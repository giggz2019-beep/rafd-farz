<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سفراء رفد</title>
<meta name="description" content="سفراء رفد — سجّل عملاءك باسمك، وتابع صفقاتك وعمولاتك خطوة بخطوة.">
<meta name="theme-color" content="#0A1628">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face { font-family: 'Thmanyah'; src: url('/fonts/thmanyah-Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Thmanyah'; src: url('/fonts/thmanyah-Medium.otf') format('opentype'); font-weight: 500 600; font-display: swap; }
@font-face { font-family: 'Thmanyah'; src: url('/fonts/thmanyah-Bold.otf') format('opentype'); font-weight: 700 900; font-display: swap; }

:root {
  --navy-900: #0A1628; --navy-800: #102640; --navy-700: #16395a;
  --teal-600: #1d6b78; --teal-500: #2a8a96; --teal-100: #e3f1f2;
  --leaf-600: #5b8a3c; --leaf-100: #ecf3e4;
  --gold-600: #b08a36; --gold-500: #C9A24B; --gold-200: #f1e2bb; --gold-100: #fbf5e6;
  --rose-100: #fbeeee; --rose-300: #efc9c6;
  --ink: #16202e; --muted: #6a7382; --line: #e9e4dc; --paper: #fbf9f5; --card: #ffffff;
  --ok: #0f7a47; --ok-bg: #e5f4ec; --bad: #b3261e; --bad-bg: #fbeaea;
  --r: 18px; --shadow: 0 10px 30px rgba(16,38,64,.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Thmanyah', -apple-system, 'Segoe UI', Tahoma, sans-serif; font-weight: 500;
  color: var(--ink); background: var(--paper); min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased; font-synthesis: none;
  font-feature-settings: 'calt' 1, 'liga' 1, 'kern' 1;
}
.num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal-600); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: rgba(251,249,245,.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy-900); }
.brand .logo-crop { position: relative; display: block; width: 66px; height: 47px; overflow: hidden; flex: none; }
/* rafd-logo.png carries wide white margins: the mark sits at x 487–1055, y 213–615 of 1472×832 */
.brand .logo-crop img { position: absolute; height: 97px; width: auto; right: auto; left: -57px; top: -25px; mix-blend-mode: multiply; }
.brand b { font-size: 1.05rem; font-weight: 800; white-space: nowrap; }
.brand b span { color: var(--gold-600); }
.top-actions { display: flex; gap: 8px; align-items: center; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 14px; padding: 13px 20px; font-weight: 700; font-size: 1rem; text-decoration: none; transition: transform .15s, box-shadow .15s, background .15s; }
.btn:active { transform: scale(.98); }
.btn-main { background: linear-gradient(135deg, var(--navy-800), var(--teal-600)); color: #fff; box-shadow: 0 8px 22px rgba(29,107,120,.28); }
.btn-gold { background: linear-gradient(135deg, var(--gold-500), #ddb866); color: var(--navy-900); box-shadow: 0 8px 22px rgba(201,162,75,.3); }
.btn-soft { background: #fff; color: var(--navy-800); border: 1.5px solid var(--line); }
.btn-ghost { background: transparent; color: var(--navy-800); padding: 9px 12px; font-size: .9rem; }
.btn-sm { padding: 8px 12px; font-size: .85rem; border-radius: 11px; }
.btn-wa { background: #25D366; color: #fff; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-block { width: 100%; }

/* demo banner */
.demo { background: var(--gold-100); color: #6b5317; border-bottom: 1px solid var(--gold-200); font-size: .82rem; text-align: center; padding: 7px 16px; }

/* hero */
.hero { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 100% 0%, #1f6f7c 0%, var(--navy-800) 45%, var(--navy-900) 100%); color: #fff; border-radius: 0 0 32px 32px; }
.hero::before { content: ""; position: absolute; width: 380px; height: 380px; left: -120px; bottom: -160px; border-radius: 50%; background: radial-gradient(circle, rgba(201,162,75,.35), transparent 65%); }
.hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -60px; top: -80px; border-radius: 50%; background: radial-gradient(circle, rgba(239,201,198,.25), transparent 65%); }
.hero .wrap { position: relative; z-index: 1; padding-top: 48px; padding-bottom: 56px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); padding: 6px 14px; border-radius: 999px; font-size: .82rem; color: var(--gold-200); }
.hero h1 { font-size: clamp(1.9rem, 6.5vw, 3rem); font-weight: 900; line-height: 1.3; margin: 18px 0 12px; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--gold-500); }
.hero p.hero-lead { font-size: 1.08rem; line-height: 1.9; color: rgba(255,255,255,.82); max-width: 560px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.hero-cta .btn-soft { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.25); }

/* sections */
section.block { padding: 36px 0 8px; }
.h2 { font-size: 1.4rem; font-weight: 800; color: var(--navy-900); margin-bottom: 6px; }
.sub { color: var(--muted); line-height: 1.8; margin-bottom: 18px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.step .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 1.3rem; margin-bottom: 12px; background: var(--gold-100); }
.step:nth-child(2) .ic { background: var(--teal-100); }
.step:nth-child(3) .ic { background: var(--rose-100); }
.step:nth-child(4) .ic { background: var(--leaf-100); }
.step h3 { font-size: 1.02rem; font-weight: 800; margin-bottom: 6px; color: var(--navy-900); }
.step p { color: var(--muted); font-size: .92rem; line-height: 1.75; }
.rules { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--shadow); }
.rules li { list-style: none; position: relative; padding-inline-start: 26px; line-height: 1.85; margin-bottom: 8px; color: #333c4a; font-size: .95rem; }
.rules li::before { content: "✦"; position: absolute; inset-inline-start: 0; top: 0; color: var(--gold-500); }

/* cards & forms */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.auth { max-width: 460px; margin: 36px auto 60px; }
.auth h2 { font-size: 1.45rem; font-weight: 900; color: var(--navy-900); margin-bottom: 4px; }
.auth .sub { margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 6px; color: var(--navy-800); }
.field label small { color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 13px; padding: 12px 14px; font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s; }
.field textarea { min-height: 80px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal-500); box-shadow: 0 0 0 4px rgba(42,138,150,.12); }
.field input.ltr { direction: ltr; text-align: right; }
[dir=ltr] .field input.ltr, [dir=ltr] .iban-shown { text-align: left; }
.field .hint { font-size: .8rem; color: var(--muted); margin-top: 5px; line-height: 1.6; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; line-height: 1.7; color: #3a4452; margin: 6px 0 16px; }
.check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--teal-600); flex: none; }
.msg { border-radius: 12px; padding: 11px 14px; font-size: .9rem; line-height: 1.7; margin-bottom: 14px; }
.msg.err { background: var(--bad-bg); color: var(--bad); }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.info { background: var(--gold-100); color: #6b5317; }
.alt { text-align: center; margin-top: 16px; font-size: .92rem; color: var(--muted); }

/* dashboard */
.dash-head { background: linear-gradient(135deg, var(--navy-900), var(--navy-700) 60%, var(--teal-600)); color: #fff; border-radius: 0 0 28px 28px; padding: 26px 0 70px; }
.dash-head h1 { font-size: 1.5rem; font-weight: 900; margin: 6px 0 4px; }
.dash-head p { color: rgba(255,255,255,.75); font-size: .92rem; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
.badge.trial { background: rgba(201,162,75,.18); color: var(--gold-200); border: 1px solid rgba(201,162,75,.4); }
.badge.contracted { background: rgba(91,138,60,.25); color: #d8efc6; border: 1px solid rgba(160,210,120,.4); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: -48px; position: relative; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 12px; box-shadow: var(--shadow); }
.stat > span { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; }
.stat b { display: block; font-size: 1.45rem; font-weight: 900; color: var(--navy-900); margin-top: 4px; }
.stat b small { font-size: .75rem; color: var(--muted); font-weight: 600; }
.stat.gold { background: linear-gradient(160deg, #fff, var(--gold-100)); border-color: var(--gold-200); }
.stat.green { background: linear-gradient(160deg, #fff, var(--ok-bg)); }
.grid-dash { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin: 18px 0 50px; align-items: start; }
.panel-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.panel-title h2 { font-size: 1.1rem; font-weight: 800; color: var(--navy-900); }
.ref-box { background: linear-gradient(150deg, var(--gold-100), #fff 70%); border: 1px solid var(--gold-200); }
.ref-code { font-size: 1.6rem; font-weight: 900; letter-spacing: .12em; color: var(--navy-900); margin: 4px 0 10px; }
.ref-link { direction: ltr; text-align: left; font-size: .8rem; background: #fff; border: 1px dashed var(--gold-500); border-radius: 10px; padding: 9px 10px; word-break: break-all; color: var(--navy-700); margin-bottom: 10px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.side { display: grid; gap: 16px; }

.lead { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
.lead-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.lead h3 { font-size: 1rem; font-weight: 800; color: var(--navy-900); }
.lead .meta { font-size: .82rem; color: var(--muted); margin-top: 3px; line-height: 1.7; }
.pill { font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.new { background: #eef1f6; color: #465569; }
.pill.contacted { background: var(--teal-100); color: var(--teal-600); }
.pill.negotiating { background: var(--gold-100); color: #8a6a1f; }
.pill.won { background: var(--ok-bg); color: var(--ok); }
.pill.lost { background: #f2f2f2; color: #777; }
.pill.duplicate { background: var(--bad-bg); color: var(--bad); }
.pill.link { background: var(--rose-100); color: #9b4b45; }
.track { display: flex; gap: 4px; margin: 12px 0 6px; }
.track i { flex: 1; height: 6px; border-radius: 6px; background: #eeebe5; }
.track i.on { background: linear-gradient(90deg, var(--teal-500), var(--gold-500)); }
.track-labels { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); }
.money { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: .88rem; }
.money b { color: var(--navy-900); }
.money .paid { color: var(--ok); font-weight: 800; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; line-height: 1.9; }
.empty .big { font-size: 2.2rem; }
.iban-shown { direction: ltr; text-align: right; font-weight: 800; letter-spacing: .04em; color: var(--navy-900); margin: 6px 0; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 700; cursor: pointer; color: var(--navy-800); }
.chip.on { background: var(--navy-800); color: #fff; border-color: var(--navy-800); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,22,40,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 20px 18px 28px; animation: up .22s ease-out; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 26px; } }
@keyframes up { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-head h2 { font-size: 1.2rem; font-weight: 900; color: var(--navy-900); }
.x { border: 0; background: #fff; border: 1px solid var(--line); width: 38px; height: 38px; border-radius: 12px; cursor: pointer; font-size: 1.1rem; }

/* toast */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy-900); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: .92rem; z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); text-align: center; }

/* admin */
.adm-tabs { display: flex; gap: 8px; margin: 18px 0 14px; flex-wrap: wrap; }
.adm-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.adm-lead { border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 14px; margin-bottom: 10px; }
.adm-lead .who { font-size: .8rem; color: var(--muted); }
.adm-edit { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 8px; margin-top: 10px; align-items: end; }
.adm-edit select, .adm-edit input { width: 100%; border: 1.5px solid var(--line); border-radius: 11px; padding: 9px 10px; background: #fff; font-size: .9rem; }
.adm-edit label { font-size: .72rem; color: var(--muted); font-weight: 700; display: block; margin-bottom: 3px; }
table.members { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.members th, table.members td { text-align: start; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.members th { font-size: .75rem; color: var(--muted); }
.scroll-x { overflow-x: auto; }
.search { width: 100%; border: 1.5px solid var(--line); border-radius: 13px; padding: 11px 14px; background: #fff; margin-bottom: 12px; font-size: .95rem; }

.task { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px dashed var(--line); }
.task:first-of-type { border-top: 0; }
.task b { font-size: .92rem; color: var(--navy-900); display: block; }
.task small { color: var(--muted); font-size: .76rem; }
.bar { height: 8px; border-radius: 8px; background: #eeebe5; overflow: hidden; margin: 10px 0 4px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal-500), var(--gold-500)); border-radius: 8px; }
.bonus-rule { font-size: .8rem; background: #fff; border: 1px dashed var(--rose-300); border-radius: 10px; padding: 7px 10px; margin: 8px 0; color: #5b4442; line-height: 1.7; }
.task-terms { margin: 4px 0 10px; font-size: .8rem; }
.task-terms > b { color: var(--navy-900); }
.task-terms:not(.open) li.more { display: none; }
.more-btn { background: none; border: 0; padding: 2px 0; font: inherit; font-weight: 700; color: var(--teal-600); cursor: pointer; }
.tt-title { display: flex; align-items: center; gap: 8px; }
.tt-ic { width: 1em; height: 1em; vertical-align: -0.12em; fill: #111; filter: drop-shadow(-1px -1px 0 #25F4EE) drop-shadow(1px 1px 0 #FE2C55); flex: none; }
.tt-title .tt-ic { width: 1.05em; height: 1.05em; }
.task-terms ul { margin: 6px 0 0; padding-inline-start: 18px; line-height: 1.8; color: #5b4442; }
.proof-img { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; border-radius: 12px; border: 1px solid var(--line); }
.task-box { background: linear-gradient(150deg, var(--rose-100), #fff 70%); border-color: var(--rose-300); }
.cmt { background: #faf7f2; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: .84rem; margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.cmt.rej { background: var(--bad-bg); text-decoration: line-through; color: var(--bad); }
.qbox { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #fcfbf8; font-size: .88rem; line-height: 1.8; }
.qbox.sent { background: var(--gold-100); border-color: var(--gold-200); }
.qbox.accepted { background: var(--ok-bg); border-color: #bfe3cf; }
.qbox.declined { background: #f5f3f1; }
.qbox .btn-row { margin-top: 8px; }
.qrow { display: grid; grid-template-columns: 1fr 70px 100px 34px; gap: 6px; margin-bottom: 6px; }
.qrow input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 8px; background: #fff; font-size: .9rem; }
.alerts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.alerts button { border: 0; cursor: pointer; }
/* the quote page — our layout, RAFD navy/teal/gold */
.qitem { border: 1px dashed var(--line); border-radius: 12px; padding: 8px; margin-bottom: 8px; background: #fff; }
.qitem .qrow { margin-bottom: 6px; }
.qrow2 { display: grid; grid-template-columns: 1fr 90px; gap: 6px; }
.qrow2 input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; font-size: .84rem; background: #fcfbf8; }
.qdoc { position: relative; overflow: hidden; max-width: 820px; margin: 24px auto 40px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 30px 30px 20px; box-shadow: var(--shadow); color: #1c2533; }
.qdoc::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: linear-gradient(90deg, var(--gold-500), var(--teal-600), var(--navy-900)); }
.qd-wm { position: absolute; width: 70%; left: 15%; top: 32%; opacity: .045; pointer-events: none; mix-blend-mode: multiply; }
.qd-top, .qd-mid, .qd-info, table.qd, .qd-sum, .qd-sec, #qdState, .qd-actions, .qd-foot { position: relative; }
.qd-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
.qd-co { display: flex; flex-direction: column; font-size: .84rem; color: var(--muted); line-height: 1.8; }
.qd-co b { font-size: 1rem; color: var(--navy-900); font-weight: 900; }
.qd-logo { position: relative; display: block; width: 118px; height: 84px; overflow: hidden; flex: none; }
.qd-logo img { position: absolute; height: 174px; left: -103px; top: -45px; mix-blend-mode: multiply; }
.qd-mid { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
.qd-client { display: flex; flex-direction: column; font-size: .88rem; line-height: 1.75; }
.qd-client small, .qd-no small, .qd-info small { color: var(--muted); font-size: .74rem; font-weight: 700; }
.qd-client b { font-size: 1.05rem; color: var(--navy-900); }
.qd-no { text-align: end; }
.qd-no b { display: block; font-size: 1.9rem; font-weight: 900; color: var(--teal-600); letter-spacing: .02em; }
.qd-info { display: grid; grid-template-columns: repeat(4, 1fr); border: 1.5px solid var(--navy-900); border-radius: 14px; overflow: hidden; margin-bottom: 16px; background: #fbfaf7; }
.qd-info > div { padding: 10px 12px; border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.qd-info > div:first-child { border-inline-start: 0; }
.qd-info b { font-size: .9rem; color: var(--navy-900); }
table.qd { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .9rem; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
table.qd th { background: var(--navy-900); color: #fff; font-weight: 700; padding: 10px; text-align: start; font-size: .82rem; }
table.qd td { padding: 10px; border-top: 1px solid var(--line); }

function shrinkImage(file, max = 1400) {
  return new Promise((ok, no) => {
    if (!file || !/^image\//.test(file.type)) return no('proof_bad');
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let out = c.toDataURL('image/jpeg', 0.6); if (out.length > 590000) out = c.toDataURL('image/jpeg', 0.35);
      out.length > 590000 ? no('proof_bad') : ok(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no('proof_bad'); };
    img.src = url;
  });
}

async function rpc(fn, args) {
  if (!REMOTE) return demo[fn](args);
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) {
      if (body && /too_many/.test(body.message || '')) return { error: 'too_many' };
      return { error: 'network', detail: body };
    }
    return body;
  } catch (e) { return { error: 'network' }; }
}

    team_add_client(a) {

    },
    team_add_lead(a) {

    team_join_info(a) { const d = db(); const c = cfg(d); const ic = String((a && a.p_code) || '').trim().toUpperCase();

    team_agreement() { const d = db(); const g = agr(d); const v = { rate: g.rate, days: g.days, name: '{name}', phone: '{phone}' };
      return { rate: g.rate, days: g.days, text: renderAgreement(g.text, v), text_en: renderAgreement(g.text_en, v) }; },
    team_ref_info(a) { const m = db().members.find(x => x.code === String(a.p_code).toUpperCase() && x.status !== 'suspended'); return m ? { first: m.full_name.split(' ')[0] } : { error: 'code' }; },
    team_ref_submit(a) {
      const d = db(); const m = d.members.find(x => x.code === String(a.p_code).toUpperCase() && x.status !== 'suspended');
      if (!m) return { error: 'code' }; if (!phoneOk(a.p_phone)) return { error: 'phone' };
      if ((a.p_name || '').trim().length < 2) return { error: 'name' };

    },
    team_quote_request(a) {
      const d = db(); const m = me(d, a.p_token); if (!m) return { error: 'auth' };
      const items = a.p_items;
      if ((a.p_details || '').trim().length < 3 && !(Array.isArray(items) && items.length)) return { error: 'details' };
      if (items != null && (!Array.isArray(items) || items.length > 20 || !items.every(itemOk))) return { error: 'items' };
      const l = d.leads.find(x => x.id === a.p_lead && x.member_id === m.id); if (!l) return { error: 'not_found' };
      if (['duplicate', 'lost', 'won'].includes(l.status)) return { error: 'lead_closed' };
      d.quotes = d.quotes || []; let q = d.quotes.find(x => x.lead_id === l.id);
      if (q && q.status === 'accepted') return { error: 'accepted' };
      if (!q) { q = { id: uid(), no: (d.quotes.length ? Math.max(...d.quotes.map(x => x.no)) : 0) + 1, lead_id: l.id }; d.quotes.push(q); }
      Object.assign(q, { details: (a.p_details || '').trim().slice(0, 1000) || '—', requested_items: items || null, status: 'requested', items: null, vat: true,
        subtotal: null, total: null, valid_until: null, note: null, requested_at: now(), sent_at: null, decided_at: null, decided_by: null, decision_note: null });
      save(d); return { ok: true };
    },
    team_quote_decide(a) {
      const d = db(); const m = me(d, a.p_token); if (!m) return { error: 'auth' };
      const l = d.leads.find(x => x.id === a.p_lead && x.member_id === m.id);
      const q = l && (d.quotes || []).find(x => x.lead_id === l.id && x.status === 'sent'); if (!q) return { error: 'not_sent' };
      Object.assign(q, { status: a.p_accept ? 'accepted' : 'declined', decided_at: now(), decided_by: 'member', decision_note: (a.p_note || '').trim() || null });
      save(d); return { ok: true };
    },
    team_quote_public(a) {
      const d = db(); const q = (d.quotes || []).find(x => x.id === a.p_id && x.status !== 'requested'); if (!q) return { error: 'not_found' };
      const l = d.leads.find(x => x.id === q.lead_id) || {}; const m = d.members.find(x => x.id === l.member_id) || {};
      const { lead_id, details, requested_at, requested_items, decision_note, id, ...pub } = q;
      return { ...pub, client_name: l.client_name, company: l.company, city: l.city, rep_name: m.full_name };
    },
    team_quote_client_accept(a) {
      const d = db(); const q = (d.quotes || []).find(x => x.id === a.p_id && x.status === 'sent');
      if (!q || (q.valid_until && q.valid_until < todayRiyadh())) return { error: 'not_open' };
      Object.assign(q, { status: 'accepted', decided_at: now(), decided_by: 'client' }); save(d); return { ok: true };
    },
    team_tasks(a) {
      const d = db(); const m = me(d, a.p_token); if (!m) return { error: 'auth' };
      const cur = monthOf(now()); const prev = prevMonth(cur); const c = cfg(d);
      return { bonus: c.bonus, invite_bonus: c.invite, cap: c.cap, this_month: cur, due: bonusOf(d, m.id, cur),
        posts: (d.posts || []).filter(p => monthOf(p.created_at) >= prev).sort((x, y) => y.created_at.localeCompare(x.created_at)).map(p => {
          const k = (d.done || []).find(x => x.post_id === p.id && x.member_id === m.id);
          return { ...p, month: monthOf(p.created_at), done: !!k, rejected: !!(k && k.rejected), comment: k ? k.comment : null, proof: hasProof(d, p.id, m.id) }; }),
        invitees: d.members.filter(x => x.invited_by === m.id && x.status !== 'suspended').sort((x, y) => x.created_at.localeCompare(y.created_at)).map(x => ({
          first: x.full_name.split(' ')[0], joined: x.created_at, qualified: qualified(d, x.id, cur),
          done: (d.posts || []).filter(p => monthOf(p.created_at) === cur && (d.done || []).some(k => k.post_id === p.id && k.member_id === x.id && !k.rejected) && hasProof(d, p.id, x.id)).length })),
        bonuses: (d.bonuses || []).filter(b => b.member_id === m.id).sort((x, y) => y.month.localeCompare(x.month)) };
    },
    team_task_done(a) {
      const d = db(); const m = me(d, a.p_token); if (!m) return { error: 'auth' };
      const c = String(a.p_comment || '').trim().slice(0, 300);
      if (!commentOk(c)) return { error: 'comment_weak' };
      const p = (d.posts || []).find(x => x.id === a.p_post); if (!p) return { error: 'not_found' };
      if (monthOf(p.created_at) < monthOf(now())) return { error: 'closed' };
      d.done = d.done || []; d.proofs = d.proofs || {};
      const k = d.done.find(x => x.post_id === p.id && x.member_id === m.id);
      if (k && k.rejected) return { error: 'rejected' };
      const key = commentKey(c);
      if (d.done.some(x => x.member_id === m.id && x.post_id !== p.id && commentKey(x.comment) === key)) return { error: 'comment_reused' };
      if (d.done.some(x => x.post_id === p.id && x.member_id !== m.id && commentKey(x.comment) === key)) return { error: 'comment_copied' };
      if (!a.p_proof && !hasProof(d, p.id, m.id)) return { error: 'proof' };
      if (a.p_proof && (!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(a.p_proof) || a.p_proof.length > 600000)) return { error: 'proof_bad' };
      if (k) { k.comment = c; k.done_at = now(); } else d.done.push({ post_id: p.id, member_id: m.id, comment: c, done_at: now(), rejected: false });
      if (a.p_proof) d.proofs[p.id + '|' + m.id] = a.p_proof;
      try { save(d); } catch (e) { return { error: 'proof_bad' }; }
      return { ok: true };
    },
    team_task_admin(a) {
      const d = db(); if (a.p_secret !== 'demo') return { error: 'auth' };
      const p = a.p || {}; const month = p.month || monthOf(now()); const c = cfg(d);
      d.posts = d.posts || []; d.done = d.done || []; d.bonuses = d.bonuses || []; d.proofs = d.proofs || {};
      if (a.p_action === 'list') {
        const ids = d.posts.filter(x => monthOf(x.created_at) === month).map(x => x.id);
        return { bonus: c.bonus, invite_bonus: c.invite, cap: c.cap, month, posts: d.posts.filter(x => ids.includes(x.id)).sort((x, y) => y.created_at.localeCompare(x.created_at)),
          done: d.done.filter(x => ids.includes(x.post_id)).map(x => ({ ...x, proof: hasProof(d, x.post_id, x.member_id) })),
          due: d.members.map(m => ({ member_id: m.id, ...bonusOf(d, m.id, month) })), paid: d.bonuses.filter(b => b.month === month) };
      }
      if (a.p_action === 'proof') return { img: d.proofs[p.post_id + '|' + p.member_id] || null };
      if (a.p_action === 'post_add') { if (!/^https:\/\//.test(p.url || '')) return { error: 'url' }; d.posts.push({ id: uid(), url: p.url.trim(), title: (p.title || '').trim() || null, created_at: now() }); }
      else if (a.p_action === 'post_del') { d.posts = d.posts.filter(x => x.id !== p.id); d.done = d.done.filter(x => x.post_id !== p.id);
        for (const k in d.proofs) if (k.startsWith(p.id + '|')) delete d.proofs[k]; }
      else if (a.p_action === 'reject') { const k = d.done.find(x => x.post_id === p.post_id && x.member_id === p.member_id); if (k) k.rejected = !p.undo; }
      else if (a.p_action === 'set_bonus') { if (!(+p.amount >= 0) || !(+p.invite >= 0) || !(+p.cap >= +p.amount)) return { error: 'bonus_bad' };
        d.bonus = +p.amount; d.inviteBonus = +p.invite; d.bonusCap = +p.cap; }
      else if (a.p_action === 'pay') { const due = bonusOf(d, p.member_id, month); if (!due.qualified) return { error: 'not_due' };
        if (d.bonuses.some(b => b.member_id === p.member_id && b.month === month)) return { error: 'already' };
        d.bonuses.push({ member_id: p.member_id, month, amount: p.amount ?? due.amount, paid_at: now(), paid_ref: p.ref || null }); }
      else if (a.p_action === 'unpay') d.bonuses = d.bonuses.filter(b => !(b.member_id === p.member_id && b.month === month));
      else return { error: 'action' };
      save(d); return { ok: true };
    },
    team_admin(a) {
      const d = db(); if (a.p_secret !== 'demo') return { error: 'auth' };
      const p = a.p || {};
      if (a.p_action === 'list') return {
        members: d.members.map(m => ({ id: m.id, code: m.code, name: m.full_name, phone: m.phone, city: m.city, tiktok: m.tiktok, status: m.status, iban: m.iban, iban_name: m.iban_name, bank: m.bank, created_at: m.created_at, agreed_rate: m.agreed_rate ?? null, agreed_at: m.terms_at || null, invited_by: m.invited_by || null })),
        join: { open: cfg(d).open, cap: cfg(d).joinCap, accepting: joinOpen(d) },
        leads: [...d.leads].sort((x, y) => y.created_at.localeCompare(x.created_at)).map(l => ({ ...l, quote: quoteOf(d, l.id) })) };
      if (a.p_action === 'lead') {
        const l = d.leads.find(x => x.id === p.id); if (!l) return { error: 'not_found' };
        if (p.status) l.status = p.status;
        if ('deal_value' in p) l.deal_value = p.deal_value === '' ? null : +p.deal_value;
        if ('commission' in p) l.commission = p.commission === '' ? null : +p.commission;
        if ('admin_note' in p) l.admin_note = p.admin_note || null;
        l.updated_at = now(); d.events.push({ lead_id: l.id, at: now(), actor: 'admin', action: 'update', detail: p }); save(d); return { ok: true };
      }
      if (a.p_action === 'quote_terms') {
        for (const [k, key] of [['terms', 'quoteTerms'], ['terms_en', 'quoteTermsEn']])
          if (k in p) { if (String(p[k] || '').length < 10) return { error: 'terms_short' }; d[key] = p[k]; }
        save(d); return { ok: true, terms: d.quoteTerms || DEFAULT_TERMS, terms_en: d.quoteTermsEn || DEFAULT_TERMS_EN };
      }
      if (a.p_action === 'agreement') {
        if ('rate' in p) { if (!(+p.rate >= 0 && +p.rate <= 100)) return { error: 'rate' }; d.rate = +p.rate; }
        if ('days' in p) { if (!(+p.days >= 1 && +p.days <= 120)) return { error: 'rate' }; d.payDays = +p.days; }
        if ('text' in p) { if (String(p.text || '').length < 50) return { error: 'terms_short' }; d.agreement = p.text; }
        if ('text_en' in p) { if (String(p.text_en || '').length < 50) return { error: 'terms_short' }; d.agreementEn = p.text_en; }
        save(d); const g = agr(d); return { ok: true, rate: g.rate, days: g.days, text: g.text, text_en: g.text_en };
      }
      if (a.p_action === 'catalog') {
        if ('catalog' in p) {
          const c = p.catalog;
          if (!Array.isArray(c) || c.length > 40 || c.some(x => !/^[a-z0-9_]{1,30}$/.test(x.id || '') || !String(x.ar || '').trim() || (x.price != null && +x.price < 0))) return { error: 'catalog' };
          d.catalog = c; save(d);
        }
        return { ok: true, catalog: catalog(d) };
      }
      if (a.p_action === 'quote_send') {
        const q = (d.quotes || []).find(x => x.lead_id === p.lead_id && x.status !== 'accepted'); if (!q) return { error: 'not_found' };
        const items = Array.isArray(p.items) ? p.items : [];
        if (!items.length || items.length > 40 || items.some(i => !String(i.d || '').trim() || !(+i.q > 0) || !(+i.p >= 0))) return { error: 'items' };
        const cv = String(p.client_vat || '').replace(/\D/g, ''); if (cv && cv.length !== 15) return { error: 'client_vat' };
        const cc = String(p.client_cr || '').replace(/\D/g, ''); if (cc && cc.length !== 10) return { error: 'client_cr' };
        const sub = items.reduce((t, i) => t + i.q * i.p, 0); const vat = p.vat !== false;

        Object.assign(q, { plan: p.plan || null, client_address: t(p.client_address, 300), client_vat: cv || null, client_cr: cc || null, lang: p.lang === 'en' ? 'en' : 'ar',
          terms: d.quoteTerms || DEFAULT_TERMS, terms_en: d.quoteTermsEn || DEFAULT_TERMS_EN,
          items: items.map(i => ({ d: t(i.d, 200), q: +i.q, p: +i.p, n: t(i.n, 300), u: t(i.u, 20), d_en: t(i.d_en, 200), n_en: t(i.n_en, 300), u_en: t(i.u_en, 20) })),
          vat, subtotal: +sub.toFixed(2), total: +(sub * (vat ? 1 + VAT_RATE : 1)).toFixed(2), valid_until: p.valid_until || null, note: t(p.note, 1000),
          status: 'sent', sent_at: now(), decided_at: null, decided_by: null, decision_note: null });
        save(d); return { ok: true };
      }
      if (a.p_action === 'paid') {
        const l = d.leads.find(x => x.id === p.id && x.status === 'won'); if (!l) return { error: 'not_won' };
        l.paid_at = p.undo ? null : now(); l.paid_ref = p.undo ? null : (p.ref || null); l.updated_at = now();
        d.events.push({ lead_id: l.id, at: now(), actor: 'admin', action: 'paid', detail: p }); save(d); return { ok: true };
      }
      if (a.p_action === 'join') {
        if ('cap' in p && !(Number.isInteger(+p.cap) && +p.cap >= 0 && +p.cap <= 100000)) return { error: 'join_cap' };
        if ('open' in p) d.joinOpen = !!p.open; if ('cap' in p) d.joinCap = +p.cap; save(d); return { ok: true };
      }
      if (a.p_action === 'member') {
        const m = d.members.find(x => x.id === p.id); if (m) m.status = p.status;
        if (p.status === 'suspended') for (const t in d.sessions) if (d.sessions[t] === p.id) delete d.sessions[t];
        save(d); return { ok: true };
      }
      if (a.p_action === 'events') return d.events.filter(e => e.lead_id === p.id);
      return { error: 'action' };
    }
  };
})();

/* ---------- routing ---------- */
const app = $('#app');
let quoteLangSet = null;       // a quote opens in its own language once, until the visitor switches
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [name, arg] = h.split('/');
  const token = store(TOKEN_KEY);
  window.scrollTo(0, 0);
  if (name !== 'q') { quoteLangSet = null; LANG = store(LANG_KEY) === 'en' ? 'en' : 'ar'; }
  applyLang();
  renderTop(name);
  if (name === 'r' && arg) return viewRef(arg);
  if (name === 'q' && arg) return viewQuote(arg);
  if (name === 'admin') return viewAdmin();
  if (name === 'join') return token ? go('me') : viewJoin(arg);
  if (name === 'login') return token ? go('me') : viewLogin();
  if (name === 'me') return token ? viewMe() : go('login');
  return viewHome();
}
function go(n) { location.hash = '#/' + n; }
window.addEventListener('hashchange', route);

function applyLang() {
  const h = document.documentElement;
  h.lang = LANG; h.dir = EN() ? 'ltr' : 'rtl';
  document.title = L('سفراء رفد', 'RAFD Ambassadors');
  $('#brandName').innerHTML = L('سفراء <span>رفد</span>', '<span>RAFD</span> Ambassadors');
  $('#footText').textContent = L('© رفد الرقمية · سفراء رفد', '© RAFD Digital · RAFD Ambassadors');
  $('#demoBar').innerHTML = L('وضع تجريبي: البيانات محفوظة على هذا الجهاز وهذا الرابط فقط. كلمة سر لوحة الإدارة: <b class="num">demo</b>',
    'Demo mode — data stays on this device and this link only. Admin password: <b class="num">demo</b>');
}
function setLang(l) { LANG = l; store(LANG_KEY, l); route(); }
const langBtn = () => `<button class="lang-btn" id="langBtn" type="button">${EN() ? 'عربي' : 'English'}</button>`;

function renderTop(name) {
  const t = store(TOKEN_KEY); const el = $('#topActions');
  let html = '';
  if (!['r', 'q', 'admin'].includes(name)) html = t
    ? (name === 'me' ? `<button class="btn btn-ghost" id="logout">${L('خروج', 'Sign out')}</button>` : `<a class="btn btn-main btn-sm" href="#/me">${L('لوحتي', 'My dashboard')}</a>`)
    : `<a class="btn btn-ghost" href="#/login">${L('دخول', 'Sign in')}</a><a class="btn btn-main btn-sm" href="#/join">${L('انضم', 'Join')}</a>`;
  el.innerHTML = langBtn() + html;
  $('#langBtn').onclick = () => setLang(EN() ? 'ar' : 'en');
  const lo = $('#logout');
  if (lo) lo.onclick = async () => { await rpc('team_logout', { p_token: t }); store(TOKEN_KEY, null); go(''); };
}

function drawFilters() {
  const leads = meData.leads;
  const opts = [['all', L('الكل', 'All')], ['open', L('قيد المتابعة', 'In progress')], ['won', L('تمّت', 'Closed')], ['other', L('أخرى', 'Other')]];
  $('#filters').innerHTML = leads.length ? opts.map(([k, t]) => `<button class="chip ${leadFilter === k ? 'on' : ''}" data-k="${k}">${t}</button>`).join('') : '';
  $('#filters').onclick = e => { const k = e.target.dataset && e.target.dataset.k; if (k) { leadFilter = k; drawFilters(); drawLeads(); } };
}

function leadCard(l) {
  const step = Math.max(STEP_OF[l.status] || 0, l.quote && l.status !== 'won' ? 3 : 0);
  const paidStep = l.paid_at ? 5 : step;
  const track = (l.status === 'lost' || l.status === 'duplicate') ? '' : `
    <div class="track">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= paidStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="track-labels"><span>${L('تسجيل', 'Registered')}</span><span>${L('تواصل', 'Contacted')}</span><span>${L('تفاوض', 'Negotiating')}</span><span>${L('تعاقد', 'Signed')}</span><span>${L('تحويل', 'Paid')}</span></div>`;
  const moneyRow = l.status === 'won' ? `
    <div class="money">
      <span>${L('قيمة الصفقة', 'Deal value')}: <b class="num">${money(l.deal_value)}</b> ${SAR()}</span>
      <span>${L('عمولتك', 'Your commission')}: <b class="num">${money(l.commission)}</b> ${SAR()}</span>
      ${l.paid_at ? `<span class="paid">✓ ${L('تم التحويل', 'Paid')} ${fmtDate(l.paid_at)}${l.paid_ref ? ` · ${L('مرجع', 'ref.')} <span class="num">${esc(l.paid_ref)}</span>` : ''}</span>` : `<span style="color:#8a6a1f">⏳ ${L('بانتظار التحويل', 'Awaiting payment')}</span>`}
    </div>` : '';
  const dupNote = l.status === 'duplicate' ? `<div class="meta" style="color:var(--bad)">${L('هذا العميل مسجّل مسبقاً باسم ممثل مبيعات آخر، والأولوية لأول تسجيل.', 'This client was already registered by a teammate — the first registration has priority.')}</div>` : '';
  return `<div class="lead">
    <div class="lead-top">
      <div>
        <h3>${esc(l.client_name)}${l.company ? ` · <span style="font-weight:600;color:var(--teal-600)">${esc(l.company)}</span>` : ''}</h3>
        <div class="meta"><span class="num">${esc(l.client_phone)}</span>${l.city ? ' · ' + esc(l.city) : ''}${l.service ? ' · ' + esc(svcLabel(l.service)) : ''}</div>
${l.client_cr ? `<div class="meta">${L('السجل التجاري', 'CR')}: <span class="num">${esc(l.client_cr)}</span>${l.client_vat ? ` · ${L('الرقم الضريبي', 'VAT')}: <span class="num">${esc(l.client_vat)}</span>` : ''}</div>` : ''}
        <div class="meta">${L('سُجّل', 'Registered')} ${fmtDateTime(l.created_at)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
        <span class="pill ${l.status}">${STATUS()[l.status]}</span>
        ${l.source === 'link' ? `<span class="pill link">${L('عبر رابطك', 'Via your link')}</span>` : ''}
      </div>
    </div>
    ${dupNote}${track}${quoteBox(l)}${moneyRow}
  </div>`;
}

/* what the ambassador picked, as readable text: «الباقة الاحترافية × 2 · كاميرا التعرف على الوجه × 4» */
function pickedText(items, catalog) {
  if (!Array.isArray(items) || !items.length) return '';
  const cat = catalog || (meData && meData.catalog) || [];
  return items.map(i => { const c = cat.find(x => x.id === i.id); return `${esc(c ? catName(c) : i.id)} × <span class="num">${money(i.q)}</span>`; }).join(' · ');
}
const detailsText = q => q && q.details && q.details !== '—' ? esc(q.details) : '';

function quoteBox(l) {
  const q = l.quote; const closed = ['duplicate', 'lost', 'won'].includes(l.status);
  if (!q) return closed ? '' : `<div class="btn-row" style="margin-top:10px"><button class="btn btn-soft btn-sm" data-qreq="${l.id}">📄 ${L('طلب عرض سعر', 'Request a quote')}</button></div>`;
  const total = `<b class="num">${money(q.total)}</b> ${SAR()}${q.vat ? ' ' + L('شامل الضريبة', 'incl. VAT') : ''}`;
  if (q.status === 'requested') return `<div class="qbox">⏳ ${L('تم طلب عرض سعر', 'Quote requested')} ${fmtDate(q.requested_at)} — ${L('جارٍ تجهيزه.', 'being prepared.')}
    <div style="font-size:.82rem">${pickedText(q.requested_items)}</div><div style="color:var(--muted);font-size:.82rem">${detailsText(q)}</div>
    <div class="btn-row"><button class="btn btn-ghost btn-sm" data-qreq="${l.id}">${L('تعديل الطلب', 'Edit request')}</button></div></div>`;
  if (q.status === 'sent') {
    const qEn = q.lang === 'en';
    const msg = qEn ? `Hello ${l.client_name}, here is your quotation from RAFD Digital:\n${quoteLink(q.id)}` : `السلام عليكم ${l.client_name}، هذا عرض السعر من رفد الرقمية:\n${quoteLink(q.id)}`;
    return `<div class="qbox sent">📄 <b>${L('عرض السعر جاهز', 'Quote ready')}:</b> ${total}${q.valid_until ? ` · ${L('ساري حتى', 'valid until')} ${fmtDate(q.valid_until)}` : ''}
    <div class="btn-row">
      <a class="btn btn-soft btn-sm" href="#/q/${q.id}">${L('فتح العرض', 'Open quote')}</a>
      <a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="${wa(l.client_phone)}?text=${encodeURIComponent(msg)}">${L('إرسال العرض للعميل عبر واتساب', 'Send to client on WhatsApp')}</a>
      <button class="btn btn-ghost btn-sm" data-qcopy="${q.id}">${L('نسخ الرابط', 'Copy link')}</button>
    </div>
    <div class="btn-row"><button class="btn btn-main btn-sm" data-qdec="${l.id}|1">✓ ${L('العميل وافق', 'Client accepted')}</button><button class="btn btn-ghost btn-sm" data-qdec="${l.id}|0">${L('العميل رفض', 'Client declined')}</button></div></div>`;
  }
  if (q.status === 'accepted') return `<div class="qbox accepted">✅ <b>${L('العميل وافق على العرض', 'The client accepted the quote')}</b> (${total})${q.decided_by === 'client' ? ' — ' + L('وافق بنفسه من صفحة العرض', 'accepted it directly on the quote page') : ''}<br>${L('ستتواصل الإدارة معه لتوقيع العقد.', 'The team will contact them to sign the contract.')}</div>`;
  return `<div class="qbox declined">✕ ${L('العميل رفض العرض', 'The client declined the quote')}${q.decision_note ? ': ' + esc(q.decision_note) : ''}
    <div class="btn-row"><button class="btn btn-soft btn-sm" data-qreq="${l.id}">${L('طلب عرض جديد', 'Request a new quote')}</button></div></div>`;
}

/* The ambassador builds the request from the catalogue — tick what the client
   wants, set how many — and adds anything bespoke as free text. Only what she
   picks reaches the quote. */
/* The package picker — one widget for the add-client sheet and for a later
   quote request. A ticked row's quantity is the number of services. */
const QTY_DEFAULT = { basic: 10, pro: 11 };
const quotePicker = (picked = new Map()) => `<div class="cats">${(meData.catalog || []).map(c => `<label class="cat ${picked.has(c.id) ? 'on' : ''}" data-id="${esc(c.id)}">
        <input type="checkbox" ${picked.has(c.id) ? 'checked' : ''}>
        <span><b>${esc(catName(c))}</b><small>${esc(catDesc(c))}</small></span>
        <input class="qty num" inputmode="numeric" value="${esc(picked.get(c.id) || QTY_DEFAULT[c.id] || 1)}" title="${L('الكمية', 'Quantity')}" aria-label="${L('الكمية', 'Quantity')}">
      </label>`).join('')}</div>`;
function wirePicker(box) {
  box.addEventListener('change', e => { const r = e.target.closest('.cat'); if (r && e.target.type === 'checkbox') r.classList.toggle('on', e.target.checked); });
  box.addEventListener('input', e => { const r = e.target.closest('.cat'); if (r && e.target.classList.contains('qty')) { r.querySelector('[type=checkbox]').checked = true; r.classList.add('on'); } });
  box.addEventListener('click', e => { if (e.target.classList.contains('qty')) e.preventDefault(); });
}
const pickedItems = box => [...box.querySelectorAll('.cat')].filter(r => r.querySelector('[type=checkbox]').checked)
  .map(r => ({ id: r.dataset.id, q: Math.max(1, +toLatin(r.querySelector('.qty').value).replace(/[^\d.]/g, '') || 1) }));

function openQuoteRequest(l) {
  const cat = meData.catalog || [];
  const prev = l.quote && l.quote.status === 'requested' ? l.quote : null;
  const picked = new Map(((prev && prev.requested_items) || []).map(i => [i.id, i.q]));
  const s = sheet(L('طلب عرض سعر', 'Request a quote'), `
    <div class="msg info">${L('لـ', 'For')} <b>${esc(l.client_name)}</b>${l.company ? ' · ' + esc(l.company) : ''}</div>
    <div id="qm"></div>
    <form id="qf" novalidate>
      <label style="display:block;font-weight:700;font-size:.9rem;margin-bottom:8px;color:var(--navy-800)">${L('ما الذي يطلبه العميل؟', 'What does the client want?')}</label>
      <div id="cats">${quotePicker(picked)}</div>
      <div class="field" style="margin-top:12px"><label>${L('تخصيص إضافي', 'Custom additions')} <small>${L('(اختياري)', '(optional)')}</small></label>
        <textarea name="details" style="min-height:90px" placeholder="${L('أي متطلبات خاصة للعميل، أو تفاصيل الموقع وعدد الفروع…', 'Anything bespoke the client wants, site details, number of branches…')}">${esc(prev && prev.details !== '—' ? prev.details : '')}</textarea></div>
      <button class="btn btn-main btn-block" type="submit">${L('إرسال الطلب إلى الإدارة', 'Send request to the team')}</button>
    </form>`);
  const box = $('#cats', s.el); wirePicker(box);
  $('#qf', s.el).onsubmit = async e => {
    e.preventDefault(); const f = e.target; const b = f.querySelector('button[type=submit]');
    const items = pickedItems(box);
    const details = f.details.value.trim();
    if (!items.length && details.length < 3) return formMsg($('#qm', s.el), 'err', err('details'));
    b.disabled = true;
    const r = await rpc('team_quote_request', { p_token: store(TOKEN_KEY), p_lead: l.id, p_details: details, p_items: items.length ? items : null });
    b.disabled = false;
    if (!r || r.error) return formMsg($('#qm', s.el), 'err', err(r && r.error));
    s.close(); toast(L('تم إرسال طلبك إلى الإدارة ✓', 'Request sent to the team ✓')); viewMe();
  };
}

function openQuoteDecide(l, accept) {
  const s = sheet(accept ? L('العميل وافق 🎉', 'Client accepted 🎉') : L('العميل رفض', 'Client declined'), `
    <div id="dm"></div>
    <form id="df" novalidate>
      <p style="line-height:1.8;margin-bottom:12px">${accept ? L('سيتم إبلاغ الإدارة للتواصل مع العميل وتوقيع العقد.', 'We will let the team know to contact the client and sign the contract.') : L('يمكنك طلب عرض جديد لاحقاً.', 'No problem — you can request a new quote later.')}</p>
      <div class="field"><label>${accept ? L('ملاحظة للإدارة', 'Note for the team') : L('ما السبب؟', 'What was the reason?')} <small>${L('(اختياري)', '(optional)')}</small></label><textarea name="note" placeholder="${accept ? L('مثلاً: يرغب بالتوقيع يوم الأحد، ويُفضّل التواصل بعد العصر', 'e.g. wants to sign on Sunday, best reached in the afternoon') : L('مثلاً: السعر أعلى من ميزانيته', 'e.g. the price is above their budget')}"></textarea></div>
      <button class="btn ${accept ? 'btn-main' : 'btn-soft'} btn-block" type="submit">${L('تأكيد', 'Confirm')}</button>
    </form>`);
  $('#df', s.el).onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true;
    const r = await rpc('team_quote_decide', { p_token: store(TOKEN_KEY), p_lead: l.id, p_accept: accept, p_note: e.target.note.value.trim() });
    b.disabled = false;
    if (!r || r.error) return formMsg($('#dm', s.el), 'err', err(r && r.error));
    s.close(); toast(accept ? L('مبارك! تم إبلاغ الإدارة ✓', 'Congratulations! The team has been told ✓') : L('تم التسجيل', 'Recorded')); viewMe();
  };
}

function drawLeads() {
  const all = meData.leads;
  const list = all.filter(l => leadFilter === 'all' ? true
    : leadFilter === 'won' ? l.status === 'won'

  $('#leads').innerHTML = list.length ? list.map(leadCard).join('') : `

}

function sheet(title, html) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>${title}</h2><button class="x" aria-label="${L('إغلاق', 'Close')}">✕</button></div>${html}</div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelector('.x').onclick = close; document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  const first = bg.querySelector('input:not([type=checkbox]), textarea'); if (first) setTimeout(() => first.focus(), 60);
  return { el: bg, close };
}

function termsHtml(t) {
  let n = 0, out = '', open = false;
  for (const raw of String(t || '').split('\n')) {
    const line = raw.trim(); if (!line) continue;
    if (line.startsWith('## ')) { if (open) out += '</ul>'; out += `<h4><span class="tn num">${++n}</span>${esc(line.slice(3))}</h4><ul>`; open = true; }
    else if (line.startsWith('- ')) { if (!open) { out += '<ul>'; open = true; } out += `<li>${esc(line.slice(2))}</li>`; }
    else { if (open) { out += '</ul>'; open = false; } out += `<p>${esc(line)}</p>`; }
  }
  return out + (open ? '</ul>' : '');
}

async function viewAdmin() {
  if (!admSecret()) return admLogin();
  const [r, c] = await Promise.all([admRpc('list'), admRpc('catalog')]);
  if (!r || r.error) {
    try { sessionStorage.removeItem(ADMIN_KEY); } catch (e) {}
    return admLogin(r && r.error === 'auth' ? L('كلمة السر غير صحيحة', 'Wrong password') : err(r && r.error));
  }
  admData = r; admCatalog = (c && c.catalog) || DEFAULT_CATALOG; drawAdmin();
}

let admTaskMonth = null, admTasks = null;
async function loadAdmTasks() {
  admTaskMonth = admTaskMonth || monthOf(Date.now());
  const r = await rpc('team_task_admin', { p_secret: admSecret(), p_action: 'list', p: { month: admTaskMonth } });
  if (!r || r.error) return toast(err(r && r.error));
  admTasks = r; drawAdmTasks();
}

async function taskAct(action, p) {
  const r = await rpc('team_task_admin', { p_secret: admSecret(), p_action: action, p: { month: admTaskMonth, ...p } });
  if (!r || r.error) { toast(err(r && r.error)); return false; }
  toast(L('تم ✓', 'Done ✓')); await loadAdmTasks(); return true;
}

  const body = $('#admBody');
  const opts = [['all', L('الكل', 'All')], ['q_req', '📄 ' + L('طلبات عرض سعر', 'Quote requests')], ['q_ok', '✅ ' + L('وافقوا على العرض', 'Accepted quotes')], ...Object.entries(STATUS()), ['unpaid', L('مستحق تحويل', 'Payout due')]];
  const nReq = admData.leads.filter(l => l.quote && l.quote.status === 'requested').length;
  const nOk = admData.leads.filter(l => l.quote && l.quote.status === 'accepted' && l.status !== 'won').length;
  body.innerHTML = `<input class="search" id="q" placeholder="${L('ابحث باسم العميل أو الشركة أو الجوال أو اسم ممثل المبيعات', 'Search by client, company, mobile or representative')}" value="${esc(admQuery)}">
    ${nReq || nOk ? `<div class="alerts">${nReq ? `<button class="pill negotiating" data-s="q_req">📄 ${nReq} ${L('طلب عرض سعر بانتظار التسعير', 'quote request(s) waiting')}</button>` : ''}${nOk ? `<button class="pill won" data-s="q_ok">✅ ${nOk} ${L('عميل وافق، يُرجى التواصل لتوقيع العقد', 'accepted — contact them to sign')}</button>` : ''}</div>` : ''}
    <div class="filters">${opts.map(([k, t]) => `<button class="chip ${admStatus === k ? 'on' : ''}" data-s="${k}">${t}</button>`).join('')}</div>
    <div id="admList"></div>`;
  $('#q').oninput = e => { admQuery = e.target.value; drawAdmList(); };
  body.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { admStatus = b.dataset.s; drawAdmLeads(); });
  drawAdmList();
}

function drawAdmList() {
  const q = admQuery.trim().toLowerCase(); const ST = STATUS();
  const list = admData.leads.filter(l => {
    const qs = l.quote && l.quote.status;
    if (admStatus === 'q_req') { if (qs !== 'requested') return false; }
    else if (admStatus === 'q_ok') { if (qs !== 'accepted' || l.status === 'won') return false; }
    else if (admStatus === 'unpaid' ? !(l.status === 'won' && !l.paid_at) : admStatus !== 'all' && l.status !== admStatus) return false;
    if (!q) return true;
    const m = memberById(l.member_id);
    return [l.client_name, l.company, l.client_phone, m.name, m.code].some(v => String(v || '').toLowerCase().includes(q));
  });
  $('#admList').innerHTML = list.length ? list.map(l => {
    const m = memberById(l.member_id);
    return `<div class="adm-lead" data-id="${l.id}">
      <div class="lead-top">
        <div>
          <h3 style="font-size:1rem;font-weight:800">${esc(l.client_name)}${l.company ? ' · ' + esc(l.company) : ''}</h3>
          <div class="meta" style="font-size:.84rem;color:var(--muted);line-height:1.8"><a class="num" href="${wa(l.client_phone)}" target="_blank" rel="noopener">${esc(l.client_phone)}</a>${l.city ? ' · ' + esc(l.city) : ''}${l.service ? ' · ' + esc(svcLabel(l.service)) : ''}</div>
          <div class="who">${L('ممثل المبيعات', 'Representative')}: <b>${esc(m.name || '—')}</b> <span class="num">(${esc(m.code || '')})</span> · ${fmtDateTime(l.created_at)} · ${l.source === 'link' ? L('سجّل العميل بنفسه من رابط ممثل المبيعات', 'client signed up via the representative\'s link') : L('سجّله ممثل المبيعات', 'registered by the representative')}</div>
          ${l.client_cr ? `<div class="who">${L('السجل التجاري', 'CR')}: <span class="num">${esc(l.client_cr)}</span>${l.client_vat ? ` · ${L('الرقم الضريبي', 'VAT')}: <span class="num">${esc(l.client_vat)}</span>` : ''}</div>` : ''}
          ${l.notes ? `<div class="who" style="margin-top:4px">📝 ${esc(l.notes)}</div>` : ''}
        </div>
        <span class="pill ${l.status}">${ST[l.status]}</span>
      </div>
      <div class="adm-edit">
        <div><label>${L('الحالة', 'Status')}</label><select data-f="status">${Object.entries(ST).map(([k, t]) => `<option value="${k}" ${k === l.status ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label>${L('قيمة الصفقة', 'Deal value')}</label><input data-f="deal_value" class="num" inputmode="decimal" value="${l.deal_value ?? (l.quote && l.quote.status === 'accepted' ? l.quote.total : '')}"></div>
        <div><label>${L('العمولة', 'Commission')}${m.agreed_rate != null ? ` <span class="num">(${fmtRate(m.agreed_rate)}%)</span>` : ''}</label><input data-f="commission" class="num" inputmode="decimal" value="${l.commission ?? ''}" data-rate="${m.agreed_rate ?? ''}"></div>
        <button class="btn btn-main btn-sm" data-a="save">${L('حفظ', 'Save')}</button>
      </div>
      ${admQuoteBox(l)}
      <div class="adm-edit" style="grid-template-columns:1fr auto auto">
        <div><label>${L('ملاحظة داخلية', 'Internal note')}</label><input data-f="admin_note" value="${esc(l.admin_note || '')}"></div>
        ${l.status === 'won' ? (l.paid_at
          ? `<span class="pill won" style="align-self:center">✓ ${L('حُوّلت', 'Paid')} ${fmtDate(l.paid_at)}${l.paid_ref ? ' · ' + esc(l.paid_ref) : ''}</span><button class="btn btn-ghost btn-sm" data-a="unpay">${L('تراجع', 'Undo')}</button>`
          : `<button class="btn btn-gold btn-sm" data-a="pay">${L('تم التحويل', 'Mark paid')}</button><span></span>`) : '<span></span><span></span>'}
      </div>
    </div>`;
  }).join('') : `<div class="empty">${L('لا توجد نتائج.', 'No results.')}</div>`;
  $('#admList').onclick = admLeadAction;
  /* The commission follows from the deal value and the rate THIS member agreed to —
     filled in as a suggestion the moment the deal is marked signed, still editable. */
  $('#admList').onchange = e => {
    const card = e.target.closest('.adm-lead'); if (!card) return;
    const f = k => card.querySelector(`[data-f=${k}]`);
    if (!['status', 'deal_value'].includes(e.target.dataset.f) || f('status').value !== 'won') return;
    const rate = +f('commission').dataset.rate, deal = +toLatin(f('deal_value').value).replace(/[^\d.]/g, '');
    if (rate && deal && (!f('commission').value || e.target.dataset.f === 'deal_value')) f('commission').value = +(deal * rate / 100).toFixed(2);
  };
}

function admQuoteBox(l) {
  const q = l.quote; if (!q) return '';
  const head = { requested: '📄 <b>' + L('طلب عرض سعر', 'Quote request') + '</b> — ' + L('بانتظار الإجراء', 'waiting for you'),
    sent: '📄 ' + L('أُرسل العرض، بانتظار رد العميل', 'Quote sent — awaiting the client'),
    accepted: `✅ <b>${L('العميل وافق', 'Client accepted')}</b>${q.decided_by === 'client' ? ' ' + L('بنفسه من صفحة العرض', 'directly on the quote page') : ' ' + L('(بإفادة ممثل المبيعات)', '(as reported by the representative)')} ${fmtDateTime(q.decided_at)} — ${L('يُرجى التواصل وتوقيع العقد', 'contact them to sign')}`,
    declined: '✕ ' + L('العميل رفض العرض', 'The client declined') }[q.status];
  return `<div class="qbox ${q.status}">${head}
    ${q.requested_items && q.requested_items.length ? `<div style="font-size:.86rem">🧾 ${pickedText(q.requested_items, admCatalog)}</div>` : ''}
    ${detailsText(q) ? `<div style="font-size:.84rem;color:#3a4452">📝 ${detailsText(q)}</div>` : ''}
    ${q.total != null ? `<div>${L('الإجمالي', 'Total')}: <b class="num">${money(q.total)}</b> ${SAR()}${q.vat ? ' ' + L('شامل الضريبة', 'incl. VAT') : ''}</div>` : ''}
    ${q.decision_note ? `<div style="font-size:.84rem">💬 ${esc(q.decision_note)}</div>` : ''}
    <div class="btn-row">
      ${q.status !== 'accepted' ? `<button class="btn ${q.status === 'requested' ? 'btn-gold' : 'btn-soft'} btn-sm" data-a="quote">${q.status === 'requested' ? L('جهّز العرض', 'Prepare quote') : L('تعديل العرض وإعادة إرساله', 'Edit and resend')}</button>` : ''}
      ${q.status !== 'requested' ? `<a class="btn btn-ghost btn-sm" href="#/q/${q.id}" target="_blank" rel="noopener">${L('فتح العرض ↗', 'Open quote ↗')}</a>` : ''}
    </div></div>`;
}

/* A catalogue entry becomes a quote line carrying BOTH languages, so the same
   quote prints correctly whichever language the client reads it in. */
const lineFromCat = (c, q) => ({ d: c.ar, d_en: c.en || '', n: c.desc_ar || '', n_en: c.desc_en || '', u: c.unit_ar || '', u_en: c.unit_en || '', q: q || 1, p: c.price ?? '' });

function openQuoteEditor(l) {
  const q = l.quote;
  let rows = q.items && q.items.length ? q.items
    : (q.requested_items || []).map(i => { const c = admCatalog.find(x => x.id === i.id); return c ? lineFromCat(c, i.q) : null; }).filter(Boolean);
  if (!rows.length) rows = [{ d: '', q: 1, p: '' }];
  const row = it => `<div class="qitem"><div class="qrow"><input data-k="d" placeholder="${L('البند', 'Item')}" value="${esc(it.d)}"><input data-k="q" class="num" inputmode="decimal" placeholder="${L('الكمية', 'Qty')}" value="${esc(it.q)}"><input data-k="p" class="num" inputmode="decimal" placeholder="${L('السعر', 'Price')}" value="${esc(it.p)}"><button type="button" class="x" data-rm title="${L('حذف', 'Remove')}">✕</button></div>
    <div class="qrow2"><input data-k="n" placeholder="${L('وصف البند للعميل (اختياري)', 'Line description for the client (optional)')}" value="${esc(it.n || '')}"><input data-k="u" placeholder="${L('الوحدة', 'Unit')}" value="${esc(it.u || '')}"></div>
    <div class="qrow3"><input data-k="d_en" placeholder="Item (English)" value="${esc(it.d_en || '')}"><input data-k="n_en" placeholder="Description (English)" value="${esc(it.n_en || '')}"><input data-k="u_en" placeholder="Unit" value="${esc(it.u_en || '')}"></div></div>`;
  const s = sheet(`${L('عرض سعر', 'Quote')} — ${esc(l.client_name)}`, `
    ${q.requested_items && q.requested_items.length ? `<div class="msg info">🧾 ${pickedText(q.requested_items, admCatalog)}</div>` : ''}
    ${detailsText(q) ? `<div class="msg info" style="white-space:pre-wrap">📝 ${detailsText(q)}</div>` : ''}
    <div id="em"></div>
    <form id="ef" novalidate class="${(q.lang || 'ar') === 'en' ? 'en' : ''}">
      <div class="row2">
        <div class="field"><label>${L('لغة العرض', 'Quote language')}</label><select name="lang"><option value="ar" ${(q.lang || 'ar') === 'ar' ? 'selected' : ''}>العربية</option><option value="en" ${q.lang === 'en' ? 'selected' : ''}>English</option></select></div>
        <div class="field"><label>${L('نوع الاشتراك', 'Billing')}</label><select name="plan">${Object.entries(PLAN()).map(([k, t]) => `<option value="${k}" ${(q.plan || 'yearly') === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label>${L('عنوان العميل', 'Client address')} <small>${L('(اختياري)', '(optional)')}</small></label><input name="caddr" placeholder="${L('الحي، المدينة', 'District, city')}" value="${esc(q.client_address || l.city || '')}"></div>
        <div class="field"><label>${L('السجل التجاري للعميل', 'Client CR no.')} <small>${L('(اختياري)', '(optional)')}</small></label><input name="ccr" class="ltr num" inputmode="numeric" placeholder="10XXXXXXXX" value="${esc(q.client_cr || l.client_cr || '')}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>${L('الرقم الضريبي للعميل', 'Client VAT no.')} <small>${L('(اختياري)', '(optional)')}</small></label><input name="cvat" class="ltr num" inputmode="numeric" placeholder="3XXXXXXXXXXXXX3" value="${esc(q.client_vat || l.client_vat || '')}"></div>
      </div>
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:var(--navy-800)">${L('أضف من الباقات', 'Add from packages')}</label>
      <div class="filters" id="catAdd">${admCatalog.map(c => `<button type="button" class="chip" data-cat="${esc(c.id)}">＋ ${esc(catName(c))}${c.price != null ? ` · <span class="num">${money(c.price)}</span>` : ''}</button>`).join('')}</div>
      <div class="qrow" style="font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:2px"><span>${L('البند', 'Item')}</span><span>${L('الكمية', 'Qty')}</span><span>${L('سعر الوحدة', 'Unit price')}</span><span></span></div>
      <div id="rows">${rows.map(row).join('')}</div>
      <button type="button" class="btn btn-ghost btn-sm" id="addRow">＋ ${L('بند مخصص', 'Custom line')}</button>
      <label class="check" style="margin-top:10px"><input type="checkbox" name="vat" ${q.vat !== false ? 'checked' : ''}><span>${L('يضاف ضريبة القيمة المضافة 15%', 'Add 15% VAT')}</span></label>
      <div class="field"><label>${L('ساري حتى', 'Valid until')}</label><input type="date" name="valid" value="${esc(q.valid_until || addDays(QUOTE_DAYS))}"></div>
      <div class="field"><label>${L('ملاحظات خاصة بهذا العرض', 'Notes on this quote')} <small>${L('(تظهر للعميل، وتُضاف الشروط العامة تلقائياً)', '(shown to the client — the standard terms are added automatically)')}</small></label><textarea name="note" placeholder="${L('مثلاً: الدفع 50% مقدم و50% بعد التركيب.', 'e.g. 50% upfront, 50% after installation.')}">${esc(q.note || '')}</textarea></div>
      <div class="qbox" id="sum" style="margin:0 0 12px"></div>
      <button class="btn btn-main btn-block" type="submit">${L('إرسال العرض إلى ممثل المبيعات', 'Send quote to the representative')}</button>
    </form>`);
  const f = $('#ef', s.el); const rowsEl = $('#rows', s.el);
  const val = (r, k) => (r.querySelector(`[data-k=${k}]`) || {}).value || '';
  const read = () => [...f.querySelectorAll('#rows .qitem')].map(r => ({ d: val(r, 'd').trim(),
    q: +toLatin(val(r, 'q')).replace(/[^\d.]/g, ''), p: (x => x === '' ? NaN : +x)(toLatin(val(r, 'p')).replace(/[^\d.]/g, '')),
    n: val(r, 'n').trim(), u: val(r, 'u').trim(), d_en: val(r, 'd_en').trim(), n_en: val(r, 'n_en').trim(), u_en: val(r, 'u_en').trim() }));
  const filled = i => i.d || i.q > 1 || !Number.isNaN(i.p);
  const sum = () => { const its = read().filter(filled); const sub = its.reduce((t, i) => t + (i.q || 0) * (i.p || 0), 0); const vat = f.vat.checked;
    $('#sum', s.el).innerHTML = `${L('المجموع', 'Subtotal')} <b class="num">${money(sub)}</b>${vat ? ` · ${L('الضريبة', 'VAT')} <b class="num">${money(sub * VAT_RATE)}</b>` : ''} · <b>${L('الإجمالي', 'Total')} <span class="num">${money(sub * (vat ? 1 + VAT_RATE : 1))}</span> ${SAR()}</b>`; };
  f.addEventListener('input', sum); f.vat.onchange = sum; sum();
  f.lang.onchange = () => f.classList.toggle('en', f.lang.value === 'en');
  const addLine = it => {
    const empty = [...rowsEl.querySelectorAll('.qitem')].find(r => !val(r, 'd').trim() && !val(r, 'p').trim());
    if (empty) empty.outerHTML = row(it); else rowsEl.insertAdjacentHTML('beforeend', row(it));
    sum();
  };
  $('#catAdd', s.el).onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; const c = admCatalog.find(x => x.id === b.dataset.cat); if (c) addLine(lineFromCat(c, 1)); };
  $('#addRow', s.el).onclick = () => { rowsEl.insertAdjacentHTML('beforeend', row({ d: '', q: 1, p: '' })); sum(); };
  rowsEl.onclick = e => { if (e.target.dataset.rm !== undefined && f.querySelectorAll('#rows .qitem').length > 1) { e.target.closest('.qitem').remove(); sum(); } };
  f.onsubmit = async e => {
    e.preventDefault(); const b = f.querySelector('button[type=submit]');
    const items = read().filter(filled);
    if (!items.length || items.some(i => !i.d || !(i.q > 0) || !(i.p >= 0) || Number.isNaN(i.p))) return formMsg($('#em', s.el), 'err', err('items'));
    b.disabled = true;
    const r = await admRpc('quote_send', { lead_id: l.id, items, vat: f.vat.checked, valid_until: f.valid.value, note: f.note.value.trim(), lang: f.lang.value,
      plan: f.plan.value, client_address: f.caddr.value.trim(), client_vat: toLatin(f.cvat.value).replace(/\D/g, ''), client_cr: toLatin(f.ccr.value).replace(/\D/g, '') });
    b.disabled = false;
    if (!r || r.error) return formMsg($('#em', s.el), 'err', err(r && r.error));
    s.close(); toast(L('تم إرسال العرض إلى ممثل المبيعات ✓', 'Quote sent to the representative ✓')); viewAdmin();
  };
}

/* The packages the ambassadors pick from and the operator prices from.
   A blank price means «priced per quote». */
function openCatalogEditor() {
  const cat = (admCatalog || []).map(c => ({ ...c }));
  const row = c => `<div class="catrow" data-id="${esc(c.id)}">
    <input data-k="ar" placeholder="الاسم بالعربي" value="${esc(c.ar || '')}"><input data-k="en" class="en" placeholder="Name in English" value="${esc(c.en || '')}">
    <input data-k="desc_ar" placeholder="الوصف بالعربي" value="${esc(c.desc_ar || '')}"><input data-k="desc_en" class="en" placeholder="Description in English" value="${esc(c.desc_en || '')}">
    <input data-k="unit_ar" placeholder="الوحدة (فرع، كاميرا…)" value="${esc(c.unit_ar || '')}"><input data-k="unit_en" class="en" placeholder="Unit (branch, camera…)" value="${esc(c.unit_en || '')}">
    <input data-k="price" class="num" inputmode="decimal" placeholder="${L('السعر الافتراضي (اختياري)', 'Default price (optional)')}" value="${esc(c.price ?? '')}">
    <button type="button" class="btn btn-ghost btn-sm" data-rm>${L('حذف الباقة', 'Remove package')}</button></div>`;
  const s = sheet(L('الباقات والأسعار', 'Packages & prices'), `
    <p class="hint" style="font-size:.84rem;color:var(--muted);line-height:1.8;margin-bottom:10px">${L('يختار ممثلو المبيعات من هذه القائمة عند طلب عرض السعر، وتضيف منها الإدارة عند التسعير. يُعبّأ السعر الافتراضي تلقائياً ويمكن تعديله في كل عرض.', 'Representatives pick from this list when requesting a quote, and the team adds from it when pricing. The default price fills in automatically and can be changed on each quote.')}</p>
    <div id="cm"></div>
    <div id="catRows">${cat.map(row).join('')}</div>
    <button type="button" class="btn btn-soft btn-sm" id="catNew">＋ ${L('باقة جديدة', 'New package')}</button>
    <button type="button" class="btn btn-main btn-block" id="catSave" style="margin-top:14px">${L('حفظ', 'Save')}</button>`);
  const box = $('#catRows', s.el);
  $('#catNew', s.el).onclick = () => box.insertAdjacentHTML('beforeend', row({ id: 'c' + Date.now().toString(36) }));
  box.onclick = e => { if (e.target.dataset.rm !== undefined) e.target.closest('.catrow').remove(); };
  $('#catSave', s.el).onclick = async () => {
    const out = [...box.querySelectorAll('.catrow')].map(r => {
      const g = k => r.querySelector(`[data-k=${k}]`).value.trim();
      const pr = toLatin(g('price')).replace(/[^\d.]/g, '');
      return { id: r.dataset.id, ar: g('ar'), en: g('en'), desc_ar: g('desc_ar'), desc_en: g('desc_en'), unit_ar: g('unit_ar'), unit_en: g('unit_en'), price: pr === '' ? null : +pr };
    }).filter(c => c.ar || c.en);
    const r = await admRpc('catalog', { catalog: out });
    if (!r || r.error) return formMsg($('#cm', s.el), 'err', err(r && r.error));
    admCatalog = r.catalog; s.close(); toast(L('تم حفظ الباقات ✓', 'Packages saved ✓'));
  };
}

async function openTermsEditor() {

      ${L('السطر الذي يبدأ بـ', 'A line starting with')} <b class="num">##</b> ${L('عنوان قسم مرقّم، والذي يبدأ بـ', 'is a numbered section; one starting with')} <b class="num">-</b> ${L('بند تحته.', 'is a clause under it.')}</p>
    <div class="tabs2"><button type="button" class="chip on" data-tl="ar">العربية</button><button type="button" class="chip" data-tl="en">English</button></div>
    <div id="tm"></div>
    <form id="tf" novalidate>
      <div class="field" data-pane="ar"><textarea name="terms" dir="rtl" style="min-height:340px;font-size:.88rem;line-height:1.8">${esc(r.terms || '')}</textarea></div>
      <div class="field" data-pane="en" hidden><textarea name="terms_en" dir="ltr" style="min-height:340px;font-size:.88rem;line-height:1.8">${esc(r.terms_en || '')}</textarea></div>
      <button class="btn btn-main btn-block" type="submit">${L('حفظ', 'Save')}</button></form>`);
  s.el.querySelectorAll('[data-tl]').forEach(b => b.onclick = () => {
    s.el.querySelectorAll('[data-tl]').forEach(x => x.classList.toggle('on', x === b));
