<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سفراء رفد</title>
<meta name="description" content="سفراء رفد — سجّلي عملاءك باسمك، تابعي صفقاتك وعمولاتك خطوة بخطوة.">
<meta name="theme-color" content="#0A1628">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face { font-family: 'Thmanyah'; src: url('/fonts/thmanyah-Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Thmanyah'; src: url('/fonts/thmanyah-Medium.otf') format('opentype'); font-weight: 500 600; font-display: swap; }
@font-face { font-family: 'Thmanyah'; src: url('/fonts/thmanyah-Bold.otf') format('opentype'); font-weight: 700 900; font-display: swap; }

:root {
  --navy-900: #0A1628; --navy-800: #102640; --navy-700: #16395a;
  --teal-600: #1d6b78; --teal-500: #2a8a96; --teal-100: #e3f1f2;
  --leaf-600: #5b8a3c; --leaf-100: #ecf3e4;
  --gold-600: #b08a36; --gold-500: #C9A24B; --gold-200: #f1e2bb; --gold-100: #fbf5e6;
  --rose-100: #fbeeee; --rose-300: #efc9c6;
  --ink: #16202e; --muted: #6a7382; --line: #e9e4dc; --paper: #fbf9f5; --card: #ffffff;
  --ok: #0f7a47; --ok-bg: #e5f4ec; --bad: #b3261e; --bad-bg: #fbeaea;
  --r: 18px; --shadow: 0 10px 30px rgba(16,38,64,.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Thmanyah', -apple-system, 'Segoe UI', Tahoma, sans-serif; font-weight: 500;
  color: var(--ink); background: var(--paper); min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased; font-synthesis: none;
  font-feature-settings: 'calt' 1, 'liga' 1, 'kern' 1;
}
.num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal-600); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: rgba(251,249,245,.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy-900); }
.brand .logo-crop { position: relative; display: block; width: 66px; height: 47px; overflow: hidden; flex: none; }
/* rafd-logo.png carries wide white margins: the mark sits at x 487–1055, y 213–615 of 1472×832 */
.brand .logo-crop img { position: absolute; height: 97px; width: auto; right: auto; left: -57px; top: -25px; mix-blend-mode: multiply; }
.brand b { font-size: 1.05rem; font-weight: 800; white-space: nowrap; }
.brand b span { color: var(--gold-600); }
.top-actions { display: flex; gap: 8px; align-items: center; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 14px; padding: 13px 20px; font-weight: 700; font-size: 1rem; text-decoration: none; transition: transform .15s, box-shadow .15s, background .15s; }
.btn:active { transform: scale(.98); }
.btn-main { background: linear-gradient(135deg, var(--navy-800), var(--teal-600)); color: #fff; box-shadow: 0 8px 22px rgba(29,107,120,.28); }
.btn-gold { background: linear-gradient(135deg, var(--gold-500), #ddb866); color: var(--navy-900); box-shadow: 0 8px 22px rgba(201,162,75,.3); }
.btn-soft { background: #fff; color: var(--navy-800); border: 1.5px solid var(--line); }
.btn-ghost { background: transparent; color: var(--navy-800); padding: 9px 12px; font-size: .9rem; }
.btn-sm { padding: 8px 12px; font-size: .85rem; border-radius: 11px; }
.btn-wa { background: #25D366; color: #fff; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-block { width: 100%; }

/* demo banner */
.demo { background: var(--gold-100); color: #6b5317; border-bottom: 1px solid var(--gold-200); font-size: .82rem; text-align: center; padding: 7px 16px; }

/* hero */
.hero { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 100% 0%, #1f6f7c 0%, var(--navy-800) 45%, var(--navy-900) 100%); color: #fff; border-radius: 0 0 32px 32px; }
.hero::before { content: ""; position: absolute; width: 380px; height: 380px; left: -120px; bottom: -160px; border-radius: 50%; background: radial-gradient(circle, rgba(201,162,75,.35), transparent 65%); }
.hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -60px; top: -80px; border-radius: 50%; background: radial-gradient(circle, rgba(239,201,198,.25), transparent 65%); }
.hero .wrap { position: relative; z-index: 1; padding-top: 48px; padding-bottom: 56px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); padding: 6px 14px; border-radius: 999px; font-size: .82rem; color: var(--gold-200); }
.hero h1 { font-size: clamp(1.9rem, 6.5vw, 3rem); font-weight: 900; line-height: 1.3; margin: 18px 0 12px; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--gold-500); }
.hero p.hero-lead { font-size: 1.08rem; line-height: 1.9; color: rgba(255,255,255,.82); max-width: 560px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.hero-cta .btn-soft { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.25); }

/* sections */
section.block { padding: 36px 0 8px; }
.h2 { font-size: 1.4rem; font-weight: 800; color: var(--navy-900); margin-bottom: 6px; }
.sub { color: var(--muted); line-height: 1.8; margin-bottom: 18px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.step .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 1.3rem; margin-bottom: 12px; background: var(--gold-100); }
.step:nth-child(2) .ic { background: var(--teal-100); }
.step:nth-child(3) .ic { background: var(--rose-100); }
.step:nth-child(4) .ic { background: var(--leaf-100); }
.step h3 { font-size: 1.02rem; font-weight: 800; margin-bottom: 6px; color: var(--navy-900); }
.step p { color: var(--muted); font-size: .92rem; line-height: 1.75; }
.rules { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--shadow); }
.rules li { list-style: none; position: relative; padding-right: 26px; line-height: 1.85; margin-bottom: 8px; color: #333c4a; font-size: .95rem; }
.rules li::before { content: "✦"; position: absolute; right: 0; top: 0; color: var(--gold-500); }

/* cards & forms */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.auth { max-width: 460px; margin: 36px auto 60px; }
.auth h2 { font-size: 1.45rem; font-weight: 900; color: var(--navy-900); margin-bottom: 4px; }
.auth .sub { margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 6px; color: var(--navy-800); }
.field label small { color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 13px; padding: 12px 14px; font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s; }
.field textarea { min-height: 80px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal-500); box-shadow: 0 0 0 4px rgba(42,138,150,.12); }
.field input.ltr { direction: ltr; text-align: right; }
.field .hint { font-size: .8rem; color: var(--muted); margin-top: 5px; line-height: 1.6; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; line-height: 1.7; color: #3a4452; margin: 6px 0 16px; }
.check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--teal-600); flex: none; }
.msg { border-radius: 12px; padding: 11px 14px; font-size: .9rem; line-height: 1.7; margin-bottom: 14px; }
.msg.err { background: var(--bad-bg); color: var(--bad); }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.info { background: var(--gold-100); color: #6b5317; }
.alt { text-align: center; margin-top: 16px; font-size: .92rem; color: var(--muted); }

/* dashboard */
.dash-head { background: linear-gradient(135deg, var(--navy-900), var(--navy-700) 60%, var(--teal-600)); color: #fff; border-radius: 0 0 28px 28px; padding: 26px 0 70px; }
.dash-head h1 { font-size: 1.5rem; font-weight: 900; margin: 6px 0 4px; }
.dash-head p { color: rgba(255,255,255,.75); font-size: .92rem; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
.badge.trial { background: rgba(201,162,75,.18); color: var(--gold-200); border: 1px solid rgba(201,162,75,.4); }
.badge.contracted { background: rgba(91,138,60,.25); color: #d8efc6; border: 1px solid rgba(160,210,120,.4); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: -48px; position: relative; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 12px; box-shadow: var(--shadow); }
.stat > span { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; }
.stat b { display: block; font-size: 1.45rem; font-weight: 900; color: var(--navy-900); margin-top: 4px; }
.stat b small { font-size: .75rem; color: var(--muted); font-weight: 600; }
.stat.gold { background: linear-gradient(160deg, #fff, var(--gold-100)); border-color: var(--gold-200); }
.stat.green { background: linear-gradient(160deg, #fff, var(--ok-bg)); }
.grid-dash { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin: 18px 0 50px; align-items: start; }
.panel-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.panel-title h2 { font-size: 1.1rem; font-weight: 800; color: var(--navy-900); }
.ref-box { background: linear-gradient(150deg, var(--gold-100), #fff 70%); border: 1px solid var(--gold-200); }
.ref-code { font-size: 1.6rem; font-weight: 900; letter-spacing: .12em; color: var(--navy-900); margin: 4px 0 10px; }
.ref-link { direction: ltr; text-align: left; font-size: .8rem; background: #fff; border: 1px dashed var(--gold-500); border-radius: 10px; padding: 9px 10px; word-break: break-all; color: var(--navy-700); margin-bottom: 10px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.side { display: grid; gap: 16px; }

.lead { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
.lead-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.lead h3 { font-size: 1rem; font-weight: 800; color: var(--navy-900); }
.lead .meta { font-size: .82rem; color: var(--muted); margin-top: 3px; line-height: 1.7; }
.pill { font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.new { background: #eef1f6; color: #465569; }
.pill.contacted { background: var(--teal-100); color: var(--teal-600); }
.pill.negotiating { background: var(--gold-100); color: #8a6a1f; }
.pill.won { background: var(--ok-bg); color: var(--ok); }
.pill.lost { background: #f2f2f2; color: #777; }
.pill.duplicate { background: var(--bad-bg); color: var(--bad); }
.pill.link { background: var(--rose-100); color: #9b4b45; }
.track { display: flex; gap: 4px; margin: 12px 0 6px; }
.track i { flex: 1; height: 6px; border-radius: 6px; background: #eeebe5; }
.track i.on { background: linear-gradient(90deg, var(--teal-500), var(--gold-500)); }
.track-labels { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); }
.money { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: .88rem; }
.money b { color: var(--navy-900); }
.money .paid { color: var(--ok); font-weight: 800; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; line-height: 1.9; }
.empty .big { font-size: 2.2rem; }
.iban-shown { direction: ltr; text-align: right; font-weight: 800; letter-spacing: .04em; color: var(--navy-900); margin: 6px 0; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 700; cursor: pointer; color: var(--navy-800); }
.chip.on { background: var(--navy-800); color: #fff; border-color: var(--navy-800); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,22,40,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 20px 18px 28px; animation: up .22s ease-out; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 26px; } }
@keyframes up { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-head h2 { font-size: 1.2rem; font-weight: 900; color: var(--navy-900); }
.x { border: 0; background: #fff; border: 1px solid var(--line); width: 38px; height: 38px; border-radius: 12px; cursor: pointer; font-size: 1.1rem; }

/* toast */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy-900); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: .92rem; z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); text-align: center; }

/* admin */
.adm-tabs { display: flex; gap: 8px; margin: 18px 0 14px; flex-wrap: wrap; }
.adm-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.adm-lead { border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 14px; margin-bottom: 10px; }
.adm-lead .who { font-size: .8rem; color: var(--muted); }
.adm-edit { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 8px; margin-top: 10px; align-items: end; }
.adm-edit select, .adm-edit input { width: 100%; border: 1.5px solid var(--line); border-radius: 11px; padding: 9px 10px; background: #fff; font-size: .9rem; }
.adm-edit label { font-size: .72rem; color: var(--muted); font-weight: 700; display: block; margin-bottom: 3px; }
table.members { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.members th, table.members td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.members th { font-size: .75rem; color: var(--muted); }
.scroll-x { overflow-x: auto; }
.search { width: 100%; border: 1.5px solid var(--line); border-radius: 13px; padding: 11px 14px; background: #fff; margin-bottom: 12px; font-size: .95rem; }

footer.foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 26px 16px 34px; }

@media (max-width: 820px) {
  .grid-dash { grid-template-columns: 1fr; }
  .side { order: -1; }
}
@media (max-width: 600px) {
  .stats, .adm-sum { grid-template-columns: repeat(2, 1fr); }
  .adm-edit { grid-template-columns: 1fr 1fr; }
  .brand b { font-size: .95rem; }
  .row2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="demoBar" class="demo" hidden>وضع تجريبي — البيانات محفوظة على هذا الجهاز فقط ولا تصل لأحد. لوحة الإدارة: كلمة السر <b class="num">demo</b></div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><span class="logo-crop"><img src="/rafd-logo.png" alt="رفد"></span><b>سفراء <span>رفد</span></b></a>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>

<main id="app"></main>
<footer class="foot">© رفد الرقمية · سفراء رفد</footer>

<script>
'use strict';
/* ============================================================
   سفراء رفد — ambassador portal.
   Both constants empty → وضع تجريبي (localStorage), the repo's usual
   degrade-instead-of-error convention. Fill them with the RAFD project's
   URL and anon key once supabase-team.sql has been run.
   ============================================================ */
const SUPABASE_URL      = '';
const SUPABASE_ANON_KEY = '';
const REMOTE = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

const TOKEN_KEY = 'rafd_team_token';
const ADMIN_KEY = 'rafd_team_admin';
const DEMO_KEY  = 'rafd_team_demo';

const STATUS = {
  new:         'جديد',
  contacted:   'تم التواصل',
  negotiating: 'قيد التفاوض',
  won:         'تم التعاقد ✓',
  lost:        'لم يتم',
  duplicate:   'مسجّل مسبقاً'
};
const STEP_OF = { new: 1, contacted: 2, negotiating: 3, won: 4 };
const SERVICES = ['منصة الفرز الذكي للتوظيف', 'باقة شركات', 'شراكة / وكالة توظيف', 'أخرى'];

const ERR = {
  phone: 'رقم الجوال لازم يكون بصيغة 05XXXXXXXX',
  password: 'كلمة المرور 6 أحرف على الأقل',
  name: 'اكتبي الاسم كامل',
  terms: 'لازم توافقين على شروط البرنامج',
  exists: 'هذا الرقم مسجّل من قبل — ادخلي من «تسجيل الدخول»',
  bad: 'الجوال أو كلمة المرور غير صحيحة',
  suspended: 'الحساب موقوف — تواصلي مع الإدارة',
  too_many: 'محاولات كثيرة — انتظري شوي وجرّبي مرة ثانية',
  iban: 'رقم الآيبان غير صحيح — تأكدي منه (SA + 22 رقم)',
  mine: 'هذا العميل مسجّل باسمك من قبل',
  code: 'الرابط غير صالح',
  auth: 'انتهت الجلسة — سجّلي دخولك مرة ثانية',
  network: 'تعذّر الاتصال — تأكدي من الإنترنت وجرّبي مرة ثانية'
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toLatin = s => String(s || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function normPhone(s) {
  let p = toLatin(s).replace(/[^\d+]/g, '');
  if (p.startsWith('+966')) p = '0' + p.slice(4);
  else if (p.startsWith('00966')) p = '0' + p.slice(5);
  else if (p.startsWith('966')) p = '0' + p.slice(3);
  else if (p.startsWith('5') && p.length === 9) p = '0' + p;
  return p;
}
const phoneOk = p => /^05\d{8}$/.test(p);
const money = n => n == null || n === '' ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtDate = d => d ? new Date(d).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
const fmtDateTime = d => d ? new Date(d).toLocaleString('ar-SA-u-ca-gregory-nu-latn', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const wa = p => 'https://wa.me/966' + String(p).slice(1);
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

function ibanClean(s) { return toLatin(s).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function ibanOk(x) {
  if (!/^SA\d{22}$/.test(x)) return false;
  const s = x.slice(4) + '2810' + x.slice(2, 4);
  let r = 0; for (const c of s) r = (r * 10 + +c) % 97;
  return r === 1;
}
function ibanPretty(x) { return x.replace(/(.{4})/g, '$1 ').trim(); }

let toastT;
function toast(t) {
  let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('تم النسخ ✓'); }
  catch (e) { prompt('انسخي:', text); }
}

/* ---------- backend: Supabase RPC, or the demo mirror ---------- */
async function rpc(fn, args) {
  if (!REMOTE) return demo[fn](args);
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) {
      if (body && /too_many/.test(body.message || '')) return { error: 'too_many' };
      return { error: 'network', detail: body };
    }
    return body;
  } catch (e) { return { error: 'network' }; }
}

/* The demo mirrors supabase-team.sql rule for rule, so what a person sees
   in a demo is what the live site will do. */
const demo = (() => {
  const load = () => { try { return JSON.parse(store(DEMO_KEY)) || null; } catch (e) { return null; } };
  const db = () => load() || { members: [], leads: [], sessions: {}, events: [] };
  const save = d => store(DEMO_KEY, JSON.stringify(d));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  const now = () => new Date().toISOString();
  const me = (d, t) => { const id = d.sessions[t]; const m = d.members.find(x => x.id === id); return m && m.status !== 'suspended' ? m : null; };
  const code = d => { let c; do { c = 'RF' + Math.random().toString(36).slice(2, 6).toUpperCase().replace(/[0O1I]/g, 'X'); } while (d.members.some(m => m.code === c)); return c; };
  function insertLead(d, m, src, a) {
    const cutoff = Date.now() - 180 * 864e5;
    const owner = d.leads.filter(l => l.client_phone === a.p_phone && l.status !== 'duplicate' && Date.parse(l.created_at) > cutoff)
                         .sort((x, y) => x.created_at.localeCompare(y.created_at))[0];
    if (owner && owner.member_id === m.id) return { error: 'mine' };
    const l = { id: uid(), member_id: m.id, client_name: a.p_name.trim(), company: (a.p_company || '').trim() || null,
      client_phone: a.p_phone, city: (a.p_city || '').trim() || null, service: a.p_service || null, notes: (a.p_notes || '').trim() || null,
      source: src, status: owner ? 'duplicate' : 'new', deal_value: null, commission: null, paid_at: null, paid_ref: null,
      admin_note: null, created_at: now(), updated_at: now() };
    d.leads.push(l); d.events.push({ lead_id: l.id, at: now(), actor: src === 'link' ? 'client' : 'member', action: 'created', detail: { status: l.status } });
    return { ok: true, id: l.id, status: l.status };
  }
  const leadOut = l => { const { member_id, admin_note, ...rest } = l; return rest; };
  return {
    team_register(a) {
      const d = db();
      if (!a.p_agree) return { error: 'terms' };
      if (!phoneOk(a.p_phone)) return { error: 'phone' };
      if ((a.p_password || '').length < 6) return { error: 'password' };
      if ((a.p_name || '').trim().length < 3) return { error: 'name' };
      if (d.members.some(m => m.phone === a.p_phone)) return { error: 'exists' };
      const m = { id: uid(), code: code(d), full_name: a.p_name.trim(), phone: a.p_phone, city: a.p_city || null, tiktok: a.p_tiktok || null,
        pass: a.p_password, status: 'trial', iban: null, iban_name: null, bank: null, iban_at: null, created_at: now() };
      d.members.push(m); const t = uid(); d.sessions[t] = m.id; save(d); return { ok: true, token: t };
    },
    team_login(a) {
      const d = db(); const m = d.members.find(x => x.phone === a.p_phone);
      if (!m || m.pass !== a.p_password) return { error: 'bad' };
      if (m.status === 'suspended') return { error: 'suspended' };
      const t = uid(); d.sessions[t] = m.id; save(d); return { ok: true, token: t };
    },
    team_logout(a) { const d = db(); delete d.sessions[a.p_token]; save(d); return null; },
    team_me(a) {
      const d = db(); const m = me(d, a.p_token); if (!m) return { error: 'auth' };
      return { member: { name: m.full_name, phone: m.phone, city: m.city, tiktok: m.tiktok, code: m.code, status: m.status, created_at: m.created_at,
          iban_masked: m.iban ? 'SA•• •••• •••• •••• ••' + m.iban.slice(-4) : null, iban_name: m.iban_name, bank: m.bank, iban_at: m.iban_at },
        leads: d.leads.filter(l => l.member_id === m.id).sort((x, y) => y.created_at.localeCompare(x.created_at)).map(leadOut) };
    },
    team_add_lead(a) {
      const d = db(); const m = me(d, a.p_token); if (!m) return { error: 'auth' };
      if (!phoneOk(a.p_phone)) return { error: 'phone' };
      if ((a.p_name || '').trim().length < 2) return { error: 'name' };
      const r = insertLead(d, m, 'manual', a); save(d); return r;
    },
    team_set_iban(a) {
      const d = db(); const m = me(d, a.p_token); if (!m) return { error: 'auth' };
      const x = ibanClean(a.p_iban); if (!ibanOk(x)) return { error: 'iban' };
      if ((a.p_name || '').trim().length < 3) return { error: 'name' };
      Object.assign(m, { iban: x, iban_name: a.p_name.trim(), bank: (a.p_bank || '').trim() || null, iban_at: now() }); save(d); return { ok: true };
    },
    team_ref_info(a) { const m = db().members.find(x => x.code === String(a.p_code).toUpperCase() && x.status !== 'suspended'); return m ? { first: m.full_name.split(' ')[0] } : { error: 'code' }; },
    team_ref_submit(a) {
      const d = db(); const m = d.members.find(x => x.code === String(a.p_code).toUpperCase() && x.status !== 'suspended');
      if (!m) return { error: 'code' }; if (!phoneOk(a.p_phone)) return { error: 'phone' };
      if ((a.p_name || '').trim().length < 2) return { error: 'name' };
      insertLead(d, m, 'link', a); save(d); return { ok: true };
    },
    team_admin(a) {
      const d = db(); if (a.p_secret !== 'demo') return { error: 'auth' };
      const p = a.p || {};
      if (a.p_action === 'list') return {
        members: d.members.map(m => ({ id: m.id, code: m.code, name: m.full_name, phone: m.phone, city: m.city, tiktok: m.tiktok, status: m.status, iban: m.iban, iban_name: m.iban_name, bank: m.bank, created_at: m.created_at })),
        leads: [...d.leads].sort((x, y) => y.created_at.localeCompare(x.created_at)) };
      if (a.p_action === 'lead') {
        const l = d.leads.find(x => x.id === p.id); if (!l) return { error: 'not_found' };
        if (p.status) l.status = p.status;
        if ('deal_value' in p) l.deal_value = p.deal_value === '' ? null : +p.deal_value;
        if ('commission' in p) l.commission = p.commission === '' ? null : +p.commission;
        if ('admin_note' in p) l.admin_note = p.admin_note || null;
        l.updated_at = now(); d.events.push({ lead_id: l.id, at: now(), actor: 'admin', action: 'update', detail: p }); save(d); return { ok: true };
      }
      if (a.p_action === 'paid') {
        const l = d.leads.find(x => x.id === p.id && x.status === 'won'); if (!l) return { error: 'not_won' };
        l.paid_at = p.undo ? null : now(); l.paid_ref = p.undo ? null : (p.ref || null); l.updated_at = now();
        d.events.push({ lead_id: l.id, at: now(), actor: 'admin', action: 'paid', detail: p }); save(d); return { ok: true };
      }
      if (a.p_action === 'member') {
        const m = d.members.find(x => x.id === p.id); if (m) m.status = p.status;
        if (p.status === 'suspended') for (const t in d.sessions) if (d.sessions[t] === p.id) delete d.sessions[t];
        save(d); return { ok: true };
      }
      if (a.p_action === 'events') return d.events.filter(e => e.lead_id === p.id);
      return { error: 'action' };
    }
  };
})();

/* ---------- routing ---------- */
const app = $('#app');
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [name, arg] = h.split('/');
  const token = store(TOKEN_KEY);
  window.scrollTo(0, 0);
  renderTop(name);
  if (name === 'r' && arg) return viewRef(arg);
  if (name === 'admin') return viewAdmin();
  if (name === 'join') return token ? go('me') : viewJoin();
  if (name === 'login') return token ? go('me') : viewLogin();
  if (name === 'me') return token ? viewMe() : go('login');
  return viewHome();
}
function go(n) { location.hash = '#/' + n; }
window.addEventListener('hashchange', route);

function renderTop(name) {
  const t = store(TOKEN_KEY); const el = $('#topActions');
  if (name === 'r' || name === 'admin') { el.innerHTML = ''; return; }
  el.innerHTML = t
    ? (name === 'me' ? '<button class="btn btn-ghost" id="logout">خروج</button>' : '<a class="btn btn-main btn-sm" href="#/me">لوحتي</a>')
    : '<a class="btn btn-ghost" href="#/login">دخول</a><a class="btn btn-main btn-sm" href="#/join">انضمي</a>';
  const lo = $('#logout');
  if (lo) lo.onclick = async () => { await rpc('team_logout', { p_token: t }); store(TOKEN_KEY, null); go(''); };
}

function sheet(title, html) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>${title}</h2><button class="x" aria-label="إغلاق">✕</button></div>${html}</div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelector('.x').onclick = close; document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  const first = bg.querySelector('input'); if (first) setTimeout(() => first.focus(), 60);
  return { el: bg, close };
}

      </div>
    </div>`;
  }).join('') : '<div class="empty">ما فيه نتائج.</div>';
  $('#admList').onclick = admLeadAction;
}

async function admLeadAction(e) {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const card = b.closest('.adm-lead'); const id = card.dataset.id; const a = b.dataset.a;
  let r;
  if (a === 'save') {
    const p = { id };
    card.querySelectorAll('[data-f]').forEach(i => p[i.dataset.f] = i.dataset.f === 'deal_value' || i.dataset.f === 'commission' ? toLatin(i.value).replace(/[^\d.]/g, '') : i.value.trim());
    if (p.status === 'won' && !p.commission) return toast('حدّد العمولة قبل ما تحفظ الصفقة');
    b.disabled = true; r = await rpc('team_admin', { p_secret: admSecret(), p_action: 'lead', p });
  } else if (a === 'pay') {
    const l = admData.leads.find(x => x.id === id); const m = memberById(l.member_id);
    if (!m.iban && !confirm('السفيرة ما أضافت آيبان بعد. تسجّل التحويل على كل حال؟')) return;
    const ref = prompt(`تحويل ${money(l.commission)} ر.س إلى ${m.name}\n${m.iban ? ibanPretty(m.iban) : ''}\n\nالرقم المرجعي للتحويل (اختياري):`, '');
    if (ref === null) return;
    b.disabled = true; r = await rpc('team_admin', { p_secret: admSecret(), p_action: 'paid', p: { id, ref: ref.trim() } });
  } else if (a === 'unpay') {
    if (!confirm('تلغي تسجيل التحويل؟')) return;
    r = await rpc('team_admin', { p_secret: admSecret(), p_action: 'paid', p: { id, undo: true } });
  }
  if (!r || r.error) { b.disabled = false; return toast(r && r.error === 'not_won' ? 'لازم تكون الحالة «تم التعاقد» ومحفوظة أول' : (ERR[r && r.error] || ERR.network)); }
  toast('تم الحفظ ✓'); viewAdmin();
}

}

function exportCsv() {
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['السفيرة', 'كود', 'جوال السفيرة', 'العميل', 'الشركة', 'جوال العميل', 'المدينة', 'الخدمة', 'المصدر', 'الحالة', 'قيمة الصفقة', 'العمولة', 'تاريخ التسجيل', 'تاريخ التحويل', 'مرجع التحويل', 'الآيبان', 'اسم صاحب الحساب']];
  for (const l of admData.leads) {
    const m = memberById(l.member_id);
    rows.push([m.name, m.code, m.phone, l.client_name, l.company, l.client_phone, l.city, l.service, l.source === 'link' ? 'رابط' : 'يدوي', STATUS[l.status], l.deal_value, l.commission, l.created_at, l.paid_at, l.paid_ref, m.iban, m.iban_name]);
  }
  const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rafd-team-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}
