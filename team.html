  $('#tf', s.el).onsubmit = async e => {
    e.preventDefault();
    const x = await admRpc('quote_terms', { terms: e.target.terms.value.trim(), terms_en: e.target.terms_en.value.trim() });
    if (!x || x.error) return formMsg($('#tm', s.el), 'err', err(x && x.error));
    s.close(); toast(L('تم حفظ الشروط ✓', 'Terms saved ✓'));
  };
}

async function openAgreementEditor() {
  const r = await admRpc('agreement');
  if (!r || r.error) return toast(err(r && r.error));
  const s = sheet(L('نسبة العمولة', 'Commission rate'), `
    <p class="hint" style="font-size:.84rem;color:var(--muted);line-height:1.8;margin-bottom:10px">${L('تظهر في الشروط والأحكام بالصفحة الرئيسية، وتسري على المنضمين الجدد فقط؛ من سجّل سابقاً تبقى نسبته كما وافق عليها.', 'Shown in the terms and conditions on the home page, and applies to new members only; existing members keep the rate they signed up with.')}</p>
    <div id="am"></div>
    <form id="af" novalidate>
      <div class="row2">
        <div class="field"><label>${L('نسبة العمولة %', 'Commission rate %')}</label><input name="rate" class="num" inputmode="decimal" value="${esc(r.rate)}"></div>
        <div class="field"><label>${L('مدة التحويل بعد التحصيل (يوم)', 'Payout days after collection')}</label><input name="days" class="num" inputmode="numeric" value="${esc(r.days)}"></div>
      </div>
      <button class="btn btn-main btn-block" type="submit">${L('حفظ', 'Save')}</button>
    </form>`);
  $('#af', s.el).onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const x = await admRpc('agreement', { rate: +toLatin(f.rate.value).replace(/[^\d.]/g, ''), days: +toLatin(f.days.value).replace(/\D/g, '') });
    if (!x || x.error) return formMsg($('#am', s.el), 'err', err(x && x.error));
    AGR = null; s.close(); toast(L('تم حفظ النسبة ✓', 'Rate saved ✓'));
  };
}

async function admLeadAction(e) {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const card = b.closest('.adm-lead'); const id = card.dataset.id; const a = b.dataset.a;
  if (a === 'quote') return openQuoteEditor(admData.leads.find(x => x.id === id));
  let r;
  if (a === 'save') {
    const p = { id };
    card.querySelectorAll('[data-f]').forEach(i => p[i.dataset.f] = i.dataset.f === 'deal_value' || i.dataset.f === 'commission' ? toLatin(i.value).replace(/[^\d.]/g, '') : i.value.trim());
    if (p.status === 'won' && !p.commission) return toast(L('حدّد العمولة قبل حفظ الصفقة', 'Set the commission before saving the deal'));
    b.disabled = true; r = await admRpc('lead', p);
  } else if (a === 'pay') {
    const l = admData.leads.find(x => x.id === id); const m = memberById(l.member_id);
    if (!m.iban && !confirm(L('لم يُضف ممثل المبيعات رقم الآيبان بعد. هل تريد تسجيل التحويل؟', 'This representative has not added an IBAN yet. Record the payment anyway?'))) return;
    const ref = prompt(`${L('تحويل', 'Pay')} ${money(l.commission)} ${SAR()} ${L('إلى', 'to')} ${m.name}\n${m.iban ? ibanPretty(m.iban) : ''}\n\n${L('الرقم المرجعي للتحويل (اختياري):', 'Transfer reference (optional):')}`, '');
    if (ref === null) return;
    b.disabled = true; r = await admRpc('paid', { id, ref: ref.trim() });
  } else if (a === 'unpay') {
    if (!confirm(L('هل تريد إلغاء تسجيل التحويل؟', 'Undo this payment record?'))) return;
    r = await admRpc('paid', { id, undo: true });
  }
  if (!r || r.error) { b.disabled = false; return toast(r && r.error === 'not_won' ? L('يجب أن تكون الحالة «تم التعاقد» ومحفوظة أولاً', 'The status must be “Contract signed” and saved first') : err(r && r.error)); }
  toast(L('تم الحفظ ✓', 'Saved ✓')); viewAdmin();
}

function drawAdmMembers() {
  const { members, leads } = admData; const j = admData.join || { open: true, cap: 0, accepting: true };
  const active = members.filter(m => m.status !== 'suspended').length;
  $('#admBody').innerHTML = `<div class="card" style="margin-bottom:12px">
      <div class="panel-title" style="margin-bottom:6px"><h2>${L('الانضمام إلى البرنامج', 'Sign-ups')}</h2><span class="pill ${j.accepting ? 'won' : 'lost'}">${j.accepting ? L('مفتوح', 'Open') : L('مغلق', 'Closed')}</span></div>
      <div class="row2" style="align-items:end">
        <label class="check" style="margin:0"><input type="checkbox" id="joinOpen" ${j.open ? 'checked' : ''}><span>${L('السماح بتسجيل أعضاء جدد', 'Allow new members to sign up')}</span></label>
        <div class="field" style="margin:0"><label>${L('إغلاق تلقائي عند بلوغ عدد', 'Close automatically at')} <small>${L('(0 = بلا حد)', '(0 = no limit)')}</small></label><input id="joinCap" class="num" inputmode="numeric" value="${esc(j.cap || 0)}"></div>
      </div>
      <p class="hint" style="margin-top:8px;color:var(--muted);font-size:.8rem">${L('الأعضاء النشطون الآن', 'Active members now')}: <b class="num">${active}</b>${j.cap ? ` / <span class="num">${j.cap}</span>` : ''}. ${L('الإغلاق يمنع التسجيل الجديد فقط، ولا يمس الأعضاء الحاليين.', 'Closing only stops new sign-ups — current members are unaffected.')}</p>
      <button class="btn btn-soft btn-sm" id="joinSave" style="margin-top:8px">${L('حفظ', 'Save')}</button>
    </div>
    <div class="card scroll-x" style="padding:8px 12px"><table class="members">
    <thead><tr><th>${L('ممثل المبيعات', 'Representative')}</th><th>${L('عملاء', 'Clients')}</th><th>${L('صفقات', 'Deals')}</th><th>${L('مستحق', 'Due')}</th><th>${L('النسبة', 'Rate')}</th><th>IBAN</th><th>${L('الحالة', 'Status')}</th></tr></thead>
    <tbody>${members.map(m => {
      const ls = leads.filter(l => l.member_id === m.id);
      const w = ls.filter(l => l.status === 'won');
      const due = w.filter(l => !l.paid_at).reduce((s, l) => s + (+l.commission || 0), 0);
      return `<tr>
        <td><b>${esc(m.name)}</b><br><a class="num" href="${wa(m.phone)}" target="_blank" rel="noopener">${esc(m.phone)}</a> · <span class="num">${esc(m.code)}</span>${m.city ? '<br>' + esc(m.city) : ''}${m.tiktok ? '<br><a class="num" href="' + esc(tiktokUrl(m.tiktok)) + '" target="_blank" rel="noopener">' + esc(m.tiktok) + '</a>' : ''}<br><small style="color:var(--muted)">${L('انضم في', 'Joined')} ${fmtDate(m.created_at)}${m.invited_by ? ' · ' + L('بدعوة من', 'invited by') + ' ' + esc(memberById(m.invited_by).name || '—') : ''}</small></td>
        <td class="num">${ls.filter(l => l.status !== 'duplicate').length}</td>
        <td class="num">${w.length}</td>
        <td><b class="num">${money(due)}</b></td>
        <td><span class="num">${m.agreed_rate != null ? fmtRate(m.agreed_rate) + '%' : '—'}</span>${m.agreed_at ? `<br><small style="color:var(--muted)">${fmtDate(m.agreed_at)}</small>` : ''}</td>
        <td>${m.iban ? `<span class="num" style="font-size:.8rem">${esc(ibanPretty(m.iban))}</span><br><small>${esc(m.iban_name || '')}${m.bank ? ' · ' + esc(m.bank) : ''}</small><br><button class="btn btn-ghost btn-sm" data-copy="${esc(m.iban)}">${L('نسخ', 'Copy')}</button>` : `<small style="color:var(--muted)">${L('لم يُضف', 'Not added')}</small>`}</td>
        <td><select data-m="${m.id}" style="border:1.5px solid var(--line);border-radius:10px;padding:7px"><option value="trial" ${m.status === 'trial' ? 'selected' : ''}>${L('فترة إثبات الكفاءة', 'Trial period')}</option><option value="contracted" ${m.status === 'contracted' ? 'selected' : ''}>${L('متعاقد', 'Contracted')}</option><option value="suspended" ${m.status === 'suspended' ? 'selected' : ''}>${L('موقوف', 'Suspended')}</option></select></td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" class="empty">${L('لا يوجد أعضاء بعد.', 'Nobody yet.')}</td></tr>`}</tbody></table></div>`;
  $('#admBody').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
  $('#joinSave').onclick = async () => {
    const cap = toLatin($('#joinCap').value).trim(); if (!/^\d{1,6}$/.test(cap)) return toast(err('join_cap'));
    const r = await admRpc('join', { open: $('#joinOpen').checked, cap: +cap });
    if (!r || r.error) return toast(err(r && r.error)); toast(L('تم الحفظ ✓', 'Saved ✓')); viewAdmin();
  };
  $('#admBody').querySelectorAll('[data-m]').forEach(s => s.onchange = async () => {
    if (s.value === 'suspended' && !confirm(L('إيقاف الحساب يُنهي جلسة ممثل المبيعات ويمنعه من الدخول. هل تريد المتابعة؟', 'Suspending signs the representative out and blocks sign-in. Continue?'))) return drawAdmMembers();
    const r = await admRpc('member', { id: s.dataset.m, status: s.value });
    if (!r || r.error) return toast(err('network'));
    toast(L('تم ✓', 'Done ✓')); viewAdmin();
  });
}

function exportCsv() {
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const ST = STATUS();
  const rows = [[L('ممثل المبيعات', 'Representative'), L('الرمز', 'Code'), L('جوال ممثل المبيعات', 'Representative mobile'), L('العميل', 'Client'), L('الشركة', 'Company'), L('جوال العميل', 'Client mobile'), L('المدينة', 'City'), L('البرنامج', 'Programme'), L('المصدر', 'Source'), L('الحالة', 'Status'), L('قيمة الصفقة', 'Deal value'), L('العمولة', 'Commission'), L('تاريخ التسجيل', 'Registered'), L('تاريخ التحويل', 'Paid on'), L('مرجع التحويل', 'Payment ref.'), 'IBAN', L('اسم صاحب الحساب', 'Account holder')]];
  for (const l of admData.leads) {
    const m = memberById(l.member_id);
    rows.push([m.name, m.code, m.phone, l.client_name, l.company, l.client_phone, l.city, l.service, l.source === 'link' ? L('رابط', 'Link') : L('يدوي', 'Manual'), ST[l.status], l.deal_value, l.commission, l.created_at, l.paid_at, l.paid_ref, m.iban, m.iban_name]);
  }
  const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rafd-team-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

/* ---------- boot ---------- */
$('#demoBar').hidden = REMOTE;
route();
</script>
</body>
