<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الطالب — رفد تعليم</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/edu.css">
</head>
<body class="edu">

<div class="edu-shell">
  <aside class="edu-side">
    <div class="edu-brand">
      <div class="edu-brand-mark">ر</div>
      <div>
        <div class="edu-brand-text">رفد تعليم</div>
        <div class="edu-brand-sub" id="schoolName">—</div>
      </div>
    </div>

    <button class="edu-nav-item active" data-view="overview"><span class="ico">🏠</span><span class="lbl">صفحتي</span></button>
    <button class="edu-nav-item" data-view="timetable"><span class="ico">📅</span><span class="lbl">جدولي الدراسي</span></button>
    <button class="edu-nav-item" data-view="exams"><span class="ico">📝</span><span class="lbl">اختباراتي</span></button>
    <button class="edu-nav-item" data-view="homework"><span class="ico">📚</span><span class="lbl">واجباتي</span><span class="edu-nav-badge" id="hwBadge" hidden></span></button>
    <button class="edu-nav-item" data-view="grades"><span class="ico">📊</span><span class="lbl">درجاتي ومستواي</span></button>
    <button class="edu-nav-item" data-view="attendance"><span class="ico">✅</span><span class="lbl">حضوري</span></button>
    <button class="edu-nav-item" data-view="report"><span class="ico">🧾</span><span class="lbl">كشف الدرجات</span></button>
    <button class="edu-nav-item" data-view="announcements"><span class="ico">📢</span><span class="lbl">إعلانات المدرسة</span></button>
    <button class="edu-nav-item" data-view="messages"><span class="ico">💬</span><span class="lbl">التواصل مع معلميّ</span></button>

    <div class="edu-side-foot">
      <button class="edu-nav-item" id="logoutBtn"><span class="ico">↩</span><span class="lbl">تسجيل الخروج</span></button>
    </div>
  </aside>

  <div class="edu-main">
    <header class="edu-top">
      <button class="edu-burger" aria-label="القائمة">☰</button>
      <h1 id="viewTitle">صفحتي</h1>
      <div class="edu-top-actions">
        <div class="edu-user-chip">
          <span class="edu-avatar" id="userAvatar">؟</span>
          <span id="userName">—</span>
        </div>
      </div>
    </header>

    <main class="edu-content">
      <div id="demoBanner"></div>
      <div class="edu-kids" id="kidsBar"></div>
      <div id="view">
        <div class="edu-card">
          <div class="edu-skeleton" style="width:40%"></div>
          <div class="edu-skeleton"></div>
          <div class="edu-skeleton" style="width:70%"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/edu-common.js"></script>
<script>window.EDU_PORTAL_ROLE = 'student';</script>
<script src="/edu-portal.js"></script>
</body>
</html>
