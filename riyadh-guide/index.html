<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل الرياض — ترندات الرياض في مكان واحد</title>
<meta name="description" content="مرشدك للرياض: أجدد الكافيهات والمطاعم والوجهات والأسواق والفنادق والشاليهات — كل ترندات الرياض في تطبيق واحد.">
<meta name="theme-color" content="#1c1917">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --ink:#1c1917; --muted:#6b645c; --line:#e7e1d8;
    --accent:#b8862b; --accent-ink:#ffffff; --accent-soft:#f5ead3;
    --danger:#c2410c; --ok:#15803d; --chip:#efe9df; --chip-on:#1c1917; --chip-on-ink:#fff;
    --shadow:0 1px 2px rgba(28,25,23,.06),0 8px 24px -12px rgba(28,25,23,.18);
    --radius:16px; --nav-h:64px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141210; --card:#1f1b18; --ink:#f3efe8; --muted:#a8a097; --line:#2e2925;
      --accent:#d9a441; --accent-ink:#1c1917; --accent-soft:#2f2718;
      --chip:#2a2521; --chip-on:#f3efe8; --chip-on-ink:#141210;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141210; --card:#1f1b18; --ink:#f3efe8; --muted:#a8a097; --line:#2e2925;
    --accent:#d9a441; --accent-ink:#1c1917; --accent-soft:#2f2718;
    --chip:#2a2521; --chip-on:#f3efe8; --chip-on-ink:#141210;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;font-size:16px;line-height:1.5}
  body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,select{font:inherit;color:inherit}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding-inline:16px}

  /* ---- header ---- */
  header{background:linear-gradient(160deg,#1c1917 0%,#3a2d1a 60%,#5b4315 100%);color:#fff;padding:20px 0 18px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;inset:auto -40px -80px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(217,164,65,.45),transparent 65%);pointer-events:none}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
  .brand p{margin:2px 0 0;font-size:.9rem;opacity:.8}
  .install{display:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 12px;border-radius:999px;font-size:.85rem;font-weight:700;white-space:nowrap}
  .install.show{display:inline-flex;align-items:center;gap:6px}
  .search{margin-top:14px;position:relative}
  .search input{width:100%;padding:13px 44px 13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;font-size:1rem;outline:none;backdrop-filter:blur(6px)}
  .search input::placeholder{color:rgba(255,255,255,.65)}
  .search input:focus{border-color:var(--accent);background:rgba(255,255,255,.18)}
  .search svg{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;opacity:.75}

  /* ---- chips ---- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:720px;margin:0 auto}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--chip);font-weight:700;font-size:.9rem;border:1px solid transparent;transition:.15s}
  .chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
  .filters{display:flex;gap:8px;padding:10px 16px 0;max-width:720px;margin:0 auto;flex-wrap:wrap}
  .filters select{flex:1 1 120px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:.9rem;appearance:none}
  .count{font-size:.85rem;color:var(--muted);padding:10px 16px 0;max-width:720px;margin:0 auto}

  /* ---- sections ---- */
  section{padding-top:18px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
  .sec-h h2{margin:0;font-size:1.15rem;font-weight:800}
  .sec-h button{font-size:.85rem;color:var(--accent);font-weight:700}
  .rail{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 12px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x mandatory}
  .rail::-webkit-scrollbar{display:none}
  .rail .card{flex:0 0 74%;max-width:280px;scroll-snap-align:start}

  /* ---- cards ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column;text-align:start;transition:transform .15s}
  .card:active{transform:scale(.985)}
  .card .art{height:110px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;position:relative}
  .card .art.cafe{background:linear-gradient(135deg,#6b4423,#b8862b)}
  .card .art.restaurant{background:linear-gradient(135deg,#7f1d1d,#ea580c)}
  .card .art.sweets{background:linear-gradient(135deg,#9d174d,#f472b6)}
  .card .art.destination{background:linear-gradient(135deg,#1e3a8a,#38bdf8)}
  .card .art.market{background:linear-gradient(135deg,#4c1d95,#a78bfa)}
  .card .art.men{background:linear-gradient(135deg,#0f172a,#475569)}
  .card .art.women{background:linear-gradient(135deg,#831843,#fb7185)}
  .card .art.salon{background:linear-gradient(135deg,#5b21b6,#c084fc)}
  .card .art.kids{background:linear-gradient(135deg,#ca8a04,#fde047)}
  .card .art.chalet{background:linear-gradient(135deg,#14532d,#4ade80)}
  .card .art.hotel{background:linear-gradient(135deg,#0c4a6e,#22d3ee)}
  .card .art.event{background:linear-gradient(135deg,#b45309,#fbbf24)}
  .badges{position:absolute;top:8px;inset-inline-start:8px;display:flex;gap:4px;flex-wrap:wrap}
  .badge{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px)}
  .badge.trend{background:#dc2626}
  .badge.new{background:#15803d}
  .badge.demo{background:#525252}
  .fav{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;backdrop-filter:blur(4px)}
  .fav.on{background:#dc2626}
  .card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .card .name{font-weight:800;font-size:1rem;line-height:1.3}
  .card .meta{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .price{color:var(--accent);font-weight:800;letter-spacing:1px;direction:ltr;unicode-bidi:isolate}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
  .tag{font-size:.72rem;background:var(--chip);padding:2px 8px;border-radius:999px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:48px 16px}
  .empty .big{font-size:2.5rem}

  /* ---- bottom nav ---- */
  nav.bottom{position:fixed;bottom:0;inset-inline:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:50}
  nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:700;color:var(--muted)}
  nav.bottom button .ic{font-size:1.35rem;line-height:1}
  nav.bottom button[aria-current="page"]{color:var(--accent)}

  /* ---- sheet ---- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:.2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;z-index:100;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:12px 18px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
  .sheet.open{transform:none}
  .handle{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .sheet .hero{height:140px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;margin-bottom:12px}
  .sheet h3{margin:0 0 2px;font-size:1.35rem;font-weight:800}
  .sheet .sub{color:var(--muted);font-size:.9rem;margin-bottom:10px}
  .sheet p{margin:0 0 12px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:12px;font-weight:800;font-size:.95rem;border:1px solid var(--line);background:var(--bg);text-decoration:none}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);grid-column:1/-1}
  .note{font-size:.8rem;color:var(--muted);background:var(--accent-soft);padding:8px 10px;border-radius:10px;margin-top:12px}
  .form label{display:block;font-size:.85rem;font-weight:700;margin:10px 0 4px}
  .form input,.form select,.form textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:.95rem}
  .form textarea{min-height:80px;resize:vertical}
  .toast{position:fixed;bottom:calc(var(--nav-h) + 20px);inset-inline:16px;margin:0 auto;max-width:360px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;font-weight:700;z-index:200;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .banner{background:var(--accent-soft);color:var(--ink);font-size:.82rem;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}
  @media (min-width:600px){ .rail .card{flex-basis:44%} }
</style>
</head>
<body>

<div class="banner" id="demoBanner">نسخة تجريبية — الأماكن للتوضيح وتحتاج تحقّق قبل النشر. <a href="#" id="hideBanner">إخفاء</a></div>

<header>
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>دليل الرياض</h1>
        <p>ترندات الرياض كلها في مكان واحد</p>
      </div>
      <button class="install" id="installBtn">⬇️ ثبّت التطبيق</button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="ابحث: كافيه، حي، مطعم، تصنيف…" autocomplete="off" enterkeyhint="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </div>
  </div>
</header>

<div class="chips" id="chips" role="tablist"></div>
<div class="filters">
  <select id="district" aria-label="المنطقة"></select>
  <select id="price" aria-label="السعر">
    <option value="all">كل الأسعار</option>
    <option value="1">$ اقتصادي</option>
    <option value="2">$$ متوسط</option>
    <option value="3">$$$ فاخر</option>
  </select>
  <select id="sort" aria-label="الترتيب">
    <option value="trend">الأكثر رواجًا</option>
    <option value="new">الأحدث إضافة</option>
    <option value="name">الاسم</option>
  </select>
</div>

<main class="wrap" id="main">
  <section id="trendSec">
    <div class="sec-h"><h2>🔥 ترند الآن</h2><button data-go="trend">عرض الكل</button></div>
    <div class="rail" id="trendRail"></div>
  </section>
  <section id="newSec">
    <div class="sec-h"><h2>✨ جديد في الرياض</h2></div>
    <div class="rail" id="newRail"></div>
  </section>
  <section>
    <div class="sec-h"><h2 id="listTitle">كل الأماكن</h2></div>
    <div class="count" id="count" style="padding:0 0 10px"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden><div class="big">🏜️</div>ما لقينا شيء يطابق بحثك.<br>جرّب كلمة ثانية أو غيّر التصنيف.</div>
  </section>
</main>

<nav class="bottom">
  <button data-view="explore" aria-current="page"><span class="ic">🧭</span>استكشف</button>
  <button data-view="trend"><span class="ic">🔥</span>ترند</button>
  <button data-view="fav"><span class="ic">❤️</span>المفضلة</button>
  <button data-view="add"><span class="ic">➕</span>أضف مكان</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="places.js"></script>
<script>
(function(){
  'use strict';
  // ---------- إعدادات يعدّلها صاحب التطبيق ----------
  const CONFIG = {
    whatsapp: '',                 // رقم واتساب لاستقبال اقتراحات الأماكن، بصيغة دولية بدون + مثل 9665xxxxxxxx
    email: '',                    // بديل: بريد لاستقبال الاقتراحات
    newDays: 45,                  // كم يوم يبقى المكان "جديد"
    favKey: 'riyadh_guide_favs_v1',
  };

  const PLACES = window.RIYADH_PLACES || [];
  const CATS = window.RIYADH_CATEGORIES || [];
  const DISTRICTS = window.RIYADH_DISTRICTS || [];
  const catMap = Object.fromEntries(CATS.map(c => [c.id, c]));
  const distMap = Object.fromEntries(DISTRICTS.map(d => [d.id, d.label]));
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const state = { view:'explore', cat:'all', district:'all', price:'all', sort:'trend', q:'' };
  let favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem(CONFIG.favKey) || '[]')); } catch(e) {}
  const saveFavs = () => { try { localStorage.setItem(CONFIG.favKey, JSON.stringify([...favs])); } catch(e) {} };

  const isNew = p => (Date.now() - new Date(p.addedAt || 0).getTime()) / 864e5 <= CONFIG.newDays;
  const priceStr = n => '$'.repeat(Math.max(1, Math.min(3, n|0)));
  const mapsUrl = p => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((p.maps || (p.nameEn || p.name)) + ' الرياض');
  const normalize = s => String(s || '').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ً-ْ]/g,'');

  // ---------- render helpers ----------
  function card(p){
    const c = catMap[p.cat] || { icon:'📍', label:p.cat };
    const badges = [
      p.trend ? '<span class="badge trend">🔥 ترند</span>' : '',
      isNew(p) ? '<span class="badge new">جديد</span>' : '',
      p.demo ? '<span class="badge demo">مثال</span>' : '',
    ].join('');
    return `<article class="card" data-id="${esc(p.id)}" tabindex="0" role="button">
      <div class="art ${esc(p.cat)}">${c.icon}
        <div class="badges">${badges}</div>
        <button class="fav ${favs.has(p.id) ? 'on' : ''}" data-fav="${esc(p.id)}" aria-label="حفظ في المفضلة">${favs.has(p.id) ? '♥' : '♡'}</button>
      </div>
      <div class="body">
        <div class="name">${esc(p.name)}</div>
        <div class="meta"><span>${c.icon} ${esc(c.label)}</span><span>·</span><span>${esc(distMap[p.district] || '')}${p.area ? ' — ' + esc(p.area) : ''}</span></div>
        <div class="meta"><span class="price">${priceStr(p.price)}</span></div>
        <div class="tags">${(p.tags || []).slice(0,3).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      </div>
    </article>`;
  }

  function filtered(){
    const q = normalize(state.q.trim());
    let list = PLACES.filter(p => {
      if (state.view === 'fav' && !favs.has(p.id)) return false;
      if (state.view === 'trend' && !p.trend) return false;
      if (state.cat !== 'all' && p.cat !== state.cat) return false;
      if (state.district !== 'all' && p.district !== state.district) return false;
      if (state.price !== 'all' && String(p.price) !== state.price) return false;
      if (q) {
        const c = catMap[p.cat];
        const hay = normalize([p.name, p.nameEn, p.area, p.desc, c && c.label, distMap[p.district], ...(p.tags || [])].join(' '));
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const by = {
      trend: (a,b) => ((a.demo?1:0) - (b.demo?1:0)) || (b.trend - a.trend) || (isNew(b) - isNew(a)) || (b.addedAt || '').localeCompare(a.addedAt || ''),
      new: (a,b) => (b.addedAt || '').localeCompare(a.addedAt || ''),
      name: (a,b) => a.name.localeCompare(b.name, 'ar'),
    };
    return list.sort(by[state.sort] || by.trend);
  }

  function render(){
    const home = state.view === 'explore' && state.cat === 'all' && !state.q && state.district === 'all' && state.price === 'all';
    $('#trendSec').hidden = !home;
    $('#newSec').hidden = !home;
    if (home) {
      $('#trendRail').innerHTML = PLACES.filter(p => p.trend).map(card).join('');
      const fresh = PLACES.filter(isNew).sort((a,b) => (b.addedAt||'').localeCompare(a.addedAt||'')).slice(0, 10);
      $('#newSec').hidden = fresh.length === 0;
      $('#newRail').innerHTML = fresh.map(card).join('');
    }
    const list = filtered();
    const titles = { explore: state.cat === 'all' ? 'كل الأماكن' : (catMap[state.cat]||{}).label, trend: '🔥 ترند الآن', fav: '❤️ المفضلة' };
    $('#listTitle').textContent = titles[state.view] || 'الأماكن';
    $('#count').textContent = list.length ? `${list.length} مكان` : '';
    $('#grid').innerHTML = list.map(card).join('');
    const empty = $('#empty');
    empty.hidden = list.length > 0;
    if (state.view === 'fav' && !list.length) empty.innerHTML = '<div class="big">🤍</div>ما عندك أماكن محفوظة بعد.<br>اضغط ♡ على أي مكان لحفظه.';
    else empty.innerHTML = '<div class="big">🏜️</div>ما لقينا شيء يطابق بحثك.<br>جرّب كلمة ثانية أو غيّر التصنيف.';
    document.querySelectorAll('nav.bottom button').forEach(b => b.toggleAttribute('aria-current', b.dataset.view === state.view) || (b.dataset.view === state.view ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current')));
  }

  // ---------- chips & filters ----------
  $('#chips').innerHTML = CATS.map(c => `<button class="chip" data-cat="${c.id}" aria-pressed="${c.id === 'all'}">${c.icon} ${c.label}</button>`).join('');
  $('#district').innerHTML = DISTRICTS.map(d => `<option value="${d.id}">${d.label}</option>`).join('');
  $('#chips').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    state.cat = b.dataset.cat;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    if (state.view === 'add') setView('explore'); else render();
  });
  $('#district').addEventListener('change', e => { state.district = e.target.value; render(); });
  $('#price').addEventListener('change', e => { state.price = e.target.value; render(); });
  $('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
  let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; if (state.view === 'add') state.view = 'explore'; render(); }, 120); });

  // ---------- views ----------
  function setView(v){
    state.view = v;
    if (v === 'add') { openAddSheet(); return; }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  document.querySelector('nav.bottom').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
  document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) setView(b.dataset.go); });

  // ---------- card interactions ----------
  document.addEventListener('click', e => {
    const f = e.target.closest('[data-fav]');
    if (f) {
      e.stopPropagation();
      const id = f.dataset.fav;
      favs.has(id) ? favs.delete(id) : favs.add(id);
      saveFavs(); toast(favs.has(id) ? 'تمت الإضافة للمفضلة ❤️' : 'أُزيل من المفضلة'); render();
      return;
    }
    const c = e.target.closest('.card[data-id]');
    if (c) openPlace(c.dataset.id);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('card')) openPlace(e.target.dataset.id);
    if (e.key === 'Escape') closeSheet();
  });

  // ---------- sheet ----------
  const sheet = $('#sheet'), sheetBg = $('#sheetBg');
  function openSheet(html){ sheet.innerHTML = '<div class="handle"></div>' + html; sheet.classList.add('open'); sheetBg.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeSheet(){ sheet.classList.remove('open'); sheetBg.classList.remove('open'); document.body.style.overflow = ''; if (state.view === 'add') { state.view = 'explore'; render(); } }
  sheetBg.addEventListener('click', closeSheet);

  function openPlace(id){
    const p = PLACES.find(x => x.id === id); if (!p) return;
    const c = catMap[p.cat] || { icon:'📍', label:p.cat };
    openSheet(`
      <div class="hero art ${esc(p.cat)}" style="${heroBg(p.cat)}">${c.icon}</div>
      <h3>${esc(p.name)}${p.nameEn ? ` <span style="font-size:.8rem;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate">${esc(p.nameEn)}</span>` : ''}</h3>
      <div class="sub">${c.icon} ${esc(c.label)} · ${esc(distMap[p.district] || '')}${p.area ? ' — ' + esc(p.area) : ''} · <span class="price">${priceStr(p.price)}</span></div>
      <div class="tags" style="margin-bottom:12px">${p.trend ? '<span class="badge trend">🔥 ترند</span>' : ''}${isNew(p) ? '<span class="badge new">جديد</span>' : ''}${(p.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <p>${esc(p.desc || '')}</p>
      <div class="actions">
        <a class="btn primary" target="_blank" rel="noopener" href="${mapsUrl(p)}">📍 افتح في خرائط قوقل</a>
        ${p.ig ? `<a class="btn" target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(p.ig)}">📸 انستقرام</a>` : '<span></span>'}
        <button class="btn" data-share="${esc(p.id)}">🔗 مشاركة</button>
        <button class="btn" data-fav="${esc(p.id)}" style="grid-column:1/-1">${favs.has(p.id) ? '♥ في المفضلة' : '♡ حفظ في المفضلة'}</button>
      </div>
      ${p.demo ? '<div class="note">هذا إدخال توضيحي لعرض شكل التصنيف — استبدله بمكان حقيقي.</div>' : (!p.verified ? '<div class="note">المعلومات من مصادر عامة وتحتاج تأكيد (العنوان وأوقات العمل) قبل الاعتماد.</div>' : '')}
    `);
  }
  function heroBg(cat){ const el = document.createElement('div'); el.className = 'art ' + cat; document.body.appendChild(el); const bg = getComputedStyle(el).backgroundImage; el.remove(); return 'background-image:' + bg; }
  document.addEventListener('click', async e => {
    const s = e.target.closest('[data-share]'); if (!s) return;
    const p = PLACES.find(x => x.id === s.dataset.share); if (!p) return;
    const url = location.origin + location.pathname + '#p=' + encodeURIComponent(p.id);
    const text = `${p.name} — ${p.desc || ''}`;
    try { if (navigator.share) { await navigator.share({ title: p.name, text, url }); return; } } catch(err) { return; }
    try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('تم نسخ الرابط'); } catch(err) { toast('انسخ الرابط من شريط العنوان'); }
  });

  function openAddSheet(){
    const cats = CATS.filter(c => c.id !== 'all').map(c => `<option value="${c.id}">${c.icon} ${c.label}</option>`).join('');
    const dists = DISTRICTS.filter(d => d.id !== 'all').map(d => `<option value="${d.id}">${d.label}</option>`).join('');
    openSheet(`
      <h3>➕ اقترح مكان</h3>
      <div class="sub">تعرف مكان جديد أو ترند؟ أرسله ونضيفه بعد التحقق.</div>
      <form class="form" id="addForm">
        <label>اسم المكان</label><input name="name" required maxlength="80" placeholder="مثال: كافيه …">
        <label>التصنيف</label><select name="cat">${cats}</select>
        <label>المنطقة</label><select name="district">${dists}</select>
        <label>الحي أو الموقع</label><input name="area" maxlength="80" placeholder="مثال: حي الياسمين">
        <label>حساب انستقرام (اختياري)</label><input name="ig" maxlength="40" placeholder="بدون @" dir="ltr">
        <label>ليش ترند؟</label><textarea name="why" maxlength="300" placeholder="وش يميزه؟"></textarea>
        <div class="actions"><button class="btn primary" type="submit">إرسال الاقتراح</button></div>
      </form>
      <div class="note">${CONFIG.whatsapp || CONFIG.email ? 'يُرسل الاقتراح عبر ' + (CONFIG.whatsapp ? 'واتساب' : 'البريد') + '.' : 'لم يُضبط رقم واتساب أو بريد بعد — سيُنسخ الاقتراح للحافظة. عدّل CONFIG في index.html.'}</div>
    `);
    $('#addForm').addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const msg = `اقتراح مكان لدليل الرياض\nالاسم: ${f.get('name')}\nالتصنيف: ${(catMap[f.get('cat')]||{}).label}\nالمنطقة: ${distMap[f.get('district')] || ''} — ${f.get('area') || ''}\nانستقرام: ${f.get('ig') || '-'}\nليش ترند: ${f.get('why') || '-'}`;
      if (CONFIG.whatsapp) { window.open('https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(msg), '_blank', 'noopener'); }
      else if (CONFIG.email) { location.href = 'mailto:' + CONFIG.email + '?subject=' + encodeURIComponent('اقتراح مكان — دليل الرياض') + '&body=' + encodeURIComponent(msg); }
      else { try { await navigator.clipboard.writeText(msg); toast('نُسخ الاقتراح للحافظة'); } catch(err) { toast('تعذّر النسخ'); } }
      closeSheet();
    });
  }

  // ---------- toast ----------
  let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

  // ---------- banner ----------
  try { if (localStorage.getItem('riyadh_guide_banner') === '0') $('#demoBanner').hidden = true; } catch(e) {}
  $('#hideBanner').addEventListener('click', e => { e.preventDefault(); $('#demoBanner').hidden = true; try { localStorage.setItem('riyadh_guide_banner', '0'); } catch(err) {} });

  // ---------- deep link ----------
  const m = location.hash.match(/#p=([^&]+)/);
  render();
  if (m) setTimeout(() => openPlace(decodeURIComponent(m[1])), 50);

  // ---------- PWA ----------
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').classList.add('show'); });
  $('#installBtn').addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#installBtn').classList.remove('show'); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();
</script>
</body>
</html>
