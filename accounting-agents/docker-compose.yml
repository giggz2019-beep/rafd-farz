# RAFD AI Accounting — Linux VPS deployment.
# Secrets come from .env (chmod 600, never committed). See docs/INSTALL.md.
name: rafd-accounting

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${APP_DB_ROLE:-rafd_app}:${APP_DB_PASSWORD}@db:5432/rafd
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rafd
      POSTGRES_USER: rafd_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_ROLE: ${APP_DB_ROLE:-rafd_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafd_admin -d rafd"]
      interval: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  migrate:
    build: .
    command: ["python", "-m", "app.storage.migrate"]
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://rafd_admin:${DB_ADMIN_PASSWORD}@db:5432/rafd
      APP_DB_ROLE: ${APP_DB_ROLE:-rafd_app}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  api:
    <<: *app
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    networks: [internal, egress]

  caddy:                      # TLS termination with automatic Let's Encrypt certificates
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]
    networks: [edge]

networks:
  internal: { internal: true }   # db and redis are unreachable from the internet
  edge: {}
  egress: {}                     # the worker needs outbound HTTPS to the Claude API (and Daftra later)

volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
