/* Measured widths, in the plate's own face at one size: س 138 and ص 134.5
   against ا at 34.3. Those two are the only letters wide enough to crowd the
   slot, so they are the only ones condensed. */
const PLATE_WIDE = { 'س': 'wider', 'ص': 'wide' };
const plateCells = (str) => String(str || '').split('')
  .map(c => '<span' + (PLATE_WIDE[c] ? ' class="' + PLATE_WIDE[c] + '"' : '') + '>' +
            esc(PLATE_GLYPH[c] || c) + '</span>').join('');
const plateArabic = (letters) => normPlate(letters);

/* ---------- the plate's own type ----------
   A Saudi plate comes in shapes, and the shape is part of what is being sold:
   a نقل plate is the blue one, a صغيرة is the short deep one off a sports car.
   The three are drawn from the owner's reference images, measured — the cell
   divisions below are where the dividers actually fall in them, not guesses:

     خصوصي   private    5.09:1, one row of content, KSA strip at the edge
     نقل     transport  4.24:1, three cells, BLUE middle, side cells split in two
     صغيرة   small      3.46:1, three cells, light middle, Latin only

   خصوصي keeps the layout measured off his own plate photo (pinned centres,
   see .cp-num/.cp-emblem/.cp-let); the other two are three bordered cells,
   because that is how they are actually divided. */
const PLATE_KINDS = { private: 'خصوصي', transport: 'نقل', small: 'صغيرة' };
const plateKindOf = (lot) =>
  (lot && PLATE_KINDS[lot.plate_kind]) ? lot.plate_kind : 'private';

/* The mark in the middle of a plate. Saudi plates carry different ones, so
   the seller is asked which his has and the plate on screen matches the plate
   in his hand.

   These are the owner's own images, cut out of the reference he supplied —
   NOT drawings. An earlier version drew them as SVG and was rejected. Do not
   redraw them: if a mark is ever added, cut it from a real plate the same way
   (crop, keep the largest connected blob so the plate's border lines are
   dropped, white to transparent) and save it as mazad-emb-<key>.png. */
const EMBLEMS = {
  swords:       'سيفين ونخلة ملون',
  swords_black: 'سيفين ونخلة أسود',
  vision:       'شعار الرؤية 2030',
  hegra:        'مداين صالح',
  diriyah:      'الدرعية',
  none:         'بدون شعار'
};

function emblemSvg(kind) {
  if (!kind || kind === 'none' || !EMBLEMS[kind]) return '';
  return '<img src="mazad-emb-' + kind + '.png" alt="" loading="lazy" decoding="async">';
}

/* One line naming the lot, for a confirm box, a share text or a sheet title. */
const IS_CAR = (lot) => lot && lot.item_type === 'car';

function itemLabel(lot) {
  if (!lot) return '';
  if (IS_CAR(lot)) {
    // a seller who typed the make into the model box too should not have it
    // read back to him twice on the broadcast
    const make = String(lot.car_make || '').trim();
    const model = String(lot.car_model || '').trim();
    return [make, model === make ? '' : model, lot.car_year].filter(Boolean).join(' ');
  }
  if (IS_PLATE(lot)) return plateText(lot.plate_letters, lot.plate_digits || '');
  return fmtPhone(lot.phone);
}
const itemWord  = (lot) => IS_CAR(lot) ? 'السيارة' : IS_PLATE(lot) ? 'اللوحة' : 'الرقم';
/* a section names itself: "3 لوحات", not "3 رقم" */
const kindCount = (k) => k === 'plate' ? 'لوحة' : k === 'car' ? 'سيارة' : 'رقم';
const kindNoun  = (k) => k === 'plate' ? 'لوحتك' : k === 'car' ? 'سيارتك' : 'رقمك';
/* «مميز» agrees with its noun: لوحة and سيارة are feminine, رقم is not — so
   this cannot be built by gluing a suffix onto kindCount(). */
const kindPremium = (k) => k === 'plate' ? 'لوحة مميزة'
                         : k === 'car'   ? 'سيارة مميزة' : 'رقم مميز';
const itemWordN = (lot) => IS_CAR(lot) ? 'سيارتك' : IS_PLATE(lot) ? 'لوحتك' : 'رقمك';
/* The icon and the name are kept APART, because half the page wants the
   name on its own — «عمولة لوحات 250», «ما فيه سيارات هنا» — and stripping
   the icon back off with a regex meant the name could never be more than one
   word. It also put two car icons side by side on the only two sections that
   are running, which is exactly what he could not tell apart:
   «وضح مسمياتها». */
const KIND_ICON = { plate: '🔖', phone: '📱', car: '🚙' };
const KIND_NAME = { plate: 'لوحات', phone: 'جوالات', car: 'سيارات' };
const KIND_LABEL = Object.fromEntries(Object.keys(KIND_NAME)
  .map(k => [k, KIND_ICON[k] + ' ' + KIND_NAME[k]]));

/* ---------- which sections the site OFFERS ----------
   جوالات is switched off for now: the plates are where the money is, and a
   third section that nobody is running only dilutes the other two. Put
   'phone' back in this list and everything returns — the chips, the publish
   form, the footer and the strip all read it, and nothing about a phone lot
   was removed.

   Lots in a hidden section are NOT deleted and NOT unreachable: the operator
   still sees them (he has to finish what is already queued) and a direct link
   still opens one, so a seller who listed yesterday is not cut off. Only the
   public list and the forms stop offering the section. */
const KINDS_SHOWN = ['plate', 'car'];
/* Which sections offer the seller a free-text note. A car is the one kind you
   cannot judge from its name — «ماشي ٩٠ ألف، فحص كامل» is exactly what a
   bidder wants and what the operator reads out on air. A plate has nothing to
   add beyond the plate itself, so it is left out rather than given an empty
   box to stare at. The column (`note`, ≤200 chars) already exists and is
   already in anon's column-by-column INSERT grant — this only surfaces it. */
const NOTE_KINDS = ['car'];
const takesNote  = (k) => NOTE_KINDS.includes(k);
const kindShown = (k) => KINDS_SHOWN.includes(k);
/* the stored choice may name a section that is switched off now */
const firstShownKind = (k) => kindShown(k) ? k : KINDS_SHOWN[0];
const kindWords = () => KINDS_SHOWN.map(k => KIND_NAME[k]).join(' و');
/* «كيف سيارات مميزة؟ لوحات هي المميزة» — he is right: the adjective agrees
   with لوحات and with nothing else on the site. A car is just a car. So the
   phrase that carries «مميزة» has to END with لوحات, whatever else is on.
   kindWords() keeps KINDS_SHOWN's own order everywhere else; this one pushes
   the premium kind last and only then appends the adjective — so switching
   جوالات back on gives «سيارات وجوالات ولوحات مميزة», still correct, and
   switching لوحات off drops the word instead of stranding it. */
const PREMIUM_KIND = 'plate';
const kindWordsPremium = () => {
  const rest = KINDS_SHOWN.filter(k => k !== PREMIUM_KIND).map(k => KIND_NAME[k]);
  if (!kindShown(PREMIUM_KIND)) return rest.join(' و');
  return rest.concat(KIND_NAME[PREMIUM_KIND]).join(' و') + ' مميزة';
};
/* the singular, for the publish form's own chips */
const SEG_LABEL = { plate: '🚗 لوحة', phone: '📱 رقم', car: '🚙 سيارة' };
/* the chip on a card says what the lot is; for a phone the carrier is more
   useful than the word "رقم", since every lot in that section is one */
const kindBadge = (lot) => IS_CAR(lot) ? 'سيارة'
  : IS_PLATE(lot) ? 'لوحة'
  : (CARRIERS[lot.carrier] || 'رقم');

/* The lot drawn as the thing itself: a phone plate, or a Saudi car plate with
   its three cells — digits, country, letters — in that order left to right,
   exactly as the real plate is laid out. */
function itemPlate(lot, size) {
  const big = size === 'live';

  if (IS_CAR(lot)) {
    const photo = carPhotoUrl(lot);
    return (
      '<div class="carcard ' + (big ? 'big' : '') + '">' +
        (photo ? '<img class="cc-photo" src="' + esc(photo) + '" alt="" ' +
                 'loading="lazy" decoding="async">' : '') +
        '<div class="cc-name">' +
          '<div class="cc-make">' + esc(lot.car_make || '') + '</div>' +
          (String(lot.car_model || '').trim() === String(lot.car_make || '').trim() ? ''
            : '<div class="cc-model">' + esc(lot.car_model || '') + '</div>') +
          '<div class="cc-year num">' + esc(lot.car_year || '') + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  if (!IS_PLATE(lot)) {
    return '<div class="' + (big ? 'live-digits' : 'phone-digits') + '">' +
      esc(fmtPhone(lot.phone)) + '</div>';
  }

  const letters = normPlate(lot.plate_letters);
  const digits  = String(lot.plate_digits || '');
  /* The digits are shown on a queued plate now and the LETTERS are masked, so
     this guard reads the digits only to stay correct for a row written before
     the flip — a masked run of • must not be fed to toArabicDigits. */
  const masked  = digits.includes('•');
  const kind    = plateKindOf(lot);
  const arDigits = masked ? digits : toArabicDigits(digits);

  /* نقل and صغيرة are three bordered cells with the country cell in the
     MIDDLE — a different plate, not a restyled خصوصي, so it gets its own
     markup rather than bending the measured one. */
  if (kind !== 'private') {
    const twoRows = kind === 'transport';
    // the characters are spread across the cell here too, and each is its own
    // element so the Arabic letters cannot join into a word
    const row = (cls, txt, rtl) =>
      '<div class="c3-r ' + cls + (String(txt).length === 1 ? ' one' : '') +
        (rtl ? ' c3-rtl' : '') + '">' + plateCells(txt) + '</div>';
    const cell = (cls, ar, en, rtl) =>
      '<div class="c3 ' + cls + '">' +
        (twoRows ? row('', ar, rtl) + row('c3-lat', en, false)
                 // صغيرة carries the Latin only — that is what comes on one
                 : row('c3-lat c3-solo', en, false)) +
      '</div>';
    return (
      '<div class="carplate cp3 k-' + kind + ' ' + (big ? 'big' : '') + '">' +
        cell('c3-num', arDigits, digits, false) +
        '<div class="c3 c3-ksa">' +
          '<img class="c3-emb" src="mazad-emb-swords_black.png" alt="" ' +
            'loading="lazy" decoding="async">' +
          '<div class="c3-ar">السعودية</div>' +
          '<div class="c3-en">KSA</div>' +
          (twoRows ? '<div class="c3-tri">▼</div>' : '') +
        '</div>' +
        cell('c3-let', plateArabic(letters), plateLatin(letters), true) +
      '</div>'
    );
  }

  return (
    '<div class="carplate ' + (big ? 'big' : '') + '">' +
      '<div class="cp-main">' +
        '<div class="cp-num">' +
          '<div class="cp-ar' + (arDigits.length === 1 ? ' one' : '') + '">' +
            plateCells(arDigits) + '</div>' +
          '<div class="cp-en' + (digits.length === 1 ? ' one' : '') + '">' +
            plateCells(digits) + '</div>' +
        '</div>' +
        '<div class="cp-emblem">' + emblemSvg(lot.plate_emblem || 'swords') + '</div>' +
        '<div class="cp-let">' +
          '<div class="cp-ar' + (letters.length === 1 ? ' one' : '') + '">' +
            plateCells(plateArabic(letters)) + '</div>' +
          '<div class="cp-en' + (letters.length === 1 ? ' one' : '') + '">' +
            plateCells(plateLatin(letters)) + '</div>' +
        '</div>' +
      '</div>' +
      '<img class="cp-ksa" src="mazad-plate-ksa.png" alt="KSA" loading="lazy" decoding="async">' +
    '</div>'
  );
}

/* What a number may look like ON THE STAGE — the part the camera sees.
   mazad_public masks a queued number for the public, but mazad_admin_list
   hands the operator the real one, and he is the one whose screen is filmed.
   So mask it here too, by the same rule the view uses, and let only his own
   strip show it in full. A number that is on air is meant to be seen. */
function stageItem(lot) {
  if (!lot) return '';
  // a car is never masked: hiding the make and model tells a viewer nothing,
  // and unlike a phone number a car is not a way to reach the seller
  if (IS_CAR(lot)) return itemLabel(lot);
  const hide = !lot.is_live && lot.status === 'pending';
  if (IS_PLATE(lot)) {
    const l = String(lot.plate_letters || '');
    // the LETTERS are what is held back on a queued plate — same rule the
    // mazad_public view applies, re-applied here because the operator's own
    // screen reads unmasked rows and is the screen being filmed
    const shown = (hide && !l.includes('•')) ? '•'.repeat(normPlate(l).length)
                                             : normPlate(l);
    return plateText(shown, String(lot.plate_digits || ''));
  }
  const raw = String(lot.phone || '');
  if (lot.is_live || lot.status !== 'pending' || raw.includes('•')) return fmtPhone(raw);
  return raw.length >= 5 ? fmtPhone(raw.slice(0, 3) + '•••••' + raw.slice(-2)) : fmtPhone(raw);
}
const CARRIERS = { stc: 'STC', mobily: 'موبايلي', zain: 'زين', other: 'أخرى' };

function stepFor(current) { return Math.max(MIN_STEP, Math.ceil(current * STEP_PERCENT)); }
function feeOf(kind) { return FEES[kind] || FEES[FEE_DEFAULT]; }

function commissionOn(price, kind) {
  const f = feeOf(kind), p = Number(price || 0);
  if (!f.rate) return f.flat;                       // flat, whatever it sells for
  return p > f.threshold ? Math.round(p * f.rate) : f.flat;
}

/* One sentence per section, so the rule cannot be worded two ways on two
   screens. Everything that states the commission reads this. */
function feeRule(kind) {
  const f = feeOf(kind);
  if (!f.rate) return money(f.flat) + ' ر.س ثابتة';
  const pct = (f.rate * 100).toString().replace(/\.0$/, '') + '%';
  return money(f.flat) + ' ر.س، وإذا زاد سعر البيع عن ' +
         money(f.threshold) + ' ر.س تكون ' + pct;
}
const kindOf = (lot) => (lot && lot.item_type) || 'phone';
const carPhotoUrl = (lot) => (lot && lot.car_photo && REMOTE)
  ? SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + lot.car_photo
  : (lot && lot.car_photo) || '';

function countdown(endAt) {
  if (!endAt) return null;
  let ms = new Date(endAt).getTime() - nowMs();
  if (ms <= 0) return null;
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), ss = s % 60;
  const pad = (x) => String(x).padStart(2, '0');
  return d > 0 ? d + ' ي ' + pad(h) + ':' + pad(m) + ':' + pad(ss)
               : pad(h) + ':' + pad(m) + ':' + pad(ss);
}

function ago(ts) {
  const s = Math.floor((nowMs() - new Date(ts).getTime()) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return 'قبل ' + Math.floor(s / 60) + ' د';
  if (s < 86400) return 'قبل ' + Math.floor(s / 3600) + ' س';
  return 'قبل ' + Math.floor(s / 86400) + ' ي';
}

/* state of a listing, derived — never trusted from a client write */
/* ---------- a held clock ----------
   `end_at` is an absolute instant, so a countdown cannot be "stopped" — it is
   held by banking what is left (`paused_ms`) and clearing `end_at`. A lot is
   paused exactly when that bank is not null. Everything that reads the clock
   has to know, or a held lot looks finished or looks queued. */
const isPaused = (lot) => Boolean(lot && lot.paused_ms != null);
/* the banked time, drawn frozen and in the same shape a running clock has */
function pausedLabel(lot) {
  const s = Math.max(0, Math.floor((lot.paused_ms || 0) / 1000));
  const pad = (x) => String(x).padStart(2, '0');
  return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
}
/* One place decides what a clock says and whether tick() should keep moving
   it: a paused node carries no data-cd, so the ticker leaves it alone. */
function clockCell(lot, cls, cd) {
  if (isPaused(lot)) {
    return '<div class="' + cls + ' held" title="العداد موقوف">⏸ ' +
      esc(pausedLabel(lot)) + '</div>';
  }
  const warn = cd && cd.length <= 8 && cd < '00:01:00' ? ' warn' : '';
  return '<div class="' + cls + warn + '" data-cd="' + esc(lot.end_at) + '">' +
    esc(cd || '00:00:00') + '</div>';
}

function lotState(lot) {
  // held, not finished and not queued — the sums still stand and it is open
  if (isPaused(lot) && lot.status === 'open') return 'live';
  if (lot.status === 'pending') return 'pending';   // in the queue, no clock yet
  if (lot.status === 'sold') return 'sold';
  if (lot.status === 'unsold') return 'unsold';
  if (lot.status === 'cancelled') return 'cancelled';
  if (!lot.end_at) return 'pending';
  return new Date(lot.end_at).getTime() <= nowMs() ? 'ended' : 'live';
}

/* The result, stamped across the plate with the owner's own mark. One line
   now, not two stacked words: the artwork has a banner for the words, and a
   banner takes a line. The file is picked by result — the three are the same
   image in different ink. */
const STAMP = {
  sold:      'تم البيع',
  unsold:    'لم يتم البيع',
  cancelled: 'ملغي'
};
function stampFor(st) {
  if (!STAMP[st]) return '';
  return '<div class="stamp ' + st + '">' +
    '<span class="st-band"></span>' +
    '<img class="st-mark" src="mazad-stamp-' + st + '.png" alt="" ' +
      'loading="lazy" decoding="async">' +
    '<span class="st-txt">' + esc(STAMP[st]) + '</span>' +
  '</div>';
}
/* ---------- the one bar at the foot of the broadcast ----------
   The site, the number and the commission used to be two stacked blocks, and
   on a 900px screen they fell BELOW the fold — on the one screen that is
   filmed, so the two things a seller has to see were never on camera. One
   compact bar, framed in olive, and the card is sized to fit the viewport. */
function liveBar(kind) {
  return '<div class="live-bar">' +
    '<div class="lb-site">زايد من الموقع <b>' + esc(SITE_URL) + '</b></div>' +
    '<div class="lb-tel">📞 للتواصل <b class="num">' + esc(fmtPhone(CONTACT_PHONE)) + '</b></div>' +
    '<div class="lb-fee">💰 عمولة ' + esc(KIND_NAME[kind] || '') +
      ' <b>' + esc(feeRule(kind)) + '</b> — على ذمة البائع</div>' +
  '</div>';
}

/* the plate and its stamp, so the seal is centred on the PLATE rather than on
   whatever else shares the card with it */
const plateStamped = (lot, size, st) =>
  '<div class="plate-stamp">' + itemPlate(lot, size) + stampFor(st) + '</div>';

/* ONE TAP. He has just called the sale out loud on air, so a dialog after
   that asks him to make a decision he has already made — and a native
   confirm() lands at the top of the screen, on camera. The price is asked for
   only when the site does not already know it: with counted sums it IS the
   top sum. Tapping تم البيع again re-opens the sheet to edit the price. */
async function markSold(lot) {
  const top = topBid(lot.id, lot);
  if (lot.status === 'sold' || !top.count) { askSoldPrice(lot); return; }
  await opDo(lot.id, 'sold', undefined, top.amount);
  toast('تم البيع على ' + money(top.amount) + ' ر.س ✔');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function badgeFor(st) {
  if (st === 'pending') return '<span class="badge wait">بانتظار الدور</span>';
  if (st === 'live')   return '<span class="badge live dot">السوم مفتوح</span>';
  if (st === 'sold')   return '<span class="badge sold">تم البيع</span>';
  if (st === 'unsold') return '<span class="badge unsold">لم يتم البيع</span>';
  if (st === 'cancelled') return '<span class="badge ended">ملغي</span>';
  return '<span class="badge ended">انتهى</span>';
}

/* ------------------------------------------------------------- identity */
const me = {
  get name()  { return localStorage.getItem('mazad_name')  || ''; },
  set name(v) { localStorage.setItem('mazad_name', v); paintName(); },
  // a winning bid is worthless if the seller cannot reach the bidder, so the
  // number is asked for once and kept in this browser like the name
  get phone()  { return localStorage.getItem('mazad_phone') || ''; },
  set phone(v) { localStorage.setItem('mazad_phone', v); },
  /* «مطلوب منه اسمه ورقم جواله وموقعه عند طلب مزايده والا الشراء» — the
     handover is physical, so where the bidder is decides how it happens and
     what it costs. Asked once, kept like the name and the number. */
  get city()  { return localStorage.getItem('mazad_city') || ''; },
  set city(v) { localStorage.setItem('mazad_city', v); }
};
function paintName() {
  /* The chip shows WHO YOU ARE, and only once you are one. An «اسمك؟» button
     beside a «مزايدة» door was the same job twice, and the door is the one a
     visitor understands. It stays hidden on /live too — the operator does not
     bid from there and it is on camera. */
  const chip = $('#nameChip');
  chip.classList.toggle('hidden', (route && route.name === 'live') || !me.name);
  chip.textContent = me.name ? '👤 ' + me.name : '';
}

/* --------------------------------------------------------------- store */
const REMOTE = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

/* Sums this device sent that have not been approved yet. The site has no
   accounts, so a pending bid is invisible to everyone but its sender —
   remembered here so the bidder is not left wondering. */
let myPending = (() => {
  try { return JSON.parse(localStorage.getItem('mazad_pending') || '{}'); } catch { return {}; }
})();

const remote = {
  async req(path, opts = {}) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
      ...opts,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
        ...(opts.headers || {})
      }
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if (!res.ok) throw new Error((data && (data.message || data.hint)) || 'network');
    return data;
  },
  /* mazad_public masks a queued number and carries no seller contact at all,
     so neither ever reaches a viewer's browser. The operator asks for the real
     rows with the secret instead. */
  async listings() {
    if (admin.on) {
      try {
        const r = await this.req('rpc/mazad_admin_list', {
          method: 'POST', body: JSON.stringify({ p_secret: admin.secret })
        });
        if (r && r.ok && r.listings) return r.listings;
      } catch (e) { console.warn('admin list failed, falling back', e); }
    }
    return this.req('mazad_public?select=*&order=created_at.desc&limit=200');
  },
  async listing(id) {
    if (admin.on) {
      const all = await this.listings();
      const hit = all.find(l => l.id === id);
      if (hit) return hit;
    }
    return this.req('mazad_public?select=*&id=eq.' + encodeURIComponent(id)).then(r => r[0] || null);
  },
  bids(id) {
    // never '*': anon has no SELECT on bidder_phone, and asking for it fails
    return this.req('mazad_bids?select=id,listing_id,bidder_name,amount,approved,created_at' +
      '&listing_id=eq.' + encodeURIComponent(id) + '&order=created_at.asc&limit=500');
  },
  async createListing(body) {
    // anon may INSERT but not SELECT the table, so ask for no row back and
    // generate the id here instead
    const id = uuid();
    await this.req('mazad_listings', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({ ...body, id })
    });
    return { ...body, id };
  },
  /* The schema gained p_city, and a five-argument place_bid REPLACES the
     four-argument one (a defaulted extra argument would be an overload, and a
     call naming only the first four would then be ambiguous). That means the
     page and the database change together — but they are deployed separately,
     so between a deploy and him running supabase-mazad.sql the new call finds
     no such function. PostgREST answers PGRST202 for that, and the whole site
     would be «ما تقدر تزايد» in the meantime. So: send the city, and on that
     one error fall back to the old call. The city is lost until the schema
     catches up; the auction is not. Same degrade-instead-of-error convention
     as the empty Supabase constants. */
  async placeBid(id, name, amount, phone, city) {
    const post = (body) => this.req('rpc/place_bid', {
      method: 'POST', body: JSON.stringify(body) });
    try {
      return await post({ p_listing: id, p_name: name, p_amount: amount,
                          p_phone: phone, p_city: city });
    } catch (e) {
      if (!/PGRST202|could not find|schema cache/i.test(String(e && e.message))) throw e;
      console.warn('place_bid has no p_city yet — run supabase-mazad.sql', e);
      return post({ p_listing: id, p_name: name, p_amount: amount, p_phone: phone });
    }
  },
  admin(id, secret, action, minutes, price) {
    return this.req('rpc/mazad_admin', {
      method: 'POST',
      body: JSON.stringify({
        p_listing: id, p_secret: secret, p_action: action,
        p_minutes: minutes ?? null, p_price: price ?? null
      })
    });
  },
  pendingBids(secret) {
    return this.req('rpc/mazad_pending_bids', {
      method: 'POST', body: JSON.stringify({ p_secret: secret })
    });
  },
  bidAction(bidId, secret, action) {
    return this.req('rpc/mazad_bid_action', {
      method: 'POST', body: JSON.stringify({ p_bid: bidId, p_secret: secret, p_action: action })
    });
  },
  manualBid(listing, secret, name, amount) {
    return this.req('rpc/mazad_manual_bid', {
      method: 'POST',
      body: JSON.stringify({ p_listing: listing, p_secret: secret, p_name: name, p_amount: amount })
    });
  },
  /* Correcting the lot that is ON AIR, without re-listing it: re-listing
     would drop the sums and the clock. Null means "leave this field alone",
     so the page can send one box at a time as the operator types. */
  setItem(listing, secret, fields) {
    return this.req('rpc/mazad_set_item', {
      method: 'POST',
      body: JSON.stringify({
        p_listing: listing, p_secret: secret,
        p_letters: fields.plate_letters ?? null,
        p_digits:  fields.plate_digits  ?? null,
        p_phone:   fields.phone         ?? null,
        p_make:    fields.car_make      ?? null,
        p_model:   fields.car_model     ?? null,
        p_year:    fields.car_year      ?? null
      })
    });
  },
  setEmblem(listing, secret, emblem) {
    return this.req('rpc/mazad_set_emblem', {
      method: 'POST',
      body: JSON.stringify({ p_listing: listing, p_secret: secret, p_emblem: emblem })
    });
  },
  setPlateKind(listing, secret, kind) {
    return this.req('rpc/mazad_set_plate_kind', {
      method: 'POST',
      body: JSON.stringify({ p_listing: listing, p_secret: secret, p_kind: kind })
    });
  },
  bidsOf(listing, secret) {
    return this.req('rpc/mazad_bids_of', {
      method: 'POST', body: JSON.stringify({ p_listing: listing, p_secret: secret })
    });
  },
  serverNow() {
    return this.req('rpc/mazad_now', { method: 'POST', body: '{}' });
  },
  /* A car photo goes to Storage, not into the table — the row keeps only the
     path. The bucket caps size and mime type server-side, because a seller has
     no account and the bucket has to accept anonymous uploads. */
  async uploadCarPhoto(file) {
    const ext = ({ 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp' })[file.type];
    if (!ext) throw new Error('bad_type');
    const path = 'cars/' + uuid() + '.' + ext;
    const res = await fetch(SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
                 'Content-Type': file.type, 'x-upsert': 'false' },
      body: file
    });
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error('upload ' + res.status + ' ' + t.slice(0, 120));
    }
    return path;
  },
  async operatorCreate(secret, d) {
    // two functions rather than one with more arguments: a defaulted extra
    // parameter on mazad_create would be an overload, and a call naming only
    // the original arguments would match both and be refused as ambiguous
    if (d.item_type === 'plate') {
      const r = await this.req('rpc/mazad_create_plate', {
        method: 'POST',
        body: JSON.stringify({
          p_secret: secret, p_letters: d.plate_letters, p_digits: d.plate_digits,
          p_start: d.start_price, p_seller: d.seller_name,
          p_contact: d.seller_contact || null, p_minutes: d.minutes, p_live: true,
          p_emblem: d.plate_emblem || null
        })
      });
      // mazad_create_plate carries no type argument — adding one would mean
      // dropping and recreating it — so the type is set right after, the same
      // way the quick-add sets an auto-sell limit
      if (r && r.ok && d.plate_kind && d.plate_kind !== 'private') {
        try { await this.setPlateKind(r.id, secret, d.plate_kind); }
        catch (e) { console.warn('plate kind not set', e); }
      }
      return r;
    }
    if (d.item_type === 'car') {
      return this.req('rpc/mazad_create_car', {
        method: 'POST',
        body: JSON.stringify({
          p_secret: secret, p_make: d.car_make, p_model: d.car_model, p_year: d.car_year,
          p_start: d.start_price, p_seller: d.seller_name,
          p_contact: d.seller_contact || null, p_minutes: d.minutes, p_live: true,
          p_photo: d.car_photo || null
        })
      });
    }
    return this.req('rpc/mazad_create', {
      method: 'POST',
      body: JSON.stringify({
        p_secret: secret, p_phone: d.phone, p_carrier: d.carrier || null,
        p_start: d.start_price, p_seller: d.seller_name, p_contact: d.seller_contact || null,
        p_note: d.note || null, p_minutes: d.minutes, p_live: true
      })
    });
  }
};

/* local demo mode — same shape, localStorage instead of a database */
const local = {
  read() { try { return JSON.parse(localStorage.getItem('mazad_demo') || '{"listings":[],"bids":[]}'); } catch { return { listings: [], bids: [] }; } },
  write(db) { localStorage.setItem('mazad_demo', JSON.stringify(db)); },
  uid() { return 'x' + Math.random().toString(36).slice(2) + nowMs().toString(36); },
  async listings() { return this.read().listings.slice().sort((a, b) => b.created_at.localeCompare(a.created_at)); },
  async listing(id) { return this.read().listings.find(l => l.id === id) || null; },
  async bids(id) { return this.read().bids.filter(b => b.listing_id === id && b.approved).sort((a, b) => a.created_at.localeCompare(b.created_at)); },
  async createListing(body) {
    const db = this.read();
    const row = { ...body, id: this.uid(), item_type: body.item_type || 'phone',
                  status: body.status || 'pending', is_live: false, created_at: new Date().toISOString() };
    db.listings.push(row); this.write(db); return row;
  },
  async placeBid(id, name, amount, phone, city) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === id);
    if (!lot) return { ok: false, error: 'not_found' };
    if (!/^05\d{8}$/.test(String(phone || ''))) return { ok: false, error: 'bad_phone' };
    if (String(city || '').trim().length < 2) return { ok: false, error: 'bad_city' };
    if (lot.status === 'pending') return { ok: false, error: 'not_started' };
    if (lot.status !== 'open') return { ok: false, error: 'closed' };
    if (!lot.end_at || new Date(lot.end_at).getTime() <= nowMs()) return { ok: false, error: 'expired' };
    const cur = db.bids.filter(b => b.listing_id === id && b.approved)
      .reduce((m, b) => Math.max(m, +b.amount), +lot.start_price);
    const min = cur + stepFor(cur);
    if (amount < min) return { ok: false, error: 'too_low', current: cur, min };
    db.bids.push({ id: this.uid(), listing_id: id, bidder_name: name, bidder_phone: phone,
                   bidder_city: String(city || '').trim(),
                   amount, approved: false, created_at: new Date().toISOString() });
    this.write(db);
    return { ok: true, pending: true, amount };
  },
  async admin(id, _secret, action, minutes, price) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === id);
    if (action === 'delete') {
      db.listings = db.listings.filter(l => l.id !== id);
      db.bids = db.bids.filter(b => b.listing_id !== id);
    } else if (action === 'next') {
      db.listings.forEach(l => l.is_live = false);
      const nx = db.listings
        .filter(l => ['pending', 'open'].includes(l.status) &&
                     (!l.end_at || new Date(l.end_at).getTime() > nowMs()) && l.id !== id)
        .sort((a, b) => a.created_at.localeCompare(b.created_at))[0];
      if (nx) nx.is_live = true;
      this.write(db);
      return { ok: true, next: nx ? nx.id : null };
    } else if (!lot) {
      return { ok: false, error: 'not_found' };
    } else if (action === 'live') {
      db.listings.forEach(l => l.is_live = false); lot.is_live = true;
    } else if (action === 'unlive') {
      lot.is_live = false;
    } else if (action === 'extend') {
      lot.end_at = new Date(Math.max(new Date(lot.end_at).getTime(), nowMs()) + (minutes || 5) * 60000).toISOString();
    } else if (action === 'timer') {
      lot.status = 'open'; lot.end_at = new Date(nowMs() + (minutes || 1) * 60000).toISOString();
    } else if (action === 'open') {
      lot.status = 'pending'; lot.end_at = null; lot.sold_price = null;
    } else if (action === 'price') {
      lot.sold_price = price;
    } else if (action === 'auto') {
      if (price != null && !(price > +lot.start_price)) {
        return { ok: false, error: 'bad_amount', start: +lot.start_price };
      }
      lot.auto_sell_price = price;
      if (price != null) {
        const best = db.bids.filter(b => b.listing_id === id && b.approved)
          .reduce((m, b) => Math.max(m, +b.amount), +lot.start_price);
        const auto = this.tryAuto(lot, best);
        this.write(db);
        return { ok: true, auto_sold: auto };
      }
    } else {
      lot.status = action;   // stays on air so the sticker shows on the broadcast
      if (action === 'sold') {
        const best = db.bids.filter(b => b.listing_id === id && b.approved).reduce((m, b) => Math.max(m, +b.amount), 0);
        lot.sold_price = price != null ? price : (best || +lot.start_price);
      } else {
        lot.sold_price = null;
      }
    }
    this.write(db);
    return { ok: true };
  },
  // mirrors mazad_try_auto_sell(): a counted sum that reaches the seller's
  // limit closes the lot, and the number stays on air wearing its sticker
  tryAuto(lot, amount) {
    if (lot.auto_sell_price == null) return false;
    if (!['open', 'pending'].includes(lot.status)) return false;
    if (!(Number(amount) >= Number(lot.auto_sell_price))) return false;
    lot.status = 'sold';
    lot.sold_price = Number(amount);
    lot.end_at = new Date(nowMs()).toISOString();
    return true;
  },
  async manualBid(listing, _secret, name, amount) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === listing);
    if (!lot) return { ok: false, error: 'not_found' };
    if (!['open', 'pending'].includes(lot.status)) {
      return { ok: false, error: 'finished', status: lot.status };
    }
    const cur = db.bids.filter(b => b.listing_id === listing && b.approved)
      .reduce((m, b) => Math.max(m, +b.amount), +lot.start_price);
    if (amount <= cur) return { ok: false, error: 'below_current', current: cur };
    db.bids.push({ id: this.uid(), listing_id: listing, bidder_name: name, amount,
                   approved: true, created_at: new Date().toISOString() });
    const auto = this.tryAuto(lot, amount);
    this.write(db);
    return { ok: true, amount, auto_sold: auto };
  },
  async bidsOf(listing) {
    const db = this.read();
    return { ok: true, bids: db.bids.filter(b => b.listing_id === listing)
      .sort((a, b) => b.amount - a.amount) };
  },
  async pendingBids() {
    const db = this.read();
    const open = new Set(db.listings.filter(l => l.status === 'open').map(l => l.id));
    return { ok: true, bids: db.bids.filter(b => !b.approved && open.has(b.listing_id))
      .map(b => ({ ...b, phone: (db.listings.find(l => l.id === b.listing_id) || {}).phone })) };
  },
  async bidAction(bidId, _secret, action) {
    const db = this.read();
    const bid = db.bids.find(b => b.id === bidId);
    if (!bid) return { ok: false, error: 'not_found' };
    if (action === 'reject') { db.bids = db.bids.filter(b => b.id !== bidId); this.write(db); return { ok: true }; }
    const lot = db.listings.find(l => l.id === bid.listing_id);
    if (!['open', 'pending'].includes(lot.status)) {
      return { ok: false, error: 'finished', status: lot.status };
    }
    const cur = db.bids.filter(b => b.listing_id === bid.listing_id && b.approved)
      .reduce((m, b) => Math.max(m, +b.amount), +lot.start_price);
    if (+bid.amount <= cur) return { ok: false, error: 'below_current', current: cur };
    bid.approved = true;
    const auto = this.tryAuto(lot, bid.amount);
    if (!auto && lot.end_at && new Date(lot.end_at).getTime() - nowMs() < 60000) {
      lot.end_at = new Date(nowMs() + 120000).toISOString();
    }
    this.write(db);
    return { ok: true, amount: bid.amount, auto_sold: auto };
  },
  async setItem(listing, _secret, fields) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === listing);
    if (!lot) return { ok: false, error: 'not_found' };
    if (['sold','unsold','cancelled'].includes(lot.status)) return { ok: false, error: 'finished' };
    if (lot.item_type === 'plate') {
      if (fields.plate_letters != null) {
        const v = normPlate(fields.plate_letters);
        if (!new RegExp('^[' + PLATE_LETTERS.join('') + ']{1,3}$').test(v)) return { ok: false, error: 'bad_letters' };
        lot.plate_letters = v;
      }
      if (fields.plate_digits != null) {
        if (!/^\d{1,4}$/.test(fields.plate_digits)) return { ok: false, error: 'bad_digits' };
        lot.plate_digits = fields.plate_digits;
      }
    } else if (lot.item_type === 'car') {
      if (fields.car_make  != null) lot.car_make  = fields.car_make;
      if (fields.car_model != null) lot.car_model = fields.car_model;
      if (fields.car_year  != null) lot.car_year  = fields.car_year;
    } else if (fields.phone != null) {
      if (!/^05\d{8}$/.test(fields.phone)) return { ok: false, error: 'bad_phone' };
      lot.phone = fields.phone;
    }
    this.write(db);
    return { ok: true, ...lot };
  },
  async setEmblem(listing, _secret, emblem) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === listing);
    if (!lot) return { ok: false, error: 'not_found' };
    if (lot.item_type !== 'plate') return { ok: false, error: 'not_a_plate' };
    lot.plate_emblem = emblem; this.write(db);
    return { ok: true, emblem };
  },
  async setPlateKind(listing, _secret, kind) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === listing);
    if (!lot) return { ok: false, error: 'not_found' };
    if (lot.item_type !== 'plate') return { ok: false, error: 'not_a_plate' };
    if (!PLATE_KINDS[kind]) return { ok: false, error: 'bad_kind' };
    lot.plate_kind = kind; this.write(db);
    return { ok: true, plate_kind: kind };
  },
  async operatorCreate(_secret, d) {
    const db = this.read();
    db.listings.forEach(l => l.is_live = false);
    const row = {
      id: this.uid(),
      item_type: d.item_type || 'phone',
      plate_letters: d.item_type === 'plate' ? d.plate_letters : null,
      plate_digits:  d.item_type === 'plate' ? d.plate_digits  : null,
      plate_emblem:  d.item_type === 'plate' ? (d.plate_emblem || 'swords') : null,
      plate_kind:    d.item_type === 'plate' ? (d.plate_kind || 'private') : null,
      car_make:  d.item_type === 'car' ? d.car_make  : null,
      car_model: d.item_type === 'car' ? d.car_model : null,
      car_year:  d.item_type === 'car' ? d.car_year  : null,
      car_photo: d.item_type === 'car' ? (d.car_photo || null) : null,
      phone: d.item_type === 'phone' ? d.phone : null, carrier: d.carrier || null,
      start_price: d.start_price, seller_name: d.seller_name,
      seller_contact: d.seller_contact || null, note: d.note || null,
      auto_sell_price: d.auto_sell_price ?? null,
      end_at: new Date(nowMs() + d.minutes * 60000).toISOString(),
      status: 'open', is_live: true, created_at: new Date().toISOString()
    };
    db.listings.push(row); this.write(db);
    return { ok: true, id: row.id };
  }
};

const store = REMOTE ? remote : local;

async function syncClock() {
  if (!REMOTE) return;
  try {
    const before = Date.now();
    const iso = await remote.serverNow();
    const after = Date.now();
    const server = Date.parse(typeof iso === 'string' ? iso : String(iso));
    if (!isNaN(server)) {
      // the reply is already half a round trip old, so meet it in the middle
      const skew = server - (before + (after - before) / 2);
      if (Math.abs(skew - clockSkew) > 1500) {
        clockSkew = skew;
        if (Math.abs(skew) > 60000) {
          console.warn('device clock is off by', Math.round(skew / 1000), 's — corrected');
        }
        refresh(false);
      } else {
        clockSkew = skew;
      }
    }
  } catch (e) { console.warn('clock sync failed', e); }
}

/* ---------------------------------------------------------------- admin */
/* Operator mode persists on this browser (localStorage, not sessionStorage) so
   the password is typed once, not at every visit. Anyone with this unlocked
   device is therefore an operator — "خروج من وضع المشرف" clears it. */
const admin = {
  get secret() {
    try { return localStorage.getItem('mazad_admin') || sessionStorage.getItem('mazad_admin') || ''; }
    catch { return ''; }
  },
  set secret(v) {
    try {
      sessionStorage.removeItem('mazad_admin');
      if (v) localStorage.setItem('mazad_admin', v); else localStorage.removeItem('mazad_admin');
    } catch { /* private mode */ }
  },
  get on() { return Boolean(this.secret); }
};

/* ---------------------------------------------------------------- views */
let cache = {
  listings: [], bids: {}, filter: 'live',
  // the section the viewer last chose, kept so a returning visitor lands on
  // the one he actually cares about
  // a section switched off since his last visit must not leave him on an
  // empty list he cannot get out of
  kind: (() => {
    let k = 'all';
    try { k = localStorage.getItem('mazad_kind') || 'all'; } catch {}
    return (k === 'all' || kindShown(k)) ? k : 'all';
  })()
};
let route = { name: 'list', id: null };
let pollTimer = null, tickTimer = null;

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('n/')) return { name: 'lot', id: decodeURIComponent(h.slice(2)) };
  if (h === 'admin') return { name: 'admin', id: null };
  if (h === 'about') return { name: 'about', id: null };
  if (h === 'live') return { name: 'live', id: null };
  // one operator screen now: /control is kept only so an old link still lands
  // somewhere sensible
  if (h === 'control') return { name: 'live', id: null };
  if (!h && /\/live\/?$/.test(location.pathname)) return { name: 'live', id: null };
  if (!h && /\/control\/?$/.test(location.pathname)) return { name: 'live', id: null };
  return { name: 'list', id: null };
}

/* The page refreshes itself every 2.5s. Rebuilding a whole screen's innerHTML
   that often makes it jump under the reader's thumb — heights change, the
   scroll position slips. Nothing on these screens moves on its own except the
   countdown, and tick() updates that in place through [data-cd], so each
   screen rebuilds only when something it shows has actually changed. Clearing
   the signatures on navigation forces the first paint of a screen. */
let screenSig = { control: '', live: '', lot: '', ops: '', item: '', about: '' };

/* The page re-reads itself every 2.5s, and the operator edits the lot that is
   ON AIR while he types. Without this the poll lands between two keystrokes
   and puts the old plate back on camera. So an edit is held locally and
   re-applied to every fetch until the server echoes it back (or 15s pass,
   which means the save failed and the truth is the server's). */
let liveEdit = null;
function applyLiveEdit(list) {
  if (!liveEdit) return list;
  if (nowMs() - liveEdit.at > 15000) { liveEdit = null; return list; }
  const lot = (list || []).find(l => l.id === liveEdit.id);
  if (!lot) { liveEdit = null; return list; }
  const landed = Object.keys(liveEdit.fields)
    .every(k => String(lot[k] ?? '') === String(liveEdit.fields[k] ?? ''));
  if (landed) { liveEdit = null; return list; }
  Object.assign(lot, liveEdit.fields);
  return list;
}
let opsFolded = (() => { try { return localStorage.getItem('mazad_ops_folded') === '1'; } catch { return false; } })();

/* ---------- the broadcast runs ONE section at a time ----------
   A plates night is a plates night. Mixing a phone into the queue behind a
   plate, and quoting the phone commission under a car, is not a smaller
   version of three auctions — it is a muddle nobody can follow, least of all
   on camera. So /live has a section: whatever is on air sets it, and when
   nothing is on air the operator picks it from his strip. The queue, the
   commission line and التالي all obey it. */
let liveKind = (() => {
  try { return firstShownKind(localStorage.getItem('mazad_live_kind') || KINDS_SHOWN[0]); }
  catch { return KINDS_SHOWN[0]; }
})();
function setLiveKind(k) {
  if (liveKind === k) return;
  liveKind = k;
  try { localStorage.setItem('mazad_live_kind', k); } catch {}
  screenSig.live = ''; screenSig.ops = ''; screenSig.item = '';
  refresh(false);
}
/* what is on air decides the section; otherwise his own choice stands */
function liveSection(lot) {
  if (!lot) return liveKind;
  const k = kindOf(lot);
  if (k !== liveKind) { liveKind = k; try { localStorage.setItem('mazad_live_kind', k); } catch {} }
  return k;
}
/* An unapproved row is a REQUEST, not a queued lot: it is invisible to the
   public, so putting one on air would broadcast a card nobody watching can
   see. It stays out of the queue until he approves it. `approved` is
   undefined on a page talking to a schema that predates the column — treat
   that as approved, the same degrade-instead-of-error rule used elsewhere. */
const isApproved = (l) => l.approved !== false;
const queueOf = (kind) => cache.listings
  .filter(l => isApproved(l) && ['pending', 'live'].includes(lotState(l)) &&
               !l.is_live && kindOf(l) === kind)
  .sort((a, b) => a.created_at.localeCompare(b.created_at));
// every section's requests, not just the one he is running: a car submitted
// on a plates night must not sit unseen until he happens to switch
const requestsWaiting = () => cache.listings
  .filter(l => !isApproved(l))
  .sort((a, b) => a.created_at.localeCompare(b.created_at));
const sigOfBids = bs => (bs || []).map(b => b.id + ':' + b.amount).join(',');

/* /live and /control are their own paths, so clearing the hash leaves you
   exactly where you were. Leaving them means changing the path. */
function goList() {
  if (/\/(live|control)\/?$/.test(location.pathname)) {
    location.href = location.pathname.replace(/\/(live|control)\/?$/, '/m');
    return;
  }
  if (location.hash) { location.hash = ''; return; }
  go();
}

async function go() {
  route = parseRoute();
  screenSig = { control: '', live: '', lot: '', ops: '', item: '', about: '' };
  if (route.name === 'admin') { location.hash = ''; askAdmin(); return; }
  $('#viewList').classList.toggle('hidden', route.name !== 'list');
  $('#viewLot').classList.toggle('hidden', route.name !== 'lot');
  $('#viewLive').classList.toggle('hidden', route.name !== 'live');
  $('#viewAbout').classList.toggle('hidden', route.name !== 'about');
  document.body.classList.toggle('on-air', route.name === 'live');
  $('#bidbarHost').innerHTML = '';
  if (route.name !== 'live') document.body.classList.remove('ops-open');
  paintName();
  if (route.name !== 'live') $('#opsPeek').classList.remove('on');
  window.scrollTo(0, 0);
  await refresh(true);
}

async function refresh(full) {
  try {
    // static text, and it must open without waiting on the network
    if (route.name === 'about') { renderAbout(); return; }
    if (route.name === 'live') {
      cache.listings = applyLiveEdit(await store.listings());
      const lot = cache.listings.find(l => l.is_live);
      const bids = lot ? await store.bids(lot.id) : [];
      if (lot) cache.bids[lot.id] = bids;
      if (admin.on) {   // both screens carry the operator's strip now
        try {
          const r = await store.pendingBids(admin.secret);
          cache.pending = (r && r.ok && r.bids) ? r.bids : [];
        } catch { cache.pending = cache.pending || []; }
      }
      renderLive(lot, bids);
      return;
    }
    if (route.name === 'lot') {
      const [lot, bids] = await Promise.all([store.listing(route.id), store.bids(route.id)]);
      if (!lot) { $('#lotBody').innerHTML = '<div class="empty"><div class="empty-emoji">🔍</div>هذا المزاد غير موجود أو تم حذفه.</div>'; return; }
      cache.bids[lot.id] = bids;
      renderLot(lot, bids, full);
    } else {
      cache.listings = await store.listings();
      const ids = cache.listings.map(l => l.id);
      if (REMOTE && ids.length) {
        const rows = await remote.req('mazad_bids?select=listing_id,amount,bidder_name,created_at&order=amount.desc&limit=2000');
        cache.bids = {};
        rows.forEach(b => (cache.bids[b.listing_id] ||= []).push(b));
      } else if (!REMOTE) {
        const db = local.read(); cache.bids = {};
        db.bids.filter(b => b.approved).forEach(b => (cache.bids[b.listing_id] ||= []).push(b));
      }
      renderList();
    }
  } catch (e) {
    console.error(e);
    if (full) toast('تعذّر تحميل البيانات — تحقق من الاتصال');
  }
}

/* What the number actually went for: the recorded sale price when the
   operator entered one, otherwise the highest real bid. Never invented. */
function finalPrice(lot, t) {
  if (lot.status === 'sold' && lot.sold_price != null) return Number(lot.sold_price);
  return t.amount;
}

/* Every sum is drawn on the raised paddle. The hand and the board are a
   supplied illustration (mazad-paddle.png) — nothing here draws them. All this
   does is lay the number on the board: the board sits at 36.0% / 20.3% of the
   frame, is 64.1% of its width, and leans -7.2deg, all measured off the file
   itself, so the text sits square on the board rather than floating over it.
   Re-measure these four numbers if the artwork is ever replaced. */
function paddle(amount, variant) {
  const label = money(amount);
  // sized against the board, which is 64.10% of this frame: 17cqw is as large
  // as it looks right, and long sums step down so they still fit
  const fs = Math.min(17, 88 / Math.max(label.length, 1)).toFixed(2);
  return (
    '<span class="paddle ' + (variant || '') + '" style="--fs:' + fs + '">' +
      '<img src="mazad-paddle.png" alt="" loading="lazy" decoding="async">' +
      '<span class="p-amt num">' + esc(label) + '</span>' +
    '</span>'
  );
}

function topBid(id, lot) {
  const bids = cache.bids[id] || [];
  if (!bids.length) return { amount: Number(lot ? lot.start_price : 0), name: null, count: 0 };
  const best = bids.reduce((a, b) => (+b.amount > +a.amount ? b : a));
  return { amount: +best.amount, name: best.bidder_name, count: bids.length };
}

function renderList() {
  const host = $('#lots');
  let rows = cache.listings.slice();

  // the public does not get a record of what every number sold for
  const finished = (l) => ['sold', 'unsold', 'cancelled', 'ended'].includes(lotState(l));
  if (!SHOW_FINISHED && !admin.on) rows = rows.filter(l => !finished(l) || l.is_live);
  const dTab = $('#fDone');
  if (dTab) dTab.classList.toggle('hidden', !SHOW_FINISHED && !admin.on);

  // the section comes first: a viewer picks what he is here for, then how far
  // along it is
  // A section that is switched off is hidden from the public list but NOT
  // deleted: the operator still sees those lots, because he has to finish
  // what is already queued, and a direct link still opens one.
  if (!admin.on) rows = rows.filter(l => kindShown(kindOf(l)));
  if (cache.kind && cache.kind !== 'all') {
    rows = rows.filter(l => (l.item_type || 'phone') === cache.kind);
  }
  if (cache.filter === 'live')    rows = rows.filter(l => lotState(l) === 'live');
  if (cache.filter === 'pending') rows = rows.filter(l => lotState(l) === 'pending');
  if (cache.filter === 'done')    rows = rows.filter(finished);
  const rank = (l) => {
    const st = lotState(l);
    if (l.is_live) return 0;
    if (st === 'live') return 1;
    if (st === 'pending') return 2;
    return 3;
  };
  rows.sort((a, b) => {
    const d = rank(a) - rank(b);
    if (d) return d;
    // the queue keeps its turn order; everything else is newest first
    return rank(a) === 2 ? new Date(a.created_at) - new Date(b.created_at)
                         : new Date(b.created_at) - new Date(a.created_at);
  });

  const onAir = cache.listings.find(l => l.is_live);

  const banner =
    (onAir
      ? '<button class="live-banner" id="goLive" data-lot="' + esc(onAir.id) + '">' +
          '<span class="live-dot">على الهواء</span>' +
          '<span class="n">' + esc(itemLabel(onAir)) + '</span>' +
          '<span class="go">زايد الحين</span>' +
        '</button>'
      : '') +
    (admin.on
      ? '<button class="live-banner" id="goControl" style="background:#48121f">' +
          '<span class="go">لوحة التحكم</span>' +
          '<span class="n" style="font-size:.86rem">تظهر لك وحدك</span>' +
        '</button>'
      : '');

  if (!rows.length) {
    /* the icon follows the SECTION — it was hard-coded to the phone one, so
       an empty سيارات list showed a mobile. Same class of slip as «رقم مميز»
       under a plate: a section names and draws itself. */
    host.innerHTML = banner + '<div class="empty"><div class="empty-emoji">' +
      (KIND_ICON[cache.kind] || '🔍') + '</div>'
      + (cache.kind && cache.kind !== 'all'
         ? 'ما فيه ' + (KIND_NAME[cache.kind] || '') + ' هنا الحين.<br>اعرض واحد ويدخل القائمة.'
         : cache.filter === 'live' ? 'ما فيه سوم مفتوح الحين.<br>اعرض واحد وينتظر دوره.'
         : cache.filter === 'pending' ? 'ما فيه شي بالانتظار.' : 'ما فيه شيء هنا بعد.')
      + '</div>';
    wireLiveBanner();
    return;
  }

  host.innerHTML = banner;
  wireLiveBanner();
  rows.forEach(lot => {
    const st = lotState(lot), t = topBid(lot.id, lot), cd = countdown(lot.end_at);
    const badge = badgeFor(st)
      + (lot.is_live ? '<span class="badge air">🔴 على الهواء</span>' : '')
      // its own class: .badge.wait already means "بانتظار الدور", and one class
      // carrying two meanings is how a selector ends up matching the wrong badge
      + (isMasked(lot) ? '<span class="badge hid">🔒 مخفي</span>' : '');
    const card = el(
      '<div class="card">' +
        '<button class="lot">' +
          '<div class="lot-top">' + badge +
            '<span class="badge">' + esc(kindBadge(lot)) + '</span>' +
            '<span style="flex:1"></span>' +
            '<span style="font-size:.72rem;color:var(--muted)">' + esc(ago(lot.created_at)) + '</span>' +
          '</div>' +
          '<div class="phone-plate plate-wrap">' + plateStamped(lot, '', st) + '</div>' +
          '<div class="lot-stats">' +
            '<div class="stat"><div class="stat-k">' + (st === 'sold' ? 'بيع على' : st === 'pending' ? 'سعر البداية' : 'السعر الحالي') + '</div>' +
              '<div class="stat-v price"><span class="num">' + money(finalPrice(lot, t)) + '</span> ر.س</div></div>' +
            '<div class="stat"><div class="stat-k">' + (st === 'live' ? 'ينتهي خلال' : 'الحالة') + '</div>' +
              (st === 'live'
                ? clockCell(lot, 'stat-v time', cd)
                : '<div class="stat-v over">' +
                  (st === 'sold' ? 'مباع' : st === 'unsold' ? 'لم يُبَع'
                   : st === 'pending' ? 'ينتظر دوره' : 'مغلق') + '</div>') +
            '</div>' +
          '</div>' +
          '<div class="lot-foot">👤 ' + esc(lot.seller_name) +
            ' · <span class="num">' + t.count + '</span> سومة' +
            (t.name ? ' · أعلى: ' + esc(t.name) : '') + '</div>' +
        '</button>' +
      '</div>'
    );
    card.querySelector('.lot').addEventListener('click', () => { location.hash = '#/n/' + encodeURIComponent(lot.id); });
    if (st === 'live') {
      const go = el('<button class="btn btn-gold btn-block btn-sm" style="margin-top:10px">زايد على ' + itemWord(lot) + '</button>');
      go.addEventListener('click', () => { location.hash = '#/n/' + encodeURIComponent(lot.id); });
      card.appendChild(go);
    }
    if (admin.on) card.appendChild(adminBar(lot));
    host.appendChild(card);
  });
}

function wireLiveBanner() {
  const b = $('#goLive');
  // viewers go to the number's own page, where the bidding is. /live is the
  // broadcast screen and has no bid box at all — sending them there was why
  // "I opened it and could not bid".
  if (b) b.addEventListener('click', () => {
    const id = b.dataset.lot;
    location.hash = id ? '#/n/' + encodeURIComponent(id) : '#/live';
  });
  const c = $('#goControl');
  if (c) c.addEventListener('click', () => { location.hash = '#/live'; });
}

function adminBar(lot) {
  const bar = el('<div class="adminbar">'
    // an unapproved row reaches this bar only through mazad_admin_list — the
    // public cannot see it at all, so approving is the first thing to offer
    + (isApproved(lot) ? '' : '<button data-a="approve" class="ok">✔ وافق — اعرضه للناس</button>')
    + '<button data-a="live">🔴 اعرضه بالبث</button>'
    + '<button data-a="sold">' + (lot.status === 'sold' ? '✎ عدّل سعر البيع' : '✔ تم البيع') + '</button>'
    + '<button data-a="unsold">✖ لم يتم البيع</button>'
    + '<button data-a="extend">+5 دقائق</button>'
    + '<button data-a="open">رجّعه للقائمة</button>'
    + '<button data-a="delete" class="del">حذف</button>'
    + '</div>');
  bar.addEventListener('click', async (e) => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'sold') { await markSold(lot); return; }
    if (a === 'delete' && !confirm('حذف ' + itemWord(lot) + ' ' + itemLabel(lot) + ' نهائياً؟')) return;
    const r = await opDo(lot.id, a);
    if (!r) return;
    if (a === 'live') { toast('صار على الهواء 🔴'); return; }
    if (a === 'approve') { toast('وافقت — صار يظهر للناس ✔'); return; }
    toast('تم');
    if (a === 'delete' && route.name === 'lot') goList();
  });
  return bar;
}

/* ===================== شاشة البث المباشر =====================
   One number at a time, sized for a phone or an iPad on screen share.
   The operator bar underneath only appears in operator mode.          */
function renderLive(lot, bids) {
  const host = $('#liveBody');

  // This screen is the operator's: it is what goes on camera and it carries
  // his controls. A viewer has no use for it — there is no bid box here by
  // design — so send them to the page they can actually act on.
  if (!admin.on) {
    $('#liveSplit').classList.remove('with-ops');
    $('#opsPeek').classList.remove('on');
    if (screenSig.live === 'locked') return;
    screenSig.live = 'locked';
    host.innerHTML =
      '<div class="card" style="text-align:center">' +
        '<div style="font-size:1.6rem;margin-bottom:6px">📺</div>' +
        '<div style="font-weight:800;margin-bottom:6px">شاشة البث</div>' +
        '<div style="font-size:.88rem;color:var(--muted);margin-bottom:14px">' +
          'هذي الشاشة للمشرف. للمزايدة وعرض رقمك، افتح صفحة المزاد.</div>' +
        '<button class="btn btn-gold btn-block" id="liveToList">روح لصفحة المزاد</button>' +
        '<button class="btn btn-ghost btn-block" style="margin-top:8px" id="liveLogin">دخول المشرف</button>' +
      '</div>';
    $('#liveToList').addEventListener('click', () => goList());
    $('#liveLogin').addEventListener('click', () => askAdmin());
    return;
  }

  const kind = liveSection(lot);
  const open = queueOf(kind);
  const liveId = lot ? lot.id : null;
  const doneCount = cache.listings
    .filter(l => ['sold', 'unsold'].includes(l.status) && kindOf(l) === kind && l.id !== liveId).length;

  if (!lot) {
    const emptySig = 'empty:' + kind + ':' + doneCount + ':' + open.map(l => l.id).join(',');
    if (emptySig === screenSig.live && host.firstElementChild) return;
    screenSig.live = emptySig;
    host.innerHTML =
      '<div class="live">' +
        '<div class="live-head"><span class="live-dot">' + esc(KIND_LABEL[kind]) + '</span>' +
          '<span class="live-seq">تم الانتهاء من <span class="num">' + doneCount + '</span> ' +
            esc(kindCount(kind)) + '</span></div>' +
        '<div class="live-empty"><div class="t">جاهزون للي بعده</div>' +
          '<div class="s">اعرض ' + esc(kindNoun(kind)) + ' من الموقع وبيجي دورك</div></div>' +
        liveBar(kind) +
        queueHtml(open) +
      '</div>';
    wireQueue(open, null);
    // the strip is needed MOST here: nothing is on air, so this is where he
    // picks the section and puts the next one up. Returning without it left
    // him staring at an empty card with no controls at all.
    renderLiveOps(null);
    return;
  }

  const st = lotState(lot);
  const t = topBid(lot.id, lot);
  const shown = finalPrice(lot, t);
  const cd = countdown(lot.end_at);
  // Four, not six. The artwork is a hand on a FOREARM, so at six across the
   // arms run under the next fist and the row reads as one smear — «مدموجة فوق
   // بعض». The newest four, with the top sum among them, is what matters.
  const last = bids.slice(-4).reverse();
  const best = bids.length ? Math.max(...bids.map(b => +b.amount)) : null;

  const sig = JSON.stringify([
    lot.id, lot.phone, lot.status, lot.sold_price, lot.auto_sell_price,
    // the identity itself is editable from the strip now, so it belongs in
    // the signature: without it the stage keeps the old plate on camera
    lot.plate_letters, lot.plate_digits, lot.plate_emblem, lot.plate_kind,
    lot.car_make, lot.car_model, lot.car_year, lot.car_photo,
    lot.seller_name, lot.end_at, lot.paused_ms, st, doneCount, kind,
    sigOfBids(bids), open.map(l => l.id).join(',')
  ]);
  if (sig === screenSig.live && host.firstElementChild) return;
  screenSig.live = sig;

  host.innerHTML =
    '<div class="live">' +
      /* «مزاد أبو شادن وضحه فوق، خلي الناس تشوف اسم المزاد». A viewer arrives
         mid-stream with no page and no URL — the only thing that can tell him
         whose auction this is, is the card itself. The topbar carries the
         brand but the camera frames the card, not the browser. */
      '<div class="live-head">' +
        '<span class="live-brand"><b>مزاد أبو شادن</b>' +
          '<span class="lb-sub">' + esc(kindPremium(kind)) + '</span></span>' +
        '<span style="flex:1"></span>' +
        '<span class="live-dot">' + (st === 'live' ? 'على الهواء' : st === 'pending' ? 'جاهز' : 'انتهى') + '</span>' +
        '<span class="live-seq">رقم <span class="num">' + (doneCount + 1) + '</span>' +
          (open.length ? ' · بالانتظار <span class="num">' + open.length + '</span>' : '') + '</span>' +
      '</div>' +

      '<div class="live-plate plate-wrap">' +
        plateStamped(lot, 'live', st) +
        /* «رقم مميز» under a PLATE, on camera. CARRIERS is the phone
           section's own label and a plate has no carrier, so it fell through
           to the phone default — the same class of bug as the commission
           quoting the phone rule under a car. A kind names itself. */
        '<div class="live-note">' +
          esc(CARRIERS[lot.carrier] || kindPremium(kindOf(lot))) +
          (lot.seller_name && lot.seller_name !== 'البائع' ? ' · البائع ' + esc(lot.seller_name) : '') + '</div>' +
      '</div>' +

      (st === 'live'
        ? clockCell(lot, 'live-clock', cd)
        : st === 'pending'
        ? '<div class="live-clock over">جاهز — ينتظر بدء السوم</div>'
        : '<div class="live-clock over">' + (st === 'sold' ? 'مبروك للمشتري 🎉' : st === 'unsold' ? 'ما تم البيع' : 'انتهى الوقت') + '</div>') +

      '<div class="live-price">' +
        '<div class="k">' + (st === 'sold' ? 'بيع على' : st === 'pending' ? 'سعر البداية' : 'أعلى سوم') + '</div>' +
        '<div class="v"><span class="num">' + money(shown) + '</span> ر.س</div>' +
        '<div class="who">' +
          (t.name ? esc(t.name)
           : st === 'sold' ? 'بيع مباشر — بدون مزايدات على الموقع'
           : st === 'pending' ? 'ابدأ المؤقت عشان يفتح السوم'
           : 'ما زايد أحد بعد') + '</div>' +
      '</div>' +

      (autoLine(lot, shown, st) ? '<div class="live-auto">' + autoLine(lot, shown, st) + '</div>' : '') +

      (last.length
        ? '<div class="live-paddles">' + last.map(b =>
            '<div class="lp' + (+b.amount === best ? ' top' : '') + '">' +
              paddle(b.amount, +b.amount === best ? 'top' : '') +
              '<div class="lp-name">' + esc(b.bidder_name) + '</div>' +
            '</div>').join('') + '</div>'
        : '') +

      liveBar(kindOf(lot)) +

      queueHtml(open) +
    '</div>';

  wireQueue(open, lot);
  renderLiveOps(lot);
}

/* ---------------- the operator's strip, beside the broadcast ----------------
   He films this screen with a phone and has no second device, so stepping away
   to /control would drop the broadcast. The strip therefore rides along on the
   PHYSICAL RIGHT of the same page, past a dashed edge he keeps outside the
   camera frame. It is his own browser — a viewer loading /live is not in
   operator mode and never gets this markup at all.

   It shows real numbers in full and the bidders' mobiles, which is exactly
   what the public view masks, so it only ever appears when there is room for
   it beside the stage (a phone gets nothing) and it can be folded away. */
function renderLiveOps(lot) {
  const host  = $('#liveOps');
  const split = $('#liveSplit');
  if (!host || !split) return;

  const on = admin.on && !opsFolded;
  split.classList.toggle('with-ops', on);
  document.body.classList.toggle('ops-open', on);
  $('#opsPeek').classList.toggle('on', admin.on && opsFolded && route.name === 'live');
  if (!on) { host.innerHTML = ''; screenSig.ops = ''; return; }

  const kind = liveSection(lot);
  const open = queueOf(kind);

  const reqs = requestsWaiting();

  const sig = JSON.stringify([
    lot ? [lot.id, lot.status, lot.end_at, lot.auto_sell_price] : null,
    kind, sigOfBids(cache.pending),
    open.map(l => l.id + ':' + itemLabel(l)).join(','),
    reqs.map(l => l.id).join(',')
  ]);
  if (sig !== screenSig.ops || !host.firstElementChild) {
    screenSig.ops = sig;
    host.innerHTML =
      '<div class="ops-warn">🎥 هذا الجزء لك وحدك — لا تدخله في إطار الكاميرا' +
        '<button class="ops-fold" title="اطوِ اللوحة">✕</button></div>' +
      // the live sections, plus whatever is on air even if its section was
      // switched off — otherwise he cannot see the lot he is running
      '<div class="seg ops-seg" id="opsKind">' +
        KINDS_SHOWN.concat(kindShown(kind) ? [] : [kind]).map(k =>
          '<button' + (k === kind ? ' class="on"' : '') + ' data-k="' + k + '">' +
            esc(KIND_LABEL[k]) + '</button>').join('') +
      '</div>' +
      '<div class="ops-card" id="opsReq"></div>' +
      '<div class="ops-card" id="opsItem"></div>' +
      '<div class="ops-card" id="opsBar"></div>' +
      '<div class="ops-card" id="opsPending"></div>' +
      '<div class="ops-card" id="opsApproved"></div>' +
      '<div class="ops-card" id="opsQueue"></div>';

    // the section is his to choose only while nothing is on air — what IS on
    // air owns the screen, and switching under it would show the wrong queue
    host.querySelector('#opsKind').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (lot) { toast('السكشن يتبع اللي على الهواء — اضغط «التالي» أو رجّعه للقائمة'); return; }
      setLiveKind(b.dataset.k);
    });
    if (lot) host.querySelector('#opsKind').classList.add('locked');

    host.querySelector('.ops-fold').addEventListener('click', () => {
      opsFolded = true;
      try { localStorage.setItem('mazad_ops_folded', '1'); } catch {}
      renderLiveOps(lot);
    });

    const bar = opBar(lot);
    bar.classList.add('light');
    $('#opsBar').appendChild(bar);

    /* «ما تطلع لناس لما يجي موافقة» — nothing a stranger submits reaches the
       page until this card says so. It shows the full identity, like the rest
       of the strip, which is why the strip stays out of the camera frame. */
    $('#opsReq').innerHTML = reqs.length
      ? '<div class="ops-h">طلبات بانتظار موافقتك (<span class="num">' + reqs.length + '</span>)</div>' +
        reqs.map(l =>
          '<div class="ctl-q req" data-r="' + esc(l.id) + '">' +
            '<b class="num">' + esc(itemLabel(l)) + '</b>' +
            '<span>' + esc(KIND_NAME[kindOf(l)] || '') + ' · ' + esc(l.seller_name) +
              (l.seller_contact ? ' · <span class="num">' + esc(l.seller_contact) + '</span>' : '') +
            '</span>' +
            '<button class="ok" data-a="approve">✔ وافق</button>' +
            '<button class="del" data-a="delete" title="ارفض">🗑</button>' +
          '</div>').join('')
      : '';

    $('#opsReq').querySelectorAll('.ctl-q button').forEach(b => {
      b.addEventListener('click', async () => {
        const row = b.closest('.ctl-q');
        const label = row.querySelector('b').textContent.trim();
        if (b.dataset.a === 'delete') {
          if (!confirm('ارفض ' + label + ' وتحذفه نهائياً؟')) return;
          await opDo(row.dataset.r, 'delete');
          toast('انرفض الطلب');
          return;
        }
        await opDo(row.dataset.r, 'approve');
        toast('وافقت على ' + label + ' ✔ — دخل القائمة');
      });
    });

    $('#opsQueue').innerHTML = open.length
      ? '<div class="ops-h">قائمة الانتظار (<span class="num">' + open.length + '</span>)</div>' +
        open.map(l =>
          '<div class="ctl-q" data-q="' + esc(l.id) + '">' +
            '<b class="num">' + esc(itemLabel(l)) + '</b>' +
            '<span>' + esc(l.seller_name) + '</span>' +
            '<button data-a="live">اعرضه</button>' +
            '<button class="del" data-a="delete" title="حذف">🗑</button>' +
          '</div>').join('')
      : '<div class="ops-empty">ما فيه ' + esc(kindCount(kind)) + ' بالانتظار</div>';

    $('#opsQueue').querySelectorAll('.ctl-q button').forEach(b => {
      b.addEventListener('click', async () => {
        const row = b.closest('.ctl-q');
        if (b.dataset.a === 'delete') {
          if (!confirm('حذف ' + row.querySelector('b').textContent.trim() + ' نهائياً من المزاد؟')) return;
          await opDo(row.dataset.q, 'delete');
          toast('انحذف الرقم');
          return;
        }
        await opDo(row.dataset.q, 'live');
      });
    });
  }

  renderItemEditor(lot, $('#opsItem'));
  renderPendingBids($('#opsPending'));
  if (lot) renderApprovedBids(lot, $('#opsApproved'));
  else { $('#opsApproved').innerHTML = ''; }
}

/* ---------- correcting the lot that is ON AIR, from the strip ----------
   He reads the plate off the seller's paper on camera and gets a letter
   wrong, or the seller corrects him while they are talking. Re-listing would
   throw away the sums and the clock, so the identity is edited in place:
   every keystroke repaints the stage — the part the camera sees — and the
   save follows a moment later.

   The card is rebuilt only when the LOT changes, never when its values do:
   while he is typing, the inputs are the truth and a rebuild would take the
   focus out from under him. That is also why the signature carries the id,
   the kind and the status and nothing else. */
function renderItemEditor(lot, host) {
  if (!host) return;
  if (!lot) { host.innerHTML = ''; screenSig.item = ''; return; }

  const kind = kindOf(lot);
  const sig  = lot.id + ':' + kind + ':' + lot.status;
  if (sig === screenSig.item && host.firstElementChild) return;
  screenSig.item = sig;

  const head = '<div class="ops-h">✎ تعديل المعروض ' +
    '<span class="ops-sub">— يتغيّر على الشاشة فوراً</span></div>';

  // what a lot sold for must not change under it
  if (['sold', 'unsold', 'cancelled'].includes(lot.status)) {
    host.innerHTML = head + '<div class="ed-done">انتهى — ما عاد يتعدّل</div>';
    return;
  }

  if (kind === 'plate') {
    const L = normPlate(lot.plate_letters || '').split('');   // pre-fills the boxes
    host.innerHTML = head +
      '<div class="ed-plate">' +
        letterBoxes('ed', L.join('')) +
        '<input id="edDigits" type="tel" inputmode="numeric" maxlength="4" ' +
          'value="' + esc(lot.plate_digits || '') + '" placeholder="900">' +
      '</div>' +
      '<div class="ed-kind" id="edKind">' +
        Object.keys(PLATE_KINDS).map(k =>
          '<button data-pk="' + k + '"' +
            (plateKindOf(lot) === k ? ' class="on"' : '') + '>' +
            esc(PLATE_KINDS[k]) + '</button>').join('') +
      '</div>' +
      '<div class="ed-emb" id="edEmb">' +
        Object.keys(EMBLEMS).map(k =>
          '<button data-e="' + k + '"' +
            ((lot.plate_emblem || 'swords') === k ? ' class="on"' : '') + '>' +
            (k === 'none' ? '<span class="none">—</span>'
                          : '<img src="mazad-emb-' + k + '.png" alt="" loading="lazy">') +
            '<span>' + esc(EMBLEMS[k]) + '</span>' +
          '</button>').join('') +
      '</div>' +
      '<div class="ed-err" id="edErr"></div>';

    // typed, not picked: he changes a letter in front of the customer and the
    // stage follows the keystroke
    wireLetterBoxes(host, 'ed', (letters) =>
      pushEdit(lot, { plate_letters: letters }), '#edDigits');
    wirePlateDigits(host, '#edDigits',
      (digits) => pushEdit(lot, { plate_digits: digits }), '#edEmb button.on');
    host.querySelector('#edKind').addEventListener('click', async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      host.querySelectorAll('#edKind button').forEach(x => x.classList.toggle('on', x === b));
      // a نقل plate has no emblem cell of its own to pick, so hide the row
      host.querySelector('#edEmb').classList.toggle('hidden', b.dataset.pk !== 'private');
      await pushPlateKind(lot, b.dataset.pk);
    });
    host.querySelector('#edEmb').classList.toggle('hidden', plateKindOf(lot) !== 'private');
    host.querySelector('#edEmb').addEventListener('click', async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      host.querySelectorAll('#edEmb button').forEach(x => x.classList.toggle('on', x === b));
      await pushEmblem(lot, b.dataset.e);
    });
    return;
  }

  if (kind === 'car') {
    host.innerHTML = head +
      '<div class="ed-plate">' +
        '<input id="edMake"  maxlength="30" value="' + esc(lot.car_make || '')  + '" placeholder="الماركة" style="letter-spacing:0;direction:rtl">' +
        '<input id="edModel" maxlength="30" value="' + esc(lot.car_model || '') + '" placeholder="الموديل" style="letter-spacing:0;direction:rtl">' +
        '<input id="edYear" type="tel" inputmode="numeric" maxlength="4" value="' + esc(lot.car_year || '') + '" placeholder="2021">' +
      '</div>' +
      '<div class="ed-err" id="edErr"></div>';
    host.querySelector('#edMake').addEventListener('input', (e) =>
      pushEdit(lot, { car_make: e.target.value.trim() }));
    host.querySelector('#edModel').addEventListener('input', (e) =>
      pushEdit(lot, { car_model: e.target.value.trim() }));
    host.querySelector('#edYear').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      pushEdit(lot, { car_year: Number(e.target.value) || null });
    });
    return;
  }

  host.innerHTML = head +
    '<div class="ed-plate">' +
      '<input id="edPhone" type="tel" inputmode="numeric" maxlength="10" ' +
        'value="' + esc(lot.phone || '') + '" placeholder="05xxxxxxxx">' +
    '</div>' +
    '<div class="ed-err" id="edErr"></div>';
  host.querySelector('#edPhone').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
    pushEdit(lot, { phone: e.target.value });
  });
}

/* Paint first, save second. The camera is on the stage, so the keystroke has
   to land there immediately; the database can be 400ms behind. A value that
   is still half-typed (one digit of four) paints but is not sent — the server
   would only refuse it. */
let editTimer = null;
const EDIT_OK = {
  plate_letters: v => new RegExp('^[' + PLATE_LETTERS.join('') + ']{1,3}$').test(normPlate(v)),
  plate_digits:  v => /^\d{1,4}$/.test(String(v || '')),
  phone:         v => /^05\d{8}$/.test(String(v || '')),
  car_make:      v => String(v || '').trim().length >= 2,
  car_model:     v => String(v || '').trim().length >= 1,
  car_year:      v => Number(v) >= 1970 && Number(v) <= 2100
};

function editErr(msg) {
  const box = $('#edErr'); if (box) box.textContent = msg || '';
}

function pushEdit(lot, fields, immediate) {
  Object.assign(lot, fields);
  liveEdit = {
    id: lot.id,
    fields: { ...(liveEdit && liveEdit.id === lot.id ? liveEdit.fields : {}), ...fields },
    at: nowMs()
  };
  screenSig.live = '';
  renderLive(lot, cache.bids[lot.id] || []);

  // a key with no rule here is painted only and saved by its own call —
  // plate_emblem goes through mazad_set_emblem, not mazad_set_item
  const sendable = {};
  let holding = false;
  Object.keys(fields).forEach(k => {
    if (!EDIT_OK[k]) return;
    if (EDIT_OK[k](fields[k])) sendable[k] = fields[k]; else holding = true;
  });
  editErr(holding ? 'ناقص — ما انحفظ بعد' : '');
  if (!Object.keys(sendable).length) return;

  clearTimeout(editTimer);
  const save = async () => {
    try {
      const r = await store.setItem(lot.id, admin.secret, sendable);
      if (r && r.ok === false) {
        editErr(r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة'
              : r.error === 'finished'  ? 'انتهى — ما عاد يتعدّل' : 'ما انحفظ');
        liveEdit = null; refresh(false);
        return;
      }
      editErr('');
      if (r && r.approved_bids > 0) toast('انتبه: عليه ' + r.approved_bids + ' سومة محتسبة');
    } catch (e) { console.error(e); editErr('تعذّر الاتصال'); }
  };
  if (immediate) save(); else editTimer = setTimeout(save, 400);
}

async function pushPlateKind(lot, kind) {
  pushEdit(lot, { plate_kind: kind });
  try {
    const r = await store.setPlateKind(lot.id, admin.secret, kind);
    if (r && r.ok === false) {
      editErr(r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'ما انحفظ نوع اللوحة');
      liveEdit = null; refresh(false);
    }
  } catch (e) { console.error(e); editErr('تعذّر الاتصال'); }
}

async function pushEmblem(lot, emblem) {
  pushEdit(lot, { plate_emblem: emblem });
  try {
    const r = await store.setEmblem(lot.id, admin.secret, emblem);
    if (r && r.ok === false) {
      editErr(r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'ما انحفظ الشعار');
      liveEdit = null; refresh(false);
    }
  } catch (e) { console.error(e); editErr('تعذّر الاتصال'); }
}

/* Sums shouted into the site wait here until the operator says yes. */
/* Where the bidder is, for the operator only. It never reaches a viewer: the
   column is left out of anon's column-by-column SELECT on mazad_bids, the
   same way bidder_phone is, and it is drawn only inside #liveOps. */
const bidderCity = (b) => b && b.bidder_city
  ? '<span class="sub-muted">📍 ' + esc(b.bidder_city) + '</span>' : '';

function renderPendingBids(host) {
  if (!host) return;
  const list = cache.pending || [];

  // Same rule as every other card: repaint only when the data changed. On the
  // old control screen this ran inside a guarded render; on the strip it is
  // called every poll, so without this it rebuilt itself under the operator's
  // thumb twenty-four times a minute.
  const key = 'pending:' + (host.id || 'x');
  const sig = list.map(b => b.id + ':' + b.amount + ':' + b.current + ':' + (b.bidder_city || '')).join(',');
  if (sig === screenSig[key] && host.firstElementChild) return;
  screenSig[key] = sig;

  if (!list.length) {
    host.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.86rem">' +
      'ما فيه سومات بانتظار موافقتك</div>';
    return;
  }
