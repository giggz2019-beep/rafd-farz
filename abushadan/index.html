  host.innerHTML =
    '<div style="font-weight:700;margin-bottom:8px">سومات بانتظار موافقتك ' +
      '<span class="pill">' + list.length + '</span></div>' +
    list.map(b => {
      // a sum only means something next to the price it is trying to beat
      const cur = Number(b.current ?? 0);
      const min = Number(b.min_next ?? 0);
      const amt = Number(b.amount);
      const beats = b.beats_current != null ? b.beats_current : amt > cur;
      const enough = min ? amt >= min : beats;
      const diff = amt - cur;
      return '<div class="ctl-bid ' + (enough ? 'ok' : beats ? 'thin' : 'low') + '" data-b="' + esc(b.id) + '"' +
               ' data-ok="' + (beats ? '1' : '0') + '">' +
        '<div class="who">' +
          '<b>' + esc(b.bidder_name) + '</b>' +
          (b.bidder_phone
            ? '<a class="wa" href="' + esc(waLink(b.bidder_phone, b.plate_letters
                ? plateText(b.plate_letters, b.plate_digits || '')
                : fmtPhone(b.phone || ''))) + '"' +
              ' target="_blank" rel="noopener" title="واتساب المزايد">💬 <span class="num">' +
              esc(fmtPhone(b.bidder_phone)) + '</span></a>'
            : '<span class="sub-muted">بدون جوال</span>') +
          bidderCity(b) +
          '<span class="num">على ' + esc(b.plate_letters
            ? plateText(b.plate_letters, b.plate_digits || '')
            : fmtPhone(b.phone || '')) + '</span>' +
        '</div>' +
        '<div class="cmp">' +
          '<div class="cmp-line">' +
            '<span class="cmp-now num">' + money(cur) + '</span>' +
            '<span class="cmp-arrow">←</span>' +
            '<span class="amt num">' + money(amt) + '</span>' +
          '</div>' +
          '<div class="cmp-note">' +
            (!beats
              ? 'أقل من السعر بـ <span class="num">' + money(Math.abs(diff)) + '</span> — ما ترفع السوم'
              : enough
                ? 'أعلى بـ <span class="num">' + money(diff) + '</span> ✔'
                : 'أعلى بـ <span class="num">' + money(diff) + '</span> — الحد الأدنى <span class="num">' + money(min) + '</span>') +
          '</div>' +
        '</div>' +
        '<button class="yes" data-a="approve"' + (beats ? '' : ' disabled title="أقل من السعر الحالي"') + '>✔</button>' +
        '<button class="no"  data-a="reject">✖</button>' +
      '</div>';
    }).join('');

  host.querySelectorAll('.ctl-bid button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.ctl-bid');
      const id = row.dataset.b, act = btn.dataset.a;
      if (act === 'approve' && row.dataset.ok === '0') {
        toast('هذي السومة أقل من السعر الحالي — ما ترفعه');
        return;
      }
      row.style.opacity = '.5';
      try {
        const r = await store.bidAction(id, admin.secret, act);
        if (r && r.ok === false) {
          row.style.opacity = '1';
          toast(r.error === 'below_current'
            ? 'أقل من السعر الحالي (' + money(r.current) + ') — ما ينفع'
            : r.error === 'finished' ? 'انتهى المزاد على هذا الرقم'
            : r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'تعذّر التنفيذ');
          return;
        }
        toast(act === 'reject' ? 'رفضت السومة'
              : r && r.auto_sold ? 'اعتمدت السومة — وانباع الرقم تلقائياً ⚡'
              : 'اعتمدت السومة ✔');
      } catch (e) {
        row.style.opacity = '1'; console.error(e); toast('تعذّر الاتصال');
      } finally {
        refresh(false);
      }
    });
  });
}

/* The operator records a sum shouted on the broadcast — from a guest on a
   TikTok call, or over the phone. It counts at once: the operator is the one
   entering it, there is nothing to approve. */
function askManualBid(lot) {
  const t = topBid(lot.id, lot);
  const cur = finalPrice(lot, t);
  const step = stepFor(cur);
  const s2 = sheet(
    '<h2>سجّل سومة</h2>' +
    '<p class="hint">للي زايد بالبث أو بالتلفون — تُحتسب على طول بدون موافقة.</p>' +
    '<div id="mbErr"></div>' +
    '<div class="bid-now" style="margin-bottom:12px">السوم الحالي ' +
      '<b><span class="num">' + money(cur) + '</span> ر.س</b></div>' +
    '<div class="field"><label>اسم المزايد <span class="opt">(اختياري)</span></label>' +
      '<input id="mbName" maxlength="40" placeholder="اتركه فاضي لو ما تعرف الاسم"></div>' +
    '<div class="field ltr"><label>المبلغ (ر.س)</label>' +
      '<input id="mbAmount" type="number" inputmode="numeric" min="0" value="' + (cur + step) + '">' +
      '<div class="sub">لازم يكون أعلى من <span class="num">' + money(cur) + '</span>.</div></div>' +
    '<div class="row2" id="mbQuick"></div>' +
    '<button class="btn btn-gold btn-block" id="mbSave" style="margin-top:10px">سجّل السومة</button>'
  );

  s2.querySelector('#mbQuick').innerHTML = [cur + step, cur + step * 2, cur + step * 5]
    .map(v => '<button class="btn btn-ghost btn-sm" data-v="' + v + '">' + money(v) + '</button>').join('');
  s2.querySelector('#mbQuick').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    s2.querySelector('#mbAmount').value = b.dataset.v;
  });

  const save = async () => {
    const err = (m) => { s2.querySelector('#mbErr').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
    /* «لا جا سومه وحطيتها ما يجبرني اسجل اسم الشخص — اختياري الاسم». On air
       the sum is what matters and the name often is not known; the database
       still wants two characters, so an empty box becomes «مزايد». */
    const name = s2.querySelector('#mbName').value.trim() || 'مزايد';
    const amount = Number(s2.querySelector('#mbAmount').value);
    if (!(amount > 0)) return err('اكتب مبلغ صحيح.');

    const btn = s2.querySelector('#mbSave'); btn.disabled = true; btn.textContent = 'جاري…';
    try {
      const r = await store.manualBid(lot.id, admin.secret, name, amount);
      if (r && r.ok === false) {
        btn.disabled = false; btn.textContent = 'سجّل السومة';
        return err(r.error === 'below_current'
          ? 'المبلغ لازم يكون أعلى من ' + money(r.current) + ' ر.س. لو تبي تنزّل السوم، احذف السومة الأعلى أول.'
          : r.error === 'finished' ? 'انتهى المزاد على هذا الرقم — رجّعه للقائمة أول.'
          : r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'تعذّر التسجيل');
      }
      closeSheet();
      toast(r && r.auto_sold
        ? 'انباع الرقم على ' + money(amount) + ' ر.س ⚡ (وصل سعر البيع المباشر)'
        : 'انسجّلت سومة ' + esc(name) + ' بـ ' + money(amount) + ' ر.س ✔');
      refresh(false);
    } catch (e) {
      console.error(e); btn.disabled = false; btn.textContent = 'سجّل السومة';
      err('تعذّر الاتصال.');
    }
  };
  s2.querySelector('#mbSave').addEventListener('click', save);
  s2.querySelector('#mbAmount').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
  s2.querySelector('#mbName').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
  // the amount is the thing he actually has to type, so start there
  const mbA = s2.querySelector('#mbAmount'); mbA.focus(); mbA.select();
}

/* The sums already counted on the number on air, each removable — this is how
   an approval given by mistake is taken back, and the only way to bring the
   price down. */
async function renderApprovedBids(lot, host) {
  if (!host || !lot) return;
  // only show the spinner on an empty card — wiping a filled one and refilling
  // it a moment later is half of what made this page jump
  if (!host.firstElementChild) {
    host.innerHTML = '<div style="color:var(--muted);font-size:.84rem">…</div>';
  }
  let list = [];
  try {
    const r = await store.bidsOf(lot.id, admin.secret);
    list = (r && r.ok && r.bids ? r.bids : []).filter(b => b.approved);
  } catch { /* leave it empty */ }

  const key = 'approved:' + (host.id || 'x');
  const sig = lot.id + '|' + sigOfBids(list);
  if (sig === screenSig[key] && host.firstElementChild) return;
  screenSig[key] = sig;

  host.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
      '<div style="flex:1;font-weight:700">السومات المحتسبة</div>' +
      '<button class="btn btn-ghost btn-sm add-bid">＋ سجّل سومة</button>' +
    '</div>' +
    (list.length
      ? list.map((b, i) =>
          '<div class="ctl-bid done" data-b="' + esc(b.id) + '">' +
            '<div class="who"><b>' + esc(b.bidder_name) + '</b>' +
              (b.bidder_phone
                ? '<a class="wa" href="' + esc(waLink(b.bidder_phone, itemLabel(lot))) + '"' +
                  ' target="_blank" rel="noopener">💬 <span class="num">' +
                  esc(fmtPhone(b.bidder_phone)) + '</span></a>'
                : '') +
              bidderCity(b) +
              '<span>' + (i === 0 ? 'أعلى سومة' : esc(ago(b.created_at))) + '</span></div>' +
            '<div class="amt num">' + money(b.amount) + '</div>' +
            '<button class="no" data-a="reject" title="احذف">✖</button>' +
          '</div>').join('')
      : '<div style="text-align:center;color:var(--muted);font-size:.86rem">ما فيه سومات محتسبة</div>');

  host.querySelector('.add-bid').addEventListener('click', () => askManualBid(lot));
  host.querySelectorAll('.ctl-bid.done button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.ctl-bid');
      if (!confirm('حذف سومة ' + row.querySelector('b').textContent + '؟ السعر بينزل.')) return;
      try {
        const r = await store.bidAction(row.dataset.b, admin.secret, 'reject');
        if (r && r.ok === false) { toast('تعذّر الحذف'); return; }
        toast('انحذفت السومة');
      } catch { toast('تعذّر الاتصال'); }
      refresh(false);
    });
  });
}

/* Put a number back in the queue — with or without the sums already on it. */
function askRequeue(lot) {
  const s2 = sheet(
    '<h2>رجّعه لقائمة الانتظار</h2>' +
    '<p class="hint">' + itemWord(lot) + ' <span class="num">' + esc(itemLabel(lot)) + '</span> يرجع بدون مؤقت، ' +
      'وما أحد يقدر يزايد عليه لين تفتحه من جديد.</p>' +
    '<button class="btn btn-block" id="rqClear" style="background:#c0392b">رجّعه وامسح كل السومات</button>' +
    '<button class="btn btn-ghost btn-block" id="rqKeep" style="margin-top:8px">رجّعه واحتفظ بالسومات</button>'
  );
  s2.querySelector('#rqClear').addEventListener('click', async () => {
    closeSheet(); await opDo(lot.id, 'reset'); toast('رجع للقائمة — بدون سومات');
  });
  s2.querySelector('#rqKeep').addEventListener('click', async () => {
    closeSheet(); await opDo(lot.id, 'open'); toast('رجع للقائمة — السومات محفوظة');
  });
}

/* ---------------------------- من نحن ----------------------------
   What the site actually does, and nothing it does not. Every claim here has
   a mechanism behind it in this file or in supabase-mazad.sql — no "advanced
   search", no "we verify ownership", because neither exists. The commission
   is printed from FEES through feeRule(), so this page cannot quote a rate
   the rest of the site has stopped charging, and the sections come from
   KINDS_SHOWN, so switching one off does not leave it described here. */
function renderAbout() {
  const host = $('#aboutBody');

function wireQueue(open, current) {
  document.querySelectorAll('.queue .q button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.closest('.q').dataset.q;
      await opDo(id, 'live');
    });
  });
}

/* one place for every operator action, so errors read the same */
async function opDo(id, action, minutes, price) {
  try {
    const r = await store.admin(id, admin.secret, action, minutes, price);
    if (r && r.ok === false) {
      toast(r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'تعذّر التنفيذ');
      return null;
    }
    return r || { ok: true };
  } catch (e) {
    console.error(e); toast('تعذّر الاتصال'); return null;
  } finally {
    refresh(false);
  }
}

function opBar(lot) {
  const bar = el('<div class="opbar"></div>');
  if (lot) {
    bar.innerHTML =
      '<div class="lbl">افتح السوم</div>' +
      '<div class="row">' +
        '<button class="start" data-a="timer" data-m="1">▶ ابدأ دقيقة</button>' +
        '<button class="start" data-a="timer" data-m="2">▶ دقيقتين</button>' +
      '</div>' +
      '<div class="row">' +
        '<button data-a="extend" data-m="1">+ دقيقة</button>' +
        '<button data-a="extend" data-m="2">+ دقيقتين</button>' +
      '</div>' +
      /* «ابي اوقف المزاد وارجع السومة مثل من البداية — ما فيه خيار يصفر
         العداد او توقيف مؤقت». Hold freezes the clock where it stands and
         keeps every sum.
         «صفّر» means ZERO, not «start another minute». It used to fire
         `timer` with one minute, so pressing it launched a fresh countdown
         he had not asked for — live, on camera: «تصفيرت العداد تبدا من
         دقيقه ماهو من صفر». It now puts the lot back to BEFORE the clock —
         no countdown at all, still on air, every sum kept — and the
         «▶ ابدأ دقيقة / دقيقتين» buttons above start whichever length he
         wants. Neither this nor the hold is «رجّعه للقائمة», which is the
         one that can throw the sums away. */
      '<div class="row">' +
        (isPaused(lot)
          ? '<button class="start" data-a="resume">▶ كمّل العدّاد</button>'
          : '<button data-a="pause">⏸ وقف العدّاد</button>') +
        '<button data-a="zero">↺ صفّر العدّاد</button>' +
      '</div>' +
      '<div class="lbl">السومات</div>' +
      '<div class="row">' +
        '<button class="add" data-a="manual">＋ سجّل سومة من البث</button>' +
      '</div>' +
      '<div class="row">' +
        '<button data-a="auto">⚡ ' +
          (lot.auto_sell_price ? 'سعر البيع المباشر: ' + money(lot.auto_sell_price) : 'حدّد سعر بيع مباشر') +
        '</button>' +
      '</div>' +
      '<div class="lbl">النتيجة</div>' +
      '<div class="row">' +
        '<button class="sold" data-a="sold">✔ تم البيع</button>' +
        '<button class="unsold" data-a="unsold">✖ لم يتم البيع</button>' +
      '</div>' +
      '<div class="row">' +
        '<button class="next" data-a="next">التالي ←</button>' +
        '<button class="add" data-a="quick">＋ سجّل جديد</button>' +
      '</div>' +
      '<div class="row">' +
        '<button data-a="open">↩ رجّعه للقائمة</button>' +
        '<button class="danger" data-a="delete">🗑 احذف</button>' +
      '</div>';
  } else {
    bar.innerHTML =
      '<div class="lbl">وضع المشرف</div>' +
      '<div class="row"><button class="add" data-a="quick">＋ سجّل وابدأ السوم</button></div>' +
      (queueOf(liveKind).length
        ? '<div class="row"><button class="next" data-a="next">اعرض أول ' +
            esc(kindCount(liveKind)) + ' بالانتظار</button></div>' : '');
  }

  bar.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const a = b.dataset.a, m = b.dataset.m ? Number(b.dataset.m) : undefined;
    if (a === 'quick') { askQuickAdd(); return; }
    if (a === 'open' && lot) { askRequeue(lot); return; }
    if (a === 'zero' && lot) {
      /* 'open' is the action that clears the clock AND the bank. It is not
         «رجّعه للقائمة» — that one goes through askRequeue, which offers to
         delete the sums; this one never touches them and never takes the
         lot off air. */
      await opDo(lot.id, 'open');
      toast('صفّرنا العدّاد ↺ — اضغط «ابدأ دقيقة» يبدأ من جديد');
      return;
    }
    if (a === 'manual' && lot) { askManualBid(lot); return; }
    if (a === 'auto'   && lot) { askAutoPrice(lot); return; }
    if (a === 'next') {
      // mazad_admin('next') takes whatever is oldest, which on a plates night
      // hands him a phone. Pick within the section instead and put that one
      // on air by id; the database does the same is_live swap either way.
      const q = queueOf(liveSection(lot));
      if (!q.length) {
        if (lot) await opDo(lot.id, 'unlive');
        toast('ما فيه ' + kindCount(liveSection(lot)) + ' بالانتظار');
        return;
      }
      await opDo(q[0].id, 'live');
      return;
    }
    if (a === 'sold') { await markSold(lot); return; }
    if (a === 'delete') {
      if (!confirm('حذف ' + itemWord(lot) + ' ' + itemLabel(lot) + ' نهائياً من المزاد؟')) return;
      await opDo(lot.id, 'delete');
      toast('انحذف الرقم');
      return;
    }
    await opDo(lot.id, a, m);
    if (a === 'pause')  toast('وقفنا العدّاد ⏸ — السومات محفوظة');
    if (a === 'resume') toast('كمّل العدّاد ▶');
    if (a === 'timer')  toast('بدأ السوم ▶');
    // bring the number and its sticker back into view for the broadcast
    if (a === 'unsold') window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  return bar;
}

/* Stamping تم البيع asks for the price it actually went for. A number can be
   agreed on the broadcast or over WhatsApp with no bids on the site at all —
   record that price as a sale price, rather than inventing bidders for it. */
function askSoldPrice(lot) {
  const t = topBid(lot.id, lot);
  const already = lot.status === 'sold' && lot.sold_price != null;
  const suggested = already ? Number(lot.sold_price) : (t.count ? t.amount : '');
  const s2 = sheet(
    '<h2>' + (already ? 'تعديل سعر البيع' : 'سعر البيع') + '</h2>' +
    '<p class="hint">' + itemWord(lot) + ' <span class="num">' + esc(itemLabel(lot)) + '</span> — كم انباع؟</p>' +
    '<div id="spErr"></div>' +
    '<div class="field ltr"><label>المبلغ (ر.س)</label>' +
      '<input id="spPrice" type="number" inputmode="numeric" min="0" value="' + esc(suggested) + '" placeholder="مثال: 4500">' +
      '<div class="sub">' +
        (t.count ? 'أعلى مزايدة على الموقع: ' + money(t.amount) + ' ر.س.' : 'ما فيه مزايدات على الموقع — اكتب السعر اللي اتفقتوا عليه.') +
      '</div></div>' +
    '<div class="fee-box">عمولتك = <b><span class="num" id="spFee">—</span> ر.س</b> على ذمة البائع.' +
      '<br><span style="font-size:.78rem">' + esc(feeRule(kindOf(lot))) + '</span></div>' +
    '<button class="btn btn-block" style="background:var(--ok-600)" id="spSave">' +
      (already ? '✎ احفظ السعر الجديد' : '✔ تأكيد البيع') + '</button>'
  );

  const input = s2.querySelector('#spPrice');
  const paintFee = () => { s2.querySelector('#spFee').textContent =
    money(commissionOn(Number(input.value || 0), kindOf(lot))); };
  input.addEventListener('input', paintFee);
  paintFee();
  input.focus();

  s2.querySelector('#spSave').addEventListener('click', async () => {
    const v = Number(input.value);
    if (!(v >= 0) || v > 100000000) {
      s2.querySelector('#spErr').innerHTML = '<div class="err">اكتب مبلغ صحيح.</div>';
      return;
    }
    closeSheet();
    await opDo(lot.id, already ? 'price' : 'sold', undefined, v);
    toast((already ? 'تعدّل السعر إلى ' : 'تم البيع على ') + money(v) + ' ر.س ✔');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

/* The seller's limit, set or cleared by the operator. A limit at or under the
   sum the lot already reached closes it immediately — the RPC says so with
   auto_sold, so the toast tells the truth either way. */
function askAutoPrice(lot) {
  const t = topBid(lot.id, lot);
  const cur = finalPrice(lot, t);
  const has = lot.auto_sell_price != null;
  const s2 = sheet(
    '<h2>سعر البيع المباشر</h2>' +
    '<p class="hint">' + itemWord(lot) + ' <span class="num">' + esc(itemLabel(lot)) + '</span> — ' +
      'لو وصل السوم لهذا المبلغ ينباع تلقائياً وينتهي المزاد عليه.</p>' +
    '<div id="apErr"></div>' +
    '<div class="bid-now" style="margin-bottom:12px">السوم الحالي ' +
      '<b><span class="num">' + money(cur) + '</span> ر.س</b></div>' +
    '<div class="field ltr"><label>المبلغ (ر.س)</label>' +
      '<input id="apPrice" type="number" inputmode="numeric" min="0" value="' +
        esc(has ? Number(lot.auto_sell_price) : '') + '" placeholder="مثال: 15000">' +
      '<div class="sub">لازم يكون أعلى من سعر البداية (<span class="num">' +
        money(lot.start_price) + '</span>). ولو حطيته أقل من السوم الحالي، ينباع الرقم على طول.</div></div>' +
    '<button class="btn btn-gold btn-block" id="apSave">احفظ</button>' +
    (has ? '<button class="btn btn-ghost btn-block" style="margin-top:8px" id="apClear">شيل سعر البيع المباشر</button>' : '')
  );

  const apply = async (v) => {
    try {
      const r = await store.admin(lot.id, admin.secret, 'auto', null, v);
      if (r && r.ok === false) {
        s2.querySelector('#apErr').innerHTML = '<div class="err">' +
          (r.error === 'bad_amount'
            ? 'لازم يكون أعلى من سعر البداية (' + money(r.start) + ' ر.س).'
            : r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'تعذّر الحفظ') + '</div>';
        return;
      }
      closeSheet();
      toast(v == null ? 'انشال سعر البيع المباشر'
            : r && r.auto_sold ? 'انباع الرقم على ' + money(cur) + ' ر.س ⚡'
            : 'سعر البيع المباشر: ' + money(v) + ' ر.س ✔');
      refresh(false);
    } catch (e) {
      console.error(e);
      s2.querySelector('#apErr').innerHTML = '<div class="err">تعذّر الاتصال.</div>';
    }
  };

  s2.querySelector('#apSave').addEventListener('click', () => {
    const v = Number(s2.querySelector('#apPrice').value);
    if (!(v > 0) || v > 100000000) {
      s2.querySelector('#apErr').innerHTML = '<div class="err">اكتب مبلغ صحيح.</div>';
      return;
    }
    apply(v);
  });
  if (has) s2.querySelector('#apClear').addEventListener('click', () => apply(null));
  s2.querySelector('#apPrice').focus();
}

    '<div class="field ltr"><label>سعر البيع المباشر (اختياري)</label>' +
      '<input id="qkAuto" type="number" inputmode="numeric" min="0" placeholder="اتركه فاضي">' +
      '<div class="sub">لو وصل السوم له ينباع الرقم تلقائياً.</div></div>' +
    '<button class="btn btn-gold btn-block" id="qkSave">ابدأ السوم على الهواء 🔴</button>'
  );

  let qkind = KINDS_SHOWN[0];
  const qshow = () => {
    s2.querySelectorAll('[data-qfor]').forEach(n => n.classList.toggle('hidden', n.dataset.qfor !== qkind));
    s2.querySelectorAll('#qkType button').forEach(b => b.classList.toggle('on', b.dataset.t === qkind));
  };
  s2.querySelector('#qkType').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return; qkind = b.dataset.t; qshow();
  });
  qshow();
  let qkKind = Object.keys(PLATE_KINDS)[0];
  const qPaint = () => {
    const l = readQkLetters();
    const d = s2.querySelector('#qkDigits').value.replace(/\D/g, '');
    s2.querySelector('#qkEmblem').closest('.field').classList.toggle('hidden', qkKind !== 'private');
    s2.querySelector('#qkPreview').innerHTML = d
      ? itemPlate({ item_type: 'plate', plate_letters: l, plate_digits: d,
                    plate_kind: qkKind,
                    plate_emblem: s2.querySelector('#qkEmblem').value }) : '';
  };
  s2.querySelector('#qkKind').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    s2.querySelectorAll('#qkKind button').forEach(x => x.classList.toggle('on', x === b));
    qkKind = b.dataset.pk; qPaint();
  });
  const readQkLetters = wireLetterBoxes(s2, 'qk', () => qPaint(), '#qkDigits');
  wirePlateDigits(s2, '#qkDigits', qPaint, '#qkEmblem');
  s2.querySelector('#qkEmblem').addEventListener('change', qPaint);
  wirePhotoPick(s2, '#qkPhoto', '#qkPhotoPrev');

  s2.querySelector('#qkSave').addEventListener('click', async () => {
    const err = (m) => { s2.querySelector('#qkErr').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
    const phone   = s2.querySelector('#qkPhone').value.replace(/\D/g, '');
    const contact = s2.querySelector('#qkContact').value.replace(/\D/g, '');
    const letters = normPlate(readQkLetters());
    const digits  = s2.querySelector('#qkDigits').value.replace(/\D/g, '');
    const make  = s2.querySelector('#qkMake').value.trim();
    const model = s2.querySelector('#qkModel').value.trim();
    const year  = Number(s2.querySelector('#qkYear').value || 0);
    if (qkind === 'phone') {
      if (!/^05\d{8}$/.test(phone)) return err('رقم الجوال لازم يبدأ بـ 05 ويكون 10 أرقام.');
    } else if (qkind === 'plate') {
      if (!letters.length) return err('اختر حرف اللوحة — من حرف إلى ثلاثة.');
      if (!/^\d{1,4}$/.test(digits)) return err('أرقام اللوحة من رقم إلى أربعة.');
    } else {
      if (make.length < 2)  return err('اكتب ماركة السيارة.');
      if (model.length < 1) return err('اكتب موديل السيارة.');
      if (!(year >= 1970 && year <= 2100)) return err('اكتب سنة صنع صحيحة.');
    }
    const start = Number(s2.querySelector('#qkPrice').value || 0);
    const autoRaw = s2.querySelector('#qkAuto').value.trim();
    const auto = autoRaw === '' ? null : Number(autoRaw);
    if (auto !== null && !(auto > start)) return err('سعر البيع المباشر لازم يكون أعلى من سعر البداية.');

    const btn = s2.querySelector('#qkSave'); btn.disabled = true; btn.textContent = 'جاري…';
    try {
      let photo = null;
      const pf = qkind === 'car' && s2.querySelector('#qkPhoto').files[0];
      if (pf) {
        btn.textContent = 'جاري رفع الصورة…';
        try { photo = await store.uploadCarPhoto(pf); }
        catch (e2) {
          console.error(e2);
          btn.disabled = false; btn.textContent = 'ابدأ السوم على الهواء 🔴';
          return err('تعذّر رفع الصورة. جرّب وحدة أصغر أو اتركها.');
        }
      }
      const r = await store.operatorCreate(admin.secret, {
        item_type: qkind,
        phone: qkind === 'phone' ? phone : null,
        carrier: qkind === 'phone' ? s2.querySelector('#qkCarrier').value : null,
        plate_letters: letters, plate_digits: digits,
        plate_emblem: s2.querySelector('#qkEmblem').value,
        plate_kind: qkKind,
        car_make: make, car_model: model, car_year: year, car_photo: photo,
        start_price: start,
        seller_name: s2.querySelector('#qkName').value.trim() || 'البائع',
        seller_contact: contact || null,
        minutes: Number(s2.querySelector('#qkMin').value)
      });
      if (r && r.ok === false) {
        btn.disabled = false; btn.textContent = 'ابدأ السوم على الهواء 🔴';
        return err(r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'تعذّر التسجيل');
      }
      // the create RPC carries no limit, so set it on the row we just made
      if (auto !== null && r && r.id) {
        try { await store.admin(r.id, admin.secret, 'auto', null, auto); } catch (e2) { console.error(e2); }
      }
      closeSheet();
      toast('بدأ السوم 🔴');
      if (route.name === 'live') refresh(true);
      else location.hash = '#/live';
    } catch (e) {
      console.error(e);
      btn.disabled = false; btn.textContent = 'ابدأ السوم على الهواء 🔴';
      err('تعذّر الاتصال. حاول مرة ثانية.');
    }
  });
}

/* The seller's optional limit, stated the same way everywhere it shows. */
function autoLine(lot, shown, st) {
  const a = Number(lot.auto_sell_price || 0);
  if (!a || !['live', 'pending'].includes(st)) return '';
  const left = a - Number(shown || 0);
  return '⚡ بيع مباشر عند <span class="num">' + money(a) + '</span> ر.س' +
    (st === 'live' && left > 0 ? ' — باقي <span class="num">' + money(left) + '</span>' : '');
}

function renderLot(lot, bids, full) {
  const st = lotState(lot);
  const t = topBid(lot.id, lot);
  const shown = finalPrice(lot, t);
  const step = stepFor(t.amount);
  const minNext = t.amount + step;
  const cd = countdown(lot.end_at);

  // the page re-reads itself every 2.5s; only rebuild when something changed,
  // otherwise the card jumps under the reader's thumb (the clock keeps ticking
  // on its own through tick() and [data-cd])
  const sig = JSON.stringify([lot.id, lot.phone, lot.status, lot.sold_price,
    lot.auto_sell_price, lot.seller_name, lot.end_at, lot.paused_ms, lot.is_live,
    st, admin.on, sigOfBids(bids)]);
  if (full || sig !== screenSig.lot || !$('#lotBody').firstElementChild) {
    screenSig.lot = sig;
    const body = $('#lotBody');
    const feedScrolled = (() => { const f = $('#feed'); return f ? f.scrollTop + f.clientHeight >= f.scrollHeight - 30 : true; })();

    body.innerHTML =
      '<div class="card">' +
        '<div class="lot-top">' + badgeFor(st) +
          (lot.is_live ? '<span class="badge air">🔴 على الهواء</span>' : '') +
          '<span class="badge">' + esc(kindBadge(lot)) + '</span>' +
          '<span style="flex:1"></span>' +
          '<button class="btn btn-ghost btn-sm" id="btnShare">مشاركة</button>' +
        '</div>' +
        '<div class="phone-plate plate-wrap">' + plateStamped(lot, '', st) + '</div>' +
        '<div class="price-hero" style="margin-top:14px">' +
          '<div class="k">' + (st === 'sold' ? 'بيع على' : st === 'pending' ? 'سعر البداية' : 'السعر الحالي') + '</div>' +
          '<div class="v"><span class="num">' + money(shown) + '</span> ر.س</div>' +
          '<div class="who">' +
            (t.name ? 'أعلى مزايد: ' + esc(t.name)
             : st === 'sold' ? 'بيع مباشر — بدون مزايدات على الموقع'
             : st === 'pending' ? 'ما بدأ السوم بعد'
             : 'لا توجد مزايدات بعد — سعر البداية') + '</div>' +
        '</div>' +
        (st === 'live'
          ? clockCell(lot, 'countdown', cd)
          : st === 'pending'
          ? '<div class="wait-note">' +
            (isMasked(lot) ? (IS_PLATE(lot)
                ? 'حروف اللوحة مخفية لين يجي دورها — تظهر كاملة لما يفتح عليها السوم.<br>'
                : 'الرقم مخفي جزئياً لين يجي دوره — يظهر كامل لما يفتح عليه السوم.<br>') : '') +
            'ما يقدر أحد يزايد عليه إلا لما نفتح عليه السوم.</div>'
          : '') +
        /* A note written and never shown is worse than no note at all — the
           column was already being WRITTEN by the operator's quick-add and
           displayed on no screen anywhere. */
        (lot.note ? '<div class="seller-note">📝 ' + esc(lot.note) + '</div>' : '') +
        (autoLine(lot, shown, st) ? '<div class="auto-note">' + autoLine(lot, shown, st) + '</div>' : '') +
        '<div class="lot-foot" style="justify-content:center">👤 البائع: ' + esc(lot.seller_name) +
          ' · <span class="num">' + t.count + '</span> مزايدة</div>' +
        (st === 'pending'
          ? '<div class="fee">عمولة الموقع ' + esc(feeRule(kindOf(lot))) + ' — على ذمة البائع</div>'
          : '<div class="fee">عمولة الموقع = ' +
            '<b><span class="num">' + money(commissionOn(shown, kindOf(lot))) + '</span> ر.س</b>' +
            '<span> — على ذمة البائع</span></div>') +
        (lot.seller_contact && admin.on
          ? '<a class="btn btn-ghost btn-block" style="margin-top:10px" target="_blank" rel="noopener" href="' +
            esc(waLink(lot.seller_contact, itemLabel(lot))) + '">💬 تواصل مع البائع (مشرف)</a>'
          : '') +
      '</div>' +

      '<div class="card">' +
        '<div style="font-weight:700;margin-bottom:8px">المزايدات</div>' +
        '<div class="feed" id="feed"></div>' +
      '</div>';

    if (admin.on) body.appendChild(adminBar(lot));

    const feed = $('#feed');
    if (!bids.length) {
      feed.innerHTML = '<div class="empty" style="padding:22px">' +
        (st === 'pending' ? 'ينتظر دوره — يبدأ السوم عليه في البث ⏳'
                          : 'ما فيه سومات معتمدة بعد. السومات تظهر هنا بعد موافقة المشرف 👋') + '</div>';
    } else {
      const best = Math.max(...bids.map(b => +b.amount));
      const newest = bids[bids.length - 1];
      const fresh = newest && newest.id !== lastSeenBid;
      if (newest) lastSeenBid = newest.id;
      feed.innerHTML = bids.slice().reverse().map(b => {
        const isTop = +b.amount === best, isMine = b.bidder_name === me.name;
        return '<div class="bid-row' + (isTop ? ' top' : '') + '">' +
          paddle(b.amount, (isTop ? 'top ' : '') + (isMine ? 'mine ' : '') +
                           (fresh && b.id === newest.id ? 'raise' : '')) +
          '<div class="bid-who">' +
            '<b>' + esc(b.bidder_name) + (isTop ? ' 🏆' : '') + '</b>' +
            '<span>' + esc(ago(b.created_at)) + (isTop ? ' · أعلى سومة' : '') + '</span>' +
          '</div>' +
          '<div class="bid-amt num">' + money(b.amount) + ' ر.س</div>' +
        '</div>';
      }).join('');
      if (full || feedScrolled) feed.scrollTop = 0;
    }

    $('#btnShare').addEventListener('click', () => share(lot));
  }

  /* bid bar */
  const host = $('#bidbarHost');
  if (st !== 'live') {
    host.innerHTML = '<div class="bidbar"><div class="inner" style="text-align:center;color:var(--muted);font-size:.86rem">' +
      (st === 'sold' ? 'تم بيع هذا الرقم ✔'
       : st === 'unsold' ? 'انتهى المزاد ولم يتم البيع'
       : st === 'pending' ? '⏳ ينتظر دوره — السوم ما بدأ عليه بعد'
       : 'انتهى المزاد على هذا الرقم') + '</div></div>';
    return;
  }
  if (!host.firstElementChild) {
    host.innerHTML =
      '<div class="bidbar"><div class="inner">' +
        '<div class="bid-wait hidden" id="bidWait"></div>' +
        '<div class="bid-now">وصل السوم إلى <b><span class="num" id="bidNow">—</span> ر.س</b></div>' +
        '<button class="btn btn-gold btn-block" id="btnQuick">زايد</button>' +
        '<div class="bid-or">أو اكتب مبلغك</div>' +
        '<div class="bidrow">' +
          '<input id="bidInput" type="number" inputmode="numeric" placeholder="مبلغك">' +
          '<button class="btn" id="btnBid">إرسال</button>' +
        '</div>' +
      '</div></div>';
    $('#btnBid').addEventListener('click', () => sendBid(lot.id));
    $('#bidInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBid(lot.id); });
    $('#btnQuick').addEventListener('click', () => {
      $('#bidInput').value = $('#btnQuick').dataset.v || '';
      sendBid(lot.id);
    });
  }
  // has my waiting sum been approved? then stop showing it as waiting
  const mine = myPending[lot.id];
  if (mine != null && bids.some(b => b.bidder_name === me.name && Number(b.amount) === Number(mine))) {
    delete myPending[lot.id];
    try { localStorage.setItem('mazad_pending', JSON.stringify(myPending)); } catch {}
  }
  const waitLine = $('#bidWait');
  if (waitLine) {
    const v = myPending[lot.id];
    waitLine.innerHTML = v != null
      ? '⏳ سومتك <span class="num">' + money(v) + '</span> ر.س بانتظار موافقة المشرف'
      : '';
    waitLine.classList.toggle('hidden', v == null);
  }

  $('#bidNow').textContent = money(shown);
  const quick = $('#btnQuick');
  quick.dataset.v = minNext;
  quick.innerHTML = 'زايد بـ <span class="num">' + money(step) + '</span> ر.س ← ' +
                    '<span class="num">' + money(minNext) + '</span>';
  const input = $('#bidInput');
  input.min = minNext;
  input.placeholder = 'أقل مبلغ ' + money(minNext);
}

function waLink(contact, phone) {
  const d = String(contact).replace(/\D/g, '').replace(/^0/, '966');
  const msg = encodeURIComponent('السلام عليكم، بخصوص ' + phone + ' المعروض في مزاد أبو شادن');
  return 'https://wa.me/' + d + '?text=' + msg;
}

async function share(lot) {
  const url = location.origin + location.pathname + '#/n/' + encodeURIComponent(lot.id);
  const data = { title: 'مزاد أبو شادن', text: 'مزاد على ' + itemWord(lot) + ' ' + itemLabel(lot) + ' — أعلى سوم يكسب', url };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(url); toast('تم نسخ الرابط');
  } catch { /* user cancelled */ }
}

async function sendBid(id) {
  // all three, not just the name: a sum we cannot follow up on, or cannot
  // arrange a handover for, is no use to the seller
  if (!me.name || !/^05\d{8}$/.test(me.phone) || !me.city) { askName(() => sendBid(id)); return; }
  const input = $('#bidInput');
  const amount = Number(input.value);
  if (!amount || amount <= 0) { toast('اكتب المبلغ'); return; }

  const btn = $('#btnBid'); btn.disabled = true;
  try {
    const r = await store.placeBid(id, me.name, amount, me.phone, me.city);
    if (r && r.ok === false) {
      const m = {
        too_low: 'المبلغ أقل من المطلوب — أقل مزايدة ' + money(r.min || 0) + ' ر.س',
        too_fast: 'على مهلك ثانية وحدة 😄',
        too_many_pending: 'عندك سومات بانتظار الموافقة — استنَّ شوي',
        not_started: 'ما بدأ السوم على هذا الرقم بعد',
        closed: 'المزاد مقفل',
        expired: 'انتهى وقت المزاد',
        bad_name: 'اكتب اسم صحيح (حرفين على الأقل)',
        bad_phone: 'اكتب رقم جوال صحيح يبدأ بـ 05',
        bad_city: 'اكتب موقعك — المدينة تكفي',
        bad_amount: 'مبلغ غير صحيح',
        not_found: 'المزاد غير موجود'
      }[r.error] || 'تعذّرت المزايدة';
      toast(m);
    } else {
      input.value = '';
      myPending[id] = amount;
      try { localStorage.setItem('mazad_pending', JSON.stringify(myPending)); } catch {}
      toast('وصلت سومتك ' + money(amount) + ' ر.س — بانتظار موافقة المشرف');
    }
  } catch (e) {
    console.error(e); toast('تعذّر الاتصال — حاول مرة ثانية');
  } finally {
    btn.disabled = false;
    refresh(false);
  }
}

/* ------------------------------------------------------------- sheets */
/* Show the seller the picture he picked before anything is uploaded — the
   file is only sent when he saves, so a wrong pick costs nothing. */
function wirePhotoPick(root, inputSel, prevSel) {
  const input = root.querySelector(inputSel), prev = root.querySelector(prevSel);
  if (!input || !prev) return;
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    prev.innerHTML = '';
    if (!f) return;
    if (f.size > 3 * 1024 * 1024) {
      prev.innerHTML = '<div class="err">الصورة أكبر من 3 ميجا — اختر وحدة أصغر.</div>';
      input.value = ''; return;
    }
    const url = URL.createObjectURL(f);
    prev.innerHTML = '<img src="' + url + '" alt="">';
    prev.querySelector('img').addEventListener('load', () => URL.revokeObjectURL(url), { once: true });
  });
}

/* ---------- EVERY sheet carries its own way out ----------
   «فتحت هذا القسم حق السومة بالغلط، أبي أرجع للقائمة ما أقدر، ما فيه سهم
   رجوع — حط للكل».

   Tapping the backdrop closed a sheet, and that was the ONLY way out. It
   works on the public page, where the backdrop is the rest of the screen —
   and it is a dead end on `/live`, because `.in-ops` shrinks the backdrop to
   the strip's own width and the sheet then fills it, so there is nothing left
   to tap. On the one screen he is filming, a sheet opened by mistake could
   not be closed at all.

   So the way out belongs to `sheet()` itself, not to each caller: every sheet
   gets the arrow, and a sheet added later cannot forget it. Three ways out
   now — the arrow, Escape, and the backdrop where there is one. */
function sheet(html) {
  const host = $('#sheetHost');
  // on the broadcast screen the operator's sheets belong in his strip, not
  // over the auction — see .sheet-bg.in-ops
  const inOps = route.name === 'live' && admin.on && !opsFolded;
  host.innerHTML = '<div class="sheet-bg' + (inOps ? ' in-ops' : '') + '">' +
    '<div class="sheet">' +
      '<button type="button" class="sheet-back" aria-label="رجوع">' +
        '<span aria-hidden="true">→</span> رجوع</button>' +
      html +
    '</div></div>';
  host.querySelector('.sheet-bg').addEventListener('click', (e) => { if (e.target.classList.contains('sheet-bg')) closeSheet(); });
  host.querySelector('.sheet-back').addEventListener('click', closeSheet);
  return host.querySelector('.sheet');
}
function closeSheet() { $('#sheetHost').innerHTML = ''; }
/* Escape is the third way out, and the one a laptop reaches for first. It is
   bound once on the document rather than per sheet, so it cannot be missed. */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#sheetHost').firstElementChild) closeSheet();
});

function askName(then) {
  const s = sheet(
    '<h2>بياناتك للمزايدة</h2>' +
    '<p class="hint">اسمك يظهر مع كل سومة. جوالك وموقعك ما يظهرون لأحد — ' +
      'يوصلون للمشرف فقط عشان يتواصل معك إذا ربحت.</p>' +
    '<div id="nmErr"></div>' +
    '<div class="field"><label>اسمك</label>' +
      '<input id="nmInput" maxlength="40" placeholder="مثال: أبو فهد" value="' + esc(me.name) + '"></div>' +
    '<div class="field ltr"><label>جوالك</label>' +
      '<input id="nmPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="05XXXXXXXX" value="' + esc(me.phone) + '">' +
      '<div class="sub">يبدأ بـ 05 ويتكوّن من 10 أرقام. سرّي — ما يظهر في المزايدات.</div></div>' +
    '<div class="field"><label>موقعك</label>' +
      '<input id="nmCity" maxlength="40" placeholder="مثال: الرياض" value="' + esc(me.city) + '">' +
      '<div class="sub">المدينة تكفي — عشان يُعرف كيف يتم التسليم ونقل الملكية.</div></div>' +
    '<button class="btn btn-block" id="nmSave">حفظ</button>'
  );
  const input = s.querySelector('#nmInput');
  input.focus();
  const save = () => {
    const err = (m) => { s.querySelector('#nmErr').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
    const v = input.value.trim();
    const ph = s.querySelector('#nmPhone').value.replace(/\D/g, '');
    const ct = s.querySelector('#nmCity').value.trim();
    if (v.length < 2) return err('الاسم قصير.');
    if (!/^05\d{8}$/.test(ph)) return err('رقم الجوال لازم يبدأ بـ 05 ويكون 10 أرقام.');
    if (ct.length < 2) return err('اكتب موقعك — المدينة تكفي.');
    me.phone = ph; me.city = ct;
    me.name = v; closeSheet(); if (then) then(); else refresh(false);
  };
  s.querySelector('#nmSave').addEventListener('click', save);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') s.querySelector('#nmPhone').focus(); });
  s.querySelector('#nmPhone').addEventListener('keydown', (e) => { if (e.key === 'Enter') s.querySelector('#nmCity').focus(); });
  s.querySelector('#nmCity').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
}

/* ---------- «طلب»: a viewer who is after one particular plate ----------
   The site has no wanted-list table and adding one would mean a schema he has
   to run before the button does anything, so this goes where a request
   actually gets answered today: a WhatsApp message to the operator, written
   for him. He is the one who knows what is coming in, and he is already the
   only contact on the page.

   It asks for the same three things a bid asks for — الاسم، الجوال، الموقع —
   because a request he cannot answer is no more use to him than a sum he
   cannot follow up. They are kept in this browser, so a viewer who has
   already bid is not asked twice. */
function askWanted() {
  const s = sheet(
    '<h2>اطلب لوحة معيّنة</h2>' +
    '<p class="hint">اكتب اللي تدوّره ونوصله للمشرف مباشرة على واتساب. إذا دخلت ' +
      'لوحة تشبه طلبك يتواصل معك.</p>' +
    '<div id="wtErr"></div>' +
    '<div class="field"><label>اللوحة أو الرقم اللي تدوّره</label>' +
      '<input id="wtWhat" maxlength="60" placeholder="مثال: أ ب 1 خصوصي، أو ثلاثي"></div>' +
    '<div class="field"><label>اسمك</label>' +
      '<input id="wtName" maxlength="40" placeholder="مثال: أبو فهد" value="' + esc(me.name) + '"></div>' +
    '<div class="field ltr"><label>جوالك</label>' +
      '<input id="wtPhone" type="tel" inputmode="numeric" maxlength="10" ' +
        'placeholder="05XXXXXXXX" value="' + esc(me.phone) + '"></div>' +
    '<div class="field"><label>موقعك</label>' +
      '<input id="wtCity" maxlength="40" placeholder="مثال: الرياض" value="' + esc(me.city) + '">' +
      '<div class="sub">المدينة تكفي — عشان يعرف كيف يتم التسليم.</div></div>' +
    '<button class="btn btn-block" id="wtSend">أرسل الطلب على واتساب</button>'
  );
  s.querySelector('#wtWhat').focus();
  s.querySelector('#wtSend').addEventListener('click', () => {
    const err = (m) => { s.querySelector('#wtErr').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
    const what = s.querySelector('#wtWhat').value.trim();
    const name = s.querySelector('#wtName').value.trim();
    const ph   = s.querySelector('#wtPhone').value.replace(/\D/g, '');
    const city = s.querySelector('#wtCity').value.trim();
    if (what.length < 2) return err('اكتب اللي تدوّره.');
    if (name.length < 2) return err('الاسم قصير.');
    if (!/^05\d{8}$/.test(ph)) return err('رقم الجوال لازم يبدأ بـ 05 ويكون 10 أرقام.');
    if (city.length < 2) return err('اكتب موقعك — المدينة تكفي.');
    me.name = name; me.phone = ph; me.city = city;
    const msg = 'طلب لوحة من مزاد أبو شادن\n' +
      'المطلوب: ' + what + '\n' +
      'الاسم: ' + name + '\n' +
      'الجوال: ' + ph + '\n' +
      'الموقع: ' + city;
    const d = CONTACT_PHONE.replace(/\D/g, '').replace(/^0/, '966');
    closeSheet();
    window.open('https://wa.me/' + d + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
  });
}

function askAdmin() {
  const s = sheet(
    '<h2>دخول المشرف</h2>' +
    '<p class="hint">تُحفظ في هذا المتصفح، فما تحتاج تكتبها كل مرة.</p>' +
    '<div class="field"><input id="adInput" type="password" placeholder="كلمة المرور"></div>' +
    '<button class="btn btn-block" id="adSave">دخول</button>' +
    (admin.on ? '<button class="btn btn-ghost btn-block" style="margin-top:8px" id="adOut">خروج من وضع المشرف</button>' : '')
  );
  s.querySelector('#adSave').addEventListener('click', () => {
    const v = s.querySelector('#adInput').value.trim();
    if (!v) return;
    admin.secret = v; closeSheet(); toast('وضع المشرف مفعّل');
    if (route.name === 'live') refresh(true); else location.hash = '#/live';
  });
  if (admin.on) s.querySelector('#adOut').addEventListener('click', () => { admin.secret = ''; closeSheet(); toast('تم الخروج'); refresh(false); });
}

function askListing() {
  const s = sheet(
    '<h2>اعرض في المزاد</h2>' +
    '<p class="hint">يدخل قائمة الانتظار، ويفتح عليه السوم لما يجي دوره في البث.</p>' +
    '<div id="lsErr"></div>' +

    '<div class="seg" id="lsType">' +
      KINDS_SHOWN.map((k, i) => '<button' + (i ? '' : ' class="on"') +
        ' data-t="' + k + '">' + esc(SEG_LABEL[k]) + '</button>').join('') +
    '</div>' +

    // ---- a car plate: three letters and up to four digits
    '<div data-for="plate">' +
      '<div class="field"><label>نوع اللوحة</label>' +
        '<div class="seg" id="lsKind">' +
          Object.keys(PLATE_KINDS).map((k, i) =>
            '<button' + (i ? '' : ' class="on"') + ' data-pk="' + k + '">' +
              esc(PLATE_KINDS[k]) + '</button>').join('') +
        '</div>' +
        '<div class="sub">نقل هي الزرقاء، وصغيرة هي القصيرة اللي على السيارات الرياضية.</div></div>' +
      '<div class="field"><label>حروف اللوحة</label>' +
        letterBoxes('ls', '') +
        '<div class="sub">اكتبها بالعربي أو بالإنجليزي — <b>د</b> أو <b>D</b>، ' +
          'نفس الشي. بالترتيب اللي على اللوحة، من اليمين لليسار. ' +
          'من حرف إلى ثلاثة.</div></div>' +
      '<div class="field ltr"><label>أرقام اللوحة</label>' +
        '<input id="lsDigits" type="tel" inputmode="numeric" maxlength="4" placeholder="900">' +
        '<div class="sub">من رقم إلى أربعة. تظهر مخفية (<span class="num">•••</span>) لين توصل دورها في البث.</div></div>' +
      '<div class="field"><label>شعار اللوحة</label>' +
        '<select id="lsEmblem">' + Object.keys(EMBLEMS).map(k =>
          '<option value="' + k + '">' + EMBLEMS[k] + '</option>').join('') + '</select>' +
        '<div class="sub">اللي في نص اللوحة — اسأل البائع وش شعار لوحته.</div></div>' +

      '<div id="lsPreview" class="plate-preview"></div>' +
    '</div>' +

    // ---- a car
    '<div data-for="car" class="hidden">' +
      '<div class="row2">' +
        '<div class="field"><label>الماركة</label>' +
          '<input id="lsMake" maxlength="30" placeholder="تويوتا"></div>' +
        '<div class="field"><label>الموديل</label>' +
          '<input id="lsModel" maxlength="30" placeholder="لاندكروزر"></div>' +
      '</div>' +
      '<div class="field ltr"><label>سنة الصنع</label>' +
        '<input id="lsYear" type="number" inputmode="numeric" min="1970" max="2100" placeholder="2022"></div>' +
      '<div class="field"><label>صورة السيارة (اختياري)</label>' +
        '<input id="lsPhoto" type="file" accept="image/jpeg,image/png,image/webp">' +
        '<div class="sub">صورة وحدة، حتى 3 ميجا. تظهر مع السيارة في القائمة وعلى البث.</div></div>' +
      '<div id="lsPhotoPrev" class="photo-prev"></div>' +
      (takesNote('car')
        ? '<div class="field"><label>ملاحظات (اختياري)</label>' +
            '<textarea id="lsNote" maxlength="200" rows="3" ' +
              'placeholder="مثال: ماشية 90 ألف، فحص كامل، ما عليها حوادث"></textarea>' +
            '<div class="sub">تظهر للمزايدين في صفحة السيارة. حتى 200 حرف.</div></div>'
        : '') +
    '</div>' +

    // ---- a phone number
    '<div data-for="phone" class="hidden">' +
      '<div class="field ltr"><label>رقم الجوال المعروض</label>' +
        '<input id="lsPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="05XXXXXXXX">' +
        '<div class="sub">يبدأ بـ 05 ويتكوّن من 10 أرقام. يظهر مخفي جزئياً ' +
          '(<span class="num">054 ••• ••01</span>) لين يجي دوره في البث.</div></div>' +
      '<div class="field"><label>الشركة</label><select id="lsCarrier">' +
        '<option value="stc">STC</option><option value="mobily">موبايلي</option>' +
        '<option value="zain">زين</option><option value="other">أخرى</option></select></div>' +
    '</div>' +

    '<div class="field ltr"><label>سعر البداية (ر.س)</label>' +
      '<input id="lsPrice" type="number" inputmode="numeric" min="0" value="0"></div>' +

    '<div class="row2">' +
      '<div class="field"><label>اسمك</label><input id="lsName" maxlength="40" placeholder="أبو فهد" value="' + esc(me.name) + '"></div>' +
      '<div class="field ltr"><label>جوال للتواصل</label><input id="lsContact" type="tel" inputmode="numeric" maxlength="14" placeholder="05XXXXXXXX">' +
        '<div class="sub">لإدارة المزاد فقط — ما يظهر لأحد.</div></div>' +
    '</div>' +
    '<div class="field ltr"><label>سعر البيع المباشر (اختياري)</label>' +
      '<input id="lsAuto" type="number" inputmode="numeric" min="0" placeholder="اتركه فاضي لو ما تبي">' +
      '<div class="sub">لو وصل السوم لهذا المبلغ ينباع رقمك على طول وينتهي المزاد عليه — بدون ما تنتظر نهاية الوقت. ' +
        'لازم يكون أعلى من سعر البداية.</div></div>' +
    '<div class="fee-box" id="lsFee"></div>' +
    '<button class="btn btn-gold btn-block" id="lsSave">اعرضه — وأوافق على العمولة</button>'
  );

  let kind = KINDS_SHOWN[0];
  // the commission differs per section, so the box has to follow the picker —
  // a seller must see the rule he is actually agreeing to
  const paintFee = () => {
    const f = feeOf(kind);
    s.querySelector('#lsFee').innerHTML =
      '💰 عمولة الموقع <b>' + esc(feeRule(kind)) + '</b>، <b>على ذمة البائع</b>.' +
      /* The two worked sums STRADDLE the threshold, derived from it rather
         than hard-coded: 10,000 and 30,000 were both under the car threshold,
         so the example printed «500 · 500» and a seller reading it never saw
         the rate at all — which is the half of the rule he most needs to see
         before he agrees to it. */
      (f.rate
        ? '<br>بيع بـ <span class="num">' + money(Math.round(f.threshold / 2)) + '</span> ← <span class="num">' +
            money(commissionOn(Math.round(f.threshold / 2), kind)) + '</span> ر.س' +
          ' · بيع بـ <span class="num">' + money(f.threshold * 3) + '</span> ← <span class="num">' +
            money(commissionOn(f.threshold * 3, kind)) + '</span> ر.س.'
        : '<br>نفس المبلغ سواء باع بـ <span class="num">5,000</span> أو <span class="num">500,000</span>.') +
      '<br>بعرضك أنت موافق على هذا.';
  };
  const show = () => {
    s.querySelectorAll('[data-for]').forEach(n => n.classList.toggle('hidden', n.dataset.for !== kind));
    paintFee();
    s.querySelectorAll('#lsType button').forEach(b => b.classList.toggle('on', b.dataset.t === kind));
  };
  s.querySelector('#lsType').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    kind = b.dataset.t; show();
  });
  show();

  // the seller sees the plate he is actually listing, drawn the way the
  // broadcast will draw it — the cheapest way to stop a wrong letter
  let lsKind = Object.keys(PLATE_KINDS)[0];
  const paintPreview = () => {
    const letters = readLsLetters();
    const digits  = s.querySelector('#lsDigits').value.replace(/\D/g, '');
    // only خصوصي carries an emblem of its own
    s.querySelector('#lsEmblem').closest('.field').classList.toggle('hidden', lsKind !== 'private');
    s.querySelector('#lsPreview').innerHTML = digits
      ? itemPlate({ item_type: 'plate', plate_letters: letters, plate_digits: digits,
                    plate_kind: lsKind,
                    plate_emblem: s.querySelector('#lsEmblem').value })
      : '<div class="sub" style="text-align:center">اكتب أرقام اللوحة عشان تشوفها</div>';
  };
  s.querySelector('#lsKind').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    s.querySelectorAll('#lsKind button').forEach(x => x.classList.toggle('on', x === b));
    lsKind = b.dataset.pk; paintPreview();
  });
  const readLsLetters = wireLetterBoxes(s, 'ls', () => paintPreview(), '#lsDigits');
  wirePlateDigits(s, '#lsDigits', paintPreview, '#lsEmblem');
  s.querySelector('#lsEmblem').addEventListener('input', paintPreview);
  wirePhotoPick(s, '#lsPhoto', '#lsPhotoPrev');
  s.querySelector('#lsEmblem').addEventListener('change', paintPreview);
  paintPreview();

  s.querySelector('#lsSave').addEventListener('click', async () => {
    const err = (m) => { s.querySelector('#lsErr').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
    const phone   = s.querySelector('#lsPhone').value.replace(/\D/g, '');
    const price   = Number(s.querySelector('#lsPrice').value || 0);
    const name    = s.querySelector('#lsName').value.trim();
    const contact = s.querySelector('#lsContact').value.replace(/\D/g, '');

    const letters = normPlate(readLsLetters());
    const digits  = s.querySelector('#lsDigits').value.replace(/\D/g, '');

    const make  = s.querySelector('#lsMake').value.trim();
    const model = s.querySelector('#lsModel').value.trim();
    const year  = Number(s.querySelector('#lsYear').value || 0);

    if (kind === 'phone') {
      if (!/^05\d{8}$/.test(phone)) return err('رقم الجوال لازم يبدأ بـ 05 ويكون 10 أرقام.');
    } else if (kind === 'plate') {
      if (!letters.length) return err('اختر حرف اللوحة — من حرف إلى ثلاثة.');
      if (!/^\d{1,4}$/.test(digits)) return err('أرقام اللوحة من رقم إلى أربعة.');
    } else {
      if (make.length < 2)  return err('اكتب ماركة السيارة.');
      if (model.length < 1) return err('اكتب موديل السيارة.');
      if (!(year >= 1970 && year <= 2100)) return err('اكتب سنة صنع صحيحة.');
    }
    if (name.length < 2) return err('اكتب اسمك.');
    if (price < 0 || price > 100000000) return err('سعر البداية غير منطقي.');
    if (contact && !/^0?5\d{8}$/.test(contact)) return err('رقم التواصل غير صحيح.');
    const autoRaw = s.querySelector('#lsAuto').value.trim();
    const auto = autoRaw === '' ? null : Number(autoRaw);
    if (auto !== null && !(auto > price)) return err('سعر البيع المباشر لازم يكون أعلى من سعر البداية.');
    if (auto !== null && auto > 100000000) return err('سعر البيع المباشر غير منطقي.');

    const btn = s.querySelector('#lsSave'); btn.disabled = true; btn.textContent = 'جاري التسجيل…';
    try {
      // upload first: if the picture fails there is no half-made listing
      let photo = null;
      const pf = kind === 'car' && s.querySelector('#lsPhoto').files[0];
      if (pf) {
        btn.textContent = 'جاري رفع الصورة…';
        try { photo = await store.uploadCarPhoto(pf); }
        catch (e2) {
          console.error(e2);
          btn.disabled = false; btn.textContent = 'اعرضه — وأوافق على العمولة';
          return err('تعذّر رفع الصورة. جرّب صورة أصغر أو اتركها فاضية.');
        }
      }
      const row = await store.createListing({
        // the database refuses a row that carries both, so send only the one
        item_type: kind,
        phone:         kind === 'phone' ? phone : null,
        carrier:       kind === 'phone' ? s.querySelector('#lsCarrier').value : null,
        plate_letters: kind === 'plate' ? letters : null,
        plate_digits:  kind === 'plate' ? digits  : null,
        plate_emblem:  kind === 'plate' ? s.querySelector('#lsEmblem').value : null,
        plate_kind:    kind === 'plate' ? lsKind : null,
        car_make:      kind === 'car' ? make  : null,
        car_model:     kind === 'car' ? model : null,
        car_year:      kind === 'car' ? year  : null,
        car_photo:     kind === 'car' ? photo : null,
        start_price: price,
        seller_name: name,
        seller_contact: contact || null,
        note: (takesNote(kind) && s.querySelector('#lsNote')
               ? s.querySelector('#lsNote').value.trim().slice(0, 200) : '') || null,
        auto_sell_price: auto,  // optional: the sum that closes the lot by itself
        status: 'pending',      // queued — only the operator opens the bidding
        end_at: null
      });
      if (!me.name) me.name = name;
      closeSheet();
      /* It does NOT go on the page yet — `mazad_public` hides an unapproved
         row, so sending the seller to #/n/<id> would land him on a lot that
         does not exist for him. Say what actually happens instead. */
      toast({ plate: 'لوحتك', car: 'سيارتك', phone: 'رقمك' }[kind] +
        ' وصل ✔ — بيراجعه المشرف قبل لا يظهر في المزاد');
      goList();
    } catch (e) {
      console.error(e);
      btn.disabled = false; btn.textContent = 'اعرضه — وأوافق على العمولة';
      err('تعذّر التسجيل. تأكد من الاتصال وحاول مرة ثانية.');
    }
  });
}

/* --------------------------------------------------------------- ticks */
function tick() {
  let expired = false;
  document.querySelectorAll('[data-cd]').forEach(node => {
    const cd = countdown(node.dataset.cd);
    if (cd === null) {
      node.textContent = 'انتهى';
      node.classList.remove('warn');
      node.removeAttribute('data-cd');
      expired = true;
    } else {
      node.textContent = cd;
    }
  });
  if (expired) refresh(false);
}

/* ---------------------------------------------------------------- boot */
$('#nameChip').addEventListener('click', () => askName());
/* ---------- the three doors ---------- */
$('#doorSell').addEventListener('click', () => askListing());
$('#doorWant').addEventListener('click', () => askWanted());
/* «انت مكرر مرتين — فوق يسجل اسمه وتحت مزايدة وهي نفسها». The chip at the
   top and this door were two ways to do one thing. The door is the one that
   makes sense to a visitor, so it OWNS the registration: tap it, give the
   three details once, and land on the open auction with the bid box in front
   of you. The chip is no longer a door at all — it only appears once you are
   registered, to show who you are and let you change it. */
$('#doorBid').addEventListener('click', () => {
  const go = () => {
    const air = cache.listings.find(l => l.is_live && (admin.on || kindShown(kindOf(l))));
    if (air) { location.hash = '#/n/' + encodeURIComponent(air.id); return; }
    // nothing on air — show what is open rather than a dead end
    const open = document.querySelector('.filter[data-filter="live"]');
    if (open) open.click();
    $('#lots').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  // register once, here, rather than bouncing him to the bid box and asking there
  if (!me.name || !/^05\d{8}$/.test(me.phone) || !me.city) { askName(go); return; }
  go();
});
$('#btnBack').addEventListener('click', () => goList());
$('#btnBackLive').addEventListener('click', () => goList());
$('#opsPeek').addEventListener('click', () => {
  opsFolded = false;
  try { localStorage.setItem('mazad_ops_folded', '0'); } catch {}
  // renderLive returns early when its data is unchanged, and unfolding is not
  // data — so clear the signature or the strip never comes back
  screenSig.live = ''; screenSig.ops = '';
  refresh(false);
});
$('#btnBackAbout').addEventListener('click', () => goList());

$('#kindRow').innerHTML =
  '<button class="filter" data-kind="all">🏷️ الكل</button>' +
  KINDS_SHOWN.map(k => '<button class="filter" data-kind="' + k + '">' +
    esc(KIND_LABEL[k]) + '</button>').join('');
$('#kindRow').querySelectorAll('.filter').forEach(b => b.addEventListener('click', () => {
  $('#kindRow').querySelectorAll('.filter').forEach(x => x.classList.toggle('on', x === b));
  cache.kind = b.dataset.kind;
  try { localStorage.setItem('mazad_kind', cache.kind); } catch {}
  renderList();
}));
document.querySelectorAll('.filter[data-filter]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.filter').forEach(x => x.classList.toggle('on', x === b));
  cache.filter = b.dataset.filter; renderList();
}));

/* long-press the logo → admin login */
(() => {
  let t = null;
  const mark = $('#brandMark');
  const start = () => { t = setTimeout(askAdmin, 900); };
  const stop  = () => clearTimeout(t);
  ['mousedown', 'touchstart'].forEach(e => mark.addEventListener(e, start, { passive: true }));
  ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(e => mark.addEventListener(e, stop, { passive: true }));
})();

if (!REMOTE) {
  const b = $('#modeBanner');
  b.classList.remove('hidden');
  b.innerHTML = '<b>وضع تجريبي محلي.</b> البيانات محفوظة في هذا المتصفح فقط. لتشغيل المزاد للناس، اربط Supabase من أعلى الملف.';
}

$('#footFee').innerHTML = (() => {
  const byRule = new Map();
  KINDS_SHOWN.forEach(k => {
    const r = feeRule(k);
    byRule.set(r, (byRule.get(r) || []).concat(KIND_NAME[k]));
  });
  return [...byRule].map(([rule, names]) => names.join(' و') + ' ' + rule).join(' · ');
})();
(() => {
  $('#footTelNum').textContent = fmtPhone(CONTACT_PHONE);
  $('#footTel').href = 'https://wa.me/' + CONTACT_PHONE.replace(/\D/g, '').replace(/^0/, '966');
})();
$('#brandSub').textContent = kindWords() + ' — مزايدة مباشرة';
paintName();
(() => {   // put the section chips back on the section this browser last used
  const row = $('#kindRow');
  if (row) row.querySelectorAll('.filter').forEach(b =>
    b.classList.toggle('on', b.dataset.kind === cache.kind));
})();
window.addEventListener('hashchange', go);
syncClock();
setInterval(syncClock, 5 * 60 * 1000);
go();
pollTimer = setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
tickTimer = setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { syncClock(); refresh(false); }   // a sleeping device drifts
});
</script>
