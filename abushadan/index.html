<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزاد أبو شادن | سيارات ولوحات مميزة</title>
<meta name="description" content="مزاد أبو شادن — مزاد سيارات ولوحات مميزة، يُدار على الهواء. اعرض، والناس تزايد لحظة بلحظة.">
<meta name="theme-color" content="#0a0908">
<meta property="og:title" content="مزاد أبو شادن | سيارات ولوحات مميزة">
<meta property="og:description" content="اعرض لوحتك أو سيارتك، والناس تزايد عليها مباشرة. أعلى سوم يكسب.">
<meta property="og:image" content="/mazad-og.png">

<meta name="twitter:image" content="/mazad-og.png">
<meta property="og:type" content="website">
<link rel="icon" href="/mazad-icon.png" sizes="512x512">
<link rel="apple-touch-icon" href="/mazad-icon.png">
<style>
@font-face { font-family: 'ThmanyahSans'; src: url('/fonts/thmanyah-Light.otf')   format('opentype'); font-weight: 300; font-display: swap; }
@font-face { font-family: 'ThmanyahSans'; src: url('/fonts/thmanyah-Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'ThmanyahSans'; src: url('/fonts/thmanyah-Medium.otf')  format('opentype'); font-weight: 500 600; font-display: swap; }
@font-face { font-family: 'ThmanyahSans'; src: url('/fonts/thmanyah-Bold.otf')    format('opentype'); font-weight: 700 900; font-display: swap; }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* عنابي وذهبي — the brand. Green is kept ONLY as a success signal
     (تم البيع, an approved sum), never as a surface, so the two never read
     as the same thing. */
  /* ===== أبو شادن =====
     Every colour below was MEASURED out of his logo, not picked by eye:
     its gold sits on one hue (37°) from #aa7620 through #bd7803 to #da9724,
     its ink is #090909, and its highlight #e6d09f is the «كريمي» he asked
     for — so the cream did not have to be invented, it is already his.
     The surface scale keeps that 37° warmth in the blacks, which is what
     stops the gold reading as a sticker laid on a neutral grey. */
  --wine-900:  #0a0908;   /* الأسود الأساسي */
  --wine-800:  #15120d;
  --wine-700:  #211c14;
  --wine-600:  #2e2718;
  --wine-500:  #3f3520;
  --gold-500:  #bd7803;   /* أكثر ذهبي تكراراً في شعاره */
  --gold-400:  #da9724;   /* أفتح ٢٥٪ من ذهبه */
  /* زيتي — the third brand colour. Deep and desaturated, so it reads as a
     dark surface beside the burgundy, never as the success green: the
     stamp on a sold lot is --ok-600, which is bright and saturated. The two
     must not converge, or "تم البيع" stops meaning anything. */
  /* the band at the foot of the broadcast card. On مزاد أبو شادن it is olive;
     here it is his own bronze, so the card closes on the logo's colour. */
  --olive-900: #4a2f02;
  --olive-800: #6b4404;
  --olive-700: #8c5a05;
  --olive-600: #bd7803;
  /* Success, and only success. These two were written as var(--ok-700) /
     var(--ok-600) — a variable defined as itself, which is invalid, so every
     green on the site resolved to TRANSPARENT: the تم البيع stamp, the ✔ on
     an approved sum and the confirm button all lost their colour silently. */
  --ok-700:    #14603a;
  --ok-600:    #1f7a4d;
  --ink:       #1a1510;
  --muted:     #7a6f5e;
  --line:      #eae3d6;
  --bg:        #faf7f0;   /* «أبيض درجة كريمي» — الخلفية */
  --card:      #ffffff;
  --danger:    #c0392b;
  --radius:    16px;
  --shadow:    0 2px 14px rgba(42, 8, 18, .08);
  --shadow-lg: 0 14px 40px rgba(42, 8, 18, .20);
}

html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'ThmanyahSans', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100dvh;
  overflow-wrap: break-word;
  /* ---------- the typeface was right, the SETTINGS were not ----------
     The family and all three faces were already loading — verified against
     the live site, which serves the real OTF. What was missing is everything
     style.css wraps around it on the rest of the site, and every line of it
     changes how Arabic actually draws:
       · font-synthesis: none — without it a weight the family does not have
         is FAKED by smearing the outline, which is what made the text read as
         a different, mushier font at 800 and 900.
       · 'calt', 'liga' and 'kern' are the contextual joins and spacing
         Arabic depends on.
     style.css also turns on 'ss01' and 'salt', Thmanyah's stylistic
     alternates, and those are deliberately NOT here: rendered side by side
     they extend the tails of final letters — «عرضـــ», «بيـــن» — which
     suits a 2.4rem marketing headline and looks ragged in a 0.78rem footer,
     which is most of this page. Turn them on only if the whole page is
     re-typeset for them. */
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
  font-synthesis: none;
  font-feature-settings: 'calt' 1, 'liga' 1, 'kern' 1;
  font-variant-ligatures: common-ligatures contextual;
}
/* The plate is the one thing that must NOT wear the brand face — a real plate
   is set in a plain grotesque, and its own rule below says so. */
button, input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; }

/* numbers stay LTR inside RTL text */
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ---------- layout ---------- */
.wrap { max-width: 720px; margin: 0 auto; padding: 0 14px 120px; }

/* ---------- the olive has to be on the MAIN page too ----------
   «الصفحة الرئيسية ليش كلها عنابي ما فيها ولا لون زيتي» — and he was right:
   every olive pass so far had been spent on the broadcast card. Here the one
   olive stop sat at **-10%**, which is off the canvas entirely, so the header
   rendered as plain burgundy and nothing else on the page carried it at all.
   The stop starts at 0 now and the olive reaches a fifth of the way in, so
   the bar actually reads burgundy-into-olive the way the card does. */
.topbar {
  background: linear-gradient(115deg, var(--olive-800) 0%, var(--olive-900) 12%,
                                      var(--wine-900) 34%, var(--wine-700) 68%, var(--wine-600));
  color: #fff;
  padding: 14px 0 18px;
  box-shadow: var(--shadow);
  border-bottom: 2px solid var(--olive-700);
  position: sticky; top: 0; z-index: 40;
}
.topbar .wrap { padding-bottom: 0; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
  color: var(--wine-900); font-weight: 900; font-size: .92rem;
  display: grid; place-items: center;
}
.brand-name { font-weight: 700; font-size: 1.1rem; line-height: 1.2; }
.brand-sub  { font-size: .72rem; opacity: .8; }

.chip-name {
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25);
  color: #fff; padding: 7px 12px; border-radius: 999px;
  font-size: .82rem; font-weight: 600; max-width: 140px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip-name:active { transform: scale(.97); }

.banner {
  margin: 10px 0 0; padding: 9px 12px; border-radius: 12px;
  background: rgba(255,255,255,.12); font-size: .78rem; line-height: 1.5;
}
.banner b { color: var(--gold-400); }

/* ---------- the three doors ---------- */
/* «ابي تضيف بالصفحه الرئيسيه اعلى الصفحه 3 ايقونات: عرض / طلب / مزايده».
   They replace the single «اعرض في المزاد» button, which only ever covered
   one of the three, and left the other two with nowhere to start. */
.doors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
.door {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 13px 6px 11px; border-radius: 16px; text-align: center;
  background: linear-gradient(170deg, #fff, #fbf7f3);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.door-i {
  font-size: 1.5rem; line-height: 1;
  /* the icon sits in an olive disc — small, repeated three times across the
     top of the page, which is what makes the colour register as the site's */
  width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 2px;
  border-radius: 50%; background: rgba(62,77,47,.1);
  border: 1.5px solid rgba(62,77,47,.3);
}
.door-t { font-size: 1rem; font-weight: 900; color: var(--wine-700); }
.door-s { font-size: .66rem; color: var(--muted); line-height: 1.45; }
.door:active { transform: scale(.97); }
/* the one that lists a lot is the one he wants pressed */
#doorSell { border-color: var(--gold-500); background: linear-gradient(170deg, #fffaf0, #fdf1dc); }
#doorSell .door-i { background: rgba(218,151,36,.18); border-color: rgba(218,151,36,.55); }

/* ---------- toolbar ---------- */
/* two rows now — the section, then how far along — so each gets its own line
   rather than sharing one and cutting the last chip off */
.toolbar { display: flex; flex-direction: column; gap: 8px; align-items: stretch; margin: 16px 0 12px; }
/* CENTRED, not packed against the right edge. On an RTL page a flex row
   starts at the right, so both rows sat in the corner with the rest of the
   line empty — «فوق ليه محاذاه كله يمين». They are the first thing a visitor
   uses, so they are centred and they wrap rather than scroll away. */
.filters { display: flex; gap: 8px; flex: 1; flex-wrap: wrap;
  justify-content: center; }
.filter { flex: none; }   /* never squeeze a chip until its label wraps */
.filter {
  padding: 9px 18px; border-radius: 999px; background: #fff;
  border: 1px solid var(--line); font-size: .92rem; font-weight: 700;
  color: var(--muted); white-space: nowrap;
}
/* the section row is the bigger of the two — it is the choice that matters */
.filters.kinds .filter { padding: 11px 22px; font-size: 1rem; }
.filter.on { background: var(--wine-700); border-color: var(--wine-700); color: #fff; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: .95rem;
  background: var(--wine-600); color: #fff; transition: transform .08s, filter .15s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-gold  { background: linear-gradient(135deg, var(--gold-500), #c2892b); color: #2a1c02; }
.btn-ghost { background: #fff; color: var(--wine-700); border: 1px solid var(--line); }
.btn-sm    { padding: 8px 12px; font-size: .82rem; border-radius: 10px; }
.btn-block { width: 100%; }

/* ---------- cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
}
/* ---------- the list is TWO PLATES ACROSS ----------
   «الوحات تصغرها شوي — تكون لوحتين جنب بعض». One plate to a row made each
   one enormous and the queue three screens long; a plate is recognisable at
   half that. A grid rather than a fixed pair, so a phone gets two, a laptop
   gets four, and a very narrow phone still gets one legible card instead of
   two unreadable ones. */
/* 158px is measured, not picked: .wrap gives 402px of content at a 430px
   phone and 332px at a 360px one, so two columns and a 10px gutter clear it
   at both — which is the point, since a 360px phone is most of them. */
#lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  gap: 10px; align-items: start; }
#lots > .card { margin-bottom: 0; }
/* ---------- only CARDS are columns; everything else spans the row ----------
   The banner was given the span by name, and the empty state was not — so
   «ما فيه لوحات هنا» landed in the first 158px cell, which on an RTL page is
   the far right, and read as a stray note in the corner of an empty screen.
   Written as "not a card" rather than by name, so the next thing added to
   this list cannot repeat it. */
#lots > :not(.card) { grid-column: 1 / -1; }
@media (max-width: 329px) { #lots { grid-template-columns: 1fr; } }
/* at two across a card has half the room, so it spends less of it on padding */
@media (max-width: 560px) {
  #lots > .card { padding: 8px; }
  #lots .lot-top { gap: 5px; margin-bottom: 7px; }
  #lots .badge { font-size: .62rem; padding: 3px 7px; }
  #lots .phone-plate { padding: 7px 5px; }
  #lots .lot-foot { font-size: .68rem; }
  #lots .btn-sm { padding: 7px 8px; font-size: .74rem; }
  #lots .lot-stats { gap: 5px; margin-top: 9px; }
  #lots .stat { padding: 6px 4px; }
  #lots .stat-k { font-size: .6rem; white-space: nowrap; }
  #lots .stat-v { font-size: .84rem; white-space: nowrap; }
  /* «على الهواء» is two words and wrapped the badge row in half a card */
  #lots .badge.air { font-size: .58rem; padding: 3px 6px; }
}
.lot { display: block; width: 100%; text-align: right; }
.lot-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.badge {
  font-size: .7rem; font-weight: 700; padding: 4px 9px; border-radius: 999px;
  background: #f4f0e6; color: var(--wine-700);
}
.badge.live   { background: #fdf3dd; color: var(--wine-600); }
.badge.sold   { background: #fdf0e6; color: #b5651d; }
.badge.ended  { background: #f0f2f1; color: var(--muted); }
.badge.unsold { background: #fdecea; color: #c0392b; }
.badge.wait   { background: #eef2f7; color: #4a6b8a; }
.badge.air    { background: #ffe9e7; color: #c0392b; }
.badge.hid    { background: #f3edee; color: var(--wine-600); }
.badge.dot::before {
  content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; margin-inline-end: 5px; vertical-align: middle;
  animation: pulse 1.4s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

.phone-plate {
  background: linear-gradient(135deg, var(--wine-900), var(--wine-700));
  color: #fff; border-radius: 14px; padding: 14px 12px; text-align: center;
  border: 2px solid var(--gold-500);
}
.phone-digits {
  font-size: clamp(1.35rem, 6.6vw, 2.4rem); font-weight: 900; letter-spacing: .04em;
  direction: ltr; unicode-bidi: isolate; white-space: nowrap;
}
.phone-carrier { font-size: .72rem; opacity: .85; margin-top: 2px; }

.lot-stats { display: flex; gap: 8px; margin-top: 12px; }
/* a faint olive wash — the same hue as the header, at a tenth of the weight,
   so the cards belong to the same site rather than being plain white boxes */
.stat { flex: 1; background: #f7f8f3; border: 1px solid #e4e6dc; border-radius: 12px; padding: 8px 6px; text-align: center; }
.stat-k { font-size: .68rem; color: var(--muted); }
.stat-v { font-weight: 800; font-size: .98rem; }
.stat-v.price { color: var(--wine-600); }
.stat-v.time  { color: #b5651d; }
.stat-v.over  { color: var(--muted); }

.lot-foot { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: .78rem; color: var(--muted); }

.empty { text-align: center; padding: 48px 16px; color: var(--muted);
  max-width: 340px; margin: 0 auto; line-height: 1.9; }
.empty-emoji { font-size: 2.4rem; }

/* ---------- detail ---------- */
.backlink { display: inline-flex; align-items: center; gap: 6px; margin: 14px 0 10px; font-size: .9rem; font-weight: 600; color: var(--wine-700); }

.price-hero { text-align: center; padding: 6px 0 2px; }
.price-hero .k { font-size: .78rem; color: var(--muted); }
.price-hero .v { font-size: clamp(1.8rem, 9vw, 2.6rem); font-weight: 900; color: var(--wine-600); }
.price-hero .who { font-size: .82rem; color: var(--muted); }

.countdown {
  text-align: center; font-weight: 900; font-size: 1.6rem; letter-spacing: .04em;
  direction: ltr; unicode-bidi: isolate; color: var(--wine-800);
}
.countdown.warn { color: var(--danger); animation: pulse 1s infinite; }

/* chat feed */
.feed { max-height: 46vh; overflow-y: auto; padding: 4px 2px; display: flex; flex-direction: column; gap: 8px; }
.feed .bid-row:first-child { box-shadow: var(--shadow); }
.msg { display: flex; flex-direction: column; max-width: 84%; }
/* RTL chat: my own bids sit on the left, everyone else's on the right */
.msg.mine { align-self: flex-end; }
.msg:not(.mine) { align-self: flex-start; }
.msg.mine .msg-meta { text-align: left; }
.msg-bubble {
  background: #f6f2e8; border: 1px solid var(--line); border-radius: 14px;
  padding: 8px 12px; font-weight: 700;
}
.msg.mine .msg-bubble { background: var(--wine-600); border-color: var(--wine-600); color: #fff; }
.msg.top .msg-bubble  { background: #fff7e8; border-color: var(--gold-500); color: #7a4f05; }
.msg.mine.top .msg-bubble { background: linear-gradient(135deg, var(--gold-500), #c2892b); color: #2a1c02; }
.msg-meta { font-size: .68rem; color: var(--muted); padding: 0 6px; }
.msg-amount { font-size: 1.05rem; }

.bidbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 30;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.bidbar .inner { max-width: 720px; margin: 0 auto; }
.quick { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: 7px 12px; font-size: .82rem; font-weight: 700; white-space: nowrap; color: var(--wine-700);
}
.bid-wait {
  background: #fffaf0; border: 1px solid #f0dcb0; color: #7a4f05;
  border-radius: 10px; padding: 7px 10px; margin-bottom: 8px;
  font-size: .8rem; font-weight: 600; text-align: center;
}
.bid-now { text-align: center; font-size: .88rem; color: var(--muted); margin-bottom: 8px; }
.bid-now b { color: var(--wine-600); font-size: 1.15rem; }
.bid-or { text-align: center; font-size: .75rem; color: var(--muted); margin: 9px 0 6px; }
#btnQuick { font-size: 1.02rem; padding: 14px; }
.bidrow { display: flex; gap: 8px; }
.bidrow input {
  flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  background: #fff; font-weight: 700; direction: ltr; text-align: right;
}
.bidrow input:focus { outline: 2px solid var(--wine-500); outline-offset: -1px; }

/* ---------- forms / modal ---------- */
.sheet-bg {
  position: fixed; inset: 0; background: rgba(5,48,29,.45); z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
}
/* ---------- a sheet on the broadcast screen opens IN THE STRIP ----------
   He films this screen with his only device. A centred modal here lands on
   camera, covers the auction, and tells every viewer that a number is being
   typed in by hand. So while he is on /live with the strip open, his sheets
   rise inside the strip instead — past the dashed edge, where the camera is
   not pointing, and the stage behind them never dims.
   Only above 900px, because that is where the strip rides alongside; on a
   phone the strip is stacked below and nothing is being filmed. */
@media (min-width: 900px) {
  .sheet-bg.in-ops {
    inset: 0 0 0 auto; width: 292px; background: transparent;
    align-items: stretch; pointer-events: none;
  }
  .sheet-bg.in-ops .sheet {
    pointer-events: auto; max-width: none; max-height: 100dvh;
    border-radius: 14px 0 0 14px; padding: 14px 12px 18px;
    border: 2px dashed var(--gold-500); border-right: 0; animation: none;
  }
  .sheet-bg.in-ops .sheet h2 { font-size: 1rem; }
  .sheet-bg.in-ops .sheet .hint { font-size: .74rem; margin-bottom: 10px; }
  .sheet-bg.in-ops .row2 { grid-template-columns: 1fr; }
}
.sheet {
  background: #fff; width: 100%; max-width: 720px; max-height: 92dvh; overflow-y: auto;
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-lg); animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6 } to { transform: none; opacity: 1 } }
/* the arrow sits above the heading and is full-height-tappable — he reaches
   for it with a thumb, on camera, without looking */
.sheet-back {
  display: inline-flex; align-items: center; gap: 6px;
  margin: -4px 0 10px -8px; padding: 8px 10px; border-radius: 10px;
  font-size: .9rem; font-weight: 700; color: var(--wine-700);
  background: #f6f1f2;
}
.sheet-back:active { transform: scale(.97); }
.sheet h2 { font-size: 1.15rem; margin-bottom: 4px; }
.sheet .hint { font-size: .8rem; color: var(--muted); margin-bottom: 14px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: .82rem; font-weight: 700; margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fdfbf6;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--wine-500); outline-offset: -1px; background: #fff; }
.field .sub { font-size: .72rem; color: var(--muted); margin-top: 4px; }
.field.ltr input { direction: ltr; text-align: right; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; }

.err { background: #fdecea; color: var(--danger); border-radius: 10px; padding: 9px 12px; font-size: .83rem; margin-bottom: 10px; }

.toast {
  position: fixed; inset-inline: 0; bottom: 96px; z-index: 90;
  display: flex; justify-content: center; pointer-events: none;
}
.toast div {
  background: var(--wine-900); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: .86rem; font-weight: 600; box-shadow: var(--shadow-lg); max-width: 90%;
}

.adminbar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.adminbar button { font-size: .75rem; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-weight: 700; }
.adminbar .del { color: var(--danger); border-color: #f3c6c1; }

/* ---------- the result is the owner's own stamp artwork ----------
   `mazad-stamp-*.png` is a mark he supplied: a double ring with stars, and a
   banner cut through it at an angle for the words. **Nothing here draws a
   ring, a star or a banner — do not "improve" it, redraw it or swap it for
   SVG.** The three files are the SAME image byte for byte in their alpha
   channel; only the ink colour differs, which is the one change he asked for
   («بس غير اللون عند البيع اخضر»). Re-colour by replacing RGB and keeping
   every alpha value, or the anti-aliased edges of his artwork are lost.

   The banner's interior is TRANSPARENT in his file, not white — over a plate
   it would show the plate through the words. So a white rectangle is laid
   UNDER the image at the banner's measured position, and his red outline
   draws on top of its edges.

   Geometry measured off the 360x360 file, by ink:
     angle  -15.03deg        banner height   64.5px = 17.9%
     centre 50.5% / 52.2%    banner length  305.8px = 85%
   Replacing the artwork means re-measuring all four. */
.plate-stamp { position: relative; display: block; container-type: inline-size; }
.stamp {
  position: absolute; inset: 0; margin: auto;
  /* the plate is 5.09:1, so 196% of its height is about 38% of its width —
     the mark lands across the middle of the plate, not on the emblem */
  height: 196%; aspect-ratio: 1;
  pointer-events: none; container-type: inline-size;
  filter: drop-shadow(0 4px 14px rgba(0,0,0,.3));
}
.stamp .st-mark {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; display: block;
}
/* the white fill and the words share one placement, so they cannot drift */
.stamp .st-band, .stamp .st-txt {
  position: absolute; left: 50.5%; top: 52.2%;
  width: 84%; height: 17.9%;
  transform: translate(-50%, -50%) rotate(-15.03deg);
}
.stamp .st-band { background: #fff; }
.stamp .st-txt {
  display: grid; place-items: center; white-space: nowrap;
  font-weight: 900; letter-spacing: -.02em; line-height: 1;
  /* MEASURED, and capped by the banner's HEIGHT rather than its length: the
     banner is 17.9% of the mark tall, so anything over ~13.5cqw starts
     clipping the tall letters however short the word is. At 13.2 the longest
     result, «لم يتم البيع», fills about three quarters of the banner and the
     short ones stay short — which is what a real stamp does. */
  font-size: 13.2cqw;
}
/* MEASURED, not picked by eye: on the banner's white these two land at the
   same 5.04:1, so «تم البيع» and «لم يتم البيع» read at identical strength on
   a stream. A brighter green was tried first and came in at 3.49 — legible on
   a monitor, not through a phone camera. The green's hue is 147, the same
   blue-green family as --ok-600, so green still means exactly one thing. */
.stamp.sold      { color: #07803e; }
.stamp.unsold    { color: #e00000; }
.stamp.cancelled { color: #6b7b73; }

.plate-wrap { position: relative; }

/* a sum on a number's page: paddle, who raised it, how much */
.bid-row {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-radius: 14px;
  padding: 8px 12px; background: #fff;
}
.bid-row.top { border-color: var(--gold-500); background: #fffaf0; }
.bid-row .paddle { width: 74px; flex: none; }
.bid-who { flex: 1; min-width: 0; }
.bid-who b { display: block; font-size: .9rem; }
.bid-who span { font-size: .72rem; color: var(--muted); }
.bid-amt { font-weight: 900; font-size: 1.05rem; color: var(--wine-600); }
.bid-row.top .bid-amt { color: #a9741d; }

/* the same paddles, big, on the broadcast screen */
/* The gap has to clear the FOREARM, so it scales with the card. Not cqw:
   .live is not a container, and cqw with no container ancestor falls back to
   the viewport — a gap that changes with the window instead of the card. A
   percentage gap in flexbox resolves against the flex container itself. */
.live-paddles { display: flex; gap: 5%; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.lp { width: 88px; text-align: center; }
.lp.top { width: 112px; }
/* .paddle carries container-type: inline-size, which contains its own inline
   size — so a shrink-to-fit .paddle has NO width to shrink to and collapses to
   0x0. The feed sets width: 74px and works; the broadcast never set one, so
   every paddle on camera was invisible and nothing failed. Any new place a
   paddle is drawn must give it a width. */
.lp .paddle { width: 100%; }
.lp-name { font-size: .7rem; color: #f0dde2; margin-top: 4px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.lp.top .lp-name { color: var(--gold-400); font-weight: 700; }

/* ---------- the raised paddle ---------- */
/* The hand and board are the supplied artwork (mazad-paddle.png). Only the
   number is ours — nothing here draws a hand. The art is framed to the board,
   the fist and a short forearm, which is the framing the owner chose. The
   board sits at 36.02% / 20.30% of that frame, is 64.10% of its width and
   leans -7.2deg — all measured off the file, so the number sits square on the
   board. Re-measure all four if the art or its framing changes. */
.paddle { position: relative; display: inline-block; line-height: 0;
  container-type: inline-size; }
.paddle img { width: 100%; height: auto; display: block; }
.paddle .p-amt {
  position: absolute; left: 36.02%; top: 20.30%; width: 58%;
  transform: translate(-50%, -50%) rotate(-7.2deg);
  text-align: center; line-height: 1; white-space: nowrap;
  font-weight: 900; color: #241d12; letter-spacing: -.02em;
  font-size: 11px;                       /* fallback: no container queries */
}
/* the board is a fixed share of the paddle, so the number is sized against the
   paddle itself — one rule instead of a size per screen — and shrinks as the
   sum gets longer so 1,250,000 still fits on the same board */
@supports (font-size: 1cqw) {
  .paddle .p-amt { font-size: calc(var(--fs, 17) * 1cqw); }
}
.paddle.top  .p-amt { color: #7a5205; }
.paddle.mine .p-amt { color: var(--ok-700); }
.paddle.raise { animation: raise .5s cubic-bezier(.2,.9,.3,1.35); transform-origin: 50% 100%; }

@keyframes raise {
  from { transform: translateY(30px) rotate(-7deg); opacity: 0 }
  60%  { transform: translateY(-3px) rotate(2deg);  opacity: 1 }
  to   { transform: none; opacity: 1 }
}

/* ---------- private control panel ---------- */
.ctl-q { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; margin-bottom: 6px; }
.ctl-q b { font-size: 1rem; }
.ctl-q span { flex: 1; font-size: .78rem; color: var(--muted); }
.ctl-q button { background: var(--wine-600); color: #fff; border-radius: 9px; padding: 7px 13px; font-size: .78rem; font-weight: 800; }
.ctl-q button.del { background: #fdecea; color: var(--danger); border: 1px solid #f3c6c1; padding: 7px 10px; }

/* the operator bar on a light card */
.opbar.light { border-top: none; padding-top: 0; }
.opbar.light .lbl { color: var(--muted); }
.opbar.light button { background: #f6f2e8; color: var(--ink); border: 1px solid var(--line); }
.opbar.light button.sold   { background: var(--ok-600); border-color: var(--ok-600); color: #fff; }
.opbar.light button.unsold { background: #c0392b; border-color: #c0392b; color: #fff; }
.opbar.light button.start  { background: var(--ok-600); border-color: var(--ok-600); color: #fff; }
.opbar.light button.next   { background: linear-gradient(135deg,#f0dcae,#da9724); color: #2a1c02; border-color: transparent; }

.pill { background: var(--danger); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: .74rem; }
.ctl-bid {
  display: flex; align-items: center; gap: 8px; border: 1px solid #f0dcb0;
  background: #fffaf0; border-radius: 12px; padding: 9px 11px; margin-bottom: 6px;
}
.ctl-bid .who { min-width: 84px; max-width: 110px; }
.ctl-bid .who b { display: block; font-size: .9rem; }
.ctl-bid .who span { font-size: .7rem; color: var(--muted); }
.ctl-bid .amt { font-weight: 900; font-size: 1.05rem; color: var(--wine-700); }
.ctl-bid button { border-radius: 10px; padding: 8px 12px; font-size: .95rem; font-weight: 900; }
.ctl-bid button.yes { background: var(--ok-600); color: #fff; }
.ctl-bid button.no  { background: #fdecea; color: var(--danger); border: 1px solid #f3c6c1; }
.ctl-bid.ok   { border-color: #bfe3cd; background: #f3fbf6; }
.ctl-bid.thin { border-color: #f0dcb0; background: #fffaf0; }
.ctl-bid.low  { border-color: #f3c6c1; background: #fdf3f2; }
.ctl-bid .cmp { flex: 1; min-width: 0; text-align: center; }
.ctl-bid .who .wa { display: inline-block; font-size: .76rem; color: var(--ok-700);
  font-weight: 700; text-decoration: none; direction: ltr; unicode-bidi: isolate; }
.ctl-bid .who .sub-muted { font-size: .74rem; color: var(--muted); }
.cmp-line { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.cmp-now { color: var(--muted); font-weight: 700; font-size: .92rem; }
.cmp-arrow { color: var(--muted); font-size: .8rem; }
.cmp-note { font-size: .7rem; color: var(--muted); margin-top: 2px; }
.ctl-bid.ok  .cmp-note { color: var(--ok-600); }
.ctl-bid.low .cmp-note { color: var(--danger); }
.ctl-bid button.yes[disabled] { opacity: .35; }
.ctl-bid.done { background: #f4f9f6; border-color: var(--line); }
.ctl-bid.done .amt { color: var(--wine-600); }
/* ---------- live broadcast screen ---------- */
.live {
  /* ---------- the olive band is real, it just climbs less far ----------
     Three goes at this. It started at 78%, which put olive across the whole
     lower half and stopped the card reading as burgundy («كبرته مرره»).
     Removing it went too far the other way — «لاتخفي الزيتي خليه مثل ماهو».
     So the band is back as it was, only shorter: burgundy holds to 62%, the
     olive is unmistakably itself by 88%, and the card still closes on
     --olive-900. Moving that 88% is the one knob — lower it and the olive
     climbs, raise it and it retreats to a hairline. */
  /* «اسود كامل بدون تدرج» — flat black, on purpose. مزاد سوم's card is a
     burgundy-to-olive gradient; his is one ink. On camera a flat field is
     also the safer choice: a gradient banded visibly on a phone recording a
     laptop, and the plate and the paddles are what the viewer should read,
     not the background. The gold lives on the frame, the price and the bar
     at the foot instead. */
  background: var(--wine-900);
  border-radius: 20px; padding: 16px 14px 20px; color: #fff; margin-top: 14px;
  border: 2px solid rgba(218,151,36,.45); box-shadow: var(--shadow-lg);
}
.live-head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  padding-bottom: 8px; border-bottom: 1.5px solid rgba(189,120,3,.45);
}
/* a held clock reads as held at a glance — amber, not the running white */
.live-clock.held, .countdown.held, .stat-v.time.held { color: var(--gold-400); }
.stat-v.time.held { color: #9a6b12; }
.live-dot {
  background: var(--gold-500); color: #3a1208; font-size: .75rem; font-weight: 800;
  padding: 4px 11px; border-radius: 999px;
}
.live-dot::before {
  content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: #c0392b; margin-inline-end: 6px; vertical-align: middle; animation: pulse 1.1s infinite;
}
.live-seq { font-size: .78rem; color: #d9cdb4; }
/* the auction's name, on camera. Gold on burgundy is the brand's own pairing,
   and it is the largest thing in the head on purpose — a stream has no tab
   title and no address bar. */
.live-brand { display: grid; line-height: 1.15; }
.live-brand b {
  font-size: 1.5rem; font-weight: 900; letter-spacing: -.01em;
  background: linear-gradient(100deg, var(--gold-400), var(--gold-500));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.live-brand .lb-sub { font-size: .7rem; color: #dcc9a6; font-weight: 700; }

.live-plate {
  background: #fff; color: #1a1510; border-radius: 16px; border: 3px solid var(--gold-500);
  padding: 16px 10px; text-align: center; position: relative; overflow: hidden;
}
.live-digits {
  font-size: clamp(1.5rem, 8vw, 3.4rem); font-weight: 900; letter-spacing: .03em;
  direction: ltr; unicode-bidi: isolate; line-height: 1.1;
  white-space: nowrap;   /* 054 677 7501 must never break across two lines */
}
.live-note { font-size: .82rem; color: #7a5c24; }

.live-clock {
  text-align: center; font-weight: 900; font-size: clamp(2.6rem, 15vw, 5rem);
  letter-spacing: .04em; direction: ltr; unicode-bidi: isolate; line-height: 1.1;
  margin: 10px 0 2px; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,.35);
}
.live-clock.warn { color: #ffd166; }
.live-clock.over { color: #f0dcae; font-size: clamp(1.6rem, 8vw, 3rem); }

.live-price { text-align: center; }
.live-price .k { font-size: .82rem; color: #e0cfa8; }
.live-price .v {
  font-size: clamp(2rem, 11vw, 3.4rem); font-weight: 900;
  background: linear-gradient(160deg,#f0dcae,#da9724 45%,#bd7803);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  direction: ltr; unicode-bidi: isolate;
}
.live-price .who { font-size: 1rem; font-weight: 700; color: #f5ecd9; }

.live-bids { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.live-bids span {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px; padding: 5px 11px; font-size: .8rem; font-weight: 700;
}
.live-bids span.top { background: rgba(218,151,36,.92); color: #241802; border-color: transparent; }

/* ---------- the foot of the broadcast card ----------
   The site, the number and the commission, in ONE olive-framed bar. They were
   two stacked blocks and fell below the fold on a 900px screen — on the one
   screen that is filmed. The olive is the third brand colour doing real work
   here: it separates this bar from the burgundy card without using gold,
   which the price and the clock already own. */
/* Olive again, as it was — it separates this bar from the card without using
   gold, which the price and the clock already own. What changed instead is
   the SIZE of what is written in it: «العمولة كبر خطها شوي، ماهي واضحة بلوحة
   البث». This bar is the seller's terms and the viewer's way to call, read
   off a phone screen pointed at a laptop, so it is the last place to be
   saving a tenth of a rem. */
.live-bar {
  margin-top: 12px; display: grid; gap: 7px; text-align: center;
  background: linear-gradient(160deg, rgba(140,90,5,.60), rgba(26,17,3,.86));
  border: 2px solid #8c5a05;
  border-radius: 16px; padding: 12px 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.live-bar .lb-site { font-size: .92rem; color: #eae6dd; }
.live-bar .lb-site b { color: var(--gold-400); direction: ltr; unicode-bidi: isolate;
  display: inline-block; font-size: 1.05rem; }
/* the number sits in its own olive frame inside the bar */
/* the number is the one thing on the card a viewer is meant to ACT on, so it
   is the biggest thing in the bar and it keeps its own olive ring */
.live-bar .lb-tel {
  justify-self: center; border: 2px solid #8c5a05;
  background: rgba(26,17,3,.70); border-radius: 999px;
  padding: 6px 18px; font-size: .95rem; color: #eae6dd;
}
.live-bar .lb-tel b { color: var(--gold-400); font-weight: 900; font-size: 1.24rem;
  letter-spacing: .01em; }
/* the commission is the one thing a seller agrees to, so it is read, not skimmed */
.live-bar .lb-fee {
  font-size: .95rem; font-weight: 800; color: #f7efdd; line-height: 1.65;
  border-top: 1px dashed rgba(234,230,221,.3); padding-top: 8px;
}
.live-bar .lb-fee b { color: var(--gold-400); font-weight: 900; font-size: 1.04rem; }

/* The commission has to be readable on the broadcast without anyone
   scrolling — it only lived in the page footer, under the fold, so on camera
   it was never seen at all. */
.live-tel {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(218,151,36,.45);
  font-size: .86rem; color: #f3e3d0;
}
.live-tel b { color: var(--gold-400); font-weight: 900; font-size: 1rem; }

/* ---------- the stage fits the screen it is filmed on ----------
   A broadcast screen that has to be scrolled is a broken broadcast screen:
   whatever is below the fold is simply not on camera. The type that can
   shrink is sized against the viewport HEIGHT (dvh) rather than its width, so
   the whole card lands inside a 800px-tall window and still fills a 1080. */
@media (min-width: 900px) {
  .live-clock      { font-size: clamp(2.2rem, 7.4dvh, 5rem); margin: 6px 0 2px; }
  .live-clock.over { font-size: clamp(1.5rem, 4.4dvh, 3rem); }
  .live-price .v   { font-size: clamp(1.9rem, 6.2dvh, 3.4rem); line-height: 1.12; }
  .live-paddles    { margin-top: 8px; }
  .live .lp        { width: clamp(50px, 8.2dvh, 88px); }
  .live .lp.top    { width: clamp(64px, 10.4dvh, 112px); }
  .live-plate      { margin-bottom: 4px; }
  .carplate.big    { width: min(100%, 620px, 66dvh); }
  /* the site and the number share a line where there is room for them */
  .live-bar        { grid-template-columns: 1fr auto; align-items: center; }
  .live-bar .lb-fee { grid-column: 1 / -1; }
}
/* A laptop leaves about 760–800px once the browser chrome is taken out, and
   the card still has to END above the fold: everything below it is off
   camera, and what fell off was the number to call and the commission — the
   two things a seller actually agrees to. Every value here is a squeeze on
   something that can afford it; the plate, the clock and the price are not
   touched beyond what dvh already does. */
@media (min-width: 900px) and (max-height: 880px) {
  .live            { padding: 10px 12px 12px; }
  .live-head       { margin-bottom: 8px; padding-bottom: 6px; }
  .live-plate      { margin-bottom: 0; }
  .live-note       { margin-top: 4px; }
  .carplate.big    { width: min(100%, 620px, 60dvh); }
  .live-clock      { font-size: clamp(2rem, 6.6dvh, 5rem); margin: 4px 0 0; }
  .live-price .k   { font-size: .72rem; }
  .live-price .who { font-size: .86rem; }
  .live-auto       { margin-top: 4px; font-size: .78rem; }
  .live-paddles    { margin-top: 6px; }
  .live .lp        { width: clamp(44px, 7.4dvh, 88px); }
  .live .lp.top    { width: clamp(56px, 9.4dvh, 112px); }
  .lp-name         { font-size: .62rem; margin-top: 2px; }
  /* The bar gives up its PADDING on a short screen, not its type. The fee and
     the number are the two things he asked to be bigger because they were not
     readable on camera; shrinking them here would shrink them on exactly the
     laptop he films. The height comes out of the plate and the paddles
     instead, which can afford it. */
  .live-bar        { margin-top: 8px; padding: 8px 10px; gap: 4px; }
  .live-bar .lb-fee  { padding-top: 5px; font-size: .9rem; }
  .live-bar .lb-fee b { font-size: .98rem; }
  .live-bar .lb-site { font-size: .86rem; }
  .live-bar .lb-site b { font-size: .96rem; }
  .live-bar .lb-tel  { padding: 3px 14px; font-size: .88rem; }
  .live-bar .lb-tel b { font-size: 1.12rem; }
  .carplate.big    { width: min(100%, 620px, 55dvh); }
  .live-brand b    { font-size: 1.28rem; }
}
@media (min-width: 900px) and (max-height: 790px) {
  .carplate.big  { width: min(100%, 620px, 49dvh); }
  .live-paddles  { margin-top: 4px; }
  .live .lp      { width: clamp(40px, 6.2dvh, 88px); }
  .live .lp.top  { width: clamp(52px, 7.8dvh, 112px); }
  .live-bar      { margin-top: 6px; }
  .live-brand b  { font-size: 1.16rem; }
  .live-brand .lb-sub { font-size: .64rem; }
}

/* ---------- the publish / quick-add forms ---------- */
.seg {
  display: flex; gap: 6px; background: #f3edee; border-radius: 12px;
  padding: 4px; margin-bottom: 12px;
}
.seg button {
  flex: 1; border: 0; border-radius: 9px; padding: 10px 4px; cursor: pointer;
  background: transparent; color: var(--muted); font-weight: 800; font-size: .85rem;
}
.seg button.on { background: var(--wine-700); color: #fff; box-shadow: var(--shadow); }
.plate-picks { display: flex; gap: 6px; direction: rtl; }
.plate-picks select,
.plate-picks .letterbox {
  flex: 1; text-align: center; font-size: 1.15rem; font-weight: 800; padding: 10px 4px;
  min-width: 0;
}
/* typed, not picked — so it has to read like a plate cell and take one glyph */
.plate-picks .letterbox { text-transform: uppercase; caret-color: var(--wine-600); }
/* a key a plate cannot carry is refused OUT LOUD — silence reads as broken */
.plate-picks .letterbox.bad { animation: refuse .45s ease; }
@keyframes refuse {
  0%,100% { transform: translateX(0); border-color: var(--line); }
  15% { transform: translateX(-4px); border-color: var(--danger); }
  45% { transform: translateX(4px);  border-color: var(--danger); }
  75% { transform: translateX(-2px); border-color: var(--danger); }
}
.plate-picks .letterbox:focus {
  outline: 2px solid var(--wine-500); outline-offset: -1px; background: #fffdf7;
}
.plate-preview { margin: 4px 0 12px; }
.photo-prev:empty { display: none; }
.photo-prev img {
  display: block; width: 100%; max-height: 180px; object-fit: cover;
  border-radius: 12px; border: 1.5px solid var(--line); margin-bottom: 10px;
}

/* ---------- the Saudi car plate ----------
   Proportioned from the owner's reference rather than guessed: the plate is
   595x117 there, so 5.09:1, and the only full-height rules in it are the two
   borders and the one before the KSA strip. There is NO divider in the middle
   — what looked like one when measuring was the palm trunk of the emblem.
   Content sits at 2.7–21.5% (digits), 45–58% (emblem) and 75–91% (letters),
   with the KSA strip taking the last 6.5%. */
.carplate {
  position: relative; direction: ltr;
  aspect-ratio: 5.09 / 1;
  background: #fff; color: #10100f; border: 2px solid #15151a;
  border-radius: 10px; overflow: hidden; margin: 0 auto;
  width: min(100%, 380px);
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  container-type: inline-size;
}
/* Each block is pinned to the centre it has on the reference plate, rather
   than left to flex to distribute — flex put the emblem and the letters about
   six per cent too far left, because the blocks are not the widths flex
   assumes. Centres measured off the image: 12.1%, 51.5%, 82.9%. */
.cp-num, .cp-emblem, .cp-let {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
}
/* ---------- the content is SPREAD over the plate, not parked on it ----------
   Measured off a photograph of a real plate (the one the owner pointed at):
   the three digits sit at 11.9 / 20.7 / 29.5 percent of the plate's width and
   the three letters at 72.3 / 80.5 / 88.9, so each block is about 21% wide
   with a gap between glyphs roughly as wide as a glyph. The emblem spans
   42.5–60.3 and the KSA rule falls at 93.9.

   The blocks used to be pinned at 12.1 / 51.5 / 82.9 and left to shrink to
   fit, which on a three-letter plate drew both blocks about 13% wide: the
   letters bunched against the KSA strip and the middle of the plate sat
   empty. A plate is not a line of text with a lot of margin — the characters
   are laid out ACROSS it. */
.cp-num    { left: 20.8%; }
.cp-emblem { left: 51.4%; height: 84%; display: flex; align-items: center; justify-content: center; }
/* closer to the emblem than the measured 80.6% centre: the letters are the
   half of the plate that is read out loud, and a gap beside the emblem is the
   one thing he keeps pointing at. Three letters put the block at 66.5–90.5%,
   still clear of the KSA rule at 93.9. */
/* Three 10.2cqw slots is 30.6cqw, and this centre puts the block at
   62.0–92.6%. The zone it has to live in is only 33.7% wide — from the
   emblem's right edge at 60.2 to the KSA rule at 93.9 — so the slot width and
   this centre are solved together against those two walls. Widen one and the
   block touches the emblem; that is what a first pass at 11cqw did. */
.cp-let    { left: 77.3%; }
.cp-num, .cp-let { display: flex; flex-direction: column; align-items: center; line-height: 1.04; }
.cp-emblem img { max-width: 100%; max-height: 100%; object-fit: contain; display: block;
  width: 17.8cqw; }

/* A ZONE, and the characters spread across it. Letter-spacing cannot do this:
   it puts a fixed gap between glyphs, so a three-letter plate drew a narrow
   block that bunched against the KSA strip and left the middle of the plate
   empty — which is exactly what a real plate never looks like. With a fixed
   zone and space-between, one digit or four both fill the same area, the way
   they do on the road. */
.cp-ar, .cp-en {
  display: flex; justify-content: center; white-space: nowrap;
  font-weight: 800;
}
/* ---------- a plate is MONOSPACED, and that is the whole trick ----------
   Every character on a real plate sits in a slot of the same width, which is
   why a ه and a ا are the same distance apart as two digits, and why the
   Arabic row lines up over the Latin one. space-between across a fixed zone
   got three characters right and everything else wrong: two characters were
   thrown into opposite corners of the zone — «الرقمين كل واحد بزاويه» — and
   four overflowed. A fixed slot per character gives three the measured 24%
   of the plate, two a natural pair, and four an honestly wider block, the
   way it comes on the road. */
.cp-ar > span, .cp-en > span {
  display: inline-block; width: 8cqw; text-align: center;
}
/* ---------- the LETTERS need a wider slot than the digits ----------
   Measured, at one font size, in the plate's own face: the ten Arabic-Indic
   digits are all exactly 61.05 wide, while the seventeen plate letters run
   from ا at 34.3 to س at 138 — a **4x** spread. One slot width cannot serve
   both, and the digits' 8cqw slot left س overflowing it by 21px with only
   1.8px between one letter and the next, while the digits sat 18px apart.
   That is «تلزق لي الحروف في بعض»: the digits breathed and the letters were
   jammed together on the same plate.

   So the letter row gets its own slot, as wide as the gap between the emblem
   (ends 60.2%) and the KSA rule (93.9%) allows — three of them fill it — and
   its own slightly smaller size. Nothing touches now. */
.cp-let .cp-ar > span, .cp-let .cp-en > span { width: 10.2cqw; }
.cp-let .cp-ar { font-size: 7.6cqw; }
.cp-let .cp-en { font-size: 6.9cqw; }
/* Two letters are wide enough that even the wider slot cannot hold them with
   a gap worth the name. They are condensed a little — measured, and only
   these two: every other letter is drawn at its natural width. */
.cp-ar > span.wide  { transform: scaleX(.84); }
.cp-ar > span.wider { transform: scaleX(.80); }
.cp-ar { font-size: 8.3cqw; direction: rtl; }
/* Arabic-Indic digits are written LEFT to right — ٩٧٨ sits over 978 in the
   same order. Only the letters read right to left, so the rtl above belongs
   to .cp-let alone. */
.cp-num .cp-ar { direction: ltr; }
/* The Latin row on a real plate is a plain, medium-weight, slightly narrow
   face — not the heavy one the Arabic row carries. At 800 it read as a
   different, bolder plate than the reference. */
.cp-en { font-size: 7.2cqw; font-weight: 600; }
/* every row is centred now, so .one needs nothing of its own — the class is
   still emitted because the three-cell plates below use it */

/* ---------- نقل and صغيرة: three cells, country in the middle ----------
   Every number below is measured off the owner's reference images, the same
   way the خصوصي plate was: the dividers fall at 46.4%/60.7% on نقل and
   44.3%/62.0% on صغيرة, the ratios are 4.24 and 3.46, and the نقل middle cell
   samples as rgb(60,104,165). Replacing a reference means re-measuring. */
.carplate.cp3 {
  display: flex; align-items: stretch; gap: 0;
  padding: 1.1cqw; background: #e9e9e6;
}
.carplate.k-transport { aspect-ratio: 4.24 / 1; }
.carplate.k-small     { aspect-ratio: 3.46 / 1; }
.cp3 .c3 {
  border: .5cqw solid #15151a; border-radius: 1.6cqw; background: #ececea;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 0; overflow: hidden;
}
.cp3 .c3 + .c3 { margin-inline-start: .5cqw; }
.k-transport .c3-num { flex: 0 0 45.4%; }
.k-transport .c3-ksa { flex: 0 0 13.3%; }
.k-transport .c3-let { flex: 1 1 auto; }
.k-small .c3-num { flex: 0 0 43.3%; }
.k-small .c3-ksa { flex: 0 0 16.7%; }
.k-small .c3-let { flex: 1 1 auto; }

/* on نقل the side cells are split in two by a rule; on صغيرة they are not */
.cp3 .c3-r {
  flex: 1 1 0; width: 100%; display: flex; align-items: center;
  justify-content: center; padding: 0 4%;
  font-weight: 800; line-height: 1; white-space: nowrap; direction: ltr;
}
.cp3 .c3-r.c3-rtl { direction: rtl; }
/* monospaced slots here too, for the same reason as on خصوصي above */
.cp3 .c3-r > span { display: inline-block; text-align: center; }
.k-transport .c3-lat { border-top: .5cqw solid #15151a; }
.k-transport .c3-r        { font-size: 7.4cqw; }
.k-transport .c3-r > span { width: 8.4cqw; }
.k-transport .c3-lat      { font-weight: 600; }
.k-small     .c3-solo     { font-size: 11.5cqw; font-weight: 600; }
.k-small     .c3-solo > span { width: 13cqw; }

/* the country cell: نقل is the blue one — that is what names it on sight */
.cp3 .c3-ksa { gap: .3cqw; padding: .6cqw .2cqw; }
.cp3 .c3-emb { width: 62%; max-height: 42%; object-fit: contain; display: block; }
.cp3 .c3-ar { font-size: 2.5cqw; font-weight: 700; }
.cp3 .c3-en { font-size: 3.1cqw; font-weight: 800; letter-spacing: .1em; direction: ltr; }
.cp3 .c3-tri { font-size: 3.2cqw; line-height: .8; }
.k-transport .c3-ksa {
  background: rgb(60,104,165); color: #fff;
}
.k-transport .c3-emb { filter: brightness(0); }
.k-small .c3-ksa { background: #ececea; }

/* the strip is lifted whole out of the reference, border included */
.cp-ksa {
  position: absolute; top: 0; right: 0; height: 100%; width: auto;
  object-fit: contain; border-left: 2px solid #15151a; padding: 0 .4cqw;
}

/* on the broadcast it is the hero */
.carplate.big { width: min(100%, 620px); border-width: 3px; border-radius: 14px; }

/* A car lot. With a photo the picture is the object and the name sits under
   it; without one the name is all there is. */
.carcard { text-align: center; line-height: 1.25; }
.carcard .cc-photo {
  display: block; width: 100%; max-height: 210px; object-fit: cover;
  border-radius: 12px; border: 2px solid var(--gold-500); margin-bottom: 8px;
  background: #0000000d;
}
.carcard.big .cc-photo { max-height: 42vh; border-width: 3px; border-radius: 16px; }
.carcard .cc-make  { font-size: 1.5rem; font-weight: 900; }
.carcard .cc-model { font-size: 1.05rem; font-weight: 700; opacity: .92; }
.carcard .cc-year  { font-size: .95rem; font-weight: 800; opacity: .8; margin-top: 2px; }
.carcard.big .cc-make  { font-size: clamp(2rem, 7vw, 3.2rem); }
.carcard.big .cc-model { font-size: clamp(1.1rem, 4vw, 1.8rem); }
.carcard.big .cc-year  { font-size: clamp(1rem, 3vw, 1.4rem); }

.live-empty { text-align: center; padding: 26px 10px; }
.live-empty .t { font-size: 1.2rem; font-weight: 800; }
.live-empty .s { font-size: .86rem; color: #e3c3cc; margin-top: 4px; }

.queue { margin-top: 14px; }
.queue h3 { font-size: .84rem; color: #e3c3cc; margin-bottom: 7px; font-weight: 700; }
.queue .q {
  display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 9px 11px; margin-bottom: 6px;
}
.queue .q b { direction: ltr; unicode-bidi: isolate; font-size: 1rem; }
.queue .q span { flex: 1; font-size: .76rem; color: #d9cdb4; }
.queue .q button { background: var(--gold-500); color: #2a1c02; border-radius: 9px; padding: 6px 11px; font-size: .76rem; font-weight: 800; }

/* operator control bar */
.opbar { margin-top: 14px; border-top: 1px dashed rgba(255,255,255,.25); padding-top: 12px; }
.opbar .row { display: flex; gap: 6px; margin-bottom: 7px; flex-wrap: wrap; }
.opbar button {
  flex: 1; min-width: 74px; border-radius: 11px; padding: 11px 8px;
  font-size: .84rem; font-weight: 800; background: rgba(255,255,255,.14);
  color: #fff; border: 1px solid rgba(255,255,255,.2);
}
.opbar button.sold   { background: var(--ok-600); border-color: var(--ok-600); }
.opbar button.unsold { background: #c0392b; border-color: #c0392b; }
.opbar button.start  { background: var(--ok-600); border-color: var(--ok-600); }
.opbar button.next   { background: linear-gradient(135deg,#f0dcae,#da9724); color: #2a1c02; border-color: transparent; }
.opbar button.add    { background: rgba(255,255,255,.22); }
.opbar button.danger { background: rgba(192,57,43,.22); border-color: rgba(192,57,43,.5); }
.opbar.light button.danger { background: #fdecea; color: var(--danger); border-color: #f3c6c1; }
.opbar .lbl { font-size: .72rem; color: #e3c3cc; margin-bottom: 5px; }

.live-banner {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: right;
  background: linear-gradient(135deg, var(--wine-800), var(--wine-600));
  color: #fff; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px;
  box-shadow: var(--shadow); border: 1px solid rgba(218,151,36,.45);
}
.live-banner .n { flex: 1; font-weight: 900; font-size: 1.15rem; direction: ltr; unicode-bidi: isolate; text-align: center; }
.live-banner .go { background: var(--gold-500); color: #2a1c02; border-radius: 10px; padding: 7px 12px; font-size: .8rem; font-weight: 800; }

/* ---------- the broadcast screen and the operator's strip ---------- */
/* Laid out left-to-right on purpose: the stage is on the LEFT, where the
   camera points, and the strip is on the PHYSICAL RIGHT, outside the frame.
   Each child switches back to RTL for its own text. */
.live-split { direction: ltr; display: flex; flex-direction: column; }
.live-split > * { direction: rtl; }
.live-stage { flex: 1; min-width: 0; }
/* Narrow screen — a phone. It is not the screen being filmed (the camera
   points at the laptop), so the controls are not hidden here, they simply sit
   below the stage. Hiding them would leave a phone operator with no controls
   at all now that /control folds into this screen. */
.live-ops { display: none; }
.live-split.with-ops .live-ops { display: block; margin-top: 14px; }

/* only where there is genuinely room beside the stage — never on a phone,
   where it would end up in shot */
@media (min-width: 900px) {
  /* The strip is a FIXED rail on the right edge, not a column in the flow.
     Two reasons. A 100vw break-out is a pixel or two wider than the client
     area once a scrollbar exists, which gave the page a horizontal scrollbar
     and shifted the stage. And a column in the flow could only be as tall as
     the page, so its own scroll never reached the last queued number —
     top/bottom pin it to the viewport instead, and it scrolls to its end. */
  .live-split.with-ops .live-ops {
    display: block; position: fixed; top: 68px; bottom: 8px; right: 8px;
    width: 268px; margin: 0; z-index: 30;
    padding-left: 12px; padding-right: 2px;
    border-left: 3px dashed var(--gold-500);
    overflow-y: auto; overscroll-behavior: contain;
  }
  /* the rail is out of the flow, so the page is nudged clear of it by hand */
  body.ops-open { padding-right: 292px; }
}
/* The strip is only 268px, so anything laid out in a row there gets squeezed
   until the words break a letter per line. Stack instead. */
.live-ops .opbar .row button { min-width: 0; }
.live-ops .ops-card { padding: 8px; }
.live-ops .ctl-bid {
  display: grid; grid-template-columns: 1fr auto auto;
  grid-template-areas: "who who who" "cmp yes no";
  gap: 6px 8px; align-items: center;
}
.live-ops .ctl-bid .who { grid-area: who; min-width: 0; max-width: none;
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.live-ops .ctl-bid .cmp { grid-area: cmp; text-align: right; }
.live-ops .ctl-bid .cmp-line { justify-content: flex-start; }
.live-ops .ctl-bid button.yes { grid-area: yes; }
.live-ops .ctl-bid button.no  { grid-area: no; }
.live-ops .ctl-bid.done {
  grid-template-columns: 1fr auto; grid-template-areas: "who who" "amt no";
}
.live-ops .ctl-bid.done .amt { grid-area: amt; text-align: right; }
.live-ops .ctl-q { flex-wrap: wrap; }
/* a request is not a queued lot — gold edge, and the ✔ is the success green
   that already means «يعتمد» everywhere else on this page */
.ctl-q.req { border-color: var(--gold-400); background: #fffdf5; }
.ctl-q button.ok, .adminbar button.ok { background: var(--ok-600); color: #fff; }
.field label .opt { font-weight: 600; color: var(--muted); font-size: .76rem; }
.ops-warn {
  display: flex; align-items: center; gap: 8px;
  background: #fff3d6; border: 1px solid #f0d79a; color: #7a4f05;
  border-radius: 10px; padding: 7px 10px; font-size: .76rem; font-weight: 700;
  margin-bottom: 10px; line-height: 1.5;
}
.ops-fold {
  margin-inline-start: auto; border: 0; background: #f0d79a; color: #5a3a04;
  border-radius: 7px; width: 22px; height: 22px; flex: none; cursor: pointer;
  font-weight: 900;
}
.ops-card {
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; margin-bottom: 10px;
}
.ops-card:empty { display: none; }
.ops-h     { font-weight: 700; margin-bottom: 8px; font-size: .9rem; }
.ops-empty { text-align: center; color: var(--muted); font-size: .84rem; }
.ops-sub   { font-weight: 500; font-size: .74rem; color: var(--muted); }

/* ---------- correcting the lot while it is on air ----------
   He reads the plate off the seller's paper on camera and gets a letter
   wrong, or the seller corrects him mid-call. Re-listing would drop the sums
   and the clock, so the identity is edited here and the stage — the part the
   camera sees — repaints on the keystroke. Sized for the 268px strip. */
.ed-plate { display: grid; gap: 8px; margin-bottom: 10px; }
.ed-plate .plate-picks select { font-size: 1rem; padding: 8px 2px; }
.ed-plate input {
  width: 100%; text-align: center; font-size: 1.05rem; font-weight: 800;
  letter-spacing: .12em; direction: ltr;
}
/* نوع اللوحة — خصوصي / نقل / صغيرة */
.ed-kind { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.ed-kind button {
  border: 1.5px solid var(--line); background: #fff; border-radius: 9px;
  padding: 7px 2px; cursor: pointer; font-size: .76rem; font-weight: 800;
  color: var(--muted); min-width: 0;
}
.ed-kind button.on { border-color: var(--wine-600); background: #fdf3f5; color: var(--wine-700); }
.ed-emb.hidden { display: none; }
.ed-emb {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
}
.ed-emb button {
  border: 1.5px solid var(--line); background: #fff; border-radius: 9px;
  padding: 5px 2px 3px; cursor: pointer; display: grid; gap: 2px;
  justify-items: center; font-size: .6rem; font-weight: 700; color: var(--muted);
  line-height: 1.25; min-width: 0;
}
.ed-emb button img { width: 30px; height: 30px; object-fit: contain; }
.ed-emb button .none { width: 30px; height: 30px; display: grid; place-items: center;
  font-size: 1rem; color: var(--line); }
.ed-emb button.on { border-color: var(--gold-500); background: #fff9e8; color: var(--ink); }
.ed-err { color: #a3241c; font-size: .74rem; font-weight: 700; margin-top: 6px; }
.ed-err:empty { display: none; }
/* ---------- من نحن ---------- */
.ab-hero { text-align: center; padding: 10px 4px 18px; }
.ab-hero h1 {
  font-size: 1.9rem; font-weight: 900; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.ab-hero p { color: var(--muted); font-size: .95rem; max-width: 30rem; margin: 0 auto; }
.ab-card { margin-bottom: 14px; }
.ab-card h2 {
  font-size: 1.05rem; font-weight: 800; margin-bottom: 12px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line); color: var(--wine-700);
}
.ab-item {
  position: relative; padding-inline-start: 22px; margin-bottom: 12px;
  font-size: .9rem; line-height: 1.75;
}
.ab-item::before {
  content: '✓'; position: absolute; inset-inline-start: 0; top: 0;
  color: var(--ok-600); font-weight: 900;
}
.ab-item:last-child { margin-bottom: 0; }
.ab-item b { color: var(--ink); }
.ab-fee {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: .9rem;
}
.ab-fee:last-of-type { border-bottom: 0; }
.ab-fee span { color: var(--muted); text-align: start; }
.ab-note { font-size: .82rem; color: var(--muted); margin-top: 10px; line-height: 1.7; }
.ab-trust .ab-item::before { content: '•'; color: var(--gold-500); }
.ab-contact { text-align: center; }
.ab-contact h2 { text-align: start; }
/* The broadcast card already carries the contact number and the commission —
   the footer under it said both again, on camera, along with a «من نحن» link
   nobody watching a stream is going to click. One screen, one statement. */
body.on-air .foot { display: none; }
/* ...and the top bar's rule is page chrome, which the broadcast is not. It
   also bought back the 2px that pushed the commission one pixel below the
   fold on a 760px laptop — the card's budget there is that tight. */
body.on-air .topbar { border-bottom: 0; }
.foot-links { margin-bottom: 10px; }
.foot-links a { color: var(--wine-600); font-weight: 700; text-decoration: none; }

.ops-seg { margin-bottom: 10px; }
.ops-seg button { font-size: .74rem; padding: 8px 2px; }
.ops-seg.locked button:not(.on) { opacity: .45; }
.ed-done { color: var(--muted); font-size: .82rem; text-align: center; }

/* the way back once it is folded away, pinned to the far edge so it stays
   out of shot */
.ops-peek {
  position: fixed; top: 50%; right: 0; transform: translateY(-50%);
  z-index: 40; display: none; border: 0; cursor: pointer;
  background: var(--gold-500); color: #2a1c02; font-weight: 900;
  padding: 14px 6px; border-radius: 10px 0 0 10px; writing-mode: vertical-rl;
  font-size: .74rem; letter-spacing: .04em;
}
.ops-peek.on { display: block; }

.wait-note {
  background: #eef2f7; color: #3c5872; border: 1px dashed #c3d3e3;
  border-radius: 12px; padding: 10px 12px; margin-top: 12px;
  font-size: .84rem; text-align: center; line-height: 1.7;
}
.seller-note {
  margin: 10px auto 0; max-width: 34ch; padding: 9px 12px;
  background: #fffdf5; border: 1px solid var(--gold-400); border-radius: 12px;
  font-size: .82rem; line-height: 1.75; color: var(--ink); white-space: pre-wrap;
}
.auto-note {
  background: #fff3d6; color: #7a4f05; border: 1px solid #f0d79a;
  border-radius: 12px; padding: 9px 12px; margin-top: 12px;
  font-size: .84rem; text-align: center; line-height: 1.7; font-weight: 700;
}
.live-auto {
  margin: 8px auto 0; max-width: 520px; text-align: center;
  font-size: 1rem; font-weight: 800; color: #f6cf7a;
}
.fee {
  margin-top: 10px; padding: 8px 10px; border-radius: 10px; text-align: center;
  background: #fff8e9; border: 1px solid #f0dcb0; color: #7a4f05; font-size: .8rem;
}
.fee b { color: #6a4304; }
.fee span { opacity: .85; }
.fee-box {
  background: #fff8e9; border: 1px solid #f0dcb0; color: #7a4f05;
  border-radius: 12px; padding: 11px 13px; font-size: .82rem; line-height: 1.8; margin-bottom: 12px;
}
.foot-tel {
  display: inline-block; margin-bottom: 10px; padding: 8px 14px;
  background: #fff; border: 1.5px solid var(--gold-500); border-radius: 999px;

<script>
/* =====================================================================
   مزاد أبو شادن — single-page auction, no build step, no backend function.
   ---------------------------------------------------------------------
   The page talks to Supabase REST directly with the PUBLIC anon key.
   All the rules (bid must beat the price, auction still open, …) live in
   the database — see supabase-mazad.sql. Nothing here is trusted.

   The database is already set up (project "mazad-arqam", schema applied from
   supabase-mazad.sql). Clearing the two constants below drops the page back
   to وضع تجريبي — a local demo on localStorage, this browser only.
   ===================================================================== */

/* Supabase project "mazad-arqam" (ap-south-1) — its own project, deliberately
   separate from the RAFD database. The key below is the PUBLIC anon key: it is
   meant to ship in the page. It can only read listings/bids and create a
   listing; it cannot change a price, close an auction, or read the operator
   secret — see supabase-mazad.sql.
   The project's modern publishable key works too, if the legacy key is ever
   rotated out: sb_publishable_137ORWCtoU2UZEEEfr4NzQ_sxWFyuXl */
const SUPABASE_URL      = '';   /* ← مشروع Supabase الخاص بأبو شادن */
const SUPABASE_ANON_KEY = '';   /* فاضيين = وضع تجريبي على هذا المتصفح فقط */

/* Commission, على ذمة البائع: a flat 200 SAR, but 2.5% once the number sells
   for more than 20,000. Note the step at the threshold — 20,000 costs 200,
   20,001 costs 500 — that is the rule as set, not a rounding artefact. */
const CONTACT_PHONE = '0560748891';   // رقم أبو شادن، يظهر للعامة
/* The address read off the broadcast card. It was hardcoded — so a copy of
   this page put the ORIGINAL owner's domain on someone else's stream, in
   front of his viewers. Never hardcode it again. */
const SITE_URL = 'mazad-abushadan.com';
/* Commission, per section — على ذمة البائع. A section with `rate` charges the
   flat fee up to `threshold` and the rate above it; a section with only
   `flat` charges that and nothing more, whatever the sale.
   Displayed only: the site takes no payment and settles nothing, so nothing
   in the database depends on any of this. */
/* A flat fee on a car is the one that stops making sense as the sale grows:
   500 on a 200,000 car is a quarter of a per-mille, for the same night's work
   as a 30,000 one. So the car rule gains a rate above a threshold, the way
   the phone rule always had one.

   The threshold is chosen so that threshold × rate === flat — 50,000 × 1% is
   exactly 500 — which means the fee does NOT jump at the crossover: a car at
   49,999 and one at 50,001 pay the same 500. (The phone rule does jump there,
   20,000 × 2.5% being 500 against its 200 flat; that section is switched off,
   and its numbers are his, so it is left as it stands.)

   لوحات stays flat at 250 because he set it that way on purpose. */
/* أبو شادن: قاعدة واحدة على القسمين — 300 ثابتة، و1.5% فوق 20,000.
   الرقمان متوافقان: 20,000 × 1.5% = 300 بالضبط، فالعمولة لا تقفز عند الحد —
   لوحة بـ19,999 عمولتها 300 ومثلها بـ20,001. تحريك أحد الرقمين يوجب تحريك
   الثاني، وإلا دفع بائع ريالين فوق الحد عمولة أعلى فجأة. */
const SHADAN_FEE = { flat: 300, threshold: 20000, rate: 0.015 };
const FEES = { plate: SHADAN_FEE, car: SHADAN_FEE, phone: SHADAN_FEE };
const FEE_DEFAULT = 'phone';
const MIN_STEP      = 50;      // smallest raise, in SAR
const STEP_PERCENT  = 0.05;    // or 5% of the current price, whichever is bigger
const POLL_MS       = 2500;
const BUCKET        = 'mazad-cars';   // Storage bucket holding car photos    // how often the page refreshes itself
/* Sale prices are not public yet. Flip to true once there is enough history
   that a results archive helps sellers instead of exposing every deal. */
const SHOW_FINISHED = false;

/* ---------------------------------------------------------------- utils */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch {}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

const $  = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = (n) => Number(n || 0).toLocaleString('en-US');

/* Every countdown is the gap between a timestamp the SERVER wrote and "now".
   Taking "now" from the device is wrong: a phone whose clock is ten minutes
   slow shows a one-minute auction as eleven. So measure the difference once,
   keep it, and run every time calculation through it. */
let lastSeenBid = null;                  // so a paddle is raised once, not every refresh
let clockSkew = 0;                       // server time minus this device's clock
const nowMs = () => Date.now() + clockSkew;

function toast(msg) {
  const host = $('#toastHost');
  host.innerHTML = '<div class="toast"><div>' + esc(msg) + '</div></div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => host.innerHTML = '', 2600);
}

/* A queued number arrives masked as 054•••••01 — keep the mask characters so
   it still groups like a phone number. */
function fmtPhone(p) {
  const d = String(p || '').replace(/[^0-9•]/g, '');
  return d.length === 10 ? d.slice(0,3) + ' ' + d.slice(3,6) + ' ' + d.slice(6) : d;
}
/* A queued lot is masked. For a plate that now means its LETTERS, not its
   digits — see the mazad_public view for why. Both are still checked, so a
   row written before the flip is read correctly either way. */
const isMasked = (lot) => Boolean(lot && (lot.phone_masked ||
  String(lot.phone || '').includes('•') ||
  String(lot.plate_letters || '').includes('•') ||
  String(lot.plate_digits  || '').includes('•')));

/* ===================== ما الذي يُباع =====================
   The auction engine never cared what the lot is — bids, the clock, approval,
   the auto-sell price and the commission are identical either way. Everything
   that DOES differ is here, so a new kind of item means touching this block
   and nothing else. */
const IS_PLATE = (lot) => lot && lot.item_type === 'plate';

/* The seventeen letters Saudi plates use, and their fixed Latin equivalents.
   Verified against real plates: س ق م reads Z G S, and ب ي ا reads A V B —
   the Latin runs left-to-right, so it is the Arabic order reversed. */
const PLATE_LATIN = { 'ا':'A','ب':'B','ح':'J','د':'D','ر':'R','س':'S','ص':'X',
                      'ط':'T','ع':'E','ق':'G','ك':'K','ل':'L','م':'Z','ن':'N',
                      'ه':'H','و':'U','ي':'V' };
const PLATE_LETTERS = Object.keys(PLATE_LATIN);

/* ---------- ه is drawn هـ, or it reads as a ٥ ----------
   Standing on its own the letter is a bare circle, which beside a row of
   Arabic-Indic digits is simply the number five: «حرف الهاء وراه كنه رقم
   خمسه». A real plate draws it in its initial form, with the tail — هـ — and
   so does every plate the owner sent. A tatweel after it is a joining
   character, so the font shapes the ه as initial and the pair renders as one
   letter with its tail; it is not a second character and it is not a hack
   around the font, it is the form the letter takes on a plate.
   Only what is DRAWN changes: the stored letter, the CHECK constraint, the
   Latin map and everything the operator types stay a plain ه. */
const PLATE_GLYPH = { 'ه': '\u0647\u0640' };

/* A plate may carry one, two or three letters, and the short ones are the
   valuable ones — «ا ب 1» is what gets auctioned, «ا ب ح 1234» is what comes
   on an ordinary car. So the second and third boxes may be left empty, and
   the letters are joined in order: a gap in the middle simply collapses.

   They are TYPED, not picked from a list. A list means hunting through
   seventeen options three times for every plate, and on a phone it hides the
   keyboard he already has open. The boxes take the letter from either
   alphabet — د or D, both land as د — so he can type ل ا د on an Arabic
   keyboard or LAD on an English one without switching. */
const PLATE_FROM_LATIN = Object.fromEntries(
  Object.entries(PLATE_LATIN).map(([ar, en]) => [en, ar]));
/* ---------- the letter a person reaches for, not just the official code ----
   The official Latin code for م is Z, for ق is G, for و is U and for ي is V —
   that is what is printed on the plate. But nobody types Z when they mean م.
   They type M, and it was silently refused: no letter, no error, nothing —
   «اقلب الكيبورد انجليزي يرفض». M, Q, W and Y are not codes for any other
   letter, so accepting them costs nothing and collides with nothing. */
Object.assign(PLATE_FROM_LATIN, { 'M': 'م', 'Q': 'ق', 'W': 'و', 'Y': 'ي' });

/* one typed character -> the canonical Arabic plate letter, or '' */
function plateLetterOf(ch) {
  const c = normPlate(String(ch || '').slice(-1));
  if (!c) return '';
  if (PLATE_LATIN[c]) return c;                       // already a plate letter
  const up = c.toUpperCase();
  return PLATE_FROM_LATIN[up] || '';                  // D -> د
}

/* the three boxes, as markup. `letters` pre-fills them. */
function letterBoxes(prefix, letters) {
  const L = normPlate(letters || '').split('');
  return '<div class="plate-picks">' +
    [0, 1, 2].map(i =>
      '<input id="' + prefix + 'L' + (i + 1) + '" class="letterbox" ' +
        'autocomplete="off" autocapitalize="characters" ' +
        'spellcheck="false" value="' + esc(L[i] || '') + '" ' +
        'aria-label="الحرف ' + (i + 1) + '">').join('') +
    '</div>';
}

/* Typing a letter moves to the next box; backspace in an empty box moves
   back. Anything that is not one of the seventeen is simply not accepted —
   silently, because a plate cannot carry it. */
function wireLetterBoxes(root, prefix, onChange, nextField) {
  const ids = [1, 2, 3].map(i => '#' + prefix + 'L' + i);
  const boxes = ids.map(i => root.querySelector(i));
  const read = () => boxes.map(b => b.value).join('');
  /* A key a plate cannot carry used to vanish without a word, which is
     indistinguishable from the box being broken. It flashes now. */
  const refuse = (box) => {
    box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad');
    setTimeout(() => box.classList.remove('bad'), 450);
  };
  boxes.forEach((box, i) => {
    // Selecting on focus, plus taking the character at the caret, is what
    // makes typing OVER a letter work. maxlength="1" cannot do it: a box that
    // already holds one refuses the next keystroke outright, so he taps it,
    // types, and nothing happens — on camera.
    box.addEventListener('focus', () => box.select());
    box.addEventListener('input', () => {
      const pos = box.selectionStart;
      const typed = box.value.length > 1 ? box.value[Math.max(0, pos - 1)] : box.value;
      const v = plateLetterOf(typed);
      box.value = v;
      if (!v && typed) refuse(box);
      /* «اسجل الحروف ينتقل ع خانة الارقام ما هو لازم اضغط انا» — the last
         letter carries on into the digits instead of stopping dead. */
      if (v) {
        if (boxes[i + 1]) boxes[i + 1].focus();
        else if (nextField) {
          const n = typeof nextField === 'string' ? root.querySelector(nextField) : nextField;
          if (n) { n.focus(); if (n.select) n.select(); }
        }
      }
      if (onChange) onChange(read());
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && boxes[i - 1]) {
        boxes[i - 1].focus();
        boxes[i - 1].value = '';
        e.preventDefault();
        if (onChange) onChange(read());
      }
    });
  });
  return read;
}
/* Focus something further down the form, but only if it is actually on screen:
   a نقل plate hides the emblem row, and stealing the focus into a hidden
   control would leave the keyboard pointed at nothing — on camera. */
function advanceTo(root, sel) {
  const n = typeof sel === 'string' ? root.querySelector(sel) : sel;
  if (!n || !n.offsetParent) return false;
  n.focus(); if (n.select) n.select();
  return true;
}
/* The digits box is the other half of «ينتقل تلقائي»: four digits is a full
   plate, so it carries on to the emblem by itself; a shorter plate is finished
   with Enter, because the page cannot know that 90 is not about to become 900. */
function wirePlateDigits(root, sel, onChange, nextField) {
  const box = typeof sel === 'string' ? root.querySelector(sel) : sel;
  if (!box) return () => '';
  const read = () => box.value.replace(/\D/g, '').slice(0, 4);
  box.addEventListener('input', () => {
    box.value = read();
    if (onChange) onChange(box.value);
    if (box.value.length === 4 && nextField) advanceTo(root, nextField);
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && nextField) { e.preventDefault(); advanceTo(root, nextField); }
  });
  return read;
}
// people type أ إ آ ى ة as often as the plate spellings; the database
// normalises the same way, so the two can never disagree
const normPlate = (t) => String(t || '').trim()
  .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
const toArabicDigits = (t) => String(t || '').replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const plateLatin = (letters) => normPlate(letters).split('')
  .map(c => PLATE_LATIN[c] || c).reverse().join('');

/* On the plate the three Arabic letters stand APART — they are letters, not a
   word, and must not join into one shape. Joining them with a space does that
   but also fixes the gap at one space's width, which forced the letters to be
   drawn small to keep the block inside its cell. A zero-width non-joiner
   breaks the connection at no width at all, so the gap is set in CSS
   (letter-spacing) and the letters can be as tall as the digits, the way they
   are on a real plate. */
/* Each character is its own cell so the row can spread them across a fixed
   zone — that is what makes a plate look like a plate. It also means the
   Arabic letters can never join into a word: separate elements do not
   connect, so no zero-width joiner is needed. */
/* A plate written as running TEXT — the on-air banner, the share line, the
   operator's bid rows. It needs the same ه rule as the drawn plate: «ع ه د
   555» puts a bare circle right beside the digits, which is the ٥ he could
   not tell apart. One helper, so the two can never disagree again. */
const plateText = (letters, digits) =>
  normPlate(letters).split('').map(c => PLATE_GLYPH[c] || c).join(' ') +
  (digits ? ' ' + digits : '');
