<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المدرسة — رفد تعليم</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/edu.css">
</head>
<body class="edu">

<div class="edu-shell">
  <aside class="edu-side">
    <div class="edu-brand">
      <div class="edu-brand-mark">ر</div>
      <div>
        <div class="edu-brand-text">رفد تعليم</div>
        <div class="edu-brand-sub" id="schoolName">—</div>
      </div>
    </div>

    <button class="edu-nav-item active" data-view="overview"><span class="ico">🏠</span><span class="lbl">لوحة المدرسة</span></button>
    <button class="edu-nav-item" data-view="classes"><span class="ico">🏫</span><span class="lbl">الفصول</span></button>
    <button class="edu-nav-item" data-view="board"><span class="ico">🗓️</span><span class="lbl">بناء الجدول</span><span class="edu-nav-badge" id="clashBadge" hidden></span></button>
    <button class="edu-nav-item" data-view="teachers"><span class="ico">👨‍🏫</span><span class="lbl">جداول المعلمين</span></button>
    <button class="edu-nav-item" data-view="cover"><span class="ico">🔄</span><span class="lbl">احتياط الغياب</span></button>
    <button class="edu-nav-item" data-view="students"><span class="ico">🎒</span><span class="lbl">الطلاب</span></button>
    <button class="edu-nav-item" data-view="attendance"><span class="ico">✅</span><span class="lbl">تحضير اليوم</span></button>
    <button class="edu-nav-item" data-view="exams"><span class="ico">📝</span><span class="lbl">الاختبارات</span></button>
    <button class="edu-nav-item" data-view="homework"><span class="ico">📚</span><span class="lbl">الواجبات</span></button>
    <button class="edu-nav-item" data-view="grades"><span class="ico">📊</span><span class="lbl">رصد الدرجات</span></button>
    <button class="edu-nav-item" data-view="finance"><span class="ico">💰</span><span class="lbl">الرسوم والتحصيل</span></button>
    <button class="edu-nav-item" data-view="import"><span class="ico">📥</span><span class="lbl">استيراد الطلاب</span></button>
    <button class="edu-nav-item" data-view="badge"><span class="ico">📇</span><span class="lbl">بطاقتي وحضوري</span></button>
    <a class="edu-nav-item" href="/edu-kiosk.html"><span class="ico">🖥️</span><span class="lbl">شاشة الحضور</span></a>
    <button class="edu-nav-item" data-view="announcements"><span class="ico">📢</span><span class="lbl">الإعلانات</span></button>

    <div class="edu-side-foot">
      <button class="edu-nav-item" id="logoutBtn"><span class="ico">↩</span><span class="lbl">تسجيل الخروج</span></button>
    </div>
  </aside>

  <div class="edu-main">
    <header class="edu-top">
      <button class="edu-burger" aria-label="القائمة">☰</button>
      <h1 id="viewTitle">لوحة المدرسة</h1>
      <div class="edu-top-actions">
        <div class="edu-user-chip">
          <span class="edu-avatar" id="userAvatar">؟</span>
          <span id="userName">—</span>
        </div>
      </div>
    </header>

    <main class="edu-content">
      <div id="demoBanner"></div>
      <div id="view">
        <div class="edu-card">
          <div class="edu-skeleton" style="width:40%"></div>
          <div class="edu-skeleton"></div>
          <div class="edu-skeleton" style="width:70%"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="edu-modal" id="modal">
  <div class="edu-modal-box">
    <div class="edu-modal-head">
      <h3 id="modalTitle">—</h3>
      <button type="button" id="modalClose" aria-label="إغلاق">×</button>
    </div>
    <form id="modalForm"></form>
  </div>
</div>

<script src="/edu-common.js"></script>
<script>
(function () {
  var session = Edu.requireRole(['school_admin', 'teacher']);
  if (!session) return;

  var E = Edu.esc;
  var viewEl = document.getElementById('view');
  var state = { view: 'overview', base: null, classId: null };

  document.getElementById('userName').textContent = session.user.full_name;
  document.getElementById('userAvatar').textContent = Edu.initials(session.user.full_name);
  document.getElementById('schoolName').textContent = session.user.school_name || 'المدرسة';
  document.getElementById('logoutBtn').onclick = Edu.logout;
  Edu.mountSidebar();

  if (Edu.isDemo()) {
    document.getElementById('demoBanner').innerHTML =
      '<div class="edu-alert info">أنت في <strong>الوضع التجريبي</strong> — البيانات توضيحية والتعديلات لا تُحفظ. ' +
      'بعد تفعيل المدرسة يعمل الحفظ فعلياً وتصل التحديثات لأولياء الأمور والطلاب فوراً.</div>';
  }

  var TITLES = {
    overview: 'لوحة المدرسة', classes: 'الفصول', students: 'الطلاب',
    attendance: 'تحضير اليوم', exams: 'الاختبارات', homework: 'الواجبات',
    grades: 'رصد الدرجات', announcements: 'الإعلانات',
    finance: 'الرسوم والتحصيل', import: 'استيراد الطلاب',
    board: 'بناء الجدول', teachers: 'جداول المعلمين', cover: 'احتياط الغياب',
    badge: 'بطاقتي وحضوري',
  };

  Array.prototype.forEach.call(document.querySelectorAll('.edu-nav-item[data-view]'), function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-view')); });
  });

  function go(view) {
    state.view = view;
    document.getElementById('viewTitle').textContent = TITLES[view] || '';
    Array.prototype.forEach.call(document.querySelectorAll('.edu-nav-item[data-view]'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === view);
    });
    location.hash = view;
    render();
  }

  function loading() {
    viewEl.innerHTML = '<div class="edu-card"><div class="edu-skeleton" style="width:35%"></div>' +
      '<div class="edu-skeleton"></div><div class="edu-skeleton" style="width:60%"></div></div>';
  }

  function fail(e) {
    viewEl.innerHTML = '<div class="edu-alert danger">' + E(e.message || 'تعذّر تحميل البيانات') + '</div>';
  }

  async function ensureBase() {
    if (state.base) return state.base;
    state.base = await Edu.data('overview', {});
    if (!state.classId && (state.base.classes || []).length) state.classId = state.base.classes[0].id;
    return state.base;
  }

  async function render() {
    loading();
    try {
      var d = await ensureBase();
      ({
        overview: viewOverview, classes: viewClasses, students: viewStudents,
        attendance: viewAttendance, exams: viewExams, homework: viewHomework,
        grades: viewGrades, announcements: viewAnnouncements,
        finance: viewFinance, import: viewImport,
        board: viewBoard, teachers: viewTeachers, cover: viewCover,
        badge: viewBadge,
      }[state.view] || viewOverview)(d);
    } catch (e) { fail(e); }
  }

  // ── نظرة عامة ────────────────────────────────────────────────────────
  function viewOverview(d) {
    var s = d.stats || {};
    var att = s.attendance_today || {};
    var html = '<div class="edu-grid c4" style="margin-bottom:1.25rem">' +
      stat('الطلاب', s.students || 0, 'مسجّلون ونشطون', '') +
      stat('حضور اليوم', att.rate != null ? att.rate + '%' : '—',
           (att.absent || 0) + ' غياب · ' + (att.late || 0) + ' تأخير', att.rate >= 90 ? 'sky' : 'amber') +
      stat('الفصول', s.classes || 0, (s.subjects || 0) + ' مادة', 'sky') +
      stat('المعلمون', s.teachers || 0, 'في الكادر التعليمي', '') +
      '</div>';

    html += '<div class="edu-grid c2">';

    html += card('📝 اختبارات قادمة', (d.exams || []).length
      ? '<div class="edu-list">' + d.exams.slice(0, 6).map(function (x) {
          return row('<span class="edu-dot">📝</span>', E(x.title),
            E(x.subject_name || '') + ' · ' + E(x.class_name || '') + ' · ' + E(Edu.fmtDate(x.exam_date)),
            '<span class="edu-badge info">' + E(Edu.relativeDay(x.exam_date)) + '</span>');
        }).join('') + '</div>'
      : empty('📭', 'لا توجد اختبارات مجدولة'),
      '<button class="more edu-btn ghost sm" data-nav="exams">إدارة الاختبارات</button>');

    html += card('📚 واجبات قائمة', (d.homework || []).length
      ? '<div class="edu-list">' + d.homework.slice(0, 6).map(function (h) {
          return row('<span class="edu-dot">📖</span>', E(h.title),
            E(h.subject_name || '') + ' · ' + E(h.class_name || '') + ' · التسليم ' + E(Edu.fmtDate(h.due_date)),
            '<span class="edu-badge">' + E(Edu.relativeDay(h.due_date)) + '</span>');
        }).join('') + '</div>'
      : empty('📭', 'لا توجد واجبات نشطة'),
      '<button class="more edu-btn ghost sm" data-nav="homework">إدارة الواجبات</button>');

    html += card('📢 آخر الإعلانات', (d.announcements || []).length
      ? '<div class="edu-list">' + d.announcements.slice(0, 5).map(function (a) {
          return row('<span class="edu-dot">' + (a.pinned ? '📌' : '📢') + '</span>',
            E(a.title), E(a.body || '').slice(0, 90), '<span class="edu-badge">' + E(Edu.fmtShort(a.created_at)) + '</span>');
        }).join('') + '</div>'
      : empty('📭', 'لا توجد إعلانات'),
      '<button class="more edu-btn ghost sm" data-nav="announcements">إدارة الإعلانات</button>');

    html += card('⚡ إجراءات سريعة',
      '<div style="display:flex;flex-wrap:wrap;gap:.6rem">' +
      '<button class="edu-btn green sm" data-quick="exam">+ اختبار جديد</button>' +
      '<button class="edu-btn green sm" data-quick="homework">+ واجب جديد</button>' +
      '<button class="edu-btn green sm" data-quick="announcement">+ إعلان جديد</button>' +
      '<button class="edu-btn ghost sm" data-nav="attendance">✅ تحضير اليوم</button>' +
      '<button class="edu-btn ghost sm" data-nav="grades">📊 رصد الدرجات</button>' +
      '</div>');

    html += '</div>';
    viewEl.innerHTML = html;
    wire();
  }

  // ── الفصول ───────────────────────────────────────────────────────────
  async function viewClasses(d) {
    var classes = d.classes || [];
    if (!classes.length) {
      viewEl.innerHTML = card('الفصول', empty('🏫', 'لم تُضف فصول بعد'));
      return;
    }
    loading();
    try {
      var detail = await Edu.data('class_detail', { class_id: state.classId });
      var html = classPicker(classes);
      var cl = classes.filter(function (c) { return c.id === state.classId; })[0] || classes[0];

      html += '<div class="edu-grid c2">';
      html += card('🎒 طلاب ' + E(cl.name) + ' (' + (detail.students || []).length + ')',
        (detail.students || []).length
          ? '<div class="edu-list">' + detail.students.map(function (st) {
              return row('<span class="edu-avatar">' + E(Edu.initials(st.full_name)) + '</span>',
                E(st.full_name), 'رقم الطالب: ' + E(st.student_number || '—'), '');
            }).join('') + '</div>'
          : empty('🎒', 'لا يوجد طلاب في هذا الفصل'));

      html += card('📅 جدول الفصل', (detail.timetable || []).length
        ? timetableTable(detail.timetable)
        : empty('📅', 'لم يُنشأ الجدول بعد'));

      html += card('📝 اختبارات الفصل', (detail.exams || []).length
        ? '<div class="edu-list">' + detail.exams.slice(0, 10).map(function (x) {
            return row('<span class="edu-dot">📝</span>', E(x.title),
              E(x.subject_name || '') + ' · ' + E(Edu.fmtDate(x.exam_date)), '');
          }).join('') + '</div>'
        : empty('📭', 'لا توجد اختبارات'));

      html += card('📚 واجبات الفصل', (detail.homework || []).length
        ? '<div class="edu-list">' + detail.homework.slice(0, 10).map(function (h) {
            return row('<span class="edu-dot">📖</span>', E(h.title),
              E(h.subject_name || '') + ' · التسليم ' + E(Edu.fmtDate(h.due_date)), '');
          }).join('') + '</div>'
        : empty('📭', 'لا توجد واجبات'));
      html += '</div>';

      viewEl.innerHTML = html;
      wire();
    } catch (e) { fail(e); }
  }

  function timetableTable(tt) {
    var periods = [];
    tt.forEach(function (p) { if (periods.indexOf(p.period_no) === -1) periods.push(p.period_no); });
    periods.sort(function (a, b) { return a - b; });
    var html = '<div class="edu-table-wrap"><table class="edu-table"><thead><tr><th>الحصة</th>' +
      Edu.SCHOOL_DAYS.map(function (wd) { return '<th>' + E(Edu.weekdayName(wd)) + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    periods.forEach(function (pn) {
      html += '<tr><td><strong>' + pn + '</strong></td>';
      Edu.SCHOOL_DAYS.forEach(function (wd) {
        var c = tt.filter(function (t) { return t.weekday === wd && t.period_no === pn; })[0];
        html += '<td>' + (c ? '<div class="edu-period"><strong>' + E(c.subject_name || '—') +
          '</strong><small>' + E(c.teacher_name || '') + '</small></div>' : '—') + '</td>';
      });
      html += '</tr>';
    });
    return html + '</tbody></table></div>';
  }

  // ── الطلاب ───────────────────────────────────────────────────────────
  async function viewStudents() {
    loading();
    try {
      var res = await Edu.data('roster', {});
      var students = res.students || [];
      var html = '<div class="edu-card"><div class="edu-card-head"><h2>🎒 الطلاب (' + students.length + ')</h2></div>' +
        '<div class="edu-field"><input id="stSearch" type="search" placeholder="ابحث بالاسم أو رقم الطالب..."></div>' +
        '<div class="edu-table-wrap"><table class="edu-table"><thead><tr>' +
        '<th>الطالب</th><th>رقم الطالب</th><th>الفصل</th></tr></thead><tbody id="stBody">' +
        students.map(studentTr).join('') + '</tbody></table></div></div>';
      viewEl.innerHTML = html;

      document.getElementById('stSearch').addEventListener('input', function () {
        var q = this.value.trim().toLowerCase();
        document.getElementById('stBody').innerHTML = students.filter(function (s) {
          return !q || (s.full_name || '').toLowerCase().indexOf(q) !== -1 ||
                 String(s.student_number || '').indexOf(q) !== -1;
        }).map(studentTr).join('');
      });
    } catch (e) { fail(e); }
  }

  function studentTr(s) {
    return '<tr><td>' + E(s.full_name) + '</td><td>' + E(s.student_number || '—') +
      '</td><td>' + E(s.class_name || '—') + '</td></tr>';
  }

  // ── تحضير اليوم ──────────────────────────────────────────────────────
  async function viewAttendance(d) {
    if (!(d.classes || []).length) {
      viewEl.innerHTML = card('تحضير اليوم', empty('🏫', 'أضف فصولاً أولاً'));
      return;
    }
    loading();
    try {
      var detail = await Edu.data('class_detail', { class_id: state.classId });
      var students = detail.students || [];
      var today = new Date().toISOString().slice(0, 10);
      var cl = d.classes.filter(function (c) { return c.id === state.classId; })[0];

      var html = classPicker(d.classes);
      html += '<div class="edu-card"><div class="edu-card-head"><h2>✅ تحضير ' + E(cl.name) +
        ' — ' + E(Edu.fmtDate(today)) + '</h2></div>';
      if (!students.length) {
        html += empty('🎒', 'لا يوجد طلاب في هذا الفصل') + '</div>';
      } else {
        html += '<div class="edu-list" id="attList">' + students.map(function (st) {
          return '<div class="edu-row"><span class="edu-avatar">' + E(Edu.initials(st.full_name)) + '</span>' +
            '<div class="edu-row-main"><div class="edu-row-title">' + E(st.full_name) + '</div>' +
            '<div class="edu-row-sub">رقم ' + E(st.student_number || '—') + '</div></div>' +
            '<div class="edu-row-end"><select data-att="' + E(st.id) + '" ' +
            'style="padding:.45rem .7rem;border:1.5px solid var(--edu-line);border-radius:9px;font-family:inherit;font-size:.82rem">' +
            '<option value="present">حاضر</option><option value="absent">غائب</option>' +
            '<option value="late">متأخر</option><option value="excused">بعذر</option>' +
            '</select></div></div>';
        }).join('') + '</div>' +
        '<button class="edu-btn green" id="saveAtt" style="margin-top:1rem">حفظ التحضير</button></div>';
      }
      viewEl.innerHTML = html;
      wire();

      var saveBtn = document.getElementById('saveAtt');
      if (saveBtn) saveBtn.onclick = async function () {
        saveBtn.disabled = true;
        saveBtn.textContent = 'جارٍ الحفظ...';
        var selects = viewEl.querySelectorAll('[data-att]');
        try {
          for (var i = 0; i < selects.length; i++) {
            await Edu.data('save', {
              table: 'edu_attendance',
              data: { student_id: selects[i].getAttribute('data-att'), date: today, status: selects[i].value },
            });
          }
          Edu.toast('تم حفظ تحضير ' + selects.length + ' طالب');
          state.base = null;
        } catch (e) { Edu.toast(e.message); }
        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ التحضير';
      };
    } catch (e) { fail(e); }
  }

  // ── الاختبارات ───────────────────────────────────────────────────────
  function viewExams(d) {
    var exams = d.exams || [];
    viewEl.innerHTML = '<div class="edu-card"><div class="edu-card-head"><h2>📝 الاختبارات القادمة</h2>' +
      '<button class="more edu-btn green sm" data-quick="exam">+ اختبار جديد</button></div>' +
      (exams.length
        ? '<div class="edu-table-wrap"><table class="edu-table"><thead><tr><th>العنوان</th><th>المادة</th>' +
          '<th>الفصل</th><th>النوع</th><th>التاريخ</th><th>الدرجة</th></tr></thead><tbody>' +
          exams.map(function (x) {
            return '<tr><td>' + E(x.title) + '</td><td>' + E(x.subject_name || '—') + '</td><td>' +
              E(x.class_name || '—') + '</td><td>' + E(Edu.label(Edu.EXAM_LABELS, x.exam_type)) +
              '</td><td>' + E(Edu.fmtDate(x.exam_date)) + '</td><td>' + E(x.max_score) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : empty('📭', 'لا توجد اختبارات مجدولة')) + '</div>';
    wire();
  }

  // ── الواجبات ─────────────────────────────────────────────────────────
  function viewHomework(d) {
    var hw = d.homework || [];
    viewEl.innerHTML = '<div class="edu-card"><div class="edu-card-head"><h2>📚 الواجبات</h2>' +
      '<button class="more edu-btn green sm" data-quick="homework">+ واجب جديد</button></div>' +
      (hw.length
        ? '<div class="edu-table-wrap"><table class="edu-table"><thead><tr><th>العنوان</th><th>المادة</th>' +
          '<th>الفصل</th><th>الإسناد</th><th>التسليم</th></tr></thead><tbody>' +
          hw.map(function (h) {
            return '<tr><td>' + E(h.title) + '</td><td>' + E(h.subject_name || '—') + '</td><td>' +
              E(h.class_name || '—') + '</td><td>' + E(Edu.fmtShort(h.assigned_date)) +
              '</td><td>' + E(Edu.fmtDate(h.due_date)) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : empty('📭', 'لا توجد واجبات')) + '</div>';
    wire();
  }

  // ── رصد الدرجات ──────────────────────────────────────────────────────
  async function viewGrades(d) {
    if (!(d.classes || []).length) {
      viewEl.innerHTML = card('رصد الدرجات', empty('🏫', 'أضف فصولاً أولاً'));
      return;
    }
    loading();
    try {
      var detail = await Edu.data('class_detail', { class_id: state.classId });
      var students = detail.students || [];
      var cl = d.classes.filter(function (c) { return c.id === state.classId; })[0];

      var html = classPicker(d.classes);
      html += '<div class="edu-card"><div class="edu-card-head"><h2>📊 رصد درجات ' + E(cl.name) + '</h2></div>';
      html += '<div class="edu-grid c3">' +
        '<div class="edu-field"><label>المادة</label><select id="grSubject">' +
        (d.subjects || []).map(function (s) {
          return '<option value="' + E(s.id) + '">' + E(s.name) + '</option>';
        }).join('') + '</select></div>' +
        '<div class="edu-field"><label>عنوان التقييم</label><input id="grTitle" placeholder="اختبار الوحدة الثالثة"></div>' +
        '<div class="edu-field"><label>الدرجة العظمى</label><input id="grMax" type="number" value="20" min="1"></div>' +
        '</div>';

      if (!students.length) {
        html += empty('🎒', 'لا يوجد طلاب في هذا الفصل') + '</div>';
      } else {
        html += '<div class="edu-list">' + students.map(function (st) {
          return '<div class="edu-row"><span class="edu-avatar">' + E(Edu.initials(st.full_name)) + '</span>' +
            '<div class="edu-row-main"><div class="edu-row-title">' + E(st.full_name) + '</div></div>' +
            '<div class="edu-row-end"><input data-score="' + E(st.id) + '" type="number" step="0.5" min="0" ' +
            'placeholder="—" style="width:90px;padding:.45rem;border:1.5px solid var(--edu-line);' +
            'border-radius:9px;font-family:inherit;text-align:center"></div></div>';
        }).join('') + '</div>' +
        '<button class="edu-btn green" id="saveGrades" style="margin-top:1rem">حفظ الدرجات</button></div>';
      }
      viewEl.innerHTML = html;
      wire();

      var btn = document.getElementById('saveGrades');
      if (btn) btn.onclick = async function () {
        var title = document.getElementById('grTitle').value.trim();
        var max = Number(document.getElementById('grMax').value) || 20;
        var subject = document.getElementById('grSubject').value;
        if (!title) return Edu.toast('اكتب عنوان التقييم');
        var inputs = Array.prototype.filter.call(viewEl.querySelectorAll('[data-score]'), function (i) {
          return i.value !== '';
        });
        if (!inputs.length) return Edu.toast('أدخل درجة واحدة على الأقل');
        btn.disabled = true;
        btn.textContent = 'جارٍ الحفظ...';
        try {
          for (var i = 0; i < inputs.length; i++) {
            await Edu.data('save', {
              table: 'edu_grades',
              data: {
                student_id: inputs[i].getAttribute('data-score'), subject_id: subject,
                kind: 'exam', title: title, score: Number(inputs[i].value),
                max_score: max, weight: 2, published: true,
              },
            });
          }
          Edu.toast('تم رصد ' + inputs.length + ' درجة — ستظهر لأولياء الأمور مباشرة');
          inputs.forEach(function (i) { i.value = ''; });
          document.getElementById('grTitle').value = '';
        } catch (e) { Edu.toast(e.message); }
        btn.disabled = false;
        btn.textContent = 'حفظ الدرجات';
      };
    } catch (e) { fail(e); }
  }

  // ── بطاقتي وحضوري ────────────────────────────────────────────────────
  // المنسوب يعرض باركوده أمام القارئ، أو يسجّل غيابه من بيته.
  var badgeTimer = null;

  function viewBadge() {
    clearInterval(badgeTimer);
    // في العرض التجريبي نستخدم رمز أ. سعد المطيري ليعمل المسح على المسرح
    var code = session.user.checkin_code ||
      (Edu.isDemo() ? 'TSA3D8FG' : null);

    var html = '<div class="edu-grid c2">';

    html += '<div class="edu-card"><div class="edu-card-head"><h2>📇 بطاقة الحضور</h2>' +
      '<button class="more edu-btn ghost sm" onclick="window.print()">🖨️ طباعة</button></div>';
    if (!code) {
      html += '<div class="edu-alert warn">لم يُصدَر رمز حضور لحسابك بعد. ' +
        'تطلبه إدارة المدرسة من «شاشة الحضور ← إصدار الرموز».</div>';
    } else {
      html += '<div class="edu-badge-card">' +
        '<div class="who">' + E(session.user.full_name) + '</div>' +
        '<div class="sub">' + E(session.user.school_name || '') + '</div>' +
        '<div id="badgeBox"></div>' +
        '<div class="edu-badge-timer" id="badgeTimer"></div>' +
        '</div>' +
        '<div class="edu-alert info" style="margin-top:1rem">الرمز المعروض يتغيّر كل 30 ثانية، ' +
        'فلا ينفع تصويره وإرساله لأحد. امسحه مباشرة من الشاشة أمام القارئ.</div>';
    }
    html += '</div>';

    html += '<div class="edu-card"><div class="edu-card-head"><h2>🏠 تسجيل غياب اليوم</h2></div>' +
      '<div class="edu-alert info">إذا لم تتمكن من الحضور، سجّل غيابك من هنا — تصل الإدارة فوراً ' +
      'وتظهر حصصك في شاشة الاحتياط ليُدبَّر لها بديل.</div>' +
      '<div class="edu-field"><label for="abStatus">الحالة</label><select id="abStatus">' +
      '<option value="absent">غياب</option>' +
      '<option value="leave">إجازة / مأذونية</option>' +
      '<option value="present">حاضر (تراجع عن الغياب)</option></select></div>' +
      '<div class="edu-field"><label for="abReason">السبب (اختياري)</label>' +
      '<textarea id="abReason" placeholder="ظرف صحي طارئ"></textarea></div>' +
      '<button class="edu-btn green" id="abGo">تسجيل</button>' +
      '<div id="abMsg" style="margin-top:1rem"></div></div>';

    html += '</div>';
    viewEl.innerHTML = html;

    if (code) {
      var box = document.getElementById('badgeBox');
      var timer = document.getElementById('badgeTimer');
      var paint = function () {
        var rolling = Edu.rollingCode(code);
        box.innerHTML = Edu.barcodeSVG(rolling, { height: 80, unit: 2 });
        timer.textContent = 'يتجدّد خلال ' + Edu.rollingSecondsLeft() + ' ثانية';
      };
      paint();
      badgeTimer = setInterval(paint, 1000);
    }

    document.getElementById('abGo').onclick = async function () {
      var btn = this;
      btn.disabled = true;
      try {
        await Edu.checkin('self', {
          status: document.getElementById('abStatus').value,
          reason: document.getElementById('abReason').value.trim(),
        });
        document.getElementById('abMsg').innerHTML =
          '<div class="edu-alert ok">تم التسجيل — وصلت الإدارة وظهرت في شاشة الحضور.</div>';
      } catch (e) {
        document.getElementById('abMsg').innerHTML =
          '<div class="edu-alert danger">' + E(e.message) + '</div>';

  // ── بناء الجدول: شبكة قابلة للتعديل + كشف تعارض فوري ─────────────────
  var boardData = null;

  async function viewBoard(d) {
    loading();
    try {
      boardData = await Edu.data('timetable_board', {});
      var classes = boardData.classes || [];
      if (!classes.length) {
        viewEl.innerHTML = card('بناء الجدول', empty('🏫', 'أضف فصولاً أولاً'));
        return;
      }
      if (!state.classId || !classes.some(function (c) { return c.id === state.classId; })) {
        state.classId = classes[0].id;
      }
      var conflicts = boardData.conflicts || [];
      var badge = document.getElementById('clashBadge');
      badge.hidden = !conflicts.length;
      badge.textContent = conflicts.length;

      var html = '';
      // التعارضات أولاً — هذه هي الشاشة التي لا يستطيع Excel تقديمها
      if (conflicts.length) {
        html += '<div class="edu-alert danger"><strong>⚠️ ' + conflicts.length +
          ' تعارض في الجدول</strong><br>' + conflicts.slice(0, 6).map(function (c) {
            return E(c.teacher_name || 'معلم') + ' مسنَد إلى <strong>' + E(c.classes[0]) +
              '</strong> و<strong>' + E(c.classes[1]) + '</strong> في نفس الوقت — ' +
              E(Edu.weekdayName(c.weekday)) + '، الحصة ' + c.period_no;
          }).join('<br>') +
          (conflicts.length > 6 ? '<br>و' + (conflicts.length - 6) + ' تعارض آخر…' : '') + '</div>';
      } else {
        html += '<div class="edu-alert ok">✅ لا توجد تعارضات — كل معلم في فصل واحد فقط في كل حصة.</div>';
      }

      html += classPicker(classes);
      html += '<div class="edu-card"><div class="edu-card-head"><h2>🗓️ جدول ' +
        E((classes.filter(function (c) { return c.id === state.classId; })[0] || {}).name || '') + '</h2>' +
        '<span class="more" style="font-size:.78rem;color:var(--edu-muted)">اضغط أي خانة لإسناد مادة ومعلم</span></div>' +
        boardGrid() + '</div>';

      // النصاب — يُحسب تلقائياً، وفي Excel يُعدّ يدوياً
      html += '<div class="edu-card"><div class="edu-card-head"><h2>📊 نصاب المعلمين الأسبوعي</h2></div>' +
        '<div class="edu-table-wrap"><table class="edu-table"><thead><tr>' +
        '<th>المعلم</th><th>الحصص الأسبوعية</th><th>أيام الدوام</th><th>التوزيع</th>' +
        '</tr></thead><tbody>' + (boardData.load || []).map(function (l) {
          var pctBar = Math.min(100, (l.periods / 25) * 100);
          var tone = l.periods > 24 ? ' danger' : l.periods < 12 ? ' warn' : '';
          return '<tr><td>' + E(l.full_name) + '</td><td><strong>' + l.periods + '</strong></td>' +
            '<td>' + l.days + '</td><td style="min-width:140px">' +
            '<div class="edu-bar' + tone + '"><span style="width:' + pctBar + '%"></span></div></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<p style="font-size:.76rem;color:var(--edu-muted);margin-top:.6rem">' +
        'النصاب يتحدّث تلقائياً مع كل تعديل على الجدول.</p></div>';

      viewEl.innerHTML = html;
      wire();
      wireBoardCells();
    } catch (e) { fail(e); }
  }

  function boardCell(wd, pn) {
    return (boardData.timetable || []).filter(function (r) {
      return r.class_id === state.classId && r.weekday === wd && r.period_no === pn;
    })[0];
  }

  // معلم مشغول في هذه الخانة عند فصل آخر
  function busyAt(wd, pn, teacherId, exceptId) {
    return (boardData.timetable || []).filter(function (r) {
      return r.teacher_id === teacherId && r.weekday === wd && r.period_no === pn && r.id !== exceptId;
    })[0];
  }

  function boardGrid() {
    var periods = [1, 2, 3, 4, 5, 6];
    var html = '<div class="edu-table-wrap"><table class="edu-table"><thead><tr><th>الحصة</th>' +
      Edu.SCHOOL_DAYS.map(function (wd) { return '<th>' + E(Edu.weekdayName(wd)) + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    periods.forEach(function (pn) {
      html += '<tr><td><strong>' + pn + '</strong></td>';
      Edu.SCHOOL_DAYS.forEach(function (wd) {
        var c = boardCell(wd, pn);
        var clash = c && c.teacher_id && busyAt(wd, pn, c.teacher_id, c.id);
        html += '<td><button class="edu-slot' + (c ? '' : ' empty') + (clash ? ' clash' : '') +
          '" data-slot="' + wd + ':' + pn + '">' +
          (c ? '<strong>' + E(c.subject_name || '—') + '</strong><small>' +
               E(c.teacher_name || 'بلا معلم') + '</small>' +
               (clash ? '<span class="edu-slot-flag">تعارض</span>' : '')
             : '<span class="edu-slot-add">+</span>') +
          '</button></td>';
      });
      html += '</tr>';
    });
    return html + '</tbody></table></div>';
  }

  function wireBoardCells() {
    Array.prototype.forEach.call(viewEl.querySelectorAll('[data-slot]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-slot').split(':');
        openSlot(parseInt(parts[0], 10), parseInt(parts[1], 10));
      });
    });
  }

  function openSlot(wd, pn) {
    var cell = boardCell(wd, pn);
    var subjects = boardData.subjects || [];
    var teachers = boardData.teachers || [];

    document.getElementById('modalTitle').textContent =
      Edu.weekdayName(wd) + ' — الحصة ' + pn;

    modalForm.innerHTML =
      '<div class="edu-field"><label for="sSubject">المادة</label><select id="sSubject">' +
      '<option value="">— بدون —</option>' +
      subjects.map(function (s) {
        return '<option value="' + E(s.id) + '"' +
          (cell && cell.subject_id === s.id ? ' selected' : '') + '>' + E(s.name) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="edu-field"><label for="sTeacher">المعلم</label><select id="sTeacher">' +
      '<option value="">— بدون —</option>' +
      teachers.map(function (t) {
        // نُعلّم المشغولين قبل الاختيار بدل رفضهم بعده
        var busy = busyAt(wd, pn, t.id, cell && cell.id);
        return '<option value="' + E(t.id) + '"' +
          (cell && cell.teacher_id === t.id ? ' selected' : '') + '>' + E(t.full_name) +
          (busy ? ' — مشغول مع ' + E(busy.class_name || 'فصل آخر') : '') + '</option>';
      }).join('') + '</select></div>' +
      '<div class="edu-field"><label for="sRoom">القاعة</label>' +
      '<input id="sRoom" value="' + E((cell && cell.room) || '') + '" placeholder="قاعة 103"></div>' +
      '<div id="slotWarn"></div>' +
      '<div style="display:flex;gap:.6rem">' +
      '<button class="edu-btn green" type="submit" style="flex:1">حفظ</button>' +
      (cell ? '<button class="edu-btn ghost" type="button" id="slotDel">حذف الحصة</button>' : '') +
      '</div>';
    modal.classList.add('open');

    function checkBusy() {
      var t = val('sTeacher');
      var busy = t && busyAt(wd, pn, t, cell && cell.id);
      document.getElementById('slotWarn').innerHTML = busy
        ? '<div class="edu-alert danger">هذا المعلم مسنَد إلى <strong>' +
          E(busy.class_name || 'فصل آخر') + '</strong> في نفس الحصة.</div>' : '';
    }
    document.getElementById('sTeacher').addEventListener('change', checkBusy);
    checkBusy();

    if (cell) {
      document.getElementById('slotDel').onclick = async function () {
        this.disabled = true;
        try {
          await Edu.data('delete', { table: 'edu_timetable', id: cell.id });
          Edu.toast('تم حذف الحصة');
          closeModal();
          viewBoard();
        } catch (err) { Edu.toast(err.message); this.disabled = false; }
      };
    }

    modalForm.onsubmit = async function (e) {
      e.preventDefault();
      var btn = modalForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'جارٍ الحفظ...';
      try {
        await Edu.data('save', {
          table: 'edu_timetable',
          id: cell ? cell.id : undefined,
          data: {
            class_id: state.classId, weekday: wd, period_no: pn,
            subject_id: val('sSubject') || null,
            teacher_id: val('sTeacher') || null,
            room: val('sRoom') || null,
          },
        });
        Edu.toast('تم حفظ الحصة');
        closeModal();
        viewBoard();
      } catch (err) {
        // الخادم يرفض التعارض حتى لو تجاوزت الواجهة — نعرض سببه
        Edu.toast(err.message);
        btn.disabled = false;
        btn.textContent = 'حفظ';
      }
    };
  }

  // ── جداول المعلمين ───────────────────────────────────────────────────
  var teacherId = null;

  async function viewTeachers() {
    loading();
    try {
      var res = await Edu.data('teacher_schedule', teacherId ? { teacher_id: teacherId } : {});
      var teachers = res.teachers || [];
      teacherId = res.teacher_id;
      var load = res.load || {};

      var html = '<div class="edu-field" style="max-width:320px"><label for="tPick">اختر المعلم</label>' +
        '<select id="tPick">' + teachers.map(function (t) {
          return '<option value="' + E(t.id) + '"' + (t.id === teacherId ? ' selected' : '') +
            '>' + E(t.full_name) + '</option>';
        }).join('') + '</select></div>';

      html += '<div class="edu-grid c3" style="margin-bottom:1.25rem">' +
        stat('الحصص الأسبوعية', load.periods || 0, 'النصاب الحالي', '') +
        stat('أيام الدوام', load.days || 0, 'من 5 أيام', 'sky') +
        stat('متوسط اليوم', load.days ? (Math.round((load.periods / load.days) * 10) / 10) : 0,
             'حصة في اليوم', 'amber') +
        '</div>';

      html += '<div class="edu-card"><div class="edu-card-head"><h2>🗓️ جدول ' +
        E(res.teacher_name || '') + '</h2>' +
        '<button class="more edu-btn ghost sm" onclick="window.print()">🖨️ طباعة</button></div>';

      var tt = res.timetable || [];
      if (!tt.length) {
        html += empty('🗓️', 'لا توجد حصص مسنَدة لهذا المعلم');
      } else {
        html += '<div class="edu-table-wrap"><table class="edu-table"><thead><tr><th>الحصة</th>' +
          Edu.SCHOOL_DAYS.map(function (wd) { return '<th>' + E(Edu.weekdayName(wd)) + '</th>'; }).join('') +
          '</tr></thead><tbody>';
        [1, 2, 3, 4, 5, 6].forEach(function (pn) {
          html += '<tr><td><strong>' + pn + '</strong></td>';
          Edu.SCHOOL_DAYS.forEach(function (wd) {
            var c = tt.filter(function (r) { return r.weekday === wd && r.period_no === pn; })[0];
            html += '<td>' + (c
              ? '<div class="edu-period"><strong>' + E(c.class_name || '—') + '</strong><small>' +
                E(c.subject_name || '') + (c.room ? ' · ' + E(c.room) : '') + '</small></div>'
              : '<span style="color:#CBD5E1">فراغ</span>') + '</td>';
          });
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }
      viewEl.innerHTML = html + '</div>';

      document.getElementById('tPick').addEventListener('change', function () {
        teacherId = this.value;
        viewTeachers();
      });
    } catch (e) { fail(e); }

  // ── احتياط الغياب ────────────────────────────────────────────────────
  var coverState = { teacher: null, weekday: new Date().getDay() };

  async function viewCover(d) {
    loading();
    try {
      var teachers = (boardData && boardData.teachers) || d.teachers || [];
      if (!teachers.length) {
        var b = await Edu.data('timetable_board', {});
        boardData = b;
        teachers = b.teachers || [];
      }
      if (!coverState.teacher && teachers.length) coverState.teacher = teachers[0].id;
      if (Edu.SCHOOL_DAYS.indexOf(coverState.weekday) === -1) coverState.weekday = Edu.SCHOOL_DAYS[0];

      var res = await Edu.data('substitutes', {
        teacher_id: coverState.teacher, weekday: coverState.weekday,
      });

      var html = '<div class="edu-alert info">اختر المعلم الغائب واليوم — يعرض النظام حصصه ' +
        'ومَن هو <strong>فعلاً فاضٍ</strong> في كل حصة منها. هذا محسوب من الجدول نفسه، ' +
        'ولا يحتاج مراجعة يدوية.</div>';

      html += '<div class="edu-grid c2" style="gap:1rem;margin-bottom:1rem">' +
        '<div class="edu-field"><label for="cvTeacher">المعلم الغائب</label><select id="cvTeacher">' +
        teachers.map(function (t) {
          return '<option value="' + E(t.id) + '"' + (t.id === coverState.teacher ? ' selected' : '') +
            '>' + E(t.full_name) + '</option>';
        }).join('') + '</select></div>' +
        '<div class="edu-field"><label for="cvDay">اليوم</label><select id="cvDay">' +
        Edu.SCHOOL_DAYS.map(function (wd) {
          return '<option value="' + wd + '"' + (wd === coverState.weekday ? ' selected' : '') +
            '>' + E(Edu.weekdayName(wd)) + '</option>';
        }).join('') + '</select></div></div>';

      var gaps = res.gaps || [];
      html += '<div class="edu-card"><div class="edu-card-head"><h2>🔄 حصص تحتاج تغطية (' +
        gaps.length + ')</h2></div>';
      if (!gaps.length) {
        html += empty('🌤️', 'لا توجد حصص لهذا المعلم في ' + Edu.weekdayName(coverState.weekday));
      } else {
        html += '<div class="edu-list">' + gaps.map(function (g) {
          return '<div class="edu-row"><span class="edu-dot">' + g.period_no + '</span>' +
            '<div class="edu-row-main"><div class="edu-row-title">' + E(g.class_name || '—') +
            ' — ' + E(g.subject_name || '') + '</div>' +
            '<div class="edu-row-sub">' + (g.start_time ? E(Edu.fmtTime(g.start_time)) + ' · ' : '') +
            (g.available.length
              ? '<strong>متاح:</strong> ' + g.available.map(function (a) { return E(a.full_name); }).join(' · ')
              : '<span style="color:var(--edu-red)">لا يوجد معلم فاضٍ في هذه الحصة</span>') +
            '</div></div>' +
            '<div class="edu-row-end"><span class="edu-badge ' +
            (g.available.length ? 'ok' : 'danger') + '">' +
            (g.available.length ? g.available.length + ' متاح' : 'لا بديل') + '</span></div></div>';
        }).join('') + '</div>';
      }
      viewEl.innerHTML = html + '</div>';

      document.getElementById('cvTeacher').addEventListener('change', function () {
        coverState.teacher = this.value; viewCover(d);
      });
      document.getElementById('cvDay').addEventListener('change', function () {
        coverState.weekday = parseInt(this.value, 10); viewCover(d);
      });
    } catch (e) { fail(e); }
  }

  // ── الرسوم والتحصيل ──────────────────────────────────────────────────
  async function viewFinance(d) {
    loading();
    try {
      var res = await Edu.data('finance', {});
      var s = res.summary || {};
      var overdue = res.overdue || [];

      var html = '<div class="edu-grid c4" style="margin-bottom:1.25rem">' +
        stat('إجمالي المستحق', Edu.money(s.billed), s.count + ' فاتورة', '') +
        stat('المحصَّل', Edu.money(s.collected),
             s.collection_rate != null ? 'نسبة التحصيل ' + s.collection_rate + '%' : '', 'sky') +
        stat('المتبقي', Edu.money(s.outstanding), 'لم يُحصَّل بعد', 'amber') +
        stat('متأخرات', Edu.money(s.overdue), s.overdue_count + ' قسط تجاوز موعده',
             s.overdue_count ? 'red' : '') +
        '</div>';

      if (s.collection_rate != null) {
        var tone = s.collection_rate >= 85 ? '' : s.collection_rate >= 70 ? ' warn' : ' danger';
        html += '<div class="edu-card"><div class="edu-card-head"><h2>نسبة التحصيل</h2>' +
          '<span class="more edu-badge ' + (s.collection_rate >= 85 ? 'ok' : 'warn') + '">' +
          s.collection_rate + '%</span></div>' +
          '<div class="edu-bar' + tone + '"><span style="width:' +
          Math.min(100, s.collection_rate) + '%"></span></div></div>';
      }

      // قائمة المتابعة اليومية للمحاسب — الأعلى مبلغاً أولاً
      html += '<div class="edu-card"><div class="edu-card-head"><h2>🔴 متأخرات تحتاج متابعة (' +
        overdue.length + ')</h2>' +
        '<button class="more edu-btn ghost sm" data-quick="issue">+ إصدار أقساط لفصل</button></div>';
      if (!overdue.length) {
        html += empty('🎉', 'لا توجد متأخرات — التحصيل مكتمل');
      } else {
        html += '<div class="edu-table-wrap"><table class="edu-table"><thead><tr>' +
          '<th>الطالب</th><th>الفصل</th><th>البيان</th><th>الاستحقاق</th><th>المتبقي</th><th></th>' +
          '</tr></thead><tbody>' + overdue.slice(0, 60).map(function (inv) {
            return '<tr><td>' + E(inv.student_name || '—') +
              '<br><small style="color:var(--edu-muted)">' + E(inv.student_number || '') + '</small></td>' +
              '<td>' + E(inv.class_name || '—') + '</td><td>' + E(inv.title) + '</td>' +
              '<td>' + E(Edu.fmtShort(inv.due_date)) +
              '<br><small style="color:var(--edu-red)">' + E(Edu.relativeDay(inv.due_date)) + '</small></td>' +
              '<td><strong>' + E(Edu.money(inv.remaining)) + '</strong></td>' +
              '<td><button class="edu-btn ghost sm" data-pay="' + E(inv.id) +
              '" data-max="' + E(inv.remaining) + '" data-name="' + E(inv.student_name || '') +
              '">تسجيل دفعة</button></td></tr>';
          }).join('') + '</tbody></table></div>';
        if (overdue.length > 60) {
          html += '<p style="font-size:.78rem;color:var(--edu-muted);margin-top:.75rem">' +
            'معروض أول 60 من ' + overdue.length + ' — الباقي يظهر بعد معالجة هذه.</p>';
        }
      }
      html += '</div>';

      if ((res.payments || []).length) {
        html += '<div class="edu-card"><div class="edu-card-head"><h2>🧾 آخر المدفوعات</h2></div>' +
          '<div class="edu-list">' + res.payments.slice(0, 12).map(function (p) {
            return row('<span class="edu-dot">✅</span>', E(p.student_name || '—'),
              E(Edu.label(Edu.PAY_LABELS, p.method)) + ' · ' + E(Edu.fmtDate(p.paid_at)),
              '<strong>' + E(Edu.money(p.amount)) + '</strong>');
          }).join('') + '</div></div>';
      }

      viewEl.innerHTML = html;
      wire();

      Array.prototype.forEach.call(viewEl.querySelectorAll('[data-pay]'), function (b) {
        b.addEventListener('click', function () { openPayment(b); });
      });
    } catch (e) { fail(e); }
  }

  function openPayment(btn) {
    var id = btn.getAttribute('data-pay');
    var max = btn.getAttribute('data-max');
    document.getElementById('modalTitle').textContent = 'تسجيل دفعة — ' + btn.getAttribute('data-name');
    modalForm.innerHTML =
      '<div class="edu-field"><label for="pAmount">المبلغ المستلم (ر.س)</label>' +
      '<input id="pAmount" type="number" step="0.01" min="0.01" value="' + E(max) + '" required></div>' +
      '<div class="edu-field"><label for="pMethod">طريقة السداد</label><select id="pMethod">' +
      '<option value="transfer">تحويل بنكي</option><option value="card">شبكة / بطاقة</option>' +
      '<option value="cash">نقداً</option><option value="cheque">شيك</option></select></div>' +
      '<div class="edu-field"><label for="pRef">رقم العملية / المرجع</label><input id="pRef" placeholder="اختياري"></div>' +
      '<div class="edu-field"><label for="pDate">تاريخ السداد</label><input id="pDate" type="date" value="' +
      new Date().toISOString().slice(0, 10) + '"></div>' +
      '<button class="edu-btn green" type="submit" style="width:100%">تسجيل الدفعة</button>';
    modal.classList.add('open');

    modalForm.onsubmit = async function (e) {
      e.preventDefault();
      var amount = Number(val('pAmount'));
      if (!(amount > 0)) return Edu.toast('أدخل مبلغاً صحيحاً');
      var b = modalForm.querySelector('button[type="submit"]');
      b.disabled = true;
      b.textContent = 'جارٍ الحفظ...';
      try {
        await Edu.data('record_payment', {
          invoice_id: id, amount: amount, method: val('pMethod'),
          reference: val('pRef'), paid_at: val('pDate'),
        });
        Edu.toast('تم تسجيل الدفعة — يظهر التحديث لولي الأمر فوراً');
        closeModal();
        render();
      } catch (err) {
        Edu.toast(err.message);
        b.disabled = false;
        b.textContent = 'تسجيل الدفعة';
      }
    };
  }

  // ── استيراد الطلاب ───────────────────────────────────────────────────
  var importRows = [];

  function viewImport(d) {
    var classes = d.classes || [];
    viewEl.innerHTML = '<div class="edu-card"><div class="edu-card-head"><h2>📥 استيراد الطلاب</h2></div>' +
      '<div class="edu-alert info">انسخ الأعمدة من ملف Excel والصقها هنا مباشرة، أو ارفع ملف CSV. ' +
      'الترتيب المتوقع: <strong>اسم الطالب</strong> · رقم الطالب · رقم الهوية · الفصل. ' +
      'أول صف يُتجاهل إذا كان عناوين أعمدة.</div>' +
      '<div class="edu-grid c2" style="gap:1rem;margin-bottom:1rem">' +
      '<div class="edu-field"><label for="impFile">رفع ملف CSV</label>' +
      '<input id="impFile" type="file" accept=".csv,text/csv,text/plain"></div>' +
      '<div class="edu-field"><label for="impClass">الفصل الافتراضي (لمن لم يُحدَّد له فصل)</label>' +
      '<select id="impClass"><option value="">بدون فصل</option>' +
      classes.map(function (c) { return '<option value="' + E(c.id) + '">' + E(c.name) + '</option>'; }).join('') +
      '</select></div></div>' +
      '<div class="edu-field"><label for="impPaste">أو الصق البيانات هنا</label>' +
      '<textarea id="impPaste" style="min-height:150px;font-family:monospace;direction:ltr;text-align:left" ' +
      'placeholder="عبدالرحمن محمد&#9;4512&#9;1098765432&#10;ليان محمد&#9;4788&#9;1098765433"></textarea></div>' +
      '<button class="edu-btn ghost" id="impPreview">معاينة</button>' +
      '<div id="impResult" style="margin-top:1.25rem"></div></div>';

    document.getElementById('impFile').addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (!f) return;
      if (f.size > 2 * 1024 * 1024) return Edu.toast('حجم الملف كبير — الحد 2 ميجابايت');
      var reader = new FileReader();
      reader.onload = function () {
        document.getElementById('impPaste').value = String(reader.result || '');
        Edu.toast('تم تحميل الملف — اضغط معاينة');
      };
      reader.readAsText(f, 'utf-8');
    });

    document.getElementById('impPreview').onclick = previewImport;
  }

  // يقبل الفاصل TAB (لصق من Excel) أو الفاصلة (CSV)
  function parseRows(text, defaultClass, classes) {
    var byName = {};
    classes.forEach(function (c) { byName[String(c.name).trim()] = c.id; });
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (line, idx) {
      if (!line.trim()) return;
      var cells = (line.indexOf('\t') !== -1 ? line.split('\t') : line.split(','))
        .map(function (c) { return c.trim().replace(/^"|"$/g, ''); });
      // تجاهل صف العناوين
      if (idx === 0 && /اسم|name/i.test(cells[0])) return;
      if (!cells[0]) return;
      out.push({
        full_name: cells[0],
        student_number: cells[1] || '',
        national_id: cells[2] || '',
        class_id: (cells[3] && byName[cells[3]]) || defaultClass || null,
        class_label: cells[3] || '',
      });
    });
    return out;
  }

  function previewImport() {
    var classes = (state.base && state.base.classes) || [];
    var defaultClass = document.getElementById('impClass').value;
    importRows = parseRows(document.getElementById('impPaste').value, defaultClass, classes);
    var box = document.getElementById('impResult');

    if (!importRows.length) {
      box.innerHTML = '<div class="edu-alert danger">لم يُعثر على صفوف صالحة. تأكد أن العمود الأول هو اسم الطالب.</div>';
      return;
    }
    var byId = {};
    classes.forEach(function (c) { byId[c.id] = c.name; });
    var noClass = importRows.filter(function (r) { return !r.class_id; }).length;

    box.innerHTML = '<div class="edu-alert ok">جاهز لاستيراد <strong>' + importRows.length +
      '</strong> طالب' + (noClass ? ' — منهم <strong>' + noClass + '</strong> بلا فصل محدد (يمكن إسنادهم لاحقاً)' : '') +
      '</div><div class="edu-table-wrap"><table class="edu-table"><thead><tr>' +
      '<th>#</th><th>الاسم</th><th>رقم الطالب</th><th>رقم الهوية</th><th>الفصل</th>' +
      '</tr></thead><tbody>' + importRows.slice(0, 25).map(function (r, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + E(r.full_name) + '</td><td>' +
          E(r.student_number || '—') + '</td><td>' + E(r.national_id || '—') + '</td><td>' +
          E(byId[r.class_id] || '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (importRows.length > 25 ? '<p style="font-size:.78rem;color:var(--edu-muted);margin:.6rem 0">' +
        'معاينة أول 25 صف من ' + importRows.length + '.</p>' : '') +
      '<button class="edu-btn green" id="impConfirm" style="margin-top:1rem">تأكيد الاستيراد (' +
      importRows.length + ' طالب)</button>';

    document.getElementById('impConfirm').onclick = async function () {
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'جارٍ الاستيراد...';
      try {
        var res = await Edu.data('import_students', {
          students: importRows.map(function (r) {
            return { full_name: r.full_name, student_number: r.student_number,
                     national_id: r.national_id, class_id: r.class_id };
          }),
        });
        Edu.toast('تم استيراد ' + (res.created || importRows.length) + ' طالب');
        document.getElementById('impPaste').value = '';
        importRows = [];
        state.base = null;
        box.innerHTML = '<div class="edu-alert ok">تم الاستيراد بنجاح.</div>';
      } catch (e) {
        Edu.toast(e.message);
        btn.disabled = false;
        btn.textContent = 'إعادة المحاولة';
      }
    };
  }

  // ── النوافذ المنبثقة للإنشاء ─────────────────────────────────────────
  var modal = document.getElementById('modal');
  var modalForm = document.getElementById('modalForm');
  document.getElementById('modalClose').onclick = closeModal;
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

  function closeModal() { modal.classList.remove('open'); }

  function selectField(id, label, options, valueKey, labelKey) {
    return '<div class="edu-field"><label for="' + id + '">' + E(label) + '</label><select id="' + id + '">' +
      options.map(function (o) {
        return '<option value="' + E(o[valueKey]) + '">' + E(o[labelKey]) + '</option>';
      }).join('') + '</select></div>';
  }

  var FORMS = {
    exam: {
      title: 'اختبار جديد',
      html: function (d) {
        return selectField('fClass', 'الفصل', d.classes || [], 'id', 'name') +
          selectField('fSubject', 'المادة', d.subjects || [], 'id', 'name') +
          '<div class="edu-field"><label for="fTitle">عنوان الاختبار</label><input id="fTitle" required placeholder="اختبار الوحدة الثالثة"></div>' +
          '<div class="edu-field"><label for="fType">النوع</label><select id="fType">' +
          '<option value="quiz">اختبار قصير</option><option value="midterm">اختبار فترة</option>' +
          '<option value="final">اختبار نهائي</option></select></div>' +
          '<div class="edu-grid c2" style="gap:.75rem">' +
          '<div class="edu-field"><label for="fDate">التاريخ</label><input id="fDate" type="date" required></div>' +
          '<div class="edu-field"><label for="fTime">وقت البداية</label><input id="fTime" type="time"></div>' +
          '<div class="edu-field"><label for="fDur">المدة (دقيقة)</label><input id="fDur" type="number" value="45"></div>' +
          '<div class="edu-field"><label for="fMax">الدرجة العظمى</label><input id="fMax" type="number" value="20"></div>' +
          '</div>' +
          '<div class="edu-field"><label for="fLoc">المكان</label><input id="fLoc" placeholder="قاعة 103"></div>' +
          '<div class="edu-field"><label for="fTopics">المقرر المطلوب</label><textarea id="fTopics" placeholder="الوحدة الثالثة كاملة، صفحات 40–72"></textarea></div>';
      },
      collect: function () {
        return {
          table: 'edu_exams',
          data: {
            class_id: val('fClass'), subject_id: val('fSubject'), title: val('fTitle'),
            exam_type: val('fType'), exam_date: val('fDate'), start_time: val('fTime') || null,
            duration_min: Number(val('fDur')) || null, max_score: Number(val('fMax')) || 100,
            location: val('fLoc'), topics: val('fTopics'), teacher_id: session.user.id,
          },
        };
      },
      required: ['fTitle', 'fDate'],
    },
    homework: {
      title: 'واجب جديد',
      html: function (d) {
        return selectField('fClass', 'الفصل', d.classes || [], 'id', 'name') +
          selectField('fSubject', 'المادة', d.subjects || [], 'id', 'name') +
          '<div class="edu-field"><label for="fTitle">عنوان الواجب</label><input id="fTitle" required placeholder="تمارين الكسور — صفحة 74"></div>' +
          '<div class="edu-field"><label for="fDesc">التفاصيل</label><textarea id="fDesc" placeholder="حل التمارين من 1 إلى 12"></textarea></div>' +
          '<div class="edu-grid c2" style="gap:.75rem">' +
          '<div class="edu-field"><label for="fDue">موعد التسليم</label><input id="fDue" type="date" required></div>' +
          '<div class="edu-field"><label for="fMax">الدرجة</label><input id="fMax" type="number" value="10"></div>' +
          '</div>';
      },
      collect: function () {
        return {
          table: 'edu_homework',
          data: {
            class_id: val('fClass'), subject_id: val('fSubject'), title: val('fTitle'),
            description: val('fDesc'), due_date: val('fDue'),
            max_score: Number(val('fMax')) || 10, teacher_id: session.user.id,
          },
        };
      },
      required: ['fTitle', 'fDue'],
    },
    announcement: {
      title: 'إعلان جديد',
      html: function (d) {
        return '<div class="edu-field"><label for="fClass">النطاق</label><select id="fClass">' +
          '<option value="">كل المدرسة</option>' +
          (d.classes || []).map(function (c) {
            return '<option value="' + E(c.id) + '">' + E(c.name) + '</option>';
          }).join('') + '</select></div>' +
          '<div class="edu-field"><label for="fAudience">الفئة المستهدفة</label><select id="fAudience">' +
          '<option value="all">الجميع</option><option value="parents">أولياء الأمور</option>' +
          '<option value="students">الطلاب</option><option value="teachers">المعلمون</option></select></div>' +
          '<div class="edu-field"><label for="fTitle">العنوان</label><input id="fTitle" required placeholder="اجتماع أولياء الأمور"></div>' +
          '<div class="edu-field"><label for="fBody">نص الإعلان</label><textarea id="fBody"></textarea></div>' +
          '<div class="edu-field"><label style="display:flex;align-items:center;gap:.5rem;font-weight:500">' +
          '<input id="fPinned" type="checkbox" style="width:auto"> تثبيت الإعلان في الأعلى</label></div>';
      },
      collect: function () {
        return {
          table: 'edu_announcements',
          data: {
            class_id: val('fClass') || null, audience: val('fAudience'),
            title: val('fTitle'), body: val('fBody'),
            pinned: document.getElementById('fPinned').checked,
          },
        };
      },
      required: ['fTitle'],
    },
    issue: {
      title: 'إصدار أقساط لفصل كامل',
      html: function (d) {
        return '<div class="edu-alert info">تُنشأ فاتورة لكل طالب في الفصل، مقسّمة على عدد الأقساط، ' +
          'باستحقاق شهري يبدأ من التاريخ المحدد.</div>' +
          selectField('fClass', 'الفصل', d.classes || [], 'id', 'name') +
          '<div class="edu-grid c2" style="gap:.75rem">' +
          '<div class="edu-field"><label for="fTotal">إجمالي الرسوم للطالب (ر.س)</label>' +
          '<input id="fTotal" type="number" min="1" step="0.01" value="18000" required></div>' +
          '<div class="edu-field"><label for="fCount">عدد الأقساط</label>' +
          '<input id="fCount" type="number" min="1" max="12" value="4" required></div>' +
          '<div class="edu-field"><label for="fFirst">استحقاق القسط الأول</label>' +
          '<input id="fFirst" type="date" required></div>' +
          '<div class="edu-field"><label for="fYear">العام الدراسي</label>' +
          '<input id="fYear" placeholder="1447"></div>' +
          '</div>';
      },
      collect: function () {
        return {
          _action: 'issue_invoices',
          class_id: val('fClass'), total_amount: Number(val('fTotal')),
          installments: Number(val('fCount')), first_due_date: val('fFirst'),
          academic_year: val('fYear'),
        };
      },
      required: ['fTotal', 'fCount', 'fFirst'],
    },
  };

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function openForm(kind) {
    var cfg = FORMS[kind];
    if (!cfg) return;
    document.getElementById('modalTitle').textContent = cfg.title;
    modalForm.innerHTML = cfg.html(state.base || {}) +
      '<button class="edu-btn green" type="submit" style="width:100%;margin-top:.5rem">حفظ</button>';
    modal.classList.add('open');

    modalForm.onsubmit = async function (e) {
      e.preventDefault();
      for (var i = 0; i < cfg.required.length; i++) {
        if (!val(cfg.required[i])) return Edu.toast('أكمل الحقول المطلوبة');
      }
      var btn = modalForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'جارٍ الحفظ...';
      try {
        // بعض النماذج تستدعي إجراءً خاصاً بدل الحفظ العام (مثل إصدار الأقساط)
        var payload = cfg.collect();
        var custom = payload._action;
        if (custom) { delete payload._action; }
        var out = await Edu.data(custom || 'save', payload);
        Edu.toast(custom === 'issue_invoices' && out && out.invoices
          ? 'تم إصدار ' + out.invoices + ' فاتورة لـ ' + out.students + ' طالب'
          : 'تم الحفظ — سيظهر لأولياء الأمور والطلاب مباشرة');
        closeModal();
        state.base = null;
        render();
      } catch (err) {
        Edu.toast(err.message);
        btn.disabled = false;
        btn.textContent = 'حفظ';
      }
    };
  }

  // ── أدوات ────────────────────────────────────────────────────────────
  function classPicker(classes) {
    return '<div class="edu-kids">' + classes.map(function (c) {
      return '<button class="edu-kid' + (c.id === state.classId ? ' active' : '') +
        '" data-class="' + E(c.id) + '"><span>' + E(c.name) + '</span></button>';
    }).join('') + '</div>';
  }

  function card(title, inner, action) {
    return '<div class="edu-card"><div class="edu-card-head"><h2>' + title + '</h2>' +
      (action || '') + '</div>' + inner + '</div>';
  }

  function empty(icon, text) {
    return '<div class="edu-empty"><div class="ico">' + icon + '</div><p>' + E(text) + '</p></div>';
  }

  function stat(lbl, val_, hint, cls) {
    return '<div class="edu-stat ' + (cls || '') + '"><div class="lbl">' + E(lbl) + '</div>' +
      '<div class="val">' + E(val_) + '</div><div class="hint">' + E(hint || '') + '</div></div>';
  }

  function row(icon, title, sub, end) {
    return '<div class="edu-row">' + icon + '<div class="edu-row-main">' +
      '<div class="edu-row-title">' + title + '</div><div class="edu-row-sub">' + sub + '</div></div>' +
      '<div class="edu-row-end">' + (end || '') + '</div></div>';
  }

  function wire() {
    Array.prototype.forEach.call(viewEl.querySelectorAll('[data-nav]'), function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-nav')); });
    });
    Array.prototype.forEach.call(viewEl.querySelectorAll('[data-quick]'), function (b) {
      b.addEventListener('click', function () { openForm(b.getAttribute('data-quick')); });
    });
    Array.prototype.forEach.call(viewEl.querySelectorAll('[data-class]'), function (b) {
      b.addEventListener('click', function () {
        state.classId = b.getAttribute('data-class');
        render();
      });
    });
  }

  var initial = (location.hash || '').replace('#', '');
  go(TITLES[initial] ? initial : 'overview');
})();
</script>
</body>
</html>
