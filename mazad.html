<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزاد سوم | للأرقام المميزة</title>
<meta name="description" content="مزاد سوم — مزاد مباشر للأرقام المميزة. اعرض رقمك، والناس تزايد عليه لحظة بلحظة.">
<meta name="theme-color" content="#0b5c37">
<meta property="og:title" content="مزاد سوم | للأرقام المميزة">
<meta property="og:description" content="اعرض رقمك المميز، والناس تزايد عليه مباشرة. أعلى سوم يكسب.">
<meta property="og:image" content="/mazad-og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/mazad-og.png">
<meta property="og:type" content="website">
<link rel="icon" href="/mazad-icon.png" sizes="512x512">
<link rel="apple-touch-icon" href="/mazad-icon.png">
<style>
@font-face { font-family: 'ThmanyahSans'; src: url('/fonts/thmanyah-Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'ThmanyahSans'; src: url('/fonts/thmanyah-Medium.otf')  format('opentype'); font-weight: 500 600; font-display: swap; }
@font-face { font-family: 'ThmanyahSans'; src: url('/fonts/thmanyah-Bold.otf')    format('opentype'); font-weight: 700 900; font-display: swap; }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --green-900: #05301d;
  --green-800: #073f27;
  --green-700: #0b5c37;
  --green-600: #0f7a49;
  --green-500: #16a35f;
  --gold-500:  #d9a441;
  --gold-400:  #edc26b;
  --ink:       #0d1512;
  --muted:     #6b7b73;
  --line:      #e3eae6;
  --bg:        #f4f7f5;
  --card:      #ffffff;
  --danger:    #c0392b;
  --radius:    16px;
  --shadow:    0 2px 14px rgba(5, 48, 29, .08);
  --shadow-lg: 0 14px 40px rgba(5, 48, 29, .18);
}

html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'ThmanyahSans', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100dvh;
  overflow-wrap: break-word;
}
button, input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; }

/* numbers stay LTR inside RTL text */
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ---------- layout ---------- */
.wrap { max-width: 720px; margin: 0 auto; padding: 0 14px 120px; }

.topbar {
  background: linear-gradient(135deg, var(--green-800), var(--green-600));
  color: #fff;
  padding: 14px 0 18px;
  box-shadow: var(--shadow);
  position: sticky; top: 0; z-index: 40;
}
.topbar .wrap { padding-bottom: 0; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
  color: var(--green-900); font-weight: 900; font-size: .92rem;
  display: grid; place-items: center;
}
.brand-name { font-weight: 700; font-size: 1.1rem; line-height: 1.2; }
.brand-sub  { font-size: .72rem; opacity: .8; }

.chip-name {
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25);
  color: #fff; padding: 7px 12px; border-radius: 999px;
  font-size: .82rem; font-weight: 600; max-width: 140px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip-name:active { transform: scale(.97); }

.banner {
  margin: 10px 0 0; padding: 9px 12px; border-radius: 12px;
  background: rgba(255,255,255,.12); font-size: .78rem; line-height: 1.5;
}
.banner b { color: var(--gold-400); }

/* ---------- toolbar ---------- */
.toolbar { display: flex; gap: 8px; align-items: center; margin: 16px 0 12px; }
.filters { display: flex; gap: 6px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter {
  padding: 7px 14px; border-radius: 999px; background: #fff;
  border: 1px solid var(--line); font-size: .84rem; font-weight: 600;
  color: var(--muted); white-space: nowrap;
}
.filter.on { background: var(--green-700); border-color: var(--green-700); color: #fff; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: .95rem;
  background: var(--green-600); color: #fff; transition: transform .08s, filter .15s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-gold  { background: linear-gradient(135deg, var(--gold-500), #c2892b); color: #2a1c02; }
.btn-ghost { background: #fff; color: var(--green-700); border: 1px solid var(--line); }
.btn-sm    { padding: 8px 12px; font-size: .82rem; border-radius: 10px; }
.btn-block { width: 100%; }

/* ---------- cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
}
.lot { display: block; width: 100%; text-align: right; }
.lot-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.badge {
  font-size: .7rem; font-weight: 700; padding: 4px 9px; border-radius: 999px;
  background: #eef4f0; color: var(--green-700);
}
.badge.live   { background: #e7f7ee; color: var(--green-600); }
.badge.sold   { background: #fdf0e6; color: #b5651d; }
.badge.ended  { background: #f0f2f1; color: var(--muted); }
.badge.unsold { background: #fdecea; color: #c0392b; }
.badge.wait   { background: #eef2f7; color: #4a6b8a; }
.badge.air    { background: #ffe9e7; color: #c0392b; }
.badge.dot::before {
  content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; margin-inline-end: 5px; vertical-align: middle;
  animation: pulse 1.4s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

.phone-plate {
  background: linear-gradient(135deg, var(--green-900), var(--green-700));
  color: #fff; border-radius: 14px; padding: 14px 12px; text-align: center;
  border: 2px solid var(--gold-500);
}
.phone-digits {
  font-size: clamp(1.35rem, 6.6vw, 2.4rem); font-weight: 900; letter-spacing: .04em;
  direction: ltr; unicode-bidi: isolate; white-space: nowrap;
}
.phone-carrier { font-size: .72rem; opacity: .85; margin-top: 2px; }

.lot-stats { display: flex; gap: 8px; margin-top: 12px; }
.stat { flex: 1; background: #f7faf8; border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; }
.stat-k { font-size: .68rem; color: var(--muted); }
.stat-v { font-weight: 800; font-size: .98rem; }
.stat-v.price { color: var(--green-600); }
.stat-v.time  { color: #b5651d; }
.stat-v.over  { color: var(--muted); }

.lot-foot { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: .78rem; color: var(--muted); }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty-emoji { font-size: 2.4rem; }

/* ---------- detail ---------- */
.backlink { display: inline-flex; align-items: center; gap: 6px; margin: 14px 0 10px; font-size: .9rem; font-weight: 600; color: var(--green-700); }

.price-hero { text-align: center; padding: 6px 0 2px; }
.price-hero .k { font-size: .78rem; color: var(--muted); }
.price-hero .v { font-size: clamp(1.8rem, 9vw, 2.6rem); font-weight: 900; color: var(--green-600); }
.price-hero .who { font-size: .82rem; color: var(--muted); }

.countdown {
  text-align: center; font-weight: 900; font-size: 1.6rem; letter-spacing: .04em;
  direction: ltr; unicode-bidi: isolate; color: var(--green-800);
}
.countdown.warn { color: var(--danger); animation: pulse 1s infinite; }

/* chat feed */
.feed { max-height: 46vh; overflow-y: auto; padding: 4px 2px; display: flex; flex-direction: column; gap: 8px; }
.feed .bid-row:first-child { box-shadow: var(--shadow); }
.msg { display: flex; flex-direction: column; max-width: 84%; }
/* RTL chat: my own bids sit on the left, everyone else's on the right */
.msg.mine { align-self: flex-end; }
.msg:not(.mine) { align-self: flex-start; }
.msg.mine .msg-meta { text-align: left; }
.msg-bubble {
  background: #f1f5f3; border: 1px solid var(--line); border-radius: 14px;
  padding: 8px 12px; font-weight: 700;
}
.msg.mine .msg-bubble { background: var(--green-600); border-color: var(--green-600); color: #fff; }
.msg.top .msg-bubble  { background: #fff7e8; border-color: var(--gold-500); color: #7a4f05; }
.msg.mine.top .msg-bubble { background: linear-gradient(135deg, var(--gold-500), #c2892b); color: #2a1c02; }
.msg-meta { font-size: .68rem; color: var(--muted); padding: 0 6px; }
.msg-amount { font-size: 1.05rem; }

.bidbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 30;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.bidbar .inner { max-width: 720px; margin: 0 auto; }
.quick { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: 7px 12px; font-size: .82rem; font-weight: 700; white-space: nowrap; color: var(--green-700);
}
.bid-wait {
  background: #fffaf0; border: 1px solid #f0dcb0; color: #7a4f05;
  border-radius: 10px; padding: 7px 10px; margin-bottom: 8px;
  font-size: .8rem; font-weight: 600; text-align: center;
}
.bid-now { text-align: center; font-size: .88rem; color: var(--muted); margin-bottom: 8px; }
.bid-now b { color: var(--green-600); font-size: 1.15rem; }
.bid-or { text-align: center; font-size: .75rem; color: var(--muted); margin: 9px 0 6px; }
#btnQuick { font-size: 1.02rem; padding: 14px; }
.bidrow { display: flex; gap: 8px; }
.bidrow input {
  flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  background: #fff; font-weight: 700; direction: ltr; text-align: right;
}
.bidrow input:focus { outline: 2px solid var(--green-500); outline-offset: -1px; }

/* ---------- forms / modal ---------- */
.sheet-bg {
  position: fixed; inset: 0; background: rgba(5,48,29,.45); z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: #fff; width: 100%; max-width: 720px; max-height: 92dvh; overflow-y: auto;
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-lg); animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6 } to { transform: none; opacity: 1 } }
.sheet h2 { font-size: 1.15rem; margin-bottom: 4px; }
.sheet .hint { font-size: .8rem; color: var(--muted); margin-bottom: 14px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: .82rem; font-weight: 700; margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fbfdfc;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--green-500); outline-offset: -1px; background: #fff; }
.field .sub { font-size: .72rem; color: var(--muted); margin-top: 4px; }
.field.ltr input { direction: ltr; text-align: right; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; }

.err { background: #fdecea; color: var(--danger); border-radius: 10px; padding: 9px 12px; font-size: .83rem; margin-bottom: 10px; }

.toast {
  position: fixed; inset-inline: 0; bottom: 96px; z-index: 90;
  display: flex; justify-content: center; pointer-events: none;
}
.toast div {
  background: var(--green-900); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: .86rem; font-weight: 600; box-shadow: var(--shadow-lg); max-width: 90%;
}

.adminbar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.adminbar button { font-size: .75rem; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-weight: 700; }
.adminbar .del { color: var(--danger); border-color: #f3c6c1; }

/* ---------- sold / unsold stamp ---------- */
/* pressed under the number, never over it — on a broadcast the viewer
   has to read the number and the result at the same time */
.stamp {
  display: inline-block; margin-top: 9px; transform: rotate(-3deg);
  border: 3px solid currentColor; border-radius: 10px;
  padding: 3px 14px; font-weight: 900; font-size: 1.05rem;
  letter-spacing: .02em; white-space: nowrap; pointer-events: none;
  background: rgba(255,255,255,.96); box-shadow: 0 4px 14px rgba(0,0,0,.18);
}
.live-plate .stamp { font-size: 1.5rem; padding: 5px 20px; border-width: 4px; margin-top: 12px; }
.phone-plate .stamp { background: #fff; }
.stamp.sold      { color: #12833f; }
.stamp.unsold    { color: #c0392b; }
.stamp.cancelled { color: #6b7b73; }
.plate-wrap { position: relative; }

/* a sum on a number's page: paddle, who raised it, how much */
.bid-row {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-radius: 14px;
  padding: 8px 12px; background: #fff;
}
.bid-row.top { border-color: var(--gold-500); background: #fffaf0; }
.bid-row .paddle { width: 46px; flex: none; }
.bid-who { flex: 1; min-width: 0; }
.bid-who b { display: block; font-size: .9rem; }
.bid-who span { font-size: .72rem; color: var(--muted); }
.bid-amt { font-weight: 900; font-size: 1.05rem; color: var(--green-600); }
.bid-row.top .bid-amt { color: #a9741d; }

/* the same paddles, big, on the broadcast screen */
.live-paddles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.lp { width: 62px; text-align: center; }
.lp.top { width: 78px; }
.lp-name { font-size: .7rem; color: #dff0e6; margin-top: 4px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.lp.top .lp-name { color: var(--gold-400); font-weight: 700; }

/* ---------- the raised paddle ---------- */
.paddle { display: inline-block; line-height: 0; }
.paddle svg { width: 100%; height: auto; overflow: visible; }

.p-shadow   { fill: rgba(0,0,0,.22); }
.p-edge     { fill: rgba(0,0,0,.30); }
.p-board    { stroke: rgba(0,0,0,.18); stroke-width: 1.5; }
.p-gloss    { fill: url(#gGloss); }
.p-stick    { fill: url(#gWood); }
.p-stick-hi { fill: rgba(255,255,255,.45); }

.p-palm     { fill: url(#gSkin); }
.p-palm-sh  { fill: rgba(120,72,32,.20); }
.p-fg-body  { fill: url(#gFinger); stroke: rgba(132,80,36,.55); stroke-width: 1.2; }
.p-fg-joint { stroke: rgba(132,80,36,.42); stroke-width: 1.3; fill: none; stroke-linecap: round; }
.p-fg-knuck { fill: rgba(255,255,255,.28); }
.p-nail     { fill: url(#gNail); stroke: rgba(132,80,36,.45); stroke-width: .9; }
.p-thumb    { fill: url(#gFinger); stroke: rgba(132,80,36,.6); stroke-width: 1.3; }

.p-amount {
  fill: #0d2a1c; font-family: inherit; font-weight: 900; font-size: 31px;
  text-anchor: middle; direction: ltr; unicode-bidi: isolate;
}
.paddle.top  .p-amount { fill: #4a3208; }
.paddle.mine .p-amount { fill: #fff; }
.paddle.mine .p-board  { stroke: rgba(0,0,0,.35); }

.paddle.raise { animation: raise .5s cubic-bezier(.2,.9,.3,1.35); transform-origin: 50% 100%; }
@keyframes raise {
  from { transform: translateY(30px) rotate(-7deg); opacity: 0 }
  60%  { transform: translateY(-3px) rotate(2deg);  opacity: 1 }
  to   { transform: none; opacity: 1 }
}

/* ---------- private control panel ---------- */
.ctl-top { display: flex; align-items: center; gap: 8px; margin: 14px 0 10px; }
.ctl-top b { font-size: 1rem; }
.ctl-top span { font-size: .76rem; color: var(--muted); }
.ctl-top > div { flex: 1; }
.ctl-now { text-align: center; padding-bottom: 12px; border-bottom: 1px dashed var(--line); margin-bottom: 12px; }
.ctl-now .k { font-size: .74rem; color: var(--muted); }
.ctl-digits { font-size: clamp(1.3rem, 7vw, 2.1rem); font-weight: 900; letter-spacing: .03em; white-space: nowrap; }
.ctl-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.ctl-price { font-weight: 900; color: var(--green-600); font-size: 1.1rem; }
.ctl-clock { font-weight: 900; color: #b5651d; font-size: 1.1rem; }
.ctl-who { font-size: .78rem; color: var(--muted); margin-top: 6px; }
.ctl-q { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; margin-bottom: 6px; }
.ctl-q b { font-size: 1rem; }
.ctl-q span { flex: 1; font-size: .78rem; color: var(--muted); }
.ctl-q button { background: var(--green-600); color: #fff; border-radius: 9px; padding: 7px 13px; font-size: .78rem; font-weight: 800; }
.ctl-q button.del { background: #fdecea; color: var(--danger); border: 1px solid #f3c6c1; padding: 7px 10px; }

/* the operator bar on a light card */
.opbar.light { border-top: none; padding-top: 0; }
.opbar.light .lbl { color: var(--muted); }
.opbar.light button { background: #f2f6f4; color: var(--ink); border: 1px solid var(--line); }
.opbar.light button.sold   { background: #12833f; border-color: #12833f; color: #fff; }
.opbar.light button.unsold { background: #c0392b; border-color: #c0392b; color: #fff; }
.opbar.light button.start  { background: #12833f; border-color: #12833f; color: #fff; }
.opbar.light button.next   { background: linear-gradient(135deg,#f6dd9e,#d9a441); color: #2a1c02; border-color: transparent; }

.pill { background: var(--danger); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: .74rem; }
.ctl-bid {
  display: flex; align-items: center; gap: 8px; border: 1px solid #f0dcb0;
  background: #fffaf0; border-radius: 12px; padding: 9px 11px; margin-bottom: 6px;
}
.ctl-bid .who { min-width: 84px; max-width: 110px; }
.ctl-bid .who b { display: block; font-size: .9rem; }
.ctl-bid .who span { font-size: .7rem; color: var(--muted); }
.ctl-bid .amt { font-weight: 900; font-size: 1.05rem; color: var(--green-700); }
.ctl-bid button { border-radius: 10px; padding: 8px 12px; font-size: .95rem; font-weight: 900; }
.ctl-bid button.yes { background: #12833f; color: #fff; }
.ctl-bid button.no  { background: #fdecea; color: var(--danger); border: 1px solid #f3c6c1; }
.ctl-bid.ok   { border-color: #bfe3cd; background: #f3fbf6; }
.ctl-bid.thin { border-color: #f0dcb0; background: #fffaf0; }
.ctl-bid.low  { border-color: #f3c6c1; background: #fdf3f2; }
.ctl-bid .cmp { flex: 1; min-width: 0; text-align: center; }
.cmp-line { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.cmp-now { color: var(--muted); font-weight: 700; font-size: .92rem; }
.cmp-arrow { color: var(--muted); font-size: .8rem; }
.cmp-note { font-size: .7rem; color: var(--muted); margin-top: 2px; }
.ctl-bid.ok  .cmp-note { color: #12833f; }
.ctl-bid.low .cmp-note { color: var(--danger); }
.ctl-bid button.yes[disabled] { opacity: .35; }
.ctl-bid.done { background: #f4f9f6; border-color: var(--line); }
.ctl-bid.done .amt { color: var(--green-600); }
button.ctl-price { background: #eef7f1; border: 1px solid #cfe6d9; border-radius: 10px; padding: 4px 10px; }
button.ctl-price:active { transform: scale(.97); }

/* ---------- live broadcast screen ---------- */
.live {
  background: radial-gradient(120% 90% at 50% 0%, #0f7a49, #073f27 48%, #04281a);
  border-radius: 20px; padding: 16px 14px 20px; color: #fff; margin-top: 14px;
  border: 2px solid rgba(217,164,65,.45); box-shadow: var(--shadow-lg);
}
.live-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.live-dot {
  background: #ff3b30; color: #fff; font-size: .75rem; font-weight: 800;
  padding: 4px 11px; border-radius: 999px;
}
.live-dot::before {
  content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: #fff; margin-inline-end: 6px; vertical-align: middle; animation: pulse 1.1s infinite;
}
.live-seq { font-size: .78rem; color: #cfe6d9; }

.live-plate {
  background: #fff; color: #0b2a1b; border-radius: 16px; border: 3px solid var(--gold-500);
  padding: 16px 10px; text-align: center; position: relative; overflow: hidden;
}
.live-digits {
  font-size: clamp(1.5rem, 8vw, 3.4rem); font-weight: 900; letter-spacing: .03em;
  direction: ltr; unicode-bidi: isolate; line-height: 1.1;

<script>
/* =====================================================================
   مزاد سوم — single-page auction, no build step, no backend function.
   ---------------------------------------------------------------------
   The page talks to Supabase REST directly with the PUBLIC anon key.
   All the rules (bid must beat the price, auction still open, …) live in
   the database — see supabase-mazad.sql. Nothing here is trusted.

   The database is already set up (project "mazad-arqam", schema applied from
   supabase-mazad.sql). Clearing the two constants below drops the page back
   to وضع تجريبي — a local demo on localStorage, this browser only.
   ===================================================================== */

/* Supabase project "mazad-arqam" (ap-south-1) — its own project, deliberately
   separate from the RAFD database. The key below is the PUBLIC anon key: it is
   meant to ship in the page. It can only read listings/bids and create a
   listing; it cannot change a price, close an auction, or read the operator
   secret — see supabase-mazad.sql.
   The project's modern publishable key works too, if the legacy key is ever
   rotated out: sb_publishable_137ORWCtoU2UZEEEfr4NzQ_sxWFyuXl */
const SUPABASE_URL      = 'https://afvgsubxuquzlkxyondf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdmdzdWJ4dXF1emxreHlvbmRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjE5NTMsImV4cCI6MjEwNTIzNzk1M30.LtmCBLoTHrKjSECjOBrOSottbJawytm70DDpH4TkgXE';

/* Commission, على ذمة البائع: a flat 200 SAR, but 2.5% once the number sells
   for more than 20,000. Note the step at the threshold — 20,000 costs 200,
   20,001 costs 500 — that is the rule as set, not a rounding artefact. */
const FEE_FLAT      = 200;
const FEE_THRESHOLD = 20000;
const FEE_RATE      = 0.025;
const MIN_STEP      = 50;      // smallest raise, in SAR
const STEP_PERCENT  = 0.05;    // or 5% of the current price, whichever is bigger
const POLL_MS       = 2500;    // how often the page refreshes itself
/* Sale prices are not public yet. Flip to true once there is enough history
   that a results archive helps sellers instead of exposing every deal. */
const SHOW_FINISHED = false;

/* ---------------------------------------------------------------- utils */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch {}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

const $  = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = (n) => Number(n || 0).toLocaleString('en-US');

/* Every countdown is the gap between a timestamp the SERVER wrote and "now".
   Taking "now" from the device is wrong: a phone whose clock is ten minutes
   slow shows a one-minute auction as eleven. So measure the difference once,
   keep it, and run every time calculation through it. */
let lastSeenBid = null;                  // so a paddle is raised once, not every refresh
let clockSkew = 0;                       // server time minus this device's clock
const nowMs = () => Date.now() + clockSkew;

function toast(msg) {
  const host = $('#toastHost');
  host.innerHTML = '<div class="toast"><div>' + esc(msg) + '</div></div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => host.innerHTML = '', 2600);
}

/* A queued number arrives masked as 054•••••01 — keep the mask characters so
   it still groups like a phone number. */
function fmtPhone(p) {
  const d = String(p || '').replace(/[^0-9•]/g, '');
  return d.length === 10 ? d.slice(0,3) + ' ' + d.slice(3,6) + ' ' + d.slice(6) : d;
}
const isMasked = (lot) => Boolean(lot && (lot.phone_masked || String(lot.phone || '').includes('•')));
const CARRIERS = { stc: 'STC', mobily: 'موبايلي', zain: 'زين', other: 'أخرى' };

function stepFor(current) { return Math.max(MIN_STEP, Math.ceil(current * STEP_PERCENT)); }
function commissionOn(price) {
  const p = Number(price || 0);
  return p > FEE_THRESHOLD ? Math.round(p * FEE_RATE) : FEE_FLAT;
}
const FEE_RATE_LABEL = (FEE_RATE * 100).toString().replace(/\.0$/, '') + '%';
/* one sentence, used everywhere the rule is stated */
const FEE_RULE = money(FEE_FLAT) + ' ر.س، وإذا زاد سعر البيع عن ' +
                 money(FEE_THRESHOLD) + ' ر.س تكون ' + FEE_RATE_LABEL;

function countdown(endAt) {
  if (!endAt) return null;
  let ms = new Date(endAt).getTime() - nowMs();
  if (ms <= 0) return null;
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), ss = s % 60;
  const pad = (x) => String(x).padStart(2, '0');
  return d > 0 ? d + ' ي ' + pad(h) + ':' + pad(m) + ':' + pad(ss)
               : pad(h) + ':' + pad(m) + ':' + pad(ss);
}

function ago(ts) {
  const s = Math.floor((nowMs() - new Date(ts).getTime()) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return 'قبل ' + Math.floor(s / 60) + ' د';
  if (s < 86400) return 'قبل ' + Math.floor(s / 3600) + ' س';
  return 'قبل ' + Math.floor(s / 86400) + ' ي';
}

/* state of a listing, derived — never trusted from a client write */
function lotState(lot) {
  if (lot.status === 'pending') return 'pending';   // in the queue, no clock yet
  if (lot.status === 'sold') return 'sold';
  if (lot.status === 'unsold') return 'unsold';
  if (lot.status === 'cancelled') return 'cancelled';
  if (!lot.end_at) return 'pending';
  return new Date(lot.end_at).getTime() <= nowMs() ? 'ended' : 'live';
}

/* the sticker that goes on a finished number */
const STAMP = { sold: 'تم البيع ✔', unsold: 'لم يتم البيع', cancelled: 'ملغي' };
function stampFor(st) {
  return STAMP[st] ? '<div class="stamp ' + st + '">' + STAMP[st] + '</div>' : '';
}
function badgeFor(st) {
  if (st === 'pending') return '<span class="badge wait">بانتظار الدور</span>';
  if (st === 'live')   return '<span class="badge live dot">السوم مفتوح</span>';
  if (st === 'sold')   return '<span class="badge sold">تم البيع</span>';
  if (st === 'unsold') return '<span class="badge unsold">لم يتم البيع</span>';
  if (st === 'cancelled') return '<span class="badge ended">ملغي</span>';
  return '<span class="badge ended">انتهى</span>';
}

/* ------------------------------------------------------------- identity */
const me = {
  get name() { return localStorage.getItem('mazad_name') || ''; },
  set name(v) { localStorage.setItem('mazad_name', v); paintName(); }
};
function paintName() {
  $('#nameChip').textContent = me.name ? '👤 ' + me.name : 'اسمك؟';
}

/* --------------------------------------------------------------- store */
const REMOTE = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

/* Sums this device sent that have not been approved yet. The site has no
   accounts, so a pending bid is invisible to everyone but its sender —
   remembered here so the bidder is not left wondering. */
let myPending = (() => {
  try { return JSON.parse(localStorage.getItem('mazad_pending') || '{}'); } catch { return {}; }
})();

const remote = {
  async req(path, opts = {}) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
      ...opts,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
        ...(opts.headers || {})
      }
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if (!res.ok) throw new Error((data && (data.message || data.hint)) || 'network');
    return data;
  },
  /* mazad_public masks a queued number and carries no seller contact at all,
     so neither ever reaches a viewer's browser. The operator asks for the real
     rows with the secret instead. */
  async listings() {
    if (admin.on) {
      try {
        const r = await this.req('rpc/mazad_admin_list', {
          method: 'POST', body: JSON.stringify({ p_secret: admin.secret })
        });
        if (r && r.ok && r.listings) return r.listings;
      } catch (e) { console.warn('admin list failed, falling back', e); }
    }
    return this.req('mazad_public?select=*&order=created_at.desc&limit=200');
  },
  async listing(id) {
    if (admin.on) {
      const all = await this.listings();
      const hit = all.find(l => l.id === id);
      if (hit) return hit;
    }
    return this.req('mazad_public?select=*&id=eq.' + encodeURIComponent(id)).then(r => r[0] || null);
  },
  bids(id) {
    return this.req('mazad_bids?select=*&listing_id=eq.' + encodeURIComponent(id) + '&order=created_at.asc&limit=500');
  },
  async createListing(body) {
    // anon may INSERT but not SELECT the table, so ask for no row back and
    // generate the id here instead
    const id = uuid();
    await this.req('mazad_listings', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({ ...body, id })
    });
    return { ...body, id };
  },
  placeBid(id, name, amount) {
    return this.req('rpc/place_bid', {
      method: 'POST',
      body: JSON.stringify({ p_listing: id, p_name: name, p_amount: amount })
    });
  },
  admin(id, secret, action, minutes, price) {
    return this.req('rpc/mazad_admin', {
      method: 'POST',
      body: JSON.stringify({
        p_listing: id, p_secret: secret, p_action: action,
        p_minutes: minutes ?? null, p_price: price ?? null
      })
    });
  },
  pendingBids(secret) {
    return this.req('rpc/mazad_pending_bids', {
      method: 'POST', body: JSON.stringify({ p_secret: secret })
    });
  },
  bidAction(bidId, secret, action) {
    return this.req('rpc/mazad_bid_action', {
      method: 'POST', body: JSON.stringify({ p_bid: bidId, p_secret: secret, p_action: action })
    });
  },
  manualBid(listing, secret, name, amount) {
    return this.req('rpc/mazad_manual_bid', {
      method: 'POST',
      body: JSON.stringify({ p_listing: listing, p_secret: secret, p_name: name, p_amount: amount })
    });
  },
  bidsOf(listing, secret) {
    return this.req('rpc/mazad_bids_of', {
      method: 'POST', body: JSON.stringify({ p_listing: listing, p_secret: secret })
    });
  },
  serverNow() {
    return this.req('rpc/mazad_now', { method: 'POST', body: '{}' });
  },
  operatorCreate(secret, d) {
    return this.req('rpc/mazad_create', {
      method: 'POST',
      body: JSON.stringify({
        p_secret: secret, p_phone: d.phone, p_carrier: d.carrier || null,
        p_start: d.start_price, p_seller: d.seller_name, p_contact: d.seller_contact || null,
        p_note: d.note || null, p_minutes: d.minutes, p_live: true
      })
    });
  }
};

/* local demo mode — same shape, localStorage instead of a database */
const local = {
  read() { try { return JSON.parse(localStorage.getItem('mazad_demo') || '{"listings":[],"bids":[]}'); } catch { return { listings: [], bids: [] }; } },
  write(db) { localStorage.setItem('mazad_demo', JSON.stringify(db)); },
  uid() { return 'x' + Math.random().toString(36).slice(2) + nowMs().toString(36); },
  async listings() { return this.read().listings.slice().sort((a, b) => b.created_at.localeCompare(a.created_at)); },
  async listing(id) { return this.read().listings.find(l => l.id === id) || null; },
  async bids(id) { return this.read().bids.filter(b => b.listing_id === id && b.approved).sort((a, b) => a.created_at.localeCompare(b.created_at)); },
  async createListing(body) {
    const db = this.read();
    const row = { ...body, id: this.uid(), status: body.status || 'pending', is_live: false, created_at: new Date().toISOString() };
    db.listings.push(row); this.write(db); return row;
  },
  async placeBid(id, name, amount) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === id);
    if (!lot) return { ok: false, error: 'not_found' };
    if (lot.status === 'pending') return { ok: false, error: 'not_started' };
    if (lot.status !== 'open') return { ok: false, error: 'closed' };
    if (!lot.end_at || new Date(lot.end_at).getTime() <= nowMs()) return { ok: false, error: 'expired' };
    const cur = db.bids.filter(b => b.listing_id === id && b.approved)
      .reduce((m, b) => Math.max(m, +b.amount), +lot.start_price);
    const min = cur + stepFor(cur);
    if (amount < min) return { ok: false, error: 'too_low', current: cur, min };
    db.bids.push({ id: this.uid(), listing_id: id, bidder_name: name, amount,
                   approved: false, created_at: new Date().toISOString() });
    this.write(db);
    return { ok: true, pending: true, amount };
  },
  async admin(id, _secret, action, minutes, price) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === id);
    if (action === 'delete') {
      db.listings = db.listings.filter(l => l.id !== id);
      db.bids = db.bids.filter(b => b.listing_id !== id);
    } else if (action === 'next') {
      db.listings.forEach(l => l.is_live = false);
      const nx = db.listings
        .filter(l => ['pending', 'open'].includes(l.status) &&
                     (!l.end_at || new Date(l.end_at).getTime() > nowMs()) && l.id !== id)
        .sort((a, b) => a.created_at.localeCompare(b.created_at))[0];
      if (nx) nx.is_live = true;
      this.write(db);
      return { ok: true, next: nx ? nx.id : null };
    } else if (!lot) {
      return { ok: false, error: 'not_found' };
    } else if (action === 'live') {
      db.listings.forEach(l => l.is_live = false); lot.is_live = true;
    } else if (action === 'unlive') {
      lot.is_live = false;
    } else if (action === 'extend') {
      lot.end_at = new Date(Math.max(new Date(lot.end_at).getTime(), nowMs()) + (minutes || 5) * 60000).toISOString();
    } else if (action === 'timer') {
      lot.status = 'open'; lot.end_at = new Date(nowMs() + (minutes || 1) * 60000).toISOString();
    } else if (action === 'open') {
      lot.status = 'pending'; lot.end_at = null; lot.sold_price = null;
    } else if (action === 'price') {
      lot.sold_price = price;
    } else {
      lot.status = action;   // stays on air so the sticker shows on the broadcast
      if (action === 'sold') {
        const best = db.bids.filter(b => b.listing_id === id).reduce((m, b) => Math.max(m, +b.amount), 0);
        lot.sold_price = price != null ? price : (best || +lot.start_price);
      } else {
        lot.sold_price = null;
      }
    }
    this.write(db);
    return { ok: true };
  },
  async manualBid(listing, _secret, name, amount) {
    const db = this.read();
    const lot = db.listings.find(l => l.id === listing);
    if (!lot) return { ok: false, error: 'not_found' };
    const cur = db.bids.filter(b => b.listing_id === listing && b.approved)
      .reduce((m, b) => Math.max(m, +b.amount), +lot.start_price);
    if (amount <= cur) return { ok: false, error: 'below_current', current: cur };
    db.bids.push({ id: this.uid(), listing_id: listing, bidder_name: name, amount,
                   approved: true, created_at: new Date().toISOString() });
    this.write(db);
    return { ok: true, amount };
  },
  async bidsOf(listing) {
    const db = this.read();
    return { ok: true, bids: db.bids.filter(b => b.listing_id === listing)
      .sort((a, b) => b.amount - a.amount) };
  },
  async pendingBids() {
    const db = this.read();
    const open = new Set(db.listings.filter(l => l.status === 'open').map(l => l.id));
    return { ok: true, bids: db.bids.filter(b => !b.approved && open.has(b.listing_id))
      .map(b => ({ ...b, phone: (db.listings.find(l => l.id === b.listing_id) || {}).phone })) };
  },
  async bidAction(bidId, _secret, action) {
    const db = this.read();
    const bid = db.bids.find(b => b.id === bidId);
    if (!bid) return { ok: false, error: 'not_found' };
    if (action === 'reject') { db.bids = db.bids.filter(b => b.id !== bidId); this.write(db); return { ok: true }; }
    const lot = db.listings.find(l => l.id === bid.listing_id);
    const cur = db.bids.filter(b => b.listing_id === bid.listing_id && b.approved)
      .reduce((m, b) => Math.max(m, +b.amount), +lot.start_price);
    if (+bid.amount <= cur) return { ok: false, error: 'below_current', current: cur };
    bid.approved = true;
    if (lot.end_at && new Date(lot.end_at).getTime() - nowMs() < 60000) {
      lot.end_at = new Date(nowMs() + 120000).toISOString();
    }
    this.write(db);
    return { ok: true, amount: bid.amount };
  },
  async operatorCreate(_secret, d) {
    const db = this.read();
    db.listings.forEach(l => l.is_live = false);
    const row = {
      id: this.uid(), phone: d.phone, carrier: d.carrier || null,
      start_price: d.start_price, seller_name: d.seller_name,
      seller_contact: d.seller_contact || null, note: d.note || null,
      end_at: new Date(nowMs() + d.minutes * 60000).toISOString(),
      status: 'open', is_live: true, created_at: new Date().toISOString()
    };
    db.listings.push(row); this.write(db);
    return { ok: true, id: row.id };
  }
};

const store = REMOTE ? remote : local;

async function syncClock() {
  if (!REMOTE) return;
  try {
    const before = Date.now();
    const iso = await remote.serverNow();
    const after = Date.now();
    const server = Date.parse(typeof iso === 'string' ? iso : String(iso));
    if (!isNaN(server)) {
      // the reply is already half a round trip old, so meet it in the middle
      const skew = server - (before + (after - before) / 2);
      if (Math.abs(skew - clockSkew) > 1500) {
        clockSkew = skew;
        if (Math.abs(skew) > 60000) {
          console.warn('device clock is off by', Math.round(skew / 1000), 's — corrected');
        }
        refresh(false);
      } else {
        clockSkew = skew;
      }
    }
  } catch (e) { console.warn('clock sync failed', e); }
}

/* ---------------------------------------------------------------- admin */
/* Operator mode persists on this browser (localStorage, not sessionStorage) so
   the password is typed once, not at every visit. Anyone with this unlocked
   device is therefore an operator — "خروج من وضع المشرف" clears it. */
const admin = {
  get secret() {
    try { return localStorage.getItem('mazad_admin') || sessionStorage.getItem('mazad_admin') || ''; }
    catch { return ''; }
  },
  set secret(v) {
    try {
      sessionStorage.removeItem('mazad_admin');
      if (v) localStorage.setItem('mazad_admin', v); else localStorage.removeItem('mazad_admin');
    } catch { /* private mode */ }
  },
  get on() { return Boolean(this.secret); }
};

/* ---------------------------------------------------------------- views */
let cache = { listings: [], bids: {}, filter: 'live' };
let route = { name: 'list', id: null };
let pollTimer = null, tickTimer = null;

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('n/')) return { name: 'lot', id: decodeURIComponent(h.slice(2)) };
  if (h === 'admin') return { name: 'admin', id: null };
  if (h === 'live') return { name: 'live', id: null };
  if (h === 'control') return { name: 'control', id: null };
  if (!h && /\/live\/?$/.test(location.pathname)) return { name: 'live', id: null };
  if (!h && /\/control\/?$/.test(location.pathname)) return { name: 'control', id: null };
  return { name: 'list', id: null };
}

async function go() {
  route = parseRoute();
  if (route.name === 'admin') { location.hash = ''; askAdmin(); return; }
  $('#viewList').classList.toggle('hidden', route.name !== 'list');
  $('#viewLot').classList.toggle('hidden', route.name !== 'lot');
  $('#viewLive').classList.toggle('hidden', route.name !== 'live');
  $('#viewControl').classList.toggle('hidden', route.name !== 'control');
  $('#bidbarHost').innerHTML = '';
  window.scrollTo(0, 0);
  await refresh(true);
}

async function refresh(full) {
  try {
    if (route.name === 'live' || route.name === 'control') {
      cache.listings = await store.listings();
      const lot = cache.listings.find(l => l.is_live);
      const bids = lot ? await store.bids(lot.id) : [];
      if (lot) cache.bids[lot.id] = bids;
      if (route.name === 'control' && admin.on) {
        try {
          const r = await store.pendingBids(admin.secret);
          cache.pending = (r && r.ok && r.bids) ? r.bids : [];
        } catch { cache.pending = cache.pending || []; }
      }
      if (route.name === 'live') renderLive(lot, bids); else renderControl(lot, bids);
      return;
    }
    if (route.name === 'lot') {
      const [lot, bids] = await Promise.all([store.listing(route.id), store.bids(route.id)]);
      if (!lot) { $('#lotBody').innerHTML = '<div class="empty"><div class="empty-emoji">🔍</div>هذا المزاد غير موجود أو تم حذفه.</div>'; return; }
      cache.bids[lot.id] = bids;
      renderLot(lot, bids, full);
    } else {
      cache.listings = await store.listings();
      const ids = cache.listings.map(l => l.id);
      if (REMOTE && ids.length) {
        const rows = await remote.req('mazad_bids?select=listing_id,amount,bidder_name,created_at&order=amount.desc&limit=2000');
        cache.bids = {};
        rows.forEach(b => (cache.bids[b.listing_id] ||= []).push(b));
      } else if (!REMOTE) {
        const db = local.read(); cache.bids = {};
        db.bids.filter(b => b.approved).forEach(b => (cache.bids[b.listing_id] ||= []).push(b));
      }
      renderList();
    }
  } catch (e) {
    console.error(e);
    if (full) toast('تعذّر تحميل البيانات — تحقق من الاتصال');
  }
}

/* What the number actually went for: the recorded sale price when the
   operator entered one, otherwise the highest real bid. Never invented. */
function finalPrice(lot, t) {
  if (lot.status === 'sold' && lot.sold_price != null) return Number(lot.sold_price);
  return t.amount;
}

/* Every sum is drawn as an auction paddle raised by a hand, with the price
   written on it — the gesture people already know from a sale room. */
/* Every sum is drawn as an auction paddle raised by a hand, with the price on
   the board. The hand is a fist gripping the handle seen from the side: four
   fingers curled round it, each with its own middle joint, knuckle and nail,
   the thumb laid across them, and the heel of the palm behind. */
function paddle(amount, variant) {
  const v = variant || '';
  const face = v.includes('top') ? 'url(#gBoardTop)' : v.includes('mine') ? 'url(#gBoardMine)' : 'url(#gBoard)';

  // one finger: a curled segment with a knuckle at the back and a nail at the tip
  const finger = (x, y, w, h, nail) =>
    '<g class="p-fg">' +
      '<rect class="p-fg-body" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (h / 2) + '"/>' +
      '<path class="p-fg-joint" d="M' + (x + w * 0.42) + ' ' + (y + 2.5) + ' v' + (h - 5) + '"/>' +
      '<ellipse class="p-fg-knuck" cx="' + (x + w - h * 0.42) + '" cy="' + (y + h * 0.46) + '" rx="' + (h * 0.40) + '" ry="' + (h * 0.34) + '"/>' +
      (nail
        ? '<rect class="p-nail" x="' + (x + 1.6) + '" y="' + (y + h * 0.20) + '" width="' + (h * 0.52) + '" height="' + (h * 0.60) + '" rx="' + (h * 0.24) + '"/>'
        : '') +
    '</g>';

  return (
    '<span class="paddle ' + v + '">' +
      '<svg viewBox="0 0 122 180" aria-hidden="true">' +
        '<ellipse class="p-shadow" cx="62" cy="173" rx="32" ry="5"/>' +

        // handle, running down behind the fist
        '<rect class="p-stick" x="54" y="60" width="15" height="72" rx="7.5"/>' +
        '<rect class="p-stick-hi" x="57" y="64" width="3.4" height="64" rx="1.7"/>' +

        // board: a darker slab behind the face gives it thickness
        '<rect class="p-edge"  x="12" y="11" width="101" height="73" rx="15"/>' +
        '<rect class="p-board" x="9"  y="5"  width="101" height="73" rx="15" fill="' + face + '"/>' +
        '<rect class="p-gloss" x="17" y="11" width="85" height="26" rx="11"/>' +
        '<text class="p-amount" x="59.5" y="52">' + esc(money(amount)) + '</text>' +

        // heel of the palm, behind the fingers
        '<path class="p-palm" d="M44 104 h42 q13 0 13 13 v34 q0 14 -14 14 h-40 q-13 0 -13 -13 v-35 q0 -13 12 -13 z"/>' +
        '<path class="p-palm-sh" d="M86 106 q13 2 13 14 v33 q0 13 -13 14 z"/>' +

        // index, middle, ring, little — curled round the handle, tips to the left
        finger(23, 100, 70, 17, true) +
        finger(21, 118, 74, 17, true) +
        finger(24, 136, 69, 16, true) +
        finger(29, 152, 61, 14, true) +

        // thumb across the fingers
        '<g transform="rotate(-24 33 133)">' +
          '<rect class="p-thumb" x="20" y="108" width="26" height="50" rx="13"/>' +
          '<path class="p-fg-joint" d="M33 120 v26"/>' +
          '<rect class="p-nail" x="25" y="113" width="16" height="15" rx="7.5"/>' +
        '</g>' +
      '</svg>' +
    '</span>'
  );
}

function topBid(id, lot) {
  const bids = cache.bids[id] || [];
  if (!bids.length) return { amount: Number(lot ? lot.start_price : 0), name: null, count: 0 };
  const best = bids.reduce((a, b) => (+b.amount > +a.amount ? b : a));
  return { amount: +best.amount, name: best.bidder_name, count: bids.length };
}

function renderList() {
  const host = $('#lots');
  let rows = cache.listings.slice();

  // the public does not get a record of what every number sold for
  const finished = (l) => ['sold', 'unsold', 'cancelled', 'ended'].includes(lotState(l));
  if (!SHOW_FINISHED && !admin.on) rows = rows.filter(l => !finished(l) || l.is_live);
  const dTab = $('#fDone');
  if (dTab) dTab.classList.toggle('hidden', !SHOW_FINISHED && !admin.on);

  if (cache.filter === 'live')    rows = rows.filter(l => lotState(l) === 'live');
  if (cache.filter === 'pending') rows = rows.filter(l => lotState(l) === 'pending');
  if (cache.filter === 'done')    rows = rows.filter(finished);
  const rank = (l) => {
    const st = lotState(l);
    if (l.is_live) return 0;
    if (st === 'live') return 1;
    if (st === 'pending') return 2;
    return 3;
  };
  rows.sort((a, b) => {
    const d = rank(a) - rank(b);
    if (d) return d;
    // the queue keeps its turn order; everything else is newest first
    return rank(a) === 2 ? new Date(a.created_at) - new Date(b.created_at)
                         : new Date(b.created_at) - new Date(a.created_at);
  });

  const onAir = cache.listings.find(l => l.is_live);

  const banner =
    (onAir
      ? '<button class="live-banner" id="goLive" data-lot="' + esc(onAir.id) + '">' +
          '<span class="live-dot">على الهواء</span>' +
          '<span class="n">' + esc(fmtPhone(onAir.phone)) + '</span>' +
          '<span class="go">زايد الحين</span>' +
        '</button>'
      : '') +
    (admin.on
      ? '<button class="live-banner" id="goControl" style="background:#0d3b26">' +
          '<span class="go">لوحة التحكم</span>' +
          '<span class="n" style="font-size:.86rem">تظهر لك وحدك</span>' +
        '</button>'
      : '');

  if (!rows.length) {
    host.innerHTML = banner + '<div class="empty"><div class="empty-emoji">📱</div>'
      + (cache.filter === 'live' ? 'ما فيه سوم مفتوح الحين.<br>سجّل رقمك وينتظر دوره.'
         : cache.filter === 'pending' ? 'ما فيه أرقام بالانتظار.' : 'ما فيه شيء هنا بعد.')
      + '</div>';
    wireLiveBanner();
    return;
  }

  host.innerHTML = banner;
  wireLiveBanner();
  rows.forEach(lot => {
    const st = lotState(lot), t = topBid(lot.id, lot), cd = countdown(lot.end_at);
    const badge = badgeFor(st)
      + (lot.is_live ? '<span class="badge air">🔴 على الهواء</span>' : '')
      + (isMasked(lot) ? '<span class="badge wait">🔒 مخفي</span>' : '');
    const card = el(
      '<div class="card">' +
        '<button class="lot">' +
          '<div class="lot-top">' + badge +
            '<span class="badge">' + esc(CARRIERS[lot.carrier] || 'رقم') + '</span>' +
            '<span style="flex:1"></span>' +
            '<span style="font-size:.72rem;color:var(--muted)">' + esc(ago(lot.created_at)) + '</span>' +
          '</div>' +
          '<div class="phone-plate plate-wrap">' +
            '<div class="phone-digits">' + esc(fmtPhone(lot.phone)) + '</div>' +
            (lot.note ? '<div class="phone-carrier">' + esc(lot.note) + '</div>' : '') +
            stampFor(st) +
          '</div>' +
          '<div class="lot-stats">' +
            '<div class="stat"><div class="stat-k">' + (st === 'sold' ? 'بيع على' : st === 'pending' ? 'سعر البداية' : 'السعر الحالي') + '</div>' +
              '<div class="stat-v price"><span class="num">' + money(finalPrice(lot, t)) + '</span> ر.س</div></div>' +
            '<div class="stat"><div class="stat-k">المزايدات</div><div class="stat-v"><span class="num">' + t.count + '</span></div></div>' +
            '<div class="stat"><div class="stat-k">' + (st === 'live' ? 'ينتهي خلال' : 'الحالة') + '</div>' +
              (st === 'live'
                ? '<div class="stat-v time" data-cd="' + esc(lot.end_at) + '">' + esc(cd || '00:00:00') + '</div>'
                : '<div class="stat-v over">' +
                  (st === 'sold' ? 'مباع' : st === 'unsold' ? 'لم يُبَع'
                   : st === 'pending' ? 'ينتظر دوره' : 'مغلق') + '</div>') +
            '</div>' +
          '</div>' +
          '<div class="lot-foot">👤 ' + esc(lot.seller_name) + (t.name ? ' · أعلى مزايد: ' + esc(t.name) : '') + '</div>' +
        '</button>' +
      '</div>'
    );
    card.querySelector('.lot').addEventListener('click', () => { location.hash = '#/n/' + encodeURIComponent(lot.id); });
    if (st === 'live') {
      const go = el('<button class="btn btn-gold btn-block btn-sm" style="margin-top:10px">زايد على هذا الرقم</button>');
      go.addEventListener('click', () => { location.hash = '#/n/' + encodeURIComponent(lot.id); });
      card.appendChild(go);

    if (admin.on) card.appendChild(adminBar(lot));

}

function wireLiveBanner() {
  const b = $('#goLive');
  // viewers go to the number's own page, where the bidding is. /live is the
  // broadcast screen and has no bid box at all — sending them there was why
  // "I opened it and could not bid".
  if (b) b.addEventListener('click', () => {
    const id = b.dataset.lot;
    location.hash = id ? '#/n/' + encodeURIComponent(id) : '#/live';
  });
  const c = $('#goControl');
  if (c) c.addEventListener('click', () => { location.hash = '#/control'; });
}

function adminBar(lot) {
  const bar = el('<div class="adminbar">'
    + '<button data-a="live">🔴 اعرضه بالبث</button>'
    + '<button data-a="sold">' + (lot.status === 'sold' ? '✎ عدّل سعر البيع' : '✔ تم البيع') + '</button>'
    + '<button data-a="unsold">✖ لم يتم البيع</button>'
    + '<button data-a="extend">+5 دقائق</button>'
    + '<button data-a="open">رجّعه للقائمة</button>'
    + '<button data-a="delete" class="del">حذف</button>'
    + '</div>');
  bar.addEventListener('click', async (e) => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'sold') { askSoldPrice(lot); return; }
    if (a === 'delete' && !confirm('حذف الرقم ' + fmtPhone(lot.phone) + ' نهائياً؟')) return;
    const r = await opDo(lot.id, a);
    if (!r) return;
    if (a === 'live') { toast('صار على الهواء 🔴'); return; }
    toast('تم');
    if (a === 'delete' && route.name === 'lot') location.hash = '';
  });
  return bar;
}

/* ===================== شاشة البث المباشر =====================
   One number at a time, sized for a phone or an iPad on screen share.
   The operator bar underneath only appears in operator mode.          */
function renderLive(lot, bids) {
  const host = $('#liveBody');
  const open = cache.listings
    .filter(l => ['pending', 'live'].includes(lotState(l)) && !l.is_live)
    .sort((a, b) => a.created_at.localeCompare(b.created_at));
  const liveId = lot ? lot.id : null;
  const doneCount = cache.listings
    .filter(l => ['sold', 'unsold'].includes(l.status) && l.id !== liveId).length;

  if (!lot) {
    host.innerHTML =
      '<div class="live">' +
        '<div class="live-head"><span class="live-dot">البث</span>' +
          '<span class="live-seq">تم الانتهاء من <span class="num">' + doneCount + '</span> رقم</span></div>' +
        '<div class="live-empty"><div class="t">جاهزون للرقم القادم</div>' +
          '<div class="s">اعرض رقمك من الموقع وبيجي دورك</div></div>' +
        '<div class="live-cta">للمشاركة والمزايدة<br><b>rafd-digital.com/m</b></div>' +
        queueHtml(open) +
      '</div>';
    wireQueue(open, null);
    return;
  }

  const st = lotState(lot);
  const t = topBid(lot.id, lot);
  const shown = finalPrice(lot, t);
  const cd = countdown(lot.end_at);
  const last = bids.slice(-6).reverse();
  const best = bids.length ? Math.max(...bids.map(b => +b.amount)) : null;

  host.innerHTML =
    '<div class="live">' +
      '<div class="live-head">' +
        '<span class="live-dot">' + (st === 'live' ? 'على الهواء' : st === 'pending' ? 'جاهز' : 'انتهى') + '</span>' +
        '<span class="live-seq">رقم <span class="num">' + (doneCount + 1) + '</span>' +
          (open.length ? ' · بالانتظار <span class="num">' + open.length + '</span>' : '') + '</span>' +
      '</div>' +

      '<div class="live-plate plate-wrap">' +
        '<div class="live-digits">' + esc(fmtPhone(lot.phone)) + '</div>' +
        '<div class="live-note">' + esc(CARRIERS[lot.carrier] || 'رقم مميز') +
          (lot.note ? ' · ' + esc(lot.note) : '') +
          (lot.seller_name && lot.seller_name !== 'البائع' ? ' · البائع ' + esc(lot.seller_name) : '') + '</div>' +
        stampFor(st) +
      '</div>' +

      (st === 'live'
        ? '<div class="live-clock' + (cd && cd.length <= 8 && cd < '00:01:00' ? ' warn' : '') + '" data-cd="' + esc(lot.end_at) + '">' + esc(cd || '00:00:00') + '</div>'
        : st === 'pending'
        ? '<div class="live-clock over">جاهز — ينتظر بدء السوم</div>'
        : '<div class="live-clock over">' + (st === 'sold' ? 'مبروك للمشتري 🎉' : st === 'unsold' ? 'ما تم البيع' : 'انتهى الوقت') + '</div>') +

      '<div class="live-price">' +
        '<div class="k">' + (st === 'sold' ? 'بيع على' : st === 'pending' ? 'سعر البداية' : 'أعلى سوم') + '</div>' +
        '<div class="v"><span class="num">' + money(shown) + '</span> ر.س</div>' +
        '<div class="who">' +
          (t.name ? esc(t.name)
           : st === 'sold' ? 'بيع مباشر — بدون مزايدات على الموقع'
           : st === 'pending' ? 'ابدأ المؤقت عشان يفتح السوم'
           : 'ما زايد أحد بعد') + '</div>' +
      '</div>' +

      (last.length
        ? '<div class="live-paddles">' + last.map(b =>
            '<div class="lp' + (+b.amount === best ? ' top' : '') + '">' +
              paddle(b.amount, +b.amount === best ? 'top' : '') +
              '<div class="lp-name">' + esc(b.bidder_name) + '</div>' +
            '</div>').join('') + '</div>'
        : '') +

      '<div class="live-cta">زايد من الموقع<br><b>rafd-digital.com/m</b>' +
        '<br><span style="font-size:.78rem">العمولة على ذمة البائع</span>' +
      '</div>' +

      queueHtml(open) +
    '</div>';

  wireQueue(open, lot);
}

    '<div class="card">' +
      (lot
        ? '<div class="ctl-now">' +
            '<div class="k">المعروض على الهواء</div>' +
            '<div class="ctl-digits num">' + esc(fmtPhone(lot.phone)) + '</div>' +
            '<div class="ctl-row">' +

              '<button class="ctl-price num" id="ctlEditPrice" title="اضغط لتعديل السوم">' +

              (st === 'live'

/* Sums shouted into the site wait here until the operator says yes. */
function renderPendingBids() {
  const host = $('#ctlBids');
  if (!host) return;
  const list = cache.pending || [];

  if (!list.length) {
    host.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.86rem">' +
      'ما فيه سومات بانتظار موافقتك</div>';
    return;
  }

  host.innerHTML =
    '<div style="font-weight:700;margin-bottom:8px">سومات بانتظار موافقتك ' +
      '<span class="pill">' + list.length + '</span></div>' +
    list.map(b => {
      // a sum only means something next to the price it is trying to beat
      const cur = Number(b.current ?? 0);
      const min = Number(b.min_next ?? 0);
      const amt = Number(b.amount);
      const beats = b.beats_current != null ? b.beats_current : amt > cur;
      const enough = min ? amt >= min : beats;
      const diff = amt - cur;
      return '<div class="ctl-bid ' + (enough ? 'ok' : beats ? 'thin' : 'low') + '" data-b="' + esc(b.id) + '"' +
               ' data-ok="' + (beats ? '1' : '0') + '">' +
        '<div class="who">' +
          '<b>' + esc(b.bidder_name) + '</b>' +
          '<span class="num">' + esc(fmtPhone(b.phone || '')) + '</span>' +
        '</div>' +
        '<div class="cmp">' +
          '<div class="cmp-line">' +
            '<span class="cmp-now num">' + money(cur) + '</span>' +
            '<span class="cmp-arrow">←</span>' +
            '<span class="amt num">' + money(amt) + '</span>' +
          '</div>' +
          '<div class="cmp-note">' +
            (!beats
              ? 'أقل من السعر بـ <span class="num">' + money(Math.abs(diff)) + '</span> — ما ترفع السوم'
              : enough
                ? 'أعلى بـ <span class="num">' + money(diff) + '</span> ✔'
                : 'أعلى بـ <span class="num">' + money(diff) + '</span> — الحد الأدنى <span class="num">' + money(min) + '</span>') +
          '</div>' +
        '</div>' +
        '<button class="yes" data-a="approve"' + (beats ? '' : ' disabled title="أقل من السعر الحالي"') + '>✔</button>' +
        '<button class="no"  data-a="reject">✖</button>' +
      '</div>';
    }).join('');

  host.querySelectorAll('.ctl-bid button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.ctl-bid');
      const id = row.dataset.b, act = btn.dataset.a;
      if (act === 'approve' && row.dataset.ok === '0') {
        toast('هذي السومة أقل من السعر الحالي — ما ترفعه');
        return;
      }
      row.style.opacity = '.5';
      try {
        const r = await store.bidAction(id, admin.secret, act);
        if (r && r.ok === false) {
          row.style.opacity = '1';
          toast(r.error === 'below_current'
            ? 'أقل من السعر الحالي (' + money(r.current) + ') — ما ينفع'
            : r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'تعذّر التنفيذ');
          return;
        }
        toast(act === 'approve' ? 'اعتمدت السومة ✔' : 'رفضت السومة');
      } catch (e) {
        row.style.opacity = '1'; console.error(e); toast('تعذّر الاتصال');
      } finally {
        refresh(false);
      }
    });
  });
}

/* The operator records a sum shouted on the broadcast — from a guest on a
   TikTok call, or over the phone. It counts at once: the operator is the one
   entering it, there is nothing to approve. */
function askManualBid(lot) {
  const t = topBid(lot.id, lot);
  const cur = finalPrice(lot, t);
  const step = stepFor(cur);
  const s2 = sheet(
    '<h2>سجّل سومة</h2>' +
    '<p class="hint">للي زايد بالبث أو بالتلفون — تُحتسب على طول بدون موافقة.</p>' +
    '<div id="mbErr"></div>' +
    '<div class="bid-now" style="margin-bottom:12px">السوم الحالي ' +
      '<b><span class="num">' + money(cur) + '</span> ر.س</b></div>' +
    '<div class="field"><label>اسم المزايد</label>' +
      '<input id="mbName" maxlength="40" placeholder="مثال: أبو فهد"></div>' +
    '<div class="field ltr"><label>المبلغ (ر.س)</label>' +
      '<input id="mbAmount" type="number" inputmode="numeric" min="0" value="' + (cur + step) + '">' +
      '<div class="sub">لازم يكون أعلى من <span class="num">' + money(cur) + '</span>.</div></div>' +
    '<div class="row2" id="mbQuick"></div>' +
    '<button class="btn btn-gold btn-block" id="mbSave" style="margin-top:10px">سجّل السومة</button>'
  );

  s2.querySelector('#mbQuick').innerHTML = [cur + step, cur + step * 2, cur + step * 5]
    .map(v => '<button class="btn btn-ghost btn-sm" data-v="' + v + '">' + money(v) + '</button>').join('');
  s2.querySelector('#mbQuick').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    s2.querySelector('#mbAmount').value = b.dataset.v;
  });

  const save = async () => {
    const err = (m) => { s2.querySelector('#mbErr').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
    const name = s2.querySelector('#mbName').value.trim();
    const amount = Number(s2.querySelector('#mbAmount').value);
    if (name.length < 2) return err('اكتب اسم المزايد.');
    if (!(amount > 0)) return err('اكتب مبلغ صحيح.');

    const btn = s2.querySelector('#mbSave'); btn.disabled = true; btn.textContent = 'جاري…';
    try {
      const r = await store.manualBid(lot.id, admin.secret, name, amount);
      if (r && r.ok === false) {
        btn.disabled = false; btn.textContent = 'سجّل السومة';
        return err(r.error === 'below_current'
          ? 'المبلغ لازم يكون أعلى من ' + money(r.current) + ' ر.س. لو تبي تنزّل السوم، احذف السومة الأعلى أول.'
          : r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'تعذّر التسجيل');
      }
      closeSheet();
      toast('انسجّلت سومة ' + esc(name) + ' بـ ' + money(amount) + ' ر.س ✔');
      refresh(false);
    } catch (e) {
      console.error(e); btn.disabled = false; btn.textContent = 'سجّل السومة';
      err('تعذّر الاتصال.');
    }
  };
  s2.querySelector('#mbSave').addEventListener('click', save);
  s2.querySelector('#mbAmount').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
  s2.querySelector('#mbName').focus();
}

/* The sums already counted on the number on air, each removable — this is how
   an approval given by mistake is taken back, and the only way to bring the
   price down. */
async function renderApprovedBids(lot) {
  const host = $('#ctlApproved');
  if (!host || !lot) return;
  host.innerHTML = '<div style="color:var(--muted);font-size:.84rem">…</div>';
  let list = [];
  try {
    const r = await store.bidsOf(lot.id, admin.secret);
    list = (r && r.ok && r.bids ? r.bids : []).filter(b => b.approved);
  } catch { /* leave it empty */ }

  host.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
      '<div style="flex:1;font-weight:700">السومات المحتسبة</div>' +
      '<button class="btn btn-ghost btn-sm" id="ctlAddBid">＋ سجّل سومة</button>' +
    '</div>' +
    (list.length
      ? list.map((b, i) =>
          '<div class="ctl-bid done" data-b="' + esc(b.id) + '">' +
            '<div class="who"><b>' + esc(b.bidder_name) + '</b>' +
              '<span>' + (i === 0 ? 'أعلى سومة' : esc(ago(b.created_at))) + '</span></div>' +
            '<div class="amt num">' + money(b.amount) + '</div>' +
            '<button class="no" data-a="reject" title="احذف">✖</button>' +
          '</div>').join('')
      : '<div style="text-align:center;color:var(--muted);font-size:.86rem">ما فيه سومات محتسبة</div>');

  $('#ctlAddBid').addEventListener('click', () => askManualBid(lot));
  host.querySelectorAll('.ctl-bid.done button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.ctl-bid');
      if (!confirm('حذف سومة ' + row.querySelector('b').textContent + '؟ السعر بينزل.')) return;
      try {
        const r = await store.bidAction(row.dataset.b, admin.secret, 'reject');
        if (r && r.ok === false) { toast('تعذّر الحذف'); return; }
        toast('انحذفت السومة');
      } catch { toast('تعذّر الاتصال'); }
      refresh(false);
    });
  });
}

/* Put a number back in the queue — with or without the sums already on it. */
function askRequeue(lot) {
  const s2 = sheet(
    '<h2>رجّعه لقائمة الانتظار</h2>' +
    '<p class="hint">الرقم <span class="num">' + esc(fmtPhone(lot.phone)) + '</span> يرجع بدون مؤقت، ' +
      'وما أحد يقدر يزايد عليه لين تفتحه من جديد.</p>' +
    '<button class="btn btn-block" id="rqClear" style="background:#c0392b">رجّعه وامسح كل السومات</button>' +
    '<button class="btn btn-ghost btn-block" id="rqKeep" style="margin-top:8px">رجّعه واحتفظ بالسومات</button>'
  );
  s2.querySelector('#rqClear').addEventListener('click', async () => {
    closeSheet(); await opDo(lot.id, 'reset'); toast('رجع للقائمة — بدون سومات');
  });
  s2.querySelector('#rqKeep').addEventListener('click', async () => {
    closeSheet(); await opDo(lot.id, 'open'); toast('رجع للقائمة — السومات محفوظة');
  });
}

function queueHtml(open) {
  if (!open.length) return '';
  return '<div class="queue"><h3>قائمة الانتظار</h3>' +
    open.slice(0, 6).map(l =>
      '<div class="q" data-q="' + esc(l.id) + '">' +
        '<b class="num">' + esc(fmtPhone(l.phone)) + '</b>' +
        '<span>' + esc(l.seller_name) + '</span>' +
        (admin.on && route.name === 'control' ? '<button>اعرضه</button>' : '') +
      '</div>').join('') + '</div>';
}

function wireQueue(open, current) {
  document.querySelectorAll('.queue .q button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.closest('.q').dataset.q;
      await opDo(id, 'live');
    });
  });
}

/* one place for every operator action, so errors read the same */
async function opDo(id, action, minutes, price) {
  try {
    const r = await store.admin(id, admin.secret, action, minutes, price);
    if (r && r.ok === false) {
      toast(r.error === 'forbidden' ? 'كلمة مرور المشرف غير صحيحة' : 'تعذّر التنفيذ');
      return null;
    }
    return r || { ok: true };
  } catch (e) {
    console.error(e); toast('تعذّر الاتصال'); return null;
  } finally {
    refresh(false);
  }
}

function opBar(lot) {
  const bar = el('<div class="opbar"></div>');
  if (lot) {
    bar.innerHTML =
      '<div class="lbl">افتح السوم على الرقم</div>' +
      '<div class="row">' +
        '<button class="start" data-a="timer" data-m="1">▶ ابدأ دقيقة</button>' +
        '<button class="start" data-a="timer" data-m="2">▶ دقيقتين</button>' +
      '</div>' +
      '<div class="row">' +
        '<button data-a="extend" data-m="1">+ دقيقة</button>' +
        '<button data-a="extend" data-m="2">+ دقيقتين</button>' +
      '</div>' +
      '<div class="lbl">السومات</div>' +
      '<div class="row">' +
        '<button class="add" data-a="manual">＋ سجّل سومة من البث</button>' +
      '</div>' +
      '<div class="lbl">نتيجة الرقم</div>' +
      '<div class="row">' +
        '<button class="sold" data-a="sold">✔ تم البيع</button>' +
        '<button class="unsold" data-a="unsold">✖ لم يتم البيع</button>' +
      '</div>' +
      '<div class="row">' +
        '<button class="next" data-a="next">الرقم التالي ←</button>' +
        '<button class="add" data-a="quick">＋ سجّل رقم</button>' +
      '</div>' +
      '<div class="row">' +
        '<button data-a="open">↩ رجّعه للقائمة</button>' +
        '<button class="danger" data-a="delete">🗑 احذف الرقم</button>' +
      '</div>';
  } else {
    bar.innerHTML =
      '<div class="lbl">وضع المشرف</div>' +
      '<div class="row"><button class="add" data-a="quick">＋ سجّل رقم وابدأ السوم</button></div>' +
      (cache.listings.some(l => lotState(l) === 'live')
        ? '<div class="row"><button class="next" data-a="next">اعرض أول رقم بالانتظار</button></div>' : '');
  }

  bar.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const a = b.dataset.a, m = b.dataset.m ? Number(b.dataset.m) : undefined;
    if (a === 'quick') { askQuickAdd(); return; }
    if (a === 'open' && lot) { askRequeue(lot); return; }
    if (a === 'manual' && lot) { askManualBid(lot); return; }
    if (a === 'next') {
      const r = await opDo(lot ? lot.id : null, 'next');
      if (r && !r.next) toast('ما فيه أرقام بالانتظار');
      return;
    }
    if (a === 'sold') { askSoldPrice(lot); return; }
    if (a === 'delete') {
      if (!confirm('حذف الرقم ' + fmtPhone(lot.phone) + ' نهائياً من المزاد؟')) return;
      await opDo(lot.id, 'delete');
      toast('انحذف الرقم');
      return;
    }
    if (a === 'unsold' && !confirm('تأكيد: لم يتم البيع؟')) return;
    await opDo(lot.id, a, m);
    // bring the number and its sticker back into view for the broadcast
    if (a === 'unsold') window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  return bar;
}

/* Stamping تم البيع asks for the price it actually went for. A number can be
   agreed on the broadcast or over WhatsApp with no bids on the site at all —
   record that price as a sale price, rather than inventing bidders for it. */
function askSoldPrice(lot) {
  const t = topBid(lot.id, lot);
  const already = lot.status === 'sold' && lot.sold_price != null;
  const suggested = already ? Number(lot.sold_price) : (t.count ? t.amount : '');
  const s2 = sheet(
    '<h2>' + (already ? 'تعديل سعر البيع' : 'سعر البيع') + '</h2>' +
    '<p class="hint">الرقم <span class="num">' + esc(fmtPhone(lot.phone)) + '</span> — كم انباع؟</p>' +
    '<div id="spErr"></div>' +
    '<div class="field ltr"><label>المبلغ (ر.س)</label>' +
      '<input id="spPrice" type="number" inputmode="numeric" min="0" value="' + esc(suggested) + '" placeholder="مثال: 4500">' +
      '<div class="sub">' +
        (t.count ? 'أعلى مزايدة على الموقع: ' + money(t.amount) + ' ر.س.' : 'ما فيه مزايدات على الموقع — اكتب السعر اللي اتفقتوا عليه.') +
      '</div></div>' +
    '<div class="fee-box">عمولتك = <b><span class="num" id="spFee">—</span> ر.س</b> على ذمة البائع.' +
      '<br><span style="font-size:.78rem">' + esc(FEE_RULE) + '</span></div>' +
    '<button class="btn btn-block" style="background:#12833f" id="spSave">' +
      (already ? '✎ احفظ السعر الجديد' : '✔ تأكيد البيع') + '</button>'
  );

  const input = s2.querySelector('#spPrice');
  const paintFee = () => { s2.querySelector('#spFee').textContent = money(commissionOn(Number(input.value || 0))); };
  input.addEventListener('input', paintFee);
  paintFee();
  input.focus();

  s2.querySelector('#spSave').addEventListener('click', async () => {
    const v = Number(input.value);
    if (!(v >= 0) || v > 100000000) {
      s2.querySelector('#spErr').innerHTML = '<div class="err">اكتب مبلغ صحيح.</div>';
      return;
    }
    closeSheet();
    await opDo(lot.id, already ? 'price' : 'sold', undefined, v);
    toast((already ? 'تعدّل السعر إلى ' : 'تم البيع على ') + money(v) + ' ر.س ✔');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

    '<button class="btn btn-gold btn-block" id="qkSave">ابدأ السوم على الهواء 🔴</button>'
